name: v1.35 SET-001 temporary compact fix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v1.35'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - name: Apply compact settings fix
        run: python3 scripts/v135_set001_compact_fix.py
      - name: Commit compact settings fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt
          if git diff --cached --quiet; then
            echo "No compact fix required"
            exit 0
          fi
          git commit -m "fix(v1.35): keep SET-001 settings reachable on compact displays"
          git push origin HEAD:develop/v1.35
