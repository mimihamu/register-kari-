name: v1.36 apply BKP-002 legacy gate source compatibility

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply source compatibility patch
        run: python3 .github/v136_bkp002_source_compat.py
      - name: Verify product changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DataProtectionOnlineBackupV136.copyWithinWriterBlockBudget(source, target)' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -Fq '// source.copyTo(target, overwrite = true)' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -Fq 'body.lineSequence().any' app/src/test/java/jp/co/tenposinfo/register/V140DataProtectionOnlineBackupTest.kt
      - name: Commit product compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v136_bkp002_source_compat.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt app/src/test/java/jp/co/tenposinfo/register/V140DataProtectionOnlineBackupTest.kt .github/v136_bkp002_source_compat.py
          git diff --cached --check
          git commit -m 'fix(v1.36): preserve V104 gate without restoring raw backup copy'
          git push origin HEAD:develop/v1.36
