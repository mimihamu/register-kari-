name: v1.35 COR-002-003 safe patch

on:
  push:
    branches:
      - develop/v1.35
    paths:
      - .github/workflows/patch-cor002-003-v135.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - name: Apply exact-match patch
        run: python3 .github/scripts/patch_cor002_003_v135.py
      - name: Commit cumulative implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(v1.35): implement COR-002 and COR-003 cart corrections"
          git push origin HEAD:develop/v1.35
