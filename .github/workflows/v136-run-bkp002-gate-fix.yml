name: v1.36 apply BKP-002 cumulative gate compatibility

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply gate patch
        run: python3 .github/v136_bkp002_gate_patch.py
      - name: Verify patched workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "replacement = 'DataProtectionOnlineBackupV136.copyWithinWriterBlockBudget(source, target)'" .github/workflows/build-apk.yml
          grep -Fq 'MAX_FALLBACK_WRITER_BLOCK_MILLIS = 2_000L' .github/workflows/build-apk.yml
          grep -Fq 'PERFORMANCE_TARGET_TRANSACTIONS = 10_000' .github/workflows/build-apk.yml
          grep -Fq 'PERFORMANCE_TARGET_MILLIS = 30_000L' .github/workflows/build-apk.yml
      - name: Commit clean gate fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v136_bkp002_gate_patch.py .github/workflows/v136-run-bkp002-gate-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci(v1.36): preserve V104 gate with bounded BKP-002 copy'
          git push origin HEAD:develop/v1.36
