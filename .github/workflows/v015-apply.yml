name: Apply v0.15 tax invoice implementation

on:
  push:
    branches:
      - develop/v0.15
    paths:
      - .github/workflows/v015-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout v0.15
        uses: actions/checkout@v4
        with:
          ref: develop/v0.15
          fetch-depth: 0

      - name: Restore implementation script
        shell: bash
        run: |
          mkdir -p tools
          echo '' | base64 -d | gzip -d > tools/apply_v015.py
          python -m py_compile tools/apply_v015.py

      - name: Apply source changes
        run: python tools/apply_v015.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run v0.15 tests and builds
        run: |
          gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest
          gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Commit v0.15 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(v0.15): finalize tax invoice and sales profile behavior'
          git push origin HEAD:develop/v0.15
