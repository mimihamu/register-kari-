name: v1.35 REP-003 safe patch

on:
  push:
    branches:
      - develop/v1.35
    paths:
      - '.github/workflows/v135-rep003-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - name: Apply exact-match patch
        run: python3 .github/scripts/v135_rep003_patch.py
      - name: Commit cumulative implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt \
                  app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt \
                  app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt \
                  app/src/main/java/jp/co/tenposinfo/register/SettlementActivityV030.kt
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m "fix(v1.35): make REP-003 X inspection read-only"
          git push origin HEAD:develop/v1.35
