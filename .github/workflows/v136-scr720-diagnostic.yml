name: v1.36 cumulative test diagnostic

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v136-cumulative-test-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cumulative-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run same cumulative unit tests as build-apk
        id: tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon clean :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest --stacktrace
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print failing tests from JUnit XML
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob('**/build/test-results/testDebugUnitTest/TEST-*.xml', recursive=True)
          failed = 0
          print(f'JUnit XML files: {len(files)}')
          for path in sorted(files):
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  print(f'XML_PARSE_ERROR {path}: {exc}')
                  continue
              for case in root.findall('.//testcase'):
                  node = case.find('failure')
                  if node is None:
                      node = case.find('error')
                  if node is None:
                      continue
                  failed += 1
                  cls = case.attrib.get('classname', '')
                  name = case.attrib.get('name', '')
                  message = (node.attrib.get('message') or '').strip()
                  body = (node.text or '').strip()
                  print(f'FAILED {cls}#{name}')
                  if message:
                      print(f'MESSAGE {message[:1500]}')
                  if body:
                      print(body[:6000])
          print(f'FAILED_COUNT {failed}')
          PY

      - name: Show compile/configuration failure hints
        if: always()
        shell: bash
        run: |
          if ! find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' -print -quit | grep -q .; then
            echo 'No JUnit XML produced. The Gradle step likely failed during compilation or configuration.'
          fi

      - name: Upload cumulative test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v136-cumulative-test-diagnostic-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            customer-display/build/test-results/
            customer-display/build/reports/tests/
            management-app/build/test-results/
            management-app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if cumulative tests failed
        if: always()
        shell: bash
        run: |
          test '${{ steps.tests.outputs.exit_code }}' = '0'
