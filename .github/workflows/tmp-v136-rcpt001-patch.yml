name: tmp v1.36 RCPT-001 patch

on:
  push:
    branches: [develop/v1.36]
    paths:
      - '.github/workflows/tmp-v136-rcpt001-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Patch receipt number formatting and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/jp/co/tenposinfo/register/Receipt.kt')
          s = p.read_text()
          old = 'lines += "No.${data.saleId}  ${formatDate(data.createdAt)}"'
          new = 'lines += "No.${ReceiptNumberV136.format(data.saleId)}  ${formatDate(data.createdAt)}"'
          if old not in s:
              raise SystemExit('target receipt-number line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/tmp-v136-rcpt001-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/jp/co/tenposinfo/register/Receipt.kt
          git commit -m "fix: format v1.36 receipt number"
          git push origin HEAD:develop/v1.36
