name: Apply v0.31 printer width setting patch

on:
  push:
    branches:
      - develop/v0.31
    paths:
      - .github/workflows/apply-v031.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop/v0.31
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v031.patch.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/v031.patch.gz.b64 | gzip --decompress > /tmp/v031.patch
          patch -p1 < /tmp/v031.patch
          rm -f .github/workflows/export-v031-source.yml
          rm -f .github/workflows/apply-v031.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.31 印字幅をプリンタ設定へ一本化"
          git push origin HEAD:develop/v0.31
