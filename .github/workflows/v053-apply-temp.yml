name: Apply v0.53 temporary

on:
  push:
    branches:
      - develop/v0.53
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[v0.53 applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout v0.53
        uses: actions/checkout@v4
        with:
          ref: develop/v0.53
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply v0.53 source changes
        run: python3 tools/v053_apply.py

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug

      - name: Commit and push v0.53
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "v0.53 Google Drive sync verification and recovery [v0.53 applied]"
          git push origin HEAD:develop/v0.53
