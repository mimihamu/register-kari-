name: Apply v0.14 UI safety changes

on:
  push:
    branches:
      - develop/v0.14
  pull_request:
    branches:
      - develop/v0.13
    types:
      - opened
      - synchronize
      - edited
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'develop/v0.14') && !contains(github.event.head_commit.message || '', '[v014-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.14
          fetch-depth: 0
      - name: Apply source changes
        run: python3 .github/scripts/apply_v014_ui.py
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          git commit -m "feat(v0.14): integrate held-ticket and payment safety UI [v014-ui-applied]"
          git push origin HEAD:develop/v0.14
