name: v1.36 BKP-007 implement

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/v136-bkp007-implement.py
      - .github/workflows/v136-bkp007-implement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply BKP-007 patch
        run: python3 .github/v136-bkp007-implement.py
      - name: Run V145 focused unit test
        run: ./gradlew :app:testDebugUnitTest --tests jp.co.tenposinfo.register.V145Bkp007PreApplySnapshotTest --no-daemon --stacktrace
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Commit BKP-007 product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogRuntime.kt \
            app/src/main/java/jp/co/tenposinfo/register/MenuRevisionPreApplySnapshotV145.kt \
            app/src/test/java/jp/co/tenposinfo/register/V145Bkp007PreApplySnapshotTest.kt \
            docs/V1.36_BKP_007_PRE_APPLY_SNAPSHOT.md
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'feat(v1.36): add BKP-007 pre-apply menu snapshot'
            git push origin HEAD:develop/v1.36
          fi
