name: Apply v0.30 responsive patch

on:
  push:
    branches:
      - develop/v0.30
    paths:
      - .github/workflows/apply-v030-responsive.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified patch
        run: |
          set -euo pipefail
          cat .github/v030-patch/part-* | base64 -d > /tmp/v030.patch.gz
          echo "88d1fb561b8677334f4e9a24dcb68c28961775b7e466c7cdc584d964611da342  /tmp/v030.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v030.patch.gz > /tmp/v030.patch
          patch --dry-run -p1 < /tmp/v030.patch
          patch -p1 < /tmp/v030.patch

          rm -rf .github/v030-patch .github/v030-payload
          rm -f .github/workflows/export-v030-source.yml
          rm -f .github/workflows/apply-v030-responsive.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete v0.30 management responsive layouts"
          git push origin HEAD:develop/v0.30
