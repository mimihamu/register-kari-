name: v135-temp-fix
on:
  push:
    branches: [develop/v1.35]
    paths:
      - scripts/v135_temp_fix.py
      - .github/workflows/v135-temp-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - run: python3 scripts/v135_temp_fix.py
      - shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix(v1.35): keep held-ticket constructor compatibility"
          git push origin HEAD:develop/v1.35
