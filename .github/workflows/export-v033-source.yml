name: Apply v0.33 periodic backup operations

on:
  pull_request:
    branches:
      - develop/v0.32
    paths:
      - .github/workflows/export-v033-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-code:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'develop/v0.33')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.33
        uses: actions/checkout@v4
        with:
          ref: develop/v0.33
          fetch-depth: 0
      - name: Apply verified v0.33 payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v033-payload.* | base64 --decode > /tmp/v033-payload.tar.gz
          echo "437216bdd839aa3da064cd308f8a71219404979aec622418c70775f8f0aac085  /tmp/v033-payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/v033-payload.tar.gz
          git checkout HEAD -- .github/workflows/build-apk.yml
          rm -f tools/v033-payload.*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs tools
          git diff --cached --check
          git commit -m "v0.33 定期バックアップ・保存世代設定・失敗通知"
          git push origin HEAD:develop/v0.33
