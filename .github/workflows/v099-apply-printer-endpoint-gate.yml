name: v0.99 Finalize release workflow

on:
  push:
    branches:
      - develop/v0.99
    paths:
      - .github/workflows/v099-apply-printer-endpoint-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.99
      - name: Update permanent build workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/build-apk.yml')
          text = path.read_text()

          text = text.replace(
              '# V098AutomaticPrintDispatchSafetyTest.kt\n',
              '# V098AutomaticPrintDispatchSafetyTest.kt\n# V099PrinterEndpointSerializationTest.kt\n',
          )

          pattern = re.compile(
              r'      - name: Verify cumulative v0\.14-v0\.98 sources\n.*?(?=      - name: Verify launcher and orientation configuration\n)',
              re.S,
          )
          replacement = '''      - name: Verify cumulative v0.14-v0.99 sources
        shell: bash
        env:
          V098_FINAL_HEAD: 8990d93c007bc0b57afed7f28695454a8535dd90
        run: |
          set -euo pipefail

          # v0.98 finalの累積ゲートを固定SHAから再実行する。
          # 現行版へ上がる2行だけを除外し、v0.98までの安全性・機能チェックを維持する。
          git show "$V098_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v098-build-apk.yml
          awk '
            /^      - name: Verify cumulative v0.14-v0.98 sources/ { capture=1; next }
            capture && /^      - name: Verify launcher and orientation configuration/ { exit }
            capture && /^        run: \\|/ { inrun=1; next }
            capture && inrun { sub(/^          /, ""); print }
          ' /tmp/v098-build-apk.yml \\
            | grep -vF "grep -Fq 'versionCode = 128' app/build.gradle.kts" \\
            | grep -vF "grep -Fq 'versionName = \\"0.98.0-dev.1\\"' app/build.gradle.kts" \\
            > /tmp/v098-cumulative-checks.sh
          test -s /tmp/v098-cumulative-checks.sh
          bash -euxo pipefail /tmp/v098-cumulative-checks.sh

          # v0.99 printer endpoint serialization acceptance.
          grep -Fq 'versionCode = 129' app/build.gradle.kts
          grep -Fq 'versionName = "0.99.0-dev.1"' app/build.gradle.kts
          test -s app/src/main/java/jp/co/tenposinfo/register/PrinterEndpointSendGate.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V099PrinterEndpointSerializationTest.kt
          test -s docs/V0.99_PRINTER_ENDPOINT_SERIALIZATION.md
          test -s docs/V0.99_RELEASE_NOTES.md
          grep -Fq 'PrinterEndpointSendGate.withPermit(' app/src/main/java/jp/co/tenposinfo/register/Receipt.kt
          grep -Fq 'waitMillis = timeoutMillis.toLong()' app/src/main/java/jp/co/tenposinfo/register/Receipt.kt
          grep -Fq 'private fun sendExclusive(payload: ByteArray)' app/src/main/java/jp/co/tenposinfo/register/Receipt.kt
          grep -Fq 'lock.tryLock(waitMillis.coerceAtLeast(1L), TimeUnit.MILLISECONDS)' app/src/main/java/jp/co/tenposinfo/register/PrinterEndpointSendGate.kt
          grep -Fq 'ReentrantLock(true)' app/src/main/java/jp/co/tenposinfo/register/PrinterEndpointSendGate.kt
          grep -Fq '送信待ちタイムアウト' app/src/main/java/jp/co/tenposinfo/register/PrinterEndpointSendGate.kt
          grep -Fq 'PrinterFailureDisposition.SAFE_TO_RETRY' app/src/test/java/jp/co/tenposinfo/register/V099PrinterEndpointSerializationTest.kt
          grep -Fq '最終総合実機試験へ繰越' docs/V0.99_RELEASE_NOTES.md
          ! grep -Fqi 'DELETE FROM sales' app/src/main/java/jp/co/tenposinfo/register/PrinterEndpointSendGate.kt
          ! grep -Fqi 'UPDATE sales' app/src/main/java/jp/co/tenposinfo/register/PrinterEndpointSendGate.kt
          ! grep -Fqi 'DROP TABLE' app/src/main/java/jp/co/tenposinfo/register/PrinterEndpointSendGate.kt

'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'cumulative gate replacement count={count}')

          replacements = {
              'POS_VERSION_CODE: 128': 'POS_VERSION_CODE: 129',
              'POS_VERSION_NAME: 0.98.0-dev.1': 'POS_VERSION_NAME: 0.99.0-dev.1',
              'register_apk=artifacts/TSUGUREGI_v0.98.0_dev1_automatic_print_dispatch_safety_debug.apk':
                  'register_apk=artifacts/TSUGUREGI_v0.99.0_dev1_printer_endpoint_serialization_debug.apk',
              'REGISTER_VERSION_NAME=0.98.0-dev.1': 'REGISTER_VERSION_NAME=0.99.0-dev.1',
              'REGISTER_VERSION_CODE=128': 'REGISTER_VERSION_CODE=129',
              'name: TSUGUREGI-v0.98.0-dev1-automatic-print-dispatch-safety-apks':
                  'name: TSUGUREGI-v0.99.0-dev1-printer-endpoint-serialization-apks',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing workflow token: {old}')
              text = text.replace(old, new, 1)

          flag_anchor = '''          AUTOMATIC_PRINT_BACKLOG_CONTINUATION=true
          REAL_DEVICE_PRINTER_VERIFICATION=deferred-final-acceptance
'''
          flag_replacement = '''          AUTOMATIC_PRINT_BACKLOG_CONTINUATION=true
          PRINTER_ENDPOINT_SERIALIZATION=true
          PRINTER_ENDPOINT_GATE=true
          PRINTER_ENDPOINT_WAIT_TIMEOUT_SAFE=true
          PRINTER_ENDPOINT_DIFFERENT_TARGET_PARALLEL=true
          PRINTER_ENDPOINT_ALL_TCP_PATHS_PROTECTED=true
          REAL_DEVICE_PRINTER_ENDPOINT_SERIALIZATION_VERIFICATION=deferred-final-acceptance
          REAL_DEVICE_PRINTER_VERIFICATION=deferred-final-acceptance
'''
          if flag_anchor not in text:
              raise SystemExit('missing build-summary flag anchor')
          text = text.replace(flag_anchor, flag_replacement, 1)

          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/v099-apply-printer-endpoint-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-apk.yml .github/workflows/v099-apply-printer-endpoint-gate.yml
          git commit -m "ci(v0.99): add printer endpoint serialization gate"
          git push origin HEAD:develop/v0.99
