name: Apply v0.17 operation atomicity

on:
  pull_request:
    branches:
      - develop/v0.16
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'develop/v0.17'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout v0.17
        uses: actions/checkout@v4
        with:
          ref: develop/v0.17
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply atomic operation changes
        run: python3 tools/apply_v017.py

      - name: Verify atomicity and idempotency
        run: |
          grep -q 'operation_commit_keys' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'claimOperationKey' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'bindOperationKey' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'OperationsIdempotencyPolicy.reversalKey' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'OperationsIdempotencyPolicy.settlementKey' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'OperationExecutionGuard' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          ! grep -q 'require(!isSaleReversed(originalSaleId))' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          test -f app/src/test/java/jp/co/tenposinfo/register/V017OperationExecutionSafetyTest.kt
          test -f docs/V0.17_OPERATION_ATOMICITY.md

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt \
            docs/V0.17_OPERATION_ATOMICITY.md
          git commit -m "feat(v0.17): make reversal and settlement operations atomic"
          git push origin HEAD:develop/v0.17
