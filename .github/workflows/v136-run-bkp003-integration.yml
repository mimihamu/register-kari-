name: v1.36 BKP-003 integration verification

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply BKP-003 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/v136_bkp003_integrate.py').read_text()
          prefix = source.split('# Startup restore:', 1)[0]
          exec(compile(prefix, '.github/v136_bkp003_integrate.py:product-prefix', 'exec'))
          PY
          python3 .github/v136_bkp003_bootstrap_patch.py
      - name: Source sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'BackupContentBundleV136.writeTo(appContext, zip, manifest.createdAt)' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -Fq 'BackupContentBundleV136.applyStagedWithRollback' app/src/main/java/jp/co/tenposinfo/register/DataRestoreBootstrapV086.kt
          grep -Fq 'contentRollback?.restore()' app/src/main/java/jp/co/tenposinfo/register/DataRestoreBootstrapV086.kt
          grep -Fq 'hasPersistedWritePermission(context, uri)' app/src/main/java/jp/co/tenposinfo/register/BackupContentV136.kt
          grep -Fq 'content_bundle" to if (hasContent) BackupContentBundleV136.FORMAT else "LEGACY_DB_ONLY"' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Focused BKP-003 unit test
        run: gradle --no-daemon :app:testDebugUnitTest --tests jp.co.tenposinfo.register.V141BackupContentBundleTest
      - name: Compile app Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Commit verified product integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v136_bkp003_integrate.py .github/v136_bkp003_bootstrap_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/co/tenposinfo/register/BackupContentV136.kt \
                  app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt \
                  app/src/main/java/jp/co/tenposinfo/register/DataRestoreBootstrapV086.kt \
                  .github/v136_bkp003_integrate.py .github/v136_bkp003_bootstrap_patch.py
          git diff --cached --check
          git commit -m 'feat(v1.36): integrate BKP-003 complete restore content'
          git push origin HEAD:develop/v1.36
