name: v1.36 SCR-720 stamp snapshot apply

on:
  push:
    branches: [ develop/v1.36 ]
    paths:
      - '.github/v136-scr720-stamp-snapshot-apply.py'
      - '.github/workflows/v136-scr720-stamp-snapshot-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply SCR-720 snapshot patch
        run: python .github/v136-scr720-stamp-snapshot-apply.py
      - name: Remove one-shot patch assets
        run: rm .github/v136-scr720-stamp-snapshot-apply.py .github/workflows/v136-scr720-stamp-snapshot-apply.yml
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'v1.36 SCR-720 freeze stamp snapshot and header mode'
          git push origin HEAD:develop/v1.36
