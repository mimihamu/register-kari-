name: v1.36 SYN-003 apply

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'develop/v1.36'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply SYN-003 patch
        run: python3 .github/v136-syn003-fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/PrintDocumentSnapshotV136.kt app/src/main/java/jp/co/tenposinfo/register/Receipt.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(v1.36): enforce SYN-003 frozen print snapshot"
            git push origin HEAD:develop/v1.36
          fi
