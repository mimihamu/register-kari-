name: Inspect v0.28 UI sources

on:
  push:
    branches:
      - develop/v0.28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate overlapping controls and headers
        run: |
          set -euo pipefail
          echo '=== navigation labels ==='
          grep -R -n --include='*.kt' -E '任意税率・改定|任意税率・メニュー改定|税・インボイス|改定内容編集|同期基盤' app/src/main/java || true
          echo '=== visible REGISTER labels ==='
          grep -R -n --include='*.kt' 'Text("REGISTER"' app/src/main/java || true
          echo '=== top bar implementations ==='
          grep -R -n --include='*.kt' -E 'fun .*Header\(|height\(62\.dp\).*background\(' app/src/main/java || true
          echo '=== keypad implementations ==='
          grep -R -n --include='*.kt' -E 'fun NumberPad\(|COMPACT_KEY_HEIGHT_DP|bottomActionLabel' app/src/main/java || true
