name: tmp v1.36 RCP-004 reissue order
on:
  push:
    branches: [develop/v1.36]
    paths: [.github/workflows/tmp-v136-rcp004-top-order.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
      - name: Move reissue mark to absolute top
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/jp/co/tenposinfo/register/Receipt.kt')
          text=p.read_text()
          old='''        val lines = mutableListOf<String>()\n        data.documentHeader.lineSequence().map { it.trim() }.filter { it.isNotBlank() }.forEach { lines += fit(it, width) }\n        lines += center(data.storeName, width)\n        if (data.storeAddress.isNotBlank()) lines += center(data.storeAddress, width)\n        if (data.storePhone.isNotBlank()) lines += center("TEL ${data.storePhone}", width)\n        if (data.reprint) lines += center("【再発行】", width)\n        lines += center("領収書／レシート", width)\n'''
          new='''        val lines = mutableListOf<String>()\n        if (data.reprint) lines += center("【再発行】", width)\n        data.documentHeader.lineSequence().map { it.trim() }.filter { it.isNotBlank() }.forEach { lines += fit(it, width) }\n        lines += center(data.storeName, width)\n        if (data.storeAddress.isNotBlank()) lines += center(data.storeAddress, width)\n        if (data.storePhone.isNotBlank()) lines += center("TEL ${data.storePhone}", width)\n        lines += center("領収書／レシート", width)\n'''
          if text.count(old)!=1:
              raise SystemExit(f'expected one match, got {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
          rm .github/workflows/tmp-v136-rcp004-top-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/co/tenposinfo/register/Receipt.kt .github/workflows/tmp-v136-rcp004-top-order.yml
          git commit -m 'fix: put v1.36 RCP-004 reissue mark at receipt top'
          git push origin HEAD:develop/v1.36
