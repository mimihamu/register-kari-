name: v1.36 BKP-005 terminal identity audit

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Audit BKP-005 terminal identity and numbering
        shell: bash
        run: |
          set -euo pipefail
          out=bkp005-audit.txt
          {
            echo '=== HEAD ==='; git rev-parse HEAD
            echo '=== identity / generation ==='
            grep -RInE --include='*.kt' --include='*.md' 'terminalId|terminal_id|terminalGeneration|terminal_generation|generation|SalesJournalIdentityStore|sync_runtime_settings' app/src/main app/src/test docs | head -n 6000 || true
            echo '=== store name / profile ==='
            grep -RInE --include='*.kt' --include='*.xml' --include='*.md' 'storeName|store_name|shopName|shop_name|店舗名|店舗名称|店名|receipt.*name|companyName|company_name' app/src/main app/src/test docs | head -n 6000 || true
            echo '=== sales / transaction / receipt numbering ==='
            grep -RInE --include='*.kt' --include='*.md' 'saleNumber|sale_number|transactionNumber|transaction_number|receiptNumber|receipt_number|receiptNo|transactionNo|会計番号|取引番号|伝票番号|採番|sequence|next[A-Za-z]*Number|number[A-Za-z]*Next' app/src/main app/src/test docs | head -n 6000 || true
            echo '=== sales schema / inserts ==='
            grep -RInE --include='*.kt' 'CREATE TABLE IF NOT EXISTS sales|CREATE TABLE sales|INSERT INTO sales|ContentValues.*sales|db\.insert\("sales"|insertOrThrow\("sales"' app/src/main app/src/test | head -n 3000 || true
            echo '=== restore identity paths ==='
            grep -RInE --include='*.kt' 'stageRestore|applyPendingRestore|pending-register|restore-plan|preflightRestore|RestoreReservation|復元|予備端末|同一端末' app/src/main app/src/test | head -n 6000 || true
            echo '=== candidate filenames ==='
            find app/src/main/java app/src/test/java -type f -name '*.kt' | sort | grep -Ei 'sale|journal|identity|restore|backup|number|sequence|session|store|receipt|profile' || true
          } > "$out"
          wc -l "$out"
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: v136-bkp005-audit
          path: bkp005-audit.txt
          retention-days: 1
