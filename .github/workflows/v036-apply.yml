name: Apply v0.36 source changes

on:
  push:
    branches:
      - develop/v0.36
    paths:
      - tools/v036_apply.py
      - .github/workflows/v036-apply.yml
  pull_request:
    branches:
      - develop/v0.35
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v036-source-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v0.36
        uses: actions/checkout@v4
        with:
          ref: develop/v0.36
          fetch-depth: 0

      - name: Apply source change
        run: python3 tools/v036_apply.py

      - name: Commit production source only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/BusinessSyncFoundation.kt
          git diff --cached --check
          git commit -m "feat: connect v0.36 sales journal contract"
          git push origin HEAD:develop/v0.36
