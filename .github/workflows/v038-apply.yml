name: Apply v0.38 source changes

on:
  push:
    branches:
      - develop/v0.38
    paths:
      - tools/v038_apply.py
      - .github/workflows/v038-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v038-source-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout v0.38
        uses: actions/checkout@v4
        with:
          ref: develop/v0.38
          fetch-depth: 0

      - name: Apply source integration and CI template
        run: python3 tools/v038_apply.py

      - name: Commit production changes and CI template
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs tools/v038_build_apk.yml
          git diff --cached --check
          git commit -m "feat: connect v0.38 outbox operations dashboard"
          git push origin HEAD:develop/v0.38
