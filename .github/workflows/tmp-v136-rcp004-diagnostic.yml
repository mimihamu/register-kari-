name: tmp v1.36 RCP-004 diagnostic
on:
  push:
    branches: [develop/v1.36]
    paths: [.github/workflows/tmp-v136-rcp004-diagnostic.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reproduce unit tests and preserve exact failure
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest > /tmp/rcp004-test.log 2>&1
          code=$?
          set -e
          tail -n 350 /tmp/rcp004-test.log > /tmp/rcp004-test-tail.log
          printf 'exit_code=%s\n' "$code" > /tmp/rcp004-exit.txt
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/tmp-v136-rcp004-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-v136-rcp004-diagnostic.yml
          git commit -m 'chore: remove v1.36 RCP-004 diagnostic workflow'
          git push origin HEAD:develop/v1.36
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v136-rcp004-diagnostic
          path: |
            /tmp/rcp004-test-tail.log
            /tmp/rcp004-exit.txt
          retention-days: 1
