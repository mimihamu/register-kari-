name: v1.36 BKP-007 implement fix

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-bkp007-implement-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare corrected BKP-007 patch runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/v136-bkp007-implement.py').read_text(encoding='utf-8')
          src = src.replace(
              "test.write_text(r'''package jp.co.tenposinfo.register",
              "test.joinpath('V145Bkp007PreApplySnapshotTest.kt').write_text(r'''package jp.co.tenposinfo.register",
              1,
          )
          src = src.replace(
              '''            snapshot = MenuRevisionPreApplySnapshotV145.capture(db)\n            val before = snapshot.rows.associateBy { it.productId }''',
              '''            val capturedSnapshot = MenuRevisionPreApplySnapshotV145.capture(db)\n            snapshot = capturedSnapshot\n            val before = capturedSnapshot.rows.associateBy { it.productId }''',
              1,
          )
          src = src.replace('snapshotRows=${snapshot.rows.size} / masterRevision=${snapshot.catalogRevision}', 'snapshotRows=${capturedSnapshot.rows.size} / masterRevision=${capturedSnapshot.catalogRevision}', 1)
          src = src.replace('            update("product_meta",', '            db.update("product_meta",', 1)
          src = src.replace('val productExists = scalarLong(this, "SELECT COUNT(*) FROM products', 'val productExists = scalarLong(db, "SELECT COUNT(*) FROM products', 1)
          src = src.replace('                    update("products",', '                    db.update("products",', 1)
          src = src.replace('                    insertOrThrow("products",', '                    db.insertOrThrow("products",', 1)
          src = src.replace('\n                insertWithOnConflict(\n                    "catalog_product_base"', '\n                db.insertWithOnConflict(\n                    "catalog_product_base"', 1)
          src = src.replace('\n                insertWithOnConflict(\n                    "product_meta"', '\n                db.insertWithOnConflict(\n                    "product_meta"', 1)
          src = src.replace('\n                insertWithOnConflict(\n                    "product_tax_assignments"', '\n                db.insertWithOnConflict(\n                    "product_tax_assignments"', 1)
          src = src.replace('            execSQL("UPDATE catalog_revision', '            db.execSQL("UPDATE catalog_revision', 1)
          src = src.replace('\n            update(\n                "menu_revisions",\n                ContentValues().apply { put("status", "SUPERSEDED") }', '\n            db.update(\n                "menu_revisions",\n                ContentValues().apply { put("status", "SUPERSEDED") }', 1)
          src = src.replace('            require(\n                update(\n                    "menu_revisions",', '            require(\n                db.update(\n                    "menu_revisions",', 1)
          src = src.replace('            audit(\n                this,\n                "MENU_REVISION_APPLIED"', '            audit(\n                db,\n                "MENU_REVISION_APPLIED"', 1)
          src = src.replace('            setTransactionSuccessful()\n        } catch', '            db.setTransactionSuccessful()\n        } catch', 1)
          src = src.replace('                    update("menu_revisions", ContentValues().apply { put("status", "FAILED") }', '                    db.update("menu_revisions", ContentValues().apply { put("status", "FAILED") }', 1)
          src = src.replace('                    audit(\n                        this,\n                        "MENU_REVISION_APPLY_ROLLED_BACK"', '                    audit(\n                        db,\n                        "MENU_REVISION_APPLY_ROLLED_BACK"', 1)
          src = src.replace('                    setTransactionSuccessful()\n                } finally', '                    db.setTransactionSuccessful()\n                } finally', 1)
          src = src.replace('assertTrue(runtime.contains("snapshot.restore(db)"))', 'assertTrue(runtime.contains("captured?.restore(db)"))', 1)
          Path('/tmp/v136-bkp007-fixed.py').write_text(src, encoding='utf-8')
          PY
      - name: Apply BKP-007 patch
        run: python3 /tmp/v136-bkp007-fixed.py
      - name: Run V145 focused unit test
        run: gradle --no-daemon :app:testDebugUnitTest --tests jp.co.tenposinfo.register.V145Bkp007PreApplySnapshotTest --stacktrace
      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace
      - name: Commit BKP-007 product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogRuntime.kt \
            app/src/main/java/jp/co/tenposinfo/register/MenuRevisionPreApplySnapshotV145.kt \
            app/src/test/java/jp/co/tenposinfo/register/V145Bkp007PreApplySnapshotTest.kt \
            docs/V1.36_BKP_007_PRE_APPLY_SNAPSHOT.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'feat(v1.36): add BKP-007 pre-apply menu snapshot'
            git push origin HEAD:develop/v1.36
          fi
