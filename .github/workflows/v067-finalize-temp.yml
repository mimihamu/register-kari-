name: v0.67 finalize temp

on:
  push:
    branches:
      - develop/v0.67

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.67
          fetch-depth: 0
      - name: Apply v0.67 final references
        run: python tools/v067_finalize.py
      - name: Commit generated v0.67
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app management-app .github/workflows docs tools/v067_finalize.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "v0.67 finalize sale receipt reprint navigation"
          git push origin HEAD:develop/v0.67
