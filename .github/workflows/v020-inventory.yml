name: Inspect v0.20 data protection

on:
  pull_request:
    branches:
      - develop/v0.19
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.20
        uses: actions/checkout@v4
        with:
          ref: develop/v0.20

      - name: Build inventory
        run: |
          mkdir -p inventory/source
          find app/src/main/java app/src/test/java docs -type f | sort > inventory/files.txt
          grep -R -n -i -E 'backup|restore|integrity|foreign_key_check|quick_check|DriveOutbox|outbox|export|import|CSV|JSON|復元|バックアップ|整合性|データ出力' app/src/main/java app/src/test/java docs > inventory/data-protection-usage.txt || true
          cp -R app/src/main/java inventory/source/main-java
          cp -R app/src/test/java inventory/source/test-java
          cp -R docs inventory/source/docs
          cp app/build.gradle.kts inventory/source/app-build.gradle.kts
          cp app/src/main/AndroidManifest.xml inventory/source/AndroidManifest.xml

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: v020-data-protection-inventory
          path: inventory
          if-no-files-found: error
          retention-days: 7
