name: Update v0.47 management tests

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - develop/v0.46
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.47 head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.47
          fetch-depth: 0

      - name: Update cumulative management tests
        run: python3 tools/v047_update_management_tests.py

      - name: Remove temporary script
        run: rm tools/v047_update_management_tests.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add management-app/src/test tools
          git commit -m "v0.47 update cumulative management test versions"
          git push origin HEAD:develop/v0.47
