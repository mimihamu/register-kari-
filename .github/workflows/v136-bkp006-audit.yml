name: v1.36 BKP-006 sync rebuild implementation

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-bkp006-audit.yml
      - .github/v136-bkp006-patch.py
      - .github/v136-bkp006-followup.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply BKP-006/BKP-018 patch
        run: |
          set -euo pipefail
          python3 .github/v136-bkp006-patch.py
          python3 .github/v136-bkp006-followup.py
          git diff --check
      - name: V144 focused unit test
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests jp.co.tenposinfo.register.V144Bkp006SyncRebuildTest
      - name: Kotlin compile
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin
      - name: Commit verified BKP-006 product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/main/java/jp/co/tenposinfo/register/BusinessSyncFoundation.kt \
            app/src/main/java/jp/co/tenposinfo/register/RestoreSyncRebuildV136.kt \
            app/src/main/java/jp/co/tenposinfo/register/DataRestoreBootstrapV086.kt \
            app/src/main/java/jp/co/tenposinfo/register/GoogleDriveDirectUpload.kt \
            app/src/test/java/jp/co/tenposinfo/register/V144Bkp006SyncRebuildTest.kt
          git diff --cached --quiet && { echo 'No BKP-006 product changes'; exit 0; }
          git commit -m 'feat(v1.36): rebuild restore sync outbox idempotently'
          git push origin HEAD:develop/v1.36
