name: v1.36 RCP batch patch runner

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-rcp-batch-patch.yml
      - tools/v136_rcp_batch_apply.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply RCP-BATCH-SET-001 implementation
        run: python3 tools/v136_rcp_batch_apply.py
      - name: Targeted unit test
        run: ./gradlew :app:testDebugUnitTest --tests 'jp.co.tenposinfo.register.V136ReceiptVoucherBatchFixedAmountTest' --stacktrace
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email 'noreply@openai.com'
          git add app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt \
                  app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucherActivity.kt \
                  app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucherBatchRecoveryV135.kt \
                  app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucherBatchFixedAmountV136.kt \
                  app/src/test/java/jp/co/tenposinfo/register/V136ReceiptVoucherBatchFixedAmountTest.kt \
                  docs/V1.36_RCP_BATCH_SET_001_FIXED_AMOUNT_BATCH.md
          git commit -m 'feat(v1.36): complete fixed-amount receipt batches'
          git push origin HEAD:develop/v1.36
