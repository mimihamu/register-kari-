name: v1.38 crash POS startup integration

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v138-crash-pos-startup.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Apply POS crash startup integration
        run: python3 .github/scripts/v138_crash_pos_startup_patch.py
      - name: Compile all app Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :management-app:compileDebugKotlin :customer-display:compileDebugKotlin
      - name: Commit and push POS integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/RegisterApplication.kt
          git diff --cached --check
          git commit -m "feat(v1.36): start crash reporting in tsuguregi"
          git push origin HEAD:develop/v1.36
