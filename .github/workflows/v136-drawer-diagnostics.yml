name: v1.36 drawer diagnostics

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-drawer-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Inspect drawer policy and call sites
        shell: bash
        run: |
          set -euo pipefail
          f=$(find app/src -name PaymentSettlementSupport.kt -print -quit)
          p=$(find app/src -name PrinterSupport.kt -print -quit)
          echo "PAYMENT_FILE=$f"
          echo "PRINTER_FILE=$p"
          echo '=== PaymentSettlementSupport drawer section ==='
          sed -n '90,650p' "$f"
          echo '=== all drawer policy call sites ==='
          grep -RniE 'CashDrawerStandaloneOpenGuardV134|CashDrawerStandaloneAction|isStandaloneOpenAllowed|openForPayment|drawerOpenStandaloneEnabled|recordDrawer|DRAWER_OPEN' app/src/main app/src/test || true
          echo '=== printer drawer section ==='
          grep -nE 'drawer|cashDrawer|pulse|0x70|ESC.?p' "$p" | head -250 || true
