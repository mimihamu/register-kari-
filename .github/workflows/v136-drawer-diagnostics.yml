name: v1.36 drawer diagnostics

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-drawer-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Inspect drawer call sites
        shell: bash
        run: |
          set -u
          echo '=== drawer / printer call sites ==='
          grep -RniE --exclude-dir=.git 'drawerOnly\(|openDrawer[[:space:]]*=|drawerOpenOnCashSale|drawerEnabled|PrinterCommandEncoder\.encodeText|PrinterPulsePolicy\.command|recordCashMovement\(|CashMovementType\.|manual_return|reversal_payments' app/src/main app/src/test | head -5000 || true
          echo '=== payment completion candidates ==='
          grep -RniE --exclude-dir=.git 'commitSale|completePayment|payment.*complete|会計完了|PaymentMethod\.CASH|sale_payments|receiptAutoPrint|enqueue.*receipt|PrintJob' app/src/main/java/jp/co/tenposinfo/register | head -5000 || true
          echo '=== operations UI cash movement ==='
          grep -RniE --exclude-dir=.git 'recordCashMovement|CashMovementType|入金|出金|両替' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt | head -2500 || true
