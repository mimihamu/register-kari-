name: v1.36 drawer diagnostics

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-drawer-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Inspect drawer policy and call sites
        shell: bash
        run: |
          echo '=== exact filenames ==='
          find . -type f \( -name 'PaymentSettlementSupport.kt' -o -name 'PrinterSupport.kt' \) -print || true
          echo '=== class references whole repo ==='
          grep -RniE --exclude-dir=.git 'CashDrawerStandaloneOpenGuardV134|CashDrawerStandaloneAction|isStandaloneOpenAllowed|drawerOpenStandaloneEnabled|openForPayment|drawerSensorMode|drawerOpenReasonRequired|DRAWER_OPEN' . | head -3000 || true
          echo '=== likely files ==='
          grep -RliE --exclude-dir=.git 'CashDrawerStandaloneOpenGuardV134|CashDrawerStandaloneAction|drawerOpenStandaloneEnabled' . | head -200 || true
