name: COR-005 one-shot hub summary patch

on:
  push:
    branches:
      - develop/v1.35
    paths:
      - scripts/cor005_remove_double_summary_patch.py
      - .github/workflows/cor005-hub-summary-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch operations hub summary
        run: python scripts/cor005_remove_double_summary_patch.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/OperationsHubActivityV030.kt
          git diff --cached --exit-code && exit 0
          git commit -m "Use unified COR-005 accounting summary in operations hub"
          git push origin HEAD:develop/v1.35
