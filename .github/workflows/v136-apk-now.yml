name: Build v1.36 APK Now

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v136-apk-now-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin

      - name: Build three debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug

      - name: Show APKs and SHA-256
        shell: bash
        run: |
          find app/build/outputs/apk/debug customer-display/build/outputs/apk/debug management-app/build/outputs/apk/debug -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload つぐレジ APK
        uses: actions/upload-artifact@v4
        with:
          name: tsugu-register-v136-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload つぐレジ CD APK
        uses: actions/upload-artifact@v4
        with:
          name: tsugu-register-cd-v136-debug-apk
          path: customer-display/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload つぐレジ＋ APK
        uses: actions/upload-artifact@v4
        with:
          name: tsugu-register-plus-v136-debug-apk
          path: management-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
