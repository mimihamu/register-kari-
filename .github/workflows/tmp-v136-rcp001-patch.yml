name: tmp-v136-rcp001-patch

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/tmp-v136-rcp001-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Patch RCP-001 printer test and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/jp/co/tenposinfo/register/AdminSettingsStore.kt')
          source = path.read_text(encoding='utf-8')
          start_marker = '    fun testPrinter(configuration: PrinterConfiguration): Result<Unit> {'
          end_marker = '\n    fun testDrawer(configuration: PrinterConfiguration): Result<Unit> {'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''    fun testPrinter(configuration: PrinterConfiguration): Result<Unit> {
              require(configuration.host.isNotBlank()) { "IPアドレスまたはホスト名を入力してください" }
              val now = Instant.now().toString()
              val paper = PrinterPaperSettingPolicy.paper(configuration)
              val text = buildString {
                  append("つぐレジ プリンターテスト\\n")
                  append("${configuration.name}\\n")
                  append("${configuration.host}:${configuration.port}\\n")
                  append("${configuration.profile.displayName}\\n")
                  append("用紙 ${paper.widthMm}mm / ${configuration.cutMode.displayName}\\n")
                  append("$now\\n\\n")
                  append(PrinterPaperWidthTestV136.buildAll(paper, now))
              }
              val payload = PrinterCommandEncoder.encodeText(
                  text = text,
                  configuration = configuration.copy(paperWidthMm = paper.widthMm),
                  openDrawer = false,
                  appendCut = true,
              )
              return printerGateway(configuration).send(payload)
          }
          '''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/AdminSettingsStore.kt
          git rm .github/workflows/tmp-v136-rcp001-patch.yml
          git commit -m "feat(v1.36): make RCP-001 printer test paper-width aware"
          git push origin HEAD:develop/v1.36
