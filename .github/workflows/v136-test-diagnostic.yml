name: Diagnose v1.36 Unit Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v136-test-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run cumulative unit tests and retain status
        id: tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest
          rc=$?
          echo "$rc" > /tmp/v136-test-rc
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "=== JUnit failure excerpts ==="
          find app customer-display management-app -path '*/build/test-results/*/*.xml' -type f -print -exec grep -n -E '<failure|testsuite .*failures="[1-9]' {} \; || true
          exit 0

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v136-junit-reports
          path: |
            app/build/test-results/**/*.xml
            customer-display/build/test-results/**/*.xml
            management-app/build/test-results/**/*.xml
          if-no-files-found: error

      - name: Preserve test failure status
        if: always()
        shell: bash
        run: |
          rc="${{ steps.tests.outputs.exit_code }}"
          test -n "$rc"
          exit "$rc"
