name: Apply v0.18 business session integration

on:
  pull_request:
    branches:
      - develop/v0.17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout v0.18
        uses: actions/checkout@v4
        with:
          ref: develop/v0.18
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply business session changes
        run: python3 tools/apply_v018.py

      - name: Verify business session integration
        run: |
          grep -q 'versionCode = 48' app/build.gradle.kts
          grep -q 'versionName = "0.18.0-dev.1"' app/build.gradle.kts
          grep -q 'fun currentOpen' app/src/main/java/jp/co/tenposinfo/register/StabilizationFoundation.kt
          grep -q 'BusinessSessionTransitionPolicy' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'startBusinessDay' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'endBusinessDay' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'sales WHERE business_session_id' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'openingCash = session.openingCash' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'business_session_id", session.id' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'BusinessSessionStatus.Z_SETTLED.name' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'BusinessSessionSchema.currentOpen(this)' app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt
          grep -q '営業開始後に会計してください' app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt
          grep -q 'OperationsScreen.BUSINESS' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q '営業開始・終了' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'is OperationsActivity, is AdvancedOperationsActivity' app/src/main/java/jp/co/tenposinfo/register/RegisterApplication.kt
          ! grep -q 'onValueChange = { operator =' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          test -f app/src/test/java/jp/co/tenposinfo/register/V018BusinessSessionIntegrationTest.kt
          test -f docs/V0.18_BUSINESS_SESSION_INTEGRATION.md

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt \
            app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt \
            app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/StabilizationFoundation.kt \
            app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt \
            app/src/main/java/jp/co/tenposinfo/register/RegisterApplication.kt \
            app/src/test/java/jp/co/tenposinfo/register/V018BusinessSessionIntegrationTest.kt \
            docs/V0.18_BUSINESS_SESSION_INTEGRATION.md
          git commit -m "feat: integrate secure business sessions into operations" || exit 0
          git push origin HEAD:develop/v0.18
