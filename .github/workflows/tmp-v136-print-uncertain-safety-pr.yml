name: Trigger v1.36 print uncertain safety patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Execute patch embedded in temporary push workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-v136-print-uncertain-safety-patch.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n          git config"
          if start not in workflow or end not in workflow:
              raise SystemExit('embedded patch boundaries not found')
          body = workflow.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          source = '\n'.join(lines) + '\n'
          exec(compile(source, '<embedded-v136-print-safety-patch>', 'exec'), {})
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/test/java docs
          git diff --cached --check
          git commit -m "feat(v1.36): harden uncertain print delivery recovery"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
