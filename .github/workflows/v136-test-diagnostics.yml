name: v1.36 Test Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v136-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-v136-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run cumulative unit tests with diagnostics
        id: cumulative_tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest --stacktrace --info 2>&1 | tee cumulative-test.log

      - name: Upload cumulative test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            cumulative-test.log
            app/build/test-results/testDebugUnitTest/**/*.xml
            customer-display/build/test-results/testDebugUnitTest/**/*.xml
            management-app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
            customer-display/build/reports/tests/testDebugUnitTest/**
            management-app/build/reports/tests/testDebugUnitTest/**
