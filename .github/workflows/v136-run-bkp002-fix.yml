name: v1.36 run BKP-002 online backup patch

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/v136_bkp002_patch.py
      - name: Verify staged changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DataProtectionOnlineBackupV136.copyWithinWriterBlockBudget(source, target)' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -Fq 'MAX_FALLBACK_WRITER_BLOCK_MILLIS = 2_000L' app/src/main/java/jp/co/tenposinfo/register/DataProtectionOnlineBackupV136.kt
          grep -Fq 'PERFORMANCE_TARGET_TRANSACTIONS = 10_000' app/src/main/java/jp/co/tenposinfo/register/DataProtectionOnlineBackupV136.kt
          grep -Fq 'PERFORMANCE_TARGET_MILLIS = 30_000L' app/src/main/java/jp/co/tenposinfo/register/DataProtectionOnlineBackupV136.kt
          test -f app/src/test/java/jp/co/tenposinfo/register/V140DataProtectionOnlineBackupTest.kt
      - name: Commit clean product patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v136_bkp002_patch.py .github/workflows/v136-run-bkp002-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(v1.36): bound legacy backup writer blocking for BKP-002'
          git push origin HEAD:develop/v1.36
