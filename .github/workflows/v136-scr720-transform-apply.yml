name: v1.36 SCR-720 crop rotation apply

on:
  pull_request:
    types: [reopened]
    branches:
      - develop/v1.35

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'develop/v1.36'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply anchored patch
        run: python3 .github/v136-scr720-transform-apply.py
      - name: Verify product diff
        run: |
          git diff --check
          git diff --exit-code -- .github/v136-scr720-transform-apply.py .github/workflows/v136-scr720-transform-apply.yml
          test -n "$(git status --porcelain -- app/src/main/java/jp/co/tenposinfo/register/ReceiptStampV136.kt)"
      - name: Commit product patch and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/ReceiptStampV136.kt
          git rm .github/v136-scr720-transform-apply.py .github/workflows/v136-scr720-transform-apply.yml
          git commit -m "feat(v1.36): add SCR-720 crop and rotation"
          git push origin HEAD:develop/v1.36
