name: Fix v0.37 CI template

on:
  push:
    branches:
      - develop/v0.37
    paths:
      - .github/workflows/v037-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v037-source-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v0.37
        uses: actions/checkout@v4
        with:
          ref: develop/v0.37
          fetch-depth: 0

      - name: Correct cumulative version check
        run: |
          set -euo pipefail
          sed -i 's/versionCode = 77/versionCode = 67/g' tools/v037_build_apk.yml
          grep -q 'versionCode = 67' tools/v037_build_apk.yml
          ! grep -q 'versionCode = 77' tools/v037_build_apk.yml

      - name: Commit corrected CI template
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/v037_build_apk.yml
          git diff --cached --check
          git commit -m "ci: correct v0.37 cumulative version check"
          git push origin HEAD:develop/v0.37
