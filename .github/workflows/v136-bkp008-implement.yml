name: v1.36 BKP-008 implement

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-bkp008-implement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply BKP-008 patch
        run: python3 .github/v136-bkp008-implement.py
      - name: Run V146 focused unit test
        run: gradle --no-daemon :app:testDebugUnitTest --tests jp.co.tenposinfo.register.V146Bkp008GoogleDriveIndependenceTest --stacktrace
      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace
      - name: Commit BKP-008 product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/BackupDriveIndependenceV146.kt \
            app/src/test/java/jp/co/tenposinfo/register/V146Bkp008GoogleDriveIndependenceTest.kt \
            docs/V1.36_BKP_008_GOOGLE_DRIVE_INDEPENDENCE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'feat(v1.36): separate backup and Drive sync status'
            git push origin HEAD:develop/v1.36
          fi
