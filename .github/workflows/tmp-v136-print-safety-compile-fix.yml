name: Apply v1.36 print safety compile fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fix exhaustive status branches and interpolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}')
              p.write_text(text.replace(old, new, 1))

          once(
              'app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt',
              '    PrintJobStatus.PRINTING -> Blue\n    PrintJobStatus.PENDING -> Navy',
              '    PrintJobStatus.SENDING -> Color(0xFFEF6C00)\n    PrintJobStatus.PRINTING -> Color(0xFFEF6C00)\n    PrintJobStatus.PENDING -> Navy',
          )
          once(
              'app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucherLedgerActivity.kt',
              '    PrintJobStatus.PENDING -> LedgerBlue\n    PrintJobStatus.PRINTING -> LedgerBlue\n    PrintJobStatus.DISCARDED -> LedgerMuted',
              '    PrintJobStatus.PENDING -> LedgerBlue\n    PrintJobStatus.SENDING -> LedgerOrange\n    PrintJobStatus.PRINTING -> LedgerOrange\n    PrintJobStatus.DISCARDED -> LedgerMuted',
          )
          once(
              'app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucherOperations.kt',
              '        PrintJobStatus.PRINTING -> "印刷中"\n        PrintJobStatus.COMPLETED -> "完了"',
              '        PrintJobStatus.SENDING -> "印刷済みの可能性"\n        PrintJobStatus.PRINTING -> "印刷済みの可能性（旧状態）"\n        PrintJobStatus.COMPLETED -> "完了"',
          )
          once(
              'app/src/main/java/jp/co/tenposinfo/register/PrintJobUncertainSafetyV136.kt',
              '"印刷結果不明。再印刷Job.$newJobIdへ引継ぎ：${reason.trim()}"',
              '"印刷結果不明。再印刷Job.${newJobId}へ引継ぎ：${reason.trim()}"',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git diff --cached --check
          git commit -m "fix(v1.36): compile uncertain print safety states"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
