name: tmp-v136-58mm-wrap-patch

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/tmp-v136-58mm-wrap-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Patch receipt wrapping and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/jp/co/tenposinfo/register/Receipt.kt')
          source = path.read_text(encoding='utf-8')
          old_name = '            lines += fit("${item.product.name} [$symbol]", width)'
          new_name = '            lines.addAll(ReceiptLineWrapV136.wrap("${item.product.name} [$symbol]", width))'
          old_note = '            if (item.note.isNotBlank()) lines += fit("  ※${item.note}", width)'
          new_note = '            if (item.note.isNotBlank()) lines.addAll(ReceiptLineWrapV136.wrap("  ※${item.note}", width))'
          if source.count(old_name) != 1:
              raise SystemExit(f'product-name target count={source.count(old_name)}')
          if source.count(old_note) != 1:
              raise SystemExit(f'note target count={source.count(old_note)}')
          source = source.replace(old_name, new_name, 1).replace(old_note, new_note, 1)
          path.write_text(source, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/Receipt.kt
          git rm .github/workflows/tmp-v136-58mm-wrap-patch.yml
          git commit -m "fix(v1.36): wrap long 58mm receipt text without truncation"
          git push origin HEAD:develop/v1.36
