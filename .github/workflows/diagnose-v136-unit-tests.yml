name: Diagnose v1.36 cumulative unit tests

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run cumulative unit tests and capture diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/test-results
          gradle --no-daemon --console=plain --stacktrace clean :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest 2>&1 | tee artifacts/gradle-unit-tests.log
          status=${PIPESTATUS[0]}
          find app customer-display management-app -path '*/build/test-results/*' -type f -name '*.xml' -print0 2>/dev/null | while IFS= read -r -d '' file; do
            dest="artifacts/test-results/$file"
            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"
          done
          echo "exit_code=$status" > artifacts/diagnostic-summary.txt
          echo "head=$(git rev-parse HEAD)" >> artifacts/diagnostic-summary.txt
          grep -E '(^|[[:space:]])(FAILED|FAILURE:|> Task .* FAILED|There were failing tests|Caused by:|AssertionError|expected:|but was:)' artifacts/gradle-unit-tests.log | tail -n 250 > artifacts/failure-excerpt.txt || true
          exit "$status"

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v136-unit-test-diagnostics
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
