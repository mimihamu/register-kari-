name: v1.36 BKP-009 implement

on:
  push:
    branches: [ develop/v1.36 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply BKP-009 patch
        run: python3 .github/v136-bkp009-patch.py
      - name: Run V147 focused unit test
        run: ./gradlew :app:testDevDebugUnitTest --tests jp.co.tenposinfo.register.V147Bkp009ManualExportTest --no-daemon
      - name: Compile Kotlin
        run: ./gradlew :app:compileDevDebugKotlin --no-daemon
      - name: Commit BKP-009 product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/BackupSafAccessV147.kt \
            app/src/test/java/jp/co/tenposinfo/register/V147Bkp009ManualExportTest.kt \
            docs/V1.36_BKP_009_MANUAL_EXPORT.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v1.36): harden SAF manual backup export'
          git push origin HEAD:develop/v1.36
