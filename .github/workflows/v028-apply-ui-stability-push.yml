name: Apply v0.28 UI stability on push

on:
  push:
    branches:
      - develop/v0.28

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v0.28
        uses: actions/checkout@v4
        with:
          ref: develop/v0.28
          fetch-depth: 0

      - name: Apply migration
        run: |
          set -euo pipefail
          python3 tools/apply_v028.py
          git diff --check
          grep -q 'versionCode = 58' app/build.gradle.kts
          grep -q 'versionName = "0.28.0-dev.1"' app/build.gradle.kts
          ! grep -q 'FrameLayout.LayoutParams' app/src/main/java/jp/co/tenposinfo/register/CatalogBootstrapProvider.kt
          grep -q 'COMPACT_KEY_HEIGHT_DP = 42' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt

      - name: Commit implementation
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No implementation changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs
          git commit -m 'feat: stabilize v0.28 tablet UI'
          git push origin HEAD:develop/v0.28
