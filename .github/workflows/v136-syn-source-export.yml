name: v1.36 sync source export
on:
  push:
    branches: [develop/v1.36]
    paths:
      - '.github/workflows/v136-syn-source-export.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect sync sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/app-main export/app-test export/plus-main export/plus-test export/github
          cp -a app/src/main/java/jp/co/tenposinfo/register/. export/app-main/
          cp -a app/src/test/java/jp/co/tenposinfo/register/. export/app-test/
          cp -a management-app/src/main/java/jp/co/tenposinfo/register/plus/. export/plus-main/
          cp -a management-app/src/test/java/jp/co/tenposinfo/register/plus/. export/plus-test/
          cp .github/workflows/build-apk.yml export/github/
          git rev-parse HEAD > export/HEAD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v136-syn-source-export
          path: export
          if-no-files-found: error
