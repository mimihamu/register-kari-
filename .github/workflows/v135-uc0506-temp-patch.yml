name: v1.35 UC-05-06 temporary patch

on:
  push:
    branches:
      - develop/v1.35

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - name: Apply fail-closed UC-05/06 patch
        run: python3 scripts/v135_uc0506_patch.py
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No implementation diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test docs
          git commit -m "feat(v1.35): implement product entry and search"
          git push origin HEAD:develop/v1.35
