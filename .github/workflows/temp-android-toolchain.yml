name: Temp Android Toolchain Prep

on:
  push:
    branches: [ tmp-android-toolchain ]

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Install API 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKROOT=/usr/local/lib/android/sdk
          echo "SDK root contents:"
          find "$SDKROOT" -maxdepth 4 -type f -name sdkmanager -o -name android.jar | head -30 || true
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 2
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"

      - name: Prefetch Android dependencies
        env:
          GRADLE_USER_HOME: /tmp/v0927-gradle-home
        run: |
          rm -rf /tmp/prefetch && mkdir -p /tmp/prefetch/app/src/main/java/test/prefetch
          cat > /tmp/prefetch/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral(); maven { url = uri("https://jitpack.io") } }
          }
          rootProject.name = "Prefetch"
          include(":app")
          EOF
          cat > /tmp/prefetch/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF
          cat > /tmp/prefetch/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cat > /tmp/prefetch/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
            namespace = "test.prefetch"
            compileSdk = 35
            defaultConfig {
              applicationId = "test.prefetch"
              minSdk = 23
              targetSdk = 35
              versionCode = 1
              versionName = "1"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("androidx.core:core:1.15.0")
            implementation("com.google.android.material:material:1.12.0")
            implementation("com.google.android.gms:play-services-location:21.3.0")
            implementation("com.journeyapps:zxing-android-embedded:4.3.0")
            implementation("com.github.pedroSG94.RootEncoder:library:2.6.1")
          }
          EOF
          cat > /tmp/prefetch/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          mkdir -p /tmp/prefetch/app/src/main/res/values
          cat > /tmp/prefetch/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar"/></resources>
          EOF
          cat > /tmp/prefetch/app/src/main/java/test/prefetch/MainActivity.java <<'EOF'
          package test.prefetch;
          public class MainActivity extends androidx.appcompat.app.AppCompatActivity {}
          EOF
          gradle -p /tmp/prefetch :app:assembleDebug --no-daemon --stacktrace

      - name: Package reusable toolchain
        env:
          GRADLE_USER_HOME: /tmp/v0927-gradle-home
        run: |
          set -euxo pipefail
          rm -rf /tmp/v0927-toolchain
          mkdir -p /tmp/v0927-toolchain/android-sdk/platforms
          mkdir -p /tmp/v0927-toolchain/android-sdk/build-tools
          mkdir -p /tmp/v0927-toolchain/android-sdk/platform-tools
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/v0927-toolchain/android-sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/v0927-toolchain/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platform-tools/." /tmp/v0927-toolchain/android-sdk/platform-tools/
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_DIR="$(dirname "$(dirname "$GRADLE_BIN")")"
          cp -a "$GRADLE_DIR" /tmp/v0927-toolchain/gradle-8.9
          mkdir -p /tmp/v0927-toolchain/gradle-home
          cp -a "$GRADLE_USER_HOME/caches" /tmp/v0927-toolchain/gradle-home/
          cp -a "$GRADLE_USER_HOME/notifications" /tmp/v0927-toolchain/gradle-home/ 2>/dev/null || true
          tar -C /tmp/v0927-toolchain -czf /tmp/android-v0927-toolchain.tar.gz .
          sha256sum /tmp/android-v0927-toolchain.tar.gz | tee /tmp/android-v0927-toolchain.sha256
          du -h /tmp/android-v0927-toolchain.tar.gz
          split -b 55M -d -a 2 /tmp/android-v0927-toolchain.tar.gz /tmp/toolchain.part-
          ls -lh /tmp/toolchain.part-*

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-manifest
          path: /tmp/android-v0927-toolchain.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-00
          path: /tmp/toolchain.part-00
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-01
          path: /tmp/toolchain.part-01
          compression-level: 0
          retention-days: 1
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-02
          path: /tmp/toolchain.part-02
          compression-level: 0
          retention-days: 1
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-03
          path: /tmp/toolchain.part-03
          compression-level: 0
          retention-days: 1
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-04
          path: /tmp/toolchain.part-04
          compression-level: 0
          retention-days: 1
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-05
          path: /tmp/toolchain.part-05
          compression-level: 0
          retention-days: 1
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-06
          path: /tmp/toolchain.part-06
          compression-level: 0
          retention-days: 1
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-07
          path: /tmp/toolchain.part-07
          compression-level: 0
          retention-days: 1
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-08
          path: /tmp/toolchain.part-08
          compression-level: 0
          retention-days: 1
      - name: Upload part 09
        if: ${{ hashFiles('/tmp/toolchain.part-09') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-09
          path: /tmp/toolchain.part-09
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload part 10
        if: ${{ hashFiles('/tmp/toolchain.part-10') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-10
          path: /tmp/toolchain.part-10
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload part 11
        if: ${{ hashFiles('/tmp/toolchain.part-11') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-11
          path: /tmp/toolchain.part-11
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
