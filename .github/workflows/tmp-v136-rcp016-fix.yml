name: tmp-v136-rcp016-fix

on:
  push:
    branches: [develop/v1.36]
    paths:
      - .github/workflows/tmp-v136-rcp016-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Patch RCP-016 routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Compose RowScope/ColumnScope exposes Modifier.weight; importing the internal
          # backing property fails on the current Compose compiler.
          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/DocumentPrintSettingsV136.kt",
              "import androidx.compose.foundation.layout.weight\n",
              "",
          )

          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt",
              "val copies = setting?.copies?.let(DocumentPrintSettingsPolicyV136::normalizeCopies) ?: 1",
              "val copies = setting?.copies?.let { DocumentPrintSettingsPolicyV136.normalizeCopies(it) } ?: 1",
          )

          # Receipt voucher: initial issuance honors auto-print; manual reprint remains
          # available even when auto-print is OFF. All physical outputs honor copies/header/footer.
          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt",
              "        val issuer = TaxInvoiceSettingsRegistry.current().issuer\n        var result: ReceiptVoucherIssueResult? = null",
              "        val issuer = TaxInvoiceSettingsRegistry.current().issuer\n        val documentPrintSetting = DocumentPrintSettingsStoreV136(appContext).load(\n            DocumentPrintKindV136.RECEIPT_VOUCHER,\n        )\n        var result: ReceiptVoucherIssueResult? = null",
          )

          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt",
              '''                    val printJobId = insertDocumentPrintJob(issuanceId, paperWidthMm, payload, now)\n                    issuanceIds += issuanceId\n                    printJobIds += printJobId''',
              '''                    issuanceIds += issuanceId\n                    if (documentPrintSetting.autoPrintEnabled) {\n                        val decoratedPayload = DocumentPrintSettingsPolicyV136.decorateText(\n                            payload,\n                            documentPrintSetting,\n                        )\n                        val copyCount = DocumentPrintSettingsPolicyV136.normalizeCopies(documentPrintSetting.copies)\n                        val offsetBase = printJobIds.size\n                        repeat(copyCount) { copyIndex ->\n                            printJobIds += insertDocumentPrintJob(\n                                issuanceId,\n                                paperWidthMm,\n                                decoratedPayload,\n                                now + offsetBase + copyIndex,\n                            )\n                        }\n                    }''',
          )

          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt",
              "        if (!completed.idempotentReplay) AutomaticPrintScheduler.enqueueNow(appContext)",
              "        if (!completed.idempotentReplay && completed.printJobIds.isNotEmpty()) {\n            AutomaticPrintScheduler.enqueueNow(appContext)\n        }",
          )

          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt",
              "        val paperWidthMm = PrinterPaperSettingPolicy.currentWidthMm(appContext)\n        val payload = ReceiptVoucherRenderer.render(",
              "        val paperWidthMm = PrinterPaperSettingPolicy.currentWidthMm(appContext)\n        val documentPrintSetting = DocumentPrintSettingsStoreV136(appContext).load(\n            DocumentPrintKindV136.RECEIPT_VOUCHER,\n        )\n        val payload = ReceiptVoucherRenderer.render(",
          )

          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt",
              '''        var result: ReceiptVoucherReprintResult? = null\n        db.beginTransaction()\n        try {\n            val printJobId = insertDocumentPrintJob(record.id, paperWidthMm, payload, now)\n            val eventId = db.insertOrThrow(''',
              '''        val decoratedPayload = DocumentPrintSettingsPolicyV136.decorateText(payload, documentPrintSetting)\n        var result: ReceiptVoucherReprintResult? = null\n        db.beginTransaction()\n        try {\n            val printJobIds = buildList {\n                repeat(DocumentPrintSettingsPolicyV136.normalizeCopies(documentPrintSetting.copies)) { copyIndex ->\n                    add(insertDocumentPrintJob(record.id, paperWidthMm, decoratedPayload, now + copyIndex))\n                }\n            }\n            val printJobId = printJobIds.first()\n            val eventId = db.insertOrThrow(''',
          )

          # Provisional receipt: copies/header/footer always affect manual print. Auto-print
          # on hold is separately gated; OFF must not disable the explicit manual print button.
          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/HeldTicketProvisionalPrintV135.kt",
              "    fun enqueue(ticketId: Long, actor: String): HeldTicketProvisionalPrintResultV135 {",
              '''    fun enqueueIfAutomatic(ticketId: Long, actor: String): HeldTicketProvisionalPrintResultV135? {\n        val setting = DocumentPrintSettingsStoreV136(appContext).load(DocumentPrintKindV136.PROVISIONAL_RECEIPT)\n        if (!setting.autoPrintEnabled) return null\n        return enqueue(ticketId, actor)\n    }\n\n    fun enqueue(ticketId: Long, actor: String): HeldTicketProvisionalPrintResultV135 {''',
          )

          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/HeldTicketProvisionalPrintV135.kt",
              "        val paperWidthMm = PrinterPaperSettingPolicy.currentWidthMm(appContext)\n        val now = System.currentTimeMillis()",
              "        val paperWidthMm = PrinterPaperSettingPolicy.currentWidthMm(appContext)\n        val documentPrintSetting = DocumentPrintSettingsStoreV136(appContext).load(\n            DocumentPrintKindV136.PROVISIONAL_RECEIPT,\n        )\n        val now = System.currentTimeMillis()",
          )

          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/HeldTicketProvisionalPrintV135.kt",
              '''        db.beginTransaction()\n        val jobId = try {\n            val id = db.insertOrThrow(\n                "document_print_jobs",\n                null,\n                ContentValues().apply {\n                    put("document_type", OperationDocumentType.HELD_TICKET_PROVISIONAL.name)\n                    put("reference_id", ticket.id)\n                    put("paper_width_mm", paperWidthMm)\n                    put("status", PrintJobStatus.PENDING.name)\n                    put("attempt_count", 0)\n                    putNull("last_error")\n                    put("payload_text", payload)\n                    put("created_at", now)\n                    put("updated_at", now)\n                },\n            )\n            db.insertOrThrow(''',
              '''        val decoratedPayload = DocumentPrintSettingsPolicyV136.decorateText(payload, documentPrintSetting)\n        db.beginTransaction()\n        val jobId = try {\n            val jobIds = buildList {\n                repeat(DocumentPrintSettingsPolicyV136.normalizeCopies(documentPrintSetting.copies)) { copyIndex ->\n                    add(\n                        db.insertOrThrow(\n                            "document_print_jobs",\n                            null,\n                            ContentValues().apply {\n                                put("document_type", OperationDocumentType.HELD_TICKET_PROVISIONAL.name)\n                                put("reference_id", ticket.id)\n                                put("paper_width_mm", paperWidthMm)\n                                put("status", PrintJobStatus.PENDING.name)\n                                put("attempt_count", 0)\n                                putNull("last_error")\n                                put("payload_text", decoratedPayload)\n                                put("created_at", now + copyIndex)\n                                put("updated_at", now + copyIndex)\n                            },\n                        ),\n                    )\n                }\n            }\n            val id = jobIds.first()\n            db.insertOrThrow(''',
          )

          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/HeldTicketProvisionalPrintV135.kt",
              "        return HeldTicketProvisionalPrintResultV135(jobId, ticket.id, payload)",
              "        return HeldTicketProvisionalPrintResultV135(jobId, ticket.id, decoratedPayload)",
          )

          # Holding a ticket is the automatic-generation trigger for the provisional receipt.
          replace_once(
              "app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt",
              '''                        database.holdCart(name, operatorName, cart.toList())\n                        database.clearCartCorrections()\n                        corrections.clear()\n                        replaceCart(emptyList())\n                        ticketMessage = "$name として保留しました"''',
              '''                        val heldTicketId = database.holdCart(name, operatorName, cart.toList())\n                        val automaticProvisional = runCatching {\n                            val service = HeldTicketProvisionalPrintServiceV135(context.applicationContext)\n                            try {\n                                service.enqueueIfAutomatic(heldTicketId, operatorName)\n                            } finally {\n                                service.close()\n                            }\n                        }.getOrNull()\n                        database.clearCartCorrections()\n                        corrections.clear()\n                        replaceCart(emptyList())\n                        if (automaticProvisional != null) {\n                            runCatching { AutomaticPrintScheduler.enqueueNow(context.applicationContext) }\n                            ticketMessage = "$name として保留し、仮締め票を自動印刷キューへ登録しました"\n                        } else {\n                            ticketMessage = "$name として保留しました"\n                        }''',
          )

          # Extend source-contract coverage so every formal document reaches a real print path.
          test_path = Path("app/src/test/java/jp/co/tenposinfo/register/V136DocumentPrintSettingsTest.kt")
          test_text = test_path.read_text()
          marker = '''    @Test\n    fun printerSettingsExposeRcp016Panel() {\n        val source = File("src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt").readText()\n        assertTrue(source.contains("DocumentPrintSettingsPanelV136(receiptAutoPrintEnabled = receiptAutoPrint)"))\n    }\n'''
          replacement = marker + '''\n    @Test\n    fun receiptVoucherAndProvisionalRoutesHonorRcp016() {\n        val voucher = File("src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt").readText()\n        val provisional = File("src/main/java/jp/co/tenposinfo/register/HeldTicketProvisionalPrintV135.kt").readText()\n        val main = File("src/main/java/jp/co/tenposinfo/register/MainActivity.kt").readText()\n\n        assertTrue(voucher.contains("DocumentPrintKindV136.RECEIPT_VOUCHER"))\n        assertTrue(voucher.contains("if (documentPrintSetting.autoPrintEnabled)"))\n        assertTrue(voucher.contains("decorateText(payload, documentPrintSetting)"))\n        assertTrue(voucher.contains("normalizeCopies(documentPrintSetting.copies)"))\n        assertTrue(provisional.contains("fun enqueueIfAutomatic"))\n        assertTrue(provisional.contains("DocumentPrintKindV136.PROVISIONAL_RECEIPT"))\n        assertTrue(provisional.contains("decorateText(payload, documentPrintSetting)"))\n        assertTrue(main.contains("service.enqueueIfAutomatic(heldTicketId, operatorName)"))\n    }\n'''
          if test_text.count(marker) != 1:
              raise SystemExit("test marker mismatch")
          test_path.write_text(test_text.replace(marker, replacement, 1))

          doc_path = Path("docs/V1.36_PRN_002_RCP_016_DOCUMENT_PRINT_SETTINGS.md")
          doc_text = doc_path.read_text()
          anchor = "## 複数部\n"
          insert = '''## 領収書 / 仮締め票\n\n領収書は発行履歴の確定と物理印刷を分離する。自動印刷OFFでは領収書発行履歴のみを確定し、自動印刷ジョブは生成しない。売上一覧からの明示的な再発行はOFFでも利用でき、その際も領収書の部数・ヘッダ・フッタ設定を適用する。\n\n仮締め票は保留伝票作成を自動印刷のトリガーとする。自動印刷ONなら保留確定後に仮締め票を印刷キューへ登録し、OFFなら保留だけを確定する。保留伝票一覧の「仮締め」操作は手動印刷なのでOFFでも利用でき、部数・ヘッダ・フッタ設定を適用する。\n\n'''
          if doc_text.count(anchor) != 1:
              raise SystemExit("doc anchor mismatch")
          doc_path.write_text(doc_text.replace(anchor, insert + anchor, 1))
          PY

          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/DocumentPrintSettingsV136.kt \
                  app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt \
                  app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt \
                  app/src/main/java/jp/co/tenposinfo/register/HeldTicketProvisionalPrintV135.kt \
                  app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt \
                  app/src/test/java/jp/co/tenposinfo/register/V136DocumentPrintSettingsTest.kt \
                  docs/V1.36_PRN_002_RCP_016_DOCUMENT_PRINT_SETTINGS.md
          git rm .github/workflows/tmp-v136-rcp016-fix.yml
          git commit -m "fix: complete v1.36 RCP-016 print routes"
          git push origin HEAD:develop/v1.36
