name: v1.35 REP-003 gate compatibility patch

on:
  push:
    branches:
      - develop/v1.35

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - name: Apply exact compatibility patch
        run: python3 .github/scripts/v135_rep003_gate_compat.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/SettlementActivityV030.kt
          git commit -m "fix(v1.35): preserve settlement actual-cash safety gate"
          git push origin HEAD:develop/v1.35
