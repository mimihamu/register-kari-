name: v1.36 BKP-004 restore preflight audit

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Audit BKP-004 identity and restore preflight
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HEAD ==='
          git rev-parse HEAD
          echo '=== store/terminal/generation/folder identity ==='
          grep -RInE --include='*.kt' --include='*.md' 'storeId|store_id|terminalId|terminal_id|terminalGeneration|terminal_generation|producerId|producer_id|folderId|folder_id|sync_runtime_settings' app/src/main app/src/test docs | head -n 2000 || true
          echo '=== UUID generation ==='
          grep -RInE --include='*.kt' 'UUID\.randomUUID|randomUUID\(' app/src/main/java | head -n 800 || true
          echo '=== restore/preflight/backup manifest ==='
          grep -RInE --include='*.kt' 'stageRestore|verifyBackup|verifyArchive|BackupManifest|databaseUserVersion|usableSpace|復元|preflight|互換|migrat' app/src/main/java app/src/test | head -n 2000 || true
          echo '=== Google Drive destination/account ==='
          grep -RInE --include='*.kt' 'GoogleDrive|Google Drive|DriveSync|folderName|folder_id|permissionId|email|DRIVE_FILE|drive.*folder|folder.*drive' app/src/main/java app/src/test | head -n 2000 || true
          echo '=== data protection UI/navigation ==='
          grep -RInE --include='*.kt' 'DataProtection|Backup|Restore|バックアップ|復元' app/src/main/java | head -n 2000 || true
