name: Apply v0.37 theme contrast fix

on:
  push:
    branches:
      - develop/v0.37
    paths:
      - tools/v037_theme_fix.py
      - .github/workflows/v037-theme-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v0.37
        uses: actions/checkout@v4
        with:
          ref: develop/v0.37
          fetch-depth: 0

      - name: Apply theme contrast fix
        run: python3 tools/v037_theme_fix.py

      - name: Commit production fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-display/src/main/java/jp/co/tenposinfo/register/cd/MainActivity.kt
          git diff --cached --check
          git commit -m "fix: apply theme-aware standby contrast"
          git push origin HEAD:develop/v0.37
