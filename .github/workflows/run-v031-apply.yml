name: Run v0.31 printer width code patch

on:
  pull_request:
    branches:
      - develop/v0.30
    paths:
      - .github/workflows/run-v031-apply.yml

permissions:
  contents: write

jobs:
  apply-code:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop/v0.31
      - name: Apply staged code and document patch
        shell: bash
        run: |
          set -euo pipefail
          awk '/^H4sI/{capture=1} capture{print} /^PAYLOAD$/{exit}' .github/workflows/apply-v031.yml | sed '$d' > /tmp/v031.patch.gz.b64
          base64 --decode /tmp/v031.patch.gz.b64 | gzip --decompress > /tmp/v031.patch
          patch -p1 < /tmp/v031.patch
          git restore .github/workflows/build-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs
          git diff --cached --check
          git commit -m "v0.31 印字幅をプリンタ設定へ一本化"
          git push origin HEAD:develop/v0.31
