name: Apply v0.13 CD NSD UI

on:
  push:
    branches:
      - develop/v0.13

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[cd-nsd-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.13
          fetch-depth: 0
      - name: Apply CD discovery UI
        run: python3 tools/apply_v013_cd_nsd_ui.py
      - name: Commit CD discovery UI
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-display/src/main/java/jp/co/tenposinfo/register/cd/MainActivity.kt
          git commit -m "feat(v0.13): add CD NSD pairing UI [cd-nsd-ui]"
          git push origin HEAD:develop/v0.13
