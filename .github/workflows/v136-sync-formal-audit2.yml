name: v1.36 sync formal audit 2
on:
  push:
    branches: [develop/v1.36]
    paths:
      - '.github/workflows/v136-sync-formal-audit2.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inspect cumulative gate and sync sources
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HEAD ==='
          git rev-parse HEAD
          echo '=== cumulative conflict block ==='
          grep -n -B20 -A100 'SYNC_IMPORT_CONFLICT_FINGERPRINT_AFTER_AUDIT=true' .github/workflows/build-apk.yml || true
          echo '=== replay/fingerprint assertions in workflow ==='
          grep -n -B12 -A50 -E 'fingerprintIndex|recordFingerprint|SalesJournalImportRepository|importDocumentsWithCommitHook|DUPLICATE_KEY_MISMATCH|conflict' .github/workflows/build-apk.yml | tail -n 800 || true
          echo '=== V118/conflict source ==='
          grep -RIn -B20 -A80 -E 'SalesJournalReplayConflictPolicyV118|SalesJournalReplayDecisionV118|DUPLICATE_KEY_MISMATCH|conflict_fingerprint|recordFingerprint' management-app/src/main/java management-app/src/test app/src/main/java app/src/test | head -n 3000 || true
          echo '=== V150 sources/tests ==='
          grep -RIn -B20 -A100 -E 'OutboxDocumentV150|PlusAckOutboxV150|ImportAckV150|ACK_REQUIRED|SALE_IMPORT_ACK|SETTLEMENT_IMPORT_ACK|sourceDocumentIds|batchMode' app/src/main/java app/src/test management-app/src/main/java management-app/src/test | head -n 4000 || true
          echo '=== temp paths ==='
          find .github -maxdepth 2 -type f -name '*v136*' -o -name '*sync*' | sort || true
