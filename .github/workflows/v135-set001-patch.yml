name: v1.35 SET-001 temporary integration patch

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v1.35'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - name: Apply SET-001 patch
        run: python3 scripts/v135_set001_patch.py
      - name: Commit integration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml \
                  app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt \
                  app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt \
                  app/src/main/java/jp/co/tenposinfo/register/InitialReleaseSettingsV135.kt
          if git diff --cached --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git commit -m "feat(v1.35): wire initial release settings"
          git push origin HEAD:develop/v1.35
