name: v135-temp-provisional
on:
  push:
    branches: [develop/v1.35]
    paths:
      - scripts/v135_temp_provisional_patch.py
      - .github/workflows/v135-temp-provisional.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - run: python3 scripts/v135_temp_provisional_patch.py
      - shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test docs
          git diff --cached --quiet && exit 0
          git commit -m "feat(v1.35): add held-ticket provisional slip"
          git push origin HEAD:develop/v1.35
