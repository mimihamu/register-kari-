name: Fix v0.47 diagnostics API

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - develop/v0.46
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.47 head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.47
          fetch-depth: 0

      - name: Apply fix
        run: python3 tools/v047_fix.py

      - name: Remove temporary script
        run: rm tools/v047_fix.py

      - name: Commit and push source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tools
          git commit -m "v0.47 fix Play services diagnostic status API"
          git push origin HEAD:develop/v0.47
