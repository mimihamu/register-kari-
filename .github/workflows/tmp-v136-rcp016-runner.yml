name: tmp-v136-rcp016-runner

on:
  pull_request:
    branches: [develop/v1.35]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'develop/v1.36' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply source patch
        run: python3 .github/tmp-v136-rcp016-patch.py
      - name: Commit source patch
        shell: bash
        run: |
          git diff --check
          git rm .github/tmp-v136-rcp016-patch.py
          git rm .github/workflows/tmp-v136-rcp016-patch.yml .github/workflows/tmp-v136-rcp016-trigger.yml .github/workflows/tmp-v136-rcp016-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java .github
          git commit -m 'feat: add RCP-016 document print runtime'
          git push origin HEAD:develop/v1.36
