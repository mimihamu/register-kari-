name: v135-temp-patch

on:
  push:
    branches: [develop/v1.35]
    paths:
      - scripts/v135_temp_patch.py
      - .github/workflows/v135-temp-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/v135_temp_patch.py
      - name: Validate and push
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test docs
          git diff --cached --quiet && exit 0
          git commit -m "fix(v1.35): close business-day residual gaps"
          git push origin HEAD:develop/v1.35
