name: v1.36 BKP-007 menu snapshot audit

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-bkp007-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Export BKP-007 audit sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/files
          find app -type f -name 'MenuRevisionApplierV132.kt' -print | tee audit-output/applier-path.txt
          find app -type f \( -name '*MenuRevision*.kt' -o -name '*V137*.kt' -o -name '*V136FreshMenuRevision*.kt' \) -print | sort | tee audit-output/relevant-paths.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            safe="$(echo "$f" | tr '/' '_')"
            cp "$f" "audit-output/files/$safe"
          done < audit-output/relevant-paths.txt
          grep -R -n -B8 -A20 -E 'menu_category_master|menu_group_master|menu_item_master' app/src/main/java/jp/co/tenposinfo/register > audit-output/master-schema-and-usage.txt || true
          grep -R -n -B8 -A30 -E 'operation_audit|OperationAudit|auditEvent|audit' app/src/main/java/jp/co/tenposinfo/register > audit-output/audit-usage.txt || true
          grep -R -n -B8 -A30 -E 'withWriterLock|beginTransaction\(|setTransactionSuccessful\(|endTransaction\(' app/src/main/java/jp/co/tenposinfo/register > audit-output/transaction-usage.txt || true
          git rev-parse HEAD > audit-output/checked-head.txt
      - name: Upload BKP-007 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: bkp007-audit-sources
          path: audit-output
          if-no-files-found: error
