name: v1.36 BKP-007 menu snapshot audit

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-bkp007-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Export actual BKP-007 menu sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/files
          grep -R -l -E 'menu_revisions|menu_revision_products|catalog_product_base|product_meta|product_tax_assignments' app/src/main app/src/test 2>/dev/null | sort -u | tee audit-output/matched-paths.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            safe="$(echo "$f" | tr '/' '_')"
            cp "$f" "audit-output/files/$safe"
          done < audit-output/matched-paths.txt
          grep -R -n -B15 -A140 -E 'menu_revisions|menu_revision_products|activeRevision|runtimeProducts|SCHEDULED|APPLIED|effective_date' app/src/main/java/jp/co/tenposinfo/register > audit-output/revision-flow.txt || true
          grep -R -n -B15 -A80 -E 'CREATE TABLE.*(products|catalog_product_base|product_meta|product_tax_assignments)|catalog_product_base|product_meta|product_tax_assignments' app/src/main/java/jp/co/tenposinfo/register > audit-output/current-master-schema.txt || true
          grep -R -n -B12 -A60 -E 'withWriterLock|beginTransaction\(|setTransactionSuccessful\(|endTransaction\(|db.transaction' app/src/main/java/jp/co/tenposinfo/register > audit-output/transaction-usage.txt || true
          git rev-parse HEAD > audit-output/checked-head.txt
      - name: Upload BKP-007 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: bkp007-audit-sources
          path: audit-output
          if-no-files-found: error
