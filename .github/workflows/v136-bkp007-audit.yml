name: v1.36 BKP-007 menu snapshot audit

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-bkp007-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Export BKP-007 audit sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/files
          grep -R -l -E 'MenuRevisionApplierV132|menu_category_master|menu_group_master|menu_item_master|MENU_REVISION_(APPLIED|APPLY|FAILED|ROLLBACK)' app/src/main app/src/test 2>/dev/null | sort -u | tee audit-output/matched-paths.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            safe="$(echo "$f" | tr '/' '_')"
            cp "$f" "audit-output/files/$safe"
          done < audit-output/matched-paths.txt
          grep -R -n -B12 -A120 -E 'MenuRevisionApplierV132|MENU_REVISION_(APPLIED|APPLY|FAILED|ROLLBACK)' app/src/main app/src/test > audit-output/applier-and-tests.txt || true
          grep -R -n -B12 -A50 -E 'CREATE TABLE.*(menu_category_master|menu_group_master|menu_item_master)|menu_category_master|menu_group_master|menu_item_master' app/src/main app/src/test > audit-output/master-schema-and-usage.txt || true
          grep -R -n -B12 -A50 -E 'operation_audit|OperationAudit|audit\(' app/src/main/java/jp/co/tenposinfo/register > audit-output/audit-usage.txt || true
          git rev-parse HEAD > audit-output/checked-head.txt
      - name: Upload BKP-007 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: bkp007-audit-sources
          path: audit-output
          if-no-files-found: error
