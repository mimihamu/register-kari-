name: V1.36 Print Job Diagnostic (temporary)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run cumulative tests with diagnostics
        id: gradle_test
        shell: bash
        run: |
          mkdir -p diagnostic
          set +e
          set -o pipefail
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :customer-display:testDebugUnitTest \
            :management-app:testDebugUnitTest \
            --stacktrace --info 2>&1 | tee diagnostic/gradle-stdout-stderr.log
          status=${PIPESTATUS[0]}
          echo "$status" > diagnostic/gradle-exit-code.txt
          find app customer-display management-app \
            -type f -name 'TEST-*.xml' \
            -path '*/build/test-results/*' -print0 2>/dev/null \
            | while IFS= read -r -d '' file; do
                target="diagnostic/junit/${file}"
                mkdir -p "$(dirname "$target")"
                cp "$file" "$target"
              done
          exit "$status"

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v136-print-job-diagnostic
          path: diagnostic/
          if-no-files-found: error
          retention-days: 7
