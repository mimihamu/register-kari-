name: v1.04 unit test diagnostic 2

on:
  push:
    branches:
      - develop/v1.04

permissions:
  contents: read

jobs:
  diagnose-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.04
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Run app tests and keep reports
        id: tests
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Print failing XML snippets
        if: always()
        shell: bash
        run: |
          set +e
          grep -R -n -E '<failure|<error|testsuite.*failures="[1-9]' app/build/test-results/testDebugUnitTest || true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v104-unit-test-diagnostic-2-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 2
      - name: Preserve failure result
        if: steps.tests.outcome == 'failure'
        run: exit 1
