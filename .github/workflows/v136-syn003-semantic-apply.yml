name: v1.36 SYN-003 semantic apply

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'develop/v1.36'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply SYN-003 semantic patch
        run: python3 .github/v136-syn003-semantic-fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/Syn003FrozenPrintPayloadV136.kt \
                  app/src/main/java/jp/co/tenposinfo/register/PrintDocumentSnapshotV136.kt \
                  app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt \
                  app/src/test/java/jp/co/tenposinfo/register/V151Syn003FrozenPrintSnapshotTest.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(v1.36): freeze exact printer and document settings for SYN-003"
            git push origin HEAD:develop/v1.36
          fi
