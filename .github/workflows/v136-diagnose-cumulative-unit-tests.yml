name: v1.36 diagnose cumulative unit tests

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Run exact cumulative unit tests
        id: tests
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest
      - name: Print failing test XML
        if: always()
        shell: bash
        run: |
          set +e
          echo '=== failing XML files ==='
          for f in $(find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' -type f | sort); do
            if grep -qE '<failure|<error' "$f"; then
              echo "===== $f ====="
              cat "$f"
            fi
          done
          echo '=== test result files ==='
          find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' -type f -print | sort
      - name: Upload test result XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v136-cumulative-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            customer-display/build/test-results/testDebugUnitTest/
            management-app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve test conclusion
        if: steps.tests.outcome != 'success'
        run: exit 1
