name: tmp-v136-rcp016-trigger

on:
  pull_request:
    branches: [develop/v1.35]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'develop/v1.36' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Execute staged patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-v136-rcp016-patch.yml').read_text()
          body = workflow.split("          python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, 'tmp-v136-rcp016-patch.py', 'exec'))
          PY
          git diff --check
          git rm .github/workflows/tmp-v136-rcp016-patch.yml .github/workflows/tmp-v136-rcp016-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java docs .github/workflows/tmp-v136-rcp016-patch.yml .github/workflows/tmp-v136-rcp016-trigger.yml
          git commit -m 'feat: add RCP-016 document print settings'
          git push origin HEAD:develop/v1.36
