name: tmp-uc07-fix

on:
  push:
    branches:
      - develop/v1.35

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - name: Apply UC-07 compile fix and clean temporary files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/jp/co/tenposinfo/register/CustomerDisplaySettingsActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '''    CustomerDisplayMode.STANDBY -> "待機"
              CustomerDisplayMode.SALES -> "販売中"
              CustomerDisplayMode.ACCOUNTING -> "小計・会計中"
              CustomerDisplayMode.COMPLETE -> "会計完了"
              CustomerDisplayMode.DISCONNECTED -> "切断"'''.replace('              ', '    ')
          new = '''    CustomerDisplayMode.STANDBY -> "待機"
              CustomerDisplayMode.SALES -> "販売中"
              CustomerDisplayMode.SUBTOTAL -> "小計"
              CustomerDisplayMode.ACCOUNTING -> "会計中"
              CustomerDisplayMode.COMPLETE -> "会計完了"
              CustomerDisplayMode.DISCONNECTED -> "切断"'''.replace('              ', '    ')
          if old not in s:
              raise SystemExit('expected displayLabel block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-uc07-fix.yml .github/tmp-uc07-fix.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/CustomerDisplaySettingsActivity.kt .github/workflows/tmp-uc07-fix.yml
          git add -A .github/tmp-uc07-fix.trigger
          git diff --cached --check
          git commit -m "fix(v1.35): handle subtotal display status"
          git push origin HEAD:develop/v1.35
