name: Fix v0.77 build summary metadata

on:
  push:
    branches:
      - develop/v0.77
  pull_request:
    branches:
      - develop/v0.76
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Correct summary code
        shell: bash
        run: python3 scripts/fix_v077_summary_code.py
