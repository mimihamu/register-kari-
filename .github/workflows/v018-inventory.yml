name: Inspect v0.18 business session

on:
  pull_request:
    branches:
      - develop/v0.17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.18
        uses: actions/checkout@v4
        with:
          ref: develop/v0.18

      - name: Build inventory
        run: |
          mkdir -p inventory/source
          grep -R -n "BusinessSessionSchema\|business_date\|business_session" app/src/main/java app/src/test/java docs > inventory/business-session-usage.txt || true
          find app/src/main/java app/src/test/java docs -type f | sort > inventory/files.txt
          cp -R app/src/main/java inventory/source/main-java
          cp -R app/src/test/java inventory/source/test-java
          cp -R docs inventory/source/docs
          cp app/build.gradle.kts inventory/source/app-build.gradle.kts

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: v018-business-session-inventory
          path: inventory
          if-no-files-found: error
          retention-days: 7
