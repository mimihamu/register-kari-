name: v1.01 Apply Drive Safety

on:
  push:
    branches:
      - develop/v1.01
    paths:
      - ci/v101-apply-trigger-4.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.01
          fetch-depth: 0
      - name: Apply v1.01 source patch
        shell: bash
        run: |
          set -euo pipefail
          git show fdc760999295977bd9979f9737e7a44380dbcaac:.github/workflows/v101-apply-drive-safety.yml > /tmp/v101-source.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/v101-source.yml').read_text(encoding='utf-8').splitlines()
          captured = []
          active = False
          for line in source:
              if not active:
                  if "python3 <<'PY'" in line:
                      active = True
                  continue
              if line == '          PY':
                  break
              captured.append(line)

          restored = []
          triple = None
          for raw in captured:
              if triple is None:
                  line = raw[10:] if raw.startswith('          ') else raw
                  restored.append(line)
                  for candidate in ("'''", '\"\"\"'):
                      if line.count(candidate) % 2 == 1:
                          triple = candidate
                          break
              else:
                  if raw.count(triple) % 2 == 1:
                      line = raw[10:] if raw.startswith('          ') else raw
                      restored.append(line)
                      triple = None
                  else:
                      restored.append(raw)

          script = '\n'.join(restored) + '\n'
          script = script.replace(
              "if text.count(setup_anchor) != 2:\n    raise SystemExit(f'EasyConnect successful connection anchors: expected 2, found {text.count(setup_anchor)}')\ntext = text.replace(setup_anchor, setup_new)",
              "if text.count(setup_anchor) != 1:\n    raise SystemExit(f'EasyConnect successful connection anchors: expected 1, found {text.count(setup_anchor)}')\ntext = text.replace(setup_anchor, setup_new, 1)",
          )
          target = Path('/tmp/v101_apply.py')
          target.write_text(script, encoding='utf-8')
          PY
          test -s /tmp/v101_apply.py
          grep -Fq 'expected 1' /tmp/v101_apply.py
          python3 -m py_compile /tmp/v101_apply.py
          python3 /tmp/v101_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app management-app docs ci/v101-final-build-apk.yml.txt
          git commit -m "v1.01 Google Drive再認可・一時障害安全化"
          git push origin HEAD:develop/v1.01
