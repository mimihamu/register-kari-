    AUTHORIZATION_REQUIRED(false),
    API_DISABLED(false),
    STORAGE_FULL(false),
    PERMISSION_DENIED(false),
    RATE_LIMITED(true),
    NETWORK(true),
    SERVER(true),
    INVALID_DATA(false),
    UNKNOWN(true),
}
'''
