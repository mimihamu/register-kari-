name: v1.01 Apply Drive Safety

on:
  push:
    branches:
      - develop/v1.01
    paths:
      - ci/v101-apply-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.01
          fetch-depth: 0

      - name: Apply v1.01 source, tests, docs and workflow candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # Versions.
          path = 'app/build.gradle.kts'
          text = read(path)
          text = replace_once(text, 'versionCode = 130', 'versionCode = 131', 'register versionCode')
          text = replace_once(text, 'versionName = "1.00.0-dev.1"', 'versionName = "1.01.0-dev.1"', 'register versionName')
          write(path, text)

          path = 'management-app/build.gradle.kts'
          text = read(path)
          text = replace_once(text, 'versionCode = 14', 'versionCode = 15', 'plus versionCode')
          text = replace_once(text, 'versionName = "0.14.0-dev.1"', 'versionName = "0.15.0-dev.1"', 'plus versionName')
          write(path, text)

          # POS Drive upload safety.
          path = 'app/src/main/java/jp/co/tenposinfo/register/GoogleDriveDirectUpload.kt'
          text = read(path)
          text = replace_once(text, 'import org.json.JSONArray\nimport org.json.JSONObject\n', 'import org.json.JSONArray\nimport org.json.JSONException\nimport org.json.JSONObject\n', 'POS JSONException import')

