name: v1.01 Apply Drive Safety

on:
  push:
    branches:
      - develop/v1.01
    paths:
      - ci/v101-apply-trigger-5.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.01
          fetch-depth: 0
      - name: Apply v1.01 review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/GoogleDriveEasyConnectActivity.kt',
              '''                    val connection = GoogleDriveConnectionTestCoordinator(applicationContext)
                        .createOrUpdate(token)
                    val staged = JournalOutboxStore(applicationContext).use { it.stagePending(500) }
''',
              '''                    val connection = GoogleDriveConnectionTestCoordinator(applicationContext)
                        .createOrUpdate(token)
                    GoogleDriveDirectUploadStatusStore(applicationContext).clearBlocker()
                    val staged = JournalOutboxStore(applicationContext).use { it.stagePending(500) }
''',
              'Easy Connect manual sync blocker clear',
          )

          replace_once(
              'app/src/test/java/jp/co/tenposinfo/register/V101GoogleDriveReauthorizationSafetyTest.kt',
              '''        assertTrue(source.contains("GoogleDriveDirectUploadStatusStore(applicationContext).clearBlocker()"))
''',
              '''        val easyConnect = File(root, "app/src/main/java/jp/co/tenposinfo/register/GoogleDriveEasyConnectActivity.kt").readText()
        assertEquals(
            2,
            Regex("GoogleDriveDirectUploadStatusStore\\\\(applicationContext\\\\)\\\\.clearBlocker\\\\(\\\\)")
                .findAll(easyConnect)
                .count(),
        )
''',
              'POS test both reconnect paths',
          )

          plus = Path('management-app/src/test/java/jp/co/tenposinfo/register/plus/V101GoogleDriveTransientImportSafetyTest.kt')
          text = plus.read_text(encoding='utf-8')
          broken = '''        val retryBodyEnd = source.indexOf("}
            }", retryStart).takeIf { it > retryStart } ?: source.length
'''
          fixed = '''        val retryBodyEnd = source.indexOf("}\\n            }", retryStart).takeIf { it > retryStart } ?: source.length
'''
          if broken not in text:
              raise SystemExit('Plus test newline anchor not found')
          plus.write_text(text.replace(broken, fixed, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/GoogleDriveEasyConnectActivity.kt \
                  app/src/test/java/jp/co/tenposinfo/register/V101GoogleDriveReauthorizationSafetyTest.kt \
                  management-app/src/test/java/jp/co/tenposinfo/register/plus/V101GoogleDriveTransientImportSafetyTest.kt
          git commit -m "v1.01 Drive再開経路と回帰テストを補強"
          git push origin HEAD:develop/v1.01
