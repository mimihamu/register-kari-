name: v1.01 Apply Drive Safety

on:
  push:
    branches:
      - develop/v1.01
    paths:
      - ci/v101-apply-trigger-6.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.01
          fetch-depth: 0
      - name: Patch manual reconnect path
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/jp/co/tenposinfo/register/GoogleDriveEasyConnectActivity.kt"); t=p.read_text(encoding="utf-8"); old="                    val connection = GoogleDriveConnectionTestCoordinator(applicationContext)\n                        .createOrUpdate(token)\n                    val staged = JournalOutboxStore(applicationContext).use { it.stagePending(500) }\n"; new="                    val connection = GoogleDriveConnectionTestCoordinator(applicationContext)\n                        .createOrUpdate(token)\n                    GoogleDriveDirectUploadStatusStore(applicationContext).clearBlocker()\n                    val staged = JournalOutboxStore(applicationContext).use { it.stagePending(500) }\n"; assert t.count(old) == 1, t.count(old); p.write_text(t.replace(old,new,1),encoding="utf-8")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/GoogleDriveEasyConnectActivity.kt
          git commit -m "v1.01 Easy Connect手動再開時のblocker解除"
          git push origin HEAD:develop/v1.01
