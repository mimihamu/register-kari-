name: v1.01 Apply Drive Safety

on:
  push:
    branches:
      - develop/v1.01
    paths:
      - ci/v101-apply-trigger-2.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.01
          fetch-depth: 0
      - name: Apply v1.01 source patch
        shell: bash
        run: |
          set -euo pipefail
          git show fdc760999295977bd9979f9737e7a44380dbcaac:.github/workflows/v101-apply-drive-safety.yml > /tmp/v101-source.yml
          awk '
            /python3 <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture {
              if (substr($0, 1, 10) == "          ") print substr($0, 11)
              else print
            }
          ' /tmp/v101-source.yml > /tmp/v101_apply.py
          test -s /tmp/v101_apply.py
          python3 /tmp/v101_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app management-app docs ci/v101-final-build-apk.yml.txt
          git commit -m "v1.01 Google Drive再認可・一時障害安全化"
          git push origin HEAD:develop/v1.01
