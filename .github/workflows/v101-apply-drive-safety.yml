name: v1.01 Apply Drive Safety

on:
  push:
    branches:
      - develop/v1.01
    paths:
      - ci/v101-apply-trigger-7.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.01
          fetch-depth: 0
      - name: Update Plus APK integrity expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("ci/verify-apk-release-integrity.sh"); t=p.read_text(); old=": \"${POS_VERSION_NAME:?POS_VERSION_NAME is required}\"\n"; new=old+": \"${PLUS_VERSION_CODE:?PLUS_VERSION_CODE is required}\"\n: \"${PLUS_VERSION_NAME:?PLUS_VERSION_NAME is required}\"\n"; assert t.count(old)==1; t=t.replace(old,new,1); t=t.replace("    '\''14'\'' \\\n    '\''0.14.0-dev.1'\'' \\\n", "    \"$PLUS_VERSION_CODE\" \\\n    \"$PLUS_VERSION_NAME\" \\\n",1); p.write_text(t)'
          python3 -c 'from pathlib import Path; p=Path("ci/v101-final-build-apk.yml.txt"); t=p.read_text(); old="          POS_VERSION_NAME: 1.01.0-dev.1\n          BUILD_TOOLS_VERSION: 36.0.0\n"; new="          POS_VERSION_NAME: 1.01.0-dev.1\n          PLUS_VERSION_CODE: 15\n          PLUS_VERSION_NAME: 0.15.0-dev.1\n          BUILD_TOOLS_VERSION: 36.0.0\n"; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          grep -Fq 'PLUS_VERSION_CODE' ci/verify-apk-release-integrity.sh
          grep -Fq 'PLUS_VERSION_CODE: 15' ci/v101-final-build-apk.yml.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/verify-apk-release-integrity.sh ci/v101-final-build-apk.yml.txt
          git commit -m "v1.01 Plus APK整合性ゲートを0.15へ更新"
          git push origin HEAD:develop/v1.01
