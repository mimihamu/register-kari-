name: Apply v0.48 settings entry

on:
  push:
    branches:
      - develop/v0.48
    paths:
      - tools/v048_apply.py
      - .github/workflows/v048-apply-temp.yml
  pull_request:
    branches:
      - develop/v0.47
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'develop/v0.48' || github.ref_name == 'develop/v0.48'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.48
        uses: actions/checkout@v4
        with:
          ref: develop/v0.48
          fetch-depth: 0

      - name: Apply navigation and version changes
        run: python3 tools/v048_apply.py

      - name: Export generated CI and restore tracked workflow
        run: |
          cp .github/workflows/build-apk.yml tools/build-apk-v048.generated.yml
          git checkout -- .github/workflows/build-apk.yml
          git rm tools/v048_apply.py

      - name: Commit and push v0.48 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.48 expose Google Drive sync settings"
          git push origin HEAD:develop/v0.48
