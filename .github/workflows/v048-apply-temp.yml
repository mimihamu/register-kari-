name: Finalize v0.48 CI definition

on:
  pull_request:
    branches:
      - develop/v0.47
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'develop/v0.48'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.48
        uses: actions/checkout@v4
        with:
          ref: develop/v0.48
          fetch-depth: 0

      - name: Correct generated CI metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/build-apk-v048.generated.yml')
          text = path.read_text()
          text = text.replace('versionName = "0.47.0-dev.1"', 'versionName = "0.48.0-dev.1"')
          text = text.replace('REGISTER_VERSION_NAME=0.47.0-dev.1', 'REGISTER_VERSION_NAME=0.48.0-dev.1')
          text = text.replace('REGISTER_VERSION_CODE=77', 'REGISTER_VERSION_CODE=78')
          text = text.replace(
              "          assert not Path('tools/v048_apply.py').exists()",
              "          assert not Path('tools/v048_apply.py').exists()\n          assert not Path('tools/build-apk-v048.generated.yml').exists()",
          )
          text = text.replace(
              '          GOOGLE_DRIVE_DIAGNOSTICS=true',
              '          GOOGLE_DRIVE_DIAGNOSTICS=true\n          GOOGLE_DRIVE_SETTINGS_ENTRY=true',
          )
          path.write_text(text)
          PY

      - name: Commit corrected generated CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-apk-v048.generated.yml
          git commit -m "v0.48 finalize generated CI metadata"
          git push origin HEAD:develop/v0.48
