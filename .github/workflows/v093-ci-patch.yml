name: v0.93 guarded CI patch

on:
  push:
    branches:
      - develop/v0.93

permissions:
  contents: write

jobs:
  patch-ci:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.93
          fetch-depth: 0

      - name: Patch cumulative CI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-apk.yml')
          text = path.read_text(encoding='utf-8')

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          one('Verify cumulative v0.14-v0.92 sources', 'Verify cumulative v0.14-v0.93 sources', 'step title')
          one("# v0.92 release identity + built APK integrity gate source acceptance.\n          grep -q 'versionCode = 122' app/build.gradle.kts\n          grep -q 'versionName = \"0.92.0-dev.1\"' app/build.gradle.kts",
              "# v0.92 built APK integrity gate remains cumulative; release identity follows v0.93.\n          grep -q 'versionCode = 123' app/build.gradle.kts\n          grep -q 'versionName = \"0.93.0-dev.1\"' app/build.gradle.kts",
              'release identity')
          one('          POS_VERSION_CODE: 122\n          POS_VERSION_NAME: 0.92.0-dev.1',
              '          POS_VERSION_CODE: 123\n          POS_VERSION_NAME: 0.93.0-dev.1',
              'integrity env')
          one('register_apk=artifacts/TSUGUREGI_v0.92.0_dev1_apk_release_integrity_gate_debug.apk',
              'register_apk=artifacts/TSUGUREGI_v0.93.0_dev1_main_flow_responsive_debug.apk',
              'register artifact file')
          one('          REGISTER_VERSION_NAME=0.92.0-dev.1\n          REGISTER_VERSION_CODE=122',
              '          REGISTER_VERSION_NAME=0.93.0-dev.1\n          REGISTER_VERSION_CODE=123',
              'summary version')
          one('          name: TSUGUREGI-v0.92.0-dev1-apk-release-integrity-gate-apks',
              '          name: TSUGUREGI-v0.93.0-dev1-main-flow-responsive-apks',
              'artifact name')

          marker = "\n      - name: Verify launcher and orientation configuration"
          acceptance = """

          # v0.93 login + complete responsive acceptance.
          test -s app/src/test/java/jp/co/tenposinfo/register/V093MainFlowResponsiveTest.kt
          test -s docs/V0.93_MAIN_FLOW_RESPONSIVE.md
          test -s docs/V0.93_RELEASE_NOTES.md
          grep -q 'val operatorScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'val pinScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'val pinPanelWidthDp = if (responsive.isCompact) 260 else 390' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'RegisterLayoutPolicy.COMPACT_KEY_HEIGHT_DP' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'val compactScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'Text(\"印刷キュー\", maxLines = 1)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'Modifier.weight(1f).height(48.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'Modifier.fillMaxWidth().height(54.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'BlueButton(\"次の取引\", onNext, Modifier.width(180.dp).height(54.dp))' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q '最終総合実機試験へ繰越' docs/V0.93_RELEASE_NOTES.md
""" + marker
          one(marker, acceptance, 'v0.93 acceptance block')

          flags = '          REAL_DEVICE_DATA_PROTECTION_RESPONSIVE_VERIFICATION=deferred-final-acceptance\n          REAL_DEVICE_APK_INSTALL_VERIFICATION=deferred-final-acceptance'
          flags_new = '''          REAL_DEVICE_DATA_PROTECTION_RESPONSIVE_VERIFICATION=deferred-final-acceptance
          MAIN_FLOW_RESPONSIVE=true
          LOGIN_RESPONSIVE=true
          LOGIN_OPERATOR_SCROLL=true
          LOGIN_COMPACT_PIN_SCROLL=true
          LOGIN_COMPACT_PIN_KEYPAD=true
          COMPLETE_RESPONSIVE=true
          COMPLETE_COMPACT_ACTION_GRID=true
          COMPLETE_NORMAL_ACTION_ROW_PRESERVED=true
          REAL_DEVICE_MAIN_FLOW_RESPONSIVE_VERIFICATION=deferred-final-acceptance
          REAL_DEVICE_APK_INSTALL_VERIFICATION=deferred-final-acceptance'''
          one(flags, flags_new, 'summary flags')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/build-apk.yml"
          grep -q 'Verify cumulative v0.14-v0.93 sources' .github/workflows/build-apk.yml
          grep -q 'POS_VERSION_CODE: 123' .github/workflows/build-apk.yml
          grep -q 'V093MainFlowResponsiveTest.kt' .github/workflows/build-apk.yml
          grep -q 'TSUGUREGI-v0.93.0-dev1-main-flow-responsive-apks' .github/workflows/build-apk.yml
          grep -q 'APK_RELEASE_INTEGRITY_GATE=true' .github/workflows/build-apk.yml

      - name: Commit CI patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-apk.yml
          git commit -m "ci(v0.93): extend cumulative release validation"
          git push origin HEAD:develop/v0.93
