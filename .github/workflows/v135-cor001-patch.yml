name: v1.35 COR-001 one-shot patch

on:
  push:
    branches:
      - develop/v1.35
    paths:
      - .github/workflows/v135-cor001-patch.yml

permissions:
  contents: write

jobs:
  patch-main-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0

      - name: Apply exact COR-001 wiring patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt")
          text = path.read_text(encoding="utf-8")
          old = '''                                OutlinedButton(
                                      onClick = onRemove,
                                      modifier = Modifier.weight(1f).height(keypad.functionHeightDp.dp),
                                  ) { Text("訂正", fontSize = 13.sp, maxLines = 1) }'''.replace("                                      ", "                                    ")
          new = '''                                OutlinedButton(
                                      onClick = {
                                          if (NumericCorrectionPolicyV135.shouldClearInput(numericInput)) {
                                              numericInput = ""
                                          } else {
                                              onRemove()
                                          }
                                      },
                                      modifier = Modifier.weight(1f).height(keypad.functionHeightDp.dp),
                                  ) { Text("訂正", fontSize = 13.sp, maxLines = 1) }'''.replace("                                      ", "                                    ")

          matches = text.count(old)
          if matches != 1:
              raise SystemExit(f"Expected exactly one correction-button block, found {matches}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          git diff -- app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt

      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "Wire COR-001 numeric correction precedence"
          git push origin HEAD:develop/v1.35
