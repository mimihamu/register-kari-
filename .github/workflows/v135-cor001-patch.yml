name: v1.35 COR-001 one-shot patch

on:
  push:
    branches:
      - develop/v1.35
    paths:
      - .github/workflows/v135-cor001-patch.yml

permissions:
  contents: write

jobs:
  patch-main-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 .github/scripts/v135_cor001_patch.py
      - name: Validate diff
        run: |
          git diff --check
          git diff -- app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          git diff --cached --quiet && exit 1
          git commit -m "Wire COR-001 numeric correction precedence"
          git push origin HEAD:develop/v1.35
