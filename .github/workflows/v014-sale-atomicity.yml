name: Apply v0.14 atomic sale commit

on:
  push:
    branches:
      - develop/v0.14
  pull_request:
    branches:
      - develop/v0.13
    types:
      - synchronize
      - edited
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'develop/v0.14') && !contains(github.event.head_commit.message || '', '[v014-sale-atomic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.14
          fetch-depth: 0
      - name: Apply atomic sale/cart change
        run: python3 .github/scripts/apply_v014_sale_atomicity.py
      - name: Commit source change
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt
          git commit -m "fix(v0.14): commit sale and clear cart atomically [v014-sale-atomic]"
          git push origin HEAD:develop/v0.14
