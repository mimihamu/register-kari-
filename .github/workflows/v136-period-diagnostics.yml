name: v1.36 period report diagnostics

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-period-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Locate and inspect actual report sources
        shell: bash
        run: |
          set -u
          echo '=== matching files ==='
          find app management-app customer-display -type f 2>/dev/null | sort | grep -Ei 'daily.*report|report.*daily|report|period|monthly|sales.*summary' | head -2500 || true
          echo '=== period symbols with filenames ==='
          grep -RniE --exclude-dir=build --exclude-dir=.gradle 'ReportPeriodRangeV124|PERIOD_TOTAL|期間売上集計|loadMonthlySummary|loadSummary\(|dayStartMinutes' app management-app customer-display 2>/dev/null | head -5000 || true
          echo '=== file context around PERIOD_TOTAL ==='
          f=$(grep -Rl --exclude-dir=build --exclude-dir=.gradle 'PERIOD_TOTAL' app/src 2>/dev/null | head -1 || true)
          echo "PERIOD_FILE=$f"
          if [ -n "$f" ]; then sed -n '1,1000p' "$f"; fi
          echo '=== file context around loadSummary ==='
          s=$(grep -Rl --exclude-dir=build --exclude-dir=.gradle 'fun loadSummary' app/src 2>/dev/null | head -1 || true)
          echo "STORE_FILE=$s"
          if [ -n "$s" ]; then sed -n '1,1000p' "$s"; fi
          echo '=== tests mentioning ReportPeriodRange ==='
          grep -Rl --exclude-dir=build --exclude-dir=.gradle 'ReportPeriodRangeV124\|PERIOD_TOTAL\|期間売上集計' app/src/test 2>/dev/null | while read -r t; do echo "--- $t ---"; sed -n '1,600p' "$t"; done || true
