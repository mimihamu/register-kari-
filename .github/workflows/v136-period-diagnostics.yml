name: v1.36 period report diagnostics

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-period-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Inspect exact period report source
        shell: bash
        run: |
          set -u
          echo '=== DailyReportStore head ==='
          sed -n '1,380p' app/src/main/java/jp/co/tenposinfo/register/DailyReportStore.kt || true
          echo '=== DailyReportStore rest ==='
          sed -n '381,900p' app/src/main/java/jp/co/tenposinfo/register/DailyReportStore.kt || true
          echo '=== DailyReportActivity head ==='
          sed -n '1,420p' app/src/main/java/jp/co/tenposinfo/register/DailyReportActivity.kt || true
          echo '=== DailyReportActivity rest ==='
          sed -n '421,1000p' app/src/main/java/jp/co/tenposinfo/register/DailyReportActivity.kt || true
          echo '=== report models / menu symbols ==='
          grep -RniE --exclude-dir=build --exclude-dir=.gradle 'data class DailyReportSummary|data class Department|data class Payment|data class Tax|enum class ReportMenuType|PERIOD_TOTAL|ReportPeriodRangeV124' app/src/main/java/jp/co/tenposinfo/register | head -2500 || true
          echo '=== relevant report tests ==='
          for f in app/src/test/java/jp/co/tenposinfo/register/V128DailyReportMenuSummaryTest.kt app/src/test/java/jp/co/tenposinfo/register/V129DailyReportDayStartFilterTest.kt; do
            echo "--- $f ---"; sed -n '1,500p' "$f" || true; done
