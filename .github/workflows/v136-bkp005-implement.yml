name: v1.36 BKP-005 implementation

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-bkp005-implement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply BKP-005 audit detail patch
        run: |
          set -euo pipefail
          python3 .github/v136-bkp005-audit-fields.py
          git diff --check
      - name: V143 focused unit test
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests jp.co.tenposinfo.register.V143Bkp005TerminalMigrationTest
      - name: Kotlin compile
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin
      - name: Commit verified BKP-005 audit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/main/java/jp/co/tenposinfo/register/RestoreTerminalMigrationV136.kt \
            app/src/main/java/jp/co/tenposinfo/register/DataRestoreBootstrapV086.kt \
            app/src/test/java/jp/co/tenposinfo/register/V143Bkp005TerminalMigrationTest.kt
          git diff --cached --quiet && { echo 'No BKP-005 audit changes'; exit 0; }
          git commit -m 'feat(v1.36): complete BKP-005 restore audit details'
          git push origin HEAD:develop/v1.36
