          doc = r'''# v1.36 BKP-005 同一端末復旧・予備端末移行

正式仕様 v2.5 BKP-005 を実装する。Issue #137の旧表記より正式仕様を優先する。

## 復元方式

- 同一端末復旧: `storeId` / `terminalId` を一致確認し、terminalIdを維持する。generationは復元前・バックアップの大きい側を維持して巻き戻さない。
- 予備端末移行: 明示選択、責任者PIN、店舗名再入力、旧端末停止確認、Drive ACK/既存イベント最大売上番号の確認を必須とする。新しい`terminalId`を発行し、generationを既知最大+1へ進める。
- 新品予備端末の`STORE-UNCONFIGURED`だけは、店舗名再入力等のBKP-005確認を前提にバックアップのstoreIdへ移行可能とする。別の設定済みstoreIdへの誤復元は引き続き拒否する。

## 会計番号重複防止

復元予約時に以下の最大値を採番floorとして計画ファイルへ固定し、古いDBへの置換で消えないようにする。

1. 復元前DBの`sales.id`最大値
2. バックアップDBの`sales.id`最大値
3. `sales_journal`のSALE `aggregate_id`最大値
4. `sync_outbox.status='SENT'`（Drive送信成功ACK）のSALE最大値
5. `sqlite_sequence`のsales値
6. `sync_runtime_settings`へ保存済みBKP-005採番floor
7. 予備端末移行画面で確認入力したDrive ACK/既存イベント最大売上番号（該当なしは0）

起動時復元のrollback境界内でidentity/generation/floorを適用し、通常の`saveSale()`でもINSERT直前にfloorを再強制する。SQLite AUTOINCREMENTの次番号は既知最大値より必ず大きくする。

## 安全性

- BKP-004のhash/schema/容量/Drive接続先チェックは維持する。
- 同一端末復旧はterminalId不一致を引き続き拒否する。
- 予備端末移行だけterminalId差異をMIGRATE扱いにする。
- 復元適用中にidentity/floor更新が失敗した場合は既存のWAL-safe rollbackへ入り、半端な正本を残さない。
- 復元結果とoperation_auditへmode、terminalId、generation、sale floorを残す。

## 実機未確認

- 実端末で同一端末復旧後のterminalId/generation/次売上番号
- 予備端末で旧端末停止→新terminalId/generation→Drive同期の一連運用
- バックアップ後に旧端末で追加売上がDrive送信済みの状態からの重複なし採番
- 復元適用中の電断/強制終了とrollback
'''
