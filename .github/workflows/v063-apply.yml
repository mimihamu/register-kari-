name: Apply v0.63 generated patch

on:
  pull_request:
    branches:
      - develop/v0.62
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v063:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.63'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.63 head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.63
          fetch-depth: 0

      - name: Apply v0.63 patch
        run: python3 tools/v063_apply.py

      - name: Commit generated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(v0.63): add reversal sale lookup"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:develop/v0.63
