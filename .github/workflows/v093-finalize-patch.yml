name: v0.93 guarded finalize patch

on:
  push:
    branches:
      - develop/v0.93

permissions:
  contents: write

jobs:
  finalize-v093:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.93
          fetch-depth: 0

      - name: Apply guarded finalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          main_path = Path('app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt')
          main = main_path.read_text(encoding='utf-8')
          start = main.index('private fun CompleteScreen(')
          end = main.index('private fun SalesHistoryScreen(', start)
          complete = main[start:end]
          if complete.count('Modifier.weight(1f).height(42.dp)') != 4:
              raise SystemExit('CompleteScreen: expected four compact 42dp action buttons')
          if complete.count('Modifier.fillMaxWidth().height(50.dp)') != 1:
              raise SystemExit('CompleteScreen: expected one compact 50dp next button')
          complete = complete.replace('Modifier.weight(1f).height(42.dp)', 'Modifier.weight(1f).height(48.dp)')
          complete = complete.replace('Modifier.fillMaxWidth().height(50.dp)', 'Modifier.fillMaxWidth().height(54.dp)')
          main = main[:start] + complete + main[end:]
          main_path.write_text(main, encoding='utf-8')

          wf_path = Path('.github/workflows/build-apk.yml')
          wf = wf_path.read_text(encoding='utf-8')
          replacements = [
              ('Verify cumulative v0.14-v0.92 sources', 'Verify cumulative v0.14-v0.93 sources', 'step title'),
              ("# v0.92 release identity + built APK integrity gate source acceptance.\n          grep -q 'versionCode = 122' app/build.gradle.kts\n          grep -q 'versionName = \"0.92.0-dev.1\"' app/build.gradle.kts",
               "# v0.92 built APK integrity gate remains cumulative; release identity follows v0.93.\n          grep -q 'versionCode = 123' app/build.gradle.kts\n          grep -q 'versionName = \"0.93.0-dev.1\"' app/build.gradle.kts",
               'current release identity'),
              ('          POS_VERSION_CODE: 122\n          POS_VERSION_NAME: 0.92.0-dev.1',
               '          POS_VERSION_CODE: 123\n          POS_VERSION_NAME: 0.93.0-dev.1',
               'integrity env'),
              ('register_apk=artifacts/TSUGUREGI_v0.92.0_dev1_apk_release_integrity_gate_debug.apk',
               'register_apk=artifacts/TSUGUREGI_v0.93.0_dev1_main_flow_responsive_debug.apk',
               'register apk name'),
              ('          REGISTER_VERSION_NAME=0.92.0-dev.1\n          REGISTER_VERSION_CODE=122',
               '          REGISTER_VERSION_NAME=0.93.0-dev.1\n          REGISTER_VERSION_CODE=123',
               'build summary version'),
              ('          name: TSUGUREGI-v0.92.0-dev1-apk-release-integrity-gate-apks',
               '          name: TSUGUREGI-v0.93.0-dev1-main-flow-responsive-apks',
               'artifact name'),
          ]
          for old, new, label in replacements:
              wf = replace_one(wf, old, new, label)

          anchor = "          ! grep -qi 'DROP TABLE' ci/verify-apk-release-integrity.sh\n\n      - name: Verify launcher and orientation configuration"
          v093 = """          ! grep -qi 'DROP TABLE' ci/verify-apk-release-integrity.sh

          # v0.93 login + complete responsive acceptance.
          test -s app/src/test/java/jp/co/tenposinfo/register/V093MainFlowResponsiveTest.kt
          test -s docs/V0.93_MAIN_FLOW_RESPONSIVE.md
          test -s docs/V0.93_RELEASE_NOTES.md
          grep -q 'val operatorScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'val pinScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'val pinPanelWidthDp = if (responsive.isCompact) 260 else 390' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'RegisterLayoutPolicy.COMPACT_KEY_HEIGHT_DP' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'val compactScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'Text(\"印刷キュー\", maxLines = 1)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'Modifier.weight(1f).height(48.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'Modifier.fillMaxWidth().height(54.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'BlueButton(\"次の取引\", onNext, Modifier.width(180.dp).height(54.dp))' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q '最終総合実機試験へ繰越' docs/V0.93_RELEASE_NOTES.md

      - name: Verify launcher and orientation configuration"""
          wf = replace_one(wf, anchor, v093, 'v0.93 source acceptance')

          flags_anchor = "          REAL_DEVICE_DATA_PROTECTION_RESPONSIVE_VERIFICATION=deferred-final-acceptance\n          REAL_DEVICE_APK_INSTALL_VERIFICATION=deferred-final-acceptance"
          flags_new = """          REAL_DEVICE_DATA_PROTECTION_RESPONSIVE_VERIFICATION=deferred-final-acceptance
          MAIN_FLOW_RESPONSIVE=true
          LOGIN_RESPONSIVE=true
          LOGIN_OPERATOR_SCROLL=true
          LOGIN_COMPACT_PIN_SCROLL=true
          LOGIN_COMPACT_PIN_KEYPAD=true
          COMPLETE_RESPONSIVE=true
          COMPLETE_COMPACT_ACTION_GRID=true
          COMPLETE_NORMAL_ACTION_ROW_PRESERVED=true
          REAL_DEVICE_MAIN_FLOW_RESPONSIVE_VERIFICATION=deferred-final-acceptance
          REAL_DEVICE_APK_INSTALL_VERIFICATION=deferred-final-acceptance"""
          wf = replace_one(wf, flags_anchor, flags_new, 'build summary flags')
          wf_path.write_text(wf, encoding='utf-8')
          PY

      - name: Verify guarded scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -qx 'app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt'
          git diff --name-only | grep -qx '.github/workflows/build-apk.yml'
          grep -q 'versionCode = 123' app/build.gradle.kts
          grep -q 'POS_VERSION_CODE: 123' .github/workflows/build-apk.yml
          grep -q 'V093MainFlowResponsiveTest.kt' .github/workflows/build-apk.yml
          grep -q 'Modifier.weight(1f).height(48.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt

      - name: Commit guarded finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt .github/workflows/build-apk.yml
          git commit -m "ci(v0.93): finalize responsive acceptance and release pipeline"
          git push origin HEAD:develop/v0.93
