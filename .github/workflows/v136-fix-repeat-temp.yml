name: v1.36 temporary repeat resolution fix

on:
  push:
    branches:
      - develop/v1.36

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply minimal Kotlin repeat fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt'): [
                  ('        repeat(copies) { copyIndex ->', '        kotlin.repeat(copies) { copyIndex ->'),
              ],
              Path('app/src/main/java/jp/co/tenposinfo/register/HeldTicketProvisionalPrintV135.kt'): [
                  ('                repeat(DocumentPrintSettingsPolicyV136.normalizeCopies(documentPrintSetting.copies)) { copyIndex ->',
                   '                kotlin.repeat(DocumentPrintSettingsPolicyV136.normalizeCopies(documentPrintSetting.copies)) { copyIndex ->'),
              ],
              Path('app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt'): [
                  ('                        repeat(copyCount) { copyIndex ->', '                        kotlin.repeat(copyCount) { copyIndex ->'),
                  ('                repeat(DocumentPrintSettingsPolicyV136.normalizeCopies(documentPrintSetting.copies)) { copyIndex ->',
                   '                kotlin.repeat(DocumentPrintSettingsPolicyV136.normalizeCopies(documentPrintSetting.copies)) { copyIndex ->'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          rm .github/workflows/v136-fix-repeat-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt \
                  app/src/main/java/jp/co/tenposinfo/register/HeldTicketProvisionalPrintV135.kt \
                  app/src/main/java/jp/co/tenposinfo/register/ReceiptVoucher.kt \
                  .github/workflows/v136-fix-repeat-temp.yml
          git commit -m "fix: disambiguate Kotlin repeat in print settings"
          git push origin HEAD:develop/v1.36
