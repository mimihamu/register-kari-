name: TEMP apply v1.35 UC-07

on:
  push:
    branches:
      - develop/v1.35

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply v1.35 UC-07 patch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0

      - name: Apply UC-07 source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = 'app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt'
          replace_once(
              main,
              '''                    CustomerDisplayRuntime.publish(
                        CustomerDisplaySnapshotFactory.accounting(
                            cart.toList(),
                            paymentState,
                            CustomerDisplaySettingsStore(context.applicationContext).load().storeName,
                        ),
                    )
                    screen = AppScreen.PAYMENT''',
              '''                    CustomerDisplayRuntime.publish(
                        CustomerDisplaySnapshotFactory.subtotal(
                            cart.toList(),
                            CustomerDisplaySettingsStore(context.applicationContext).load().storeName,
                        ),
                    )
                    screen = AppScreen.PAYMENT''',
          )
          replace_once(
              main,
              '''                LazyColumn(Modifier.weight(1f)) {
                    itemsIndexed(items) { _, item ->
                        AmountRow("${item.product.name} × ${item.quantity} ${item.product.taxSymbol}", yen(item.baseAmount))
                    }
                }
                summary.buckets.forEach { bucket ->
                    val label = if (bucket.taxable) "${bucket.ratePercent}% 消費税" else "非課税"
                    AmountRow(label, yen(bucket.taxAmount))
                }''',
              '''                LazyColumn(Modifier.weight(1f)) {
                    itemsIndexed(items) { _, item ->
                        AmountRow(
                            "${item.product.name} × ${item.quantity} ${item.product.taxSymbol}",
                            yen(item.amountBeforeDiscount),
                        )
                        if (item.discountAmount > 0L) {
                            AmountRow("  値引", "-${yen(item.discountAmount)}")
                        }
                    }
                }
                AmountRow("商品計", yen(items.sumOf { it.baseAmount }))
                summary.buckets.forEach { bucket ->
                    if (bucket.taxable) {
                        AmountRow(
                            "${bucket.ratePercent}%対象",
                            "${yen(bucket.grossAmount)} / 税 ${yen(bucket.taxAmount)}",
                        )
                    } else {
                        AmountRow("非課税", yen(bucket.grossAmount))
                    }
                }
                AmountRow("合計", yen(summary.grossAmount), emphasized = true)''',
          )

          protocol = 'app/src/main/java/jp/co/tenposinfo/register/CustomerDisplayProtocol.kt'
          replace_once(
              protocol,
              '''enum class CustomerDisplayMode {
    STANDBY,
    SALES,
    ACCOUNTING,
    COMPLETE,
    DISCONNECTED,
}''',
              '''enum class CustomerDisplayMode {
    STANDBY,
    SALES,
    SUBTOTAL,
    ACCOUNTING,
    COMPLETE,
    DISCONNECTED,
}''',
          )
          replace_once(
              protocol,
              '''    fun accounting(
        items: List<CartItem>,''',
              '''    /**
     * v2.5 UC-07: explicit subtotal snapshot emitted when SCR-100 小計／会計 is pressed.
     * SALES / ACCOUNTING remain as legacy wire modes until the full v1.37 display-state migration.
     */
    fun subtotal(
        items: List<CartItem>,
        storeName: String,
        presentation: CustomerDisplayPresentation = CustomerDisplayPresentation(),
    ): CustomerDisplaySnapshot {
        if (items.isEmpty()) return standby(storeName, presentation)
        val total = TaxEngine.calculate(items).grossAmount
        return CustomerDisplaySnapshot(
            mode = CustomerDisplayMode.SUBTOTAL,
            storeName = storeName,
            numberOfProducts = items.sumOf { it.quantity },
            subtotalAmount = total,
            totalAmount = total,
            message = "小計をご確認ください",
            orderItems = orderItems(items),
            presentation = presentation,
        )
    }

    fun accounting(
        items: List<CartItem>,''',
          )

          cd_model = 'customer-display/src/main/java/jp/co/tenposinfo/register/cd/CustomerDisplayModel.kt'
          replace_once(
              cd_model,
              '''enum class CustomerDisplayMode {
    STANDBY,
    SALES,
    ACCOUNTING,
    COMPLETE,
    DISCONNECTED,
}''',
              '''enum class CustomerDisplayMode {
    STANDBY,
    SALES,
    SUBTOTAL,
    ACCOUNTING,
    COMPLETE,
    DISCONNECTED,
}''',
          )

          cd_main = 'customer-display/src/main/java/jp/co/tenposinfo/register/cd/MainActivity.kt'
          replace_once(
              cd_main,
              '''                        CustomerDisplayMode.SALES -> SalesScreen(state.snapshot, layoutMode)
                        CustomerDisplayMode.ACCOUNTING -> AccountingScreen(state.snapshot, layoutMode)''',
              '''                        CustomerDisplayMode.SALES -> SalesScreen(state.snapshot, layoutMode)
                        CustomerDisplayMode.SUBTOTAL -> AccountingScreen(state.snapshot, layoutMode)
                        CustomerDisplayMode.ACCOUNTING -> AccountingScreen(state.snapshot, layoutMode)''',
          )

          Path('app/src/test/java/jp/co/tenposinfo/register/V135SubtotalUc07Test.kt').write_text('''package jp.co.tenposinfo.register

import java.io.File
import org.junit.Assert.assertEquals
import org.junit.Assert.assertTrue
import org.junit.Test

class V135SubtotalUc07Test {
    private fun product(
        id: String,
        price: Long,
        category: TaxCategory,
    ) = Product(
        id = id,
        name = id,
        unitPrice = price,
        taxCategory = category,
        displayOrder = 1,
    )

    @Test
    fun subtotalSnapshotHasDedicatedModeAndCalculatedTotal() {
        val items = listOf(
            CartItem(product("内税", 1_100, TaxCategory.INCLUDED_10), 1),
            CartItem(product("外税", 1_000, TaxCategory.EXCLUDED_10), 1),
        )

        val snapshot = CustomerDisplaySnapshotFactory.subtotal(items, "つぐレジ")

        assertEquals(CustomerDisplayMode.SUBTOTAL, snapshot.mode)
        assertEquals(2, snapshot.numberOfProducts)
        assertEquals(2_200L, snapshot.subtotalAmount)
        assertEquals(2_200L, snapshot.totalAmount)
        assertEquals("小計をご確認ください", snapshot.message)
    }

    @Test
    fun paymentScreenShowsDiscountTaxableAmountNonTaxableAmountAndTotals() {
        val source = File("src/main/java/jp/co/tenposinfo/register/MainActivity.kt").readText()
        assertTrue(source.contains("yen(item.amountBeforeDiscount)"))
        assertTrue(source.contains("AmountRow(\"  値引\", \"-${yen(item.discountAmount)}\")"))
        assertTrue(source.contains("AmountRow(\"商品計\", yen(items.sumOf { it.baseAmount }))"))
        assertTrue(source.contains("\"${bucket.ratePercent}%対象\""))
        assertTrue(source.contains("\"${yen(bucket.grossAmount)} / 税 ${yen(bucket.taxAmount)}\""))
        assertTrue(source.contains("AmountRow(\"非課税\", yen(bucket.grossAmount))"))
        assertTrue(source.contains("AmountRow(\"合計\", yen(summary.grossAmount), emphasized = true)"))
    }

    @Test
    fun subtotalActionIsDisabledWhenEmptyAndPublishesBeforePaymentScreen() {
        val source = File("src/main/java/jp/co/tenposinfo/register/MainActivity.kt").readText()
        assertTrue(source.contains("\"小計／会計  ${yen(summary.grossAmount)}\""))
        assertTrue(source.contains("cart.isNotEmpty(),"))
        val subtotalIndex = source.indexOf("CustomerDisplaySnapshotFactory.subtotal(")
        val paymentIndex = source.indexOf("screen = AppScreen.PAYMENT", startIndex = subtotalIndex)
        assertTrue(subtotalIndex >= 0)
        assertTrue(paymentIndex > subtotalIndex)
    }

    @Test
    fun guestCountAndHeldTicketCompatibilityRemainConnected() {
        val guestSource = File("src/main/java/jp/co/tenposinfo/register/SaleGuestCountV135.kt").readText()
        val heldSource = File("src/main/java/jp/co/tenposinfo/register/HeldTicketSafety.kt").readText()
        assertTrue(guestSource.contains("const val MIN = 1"))
        assertTrue(guestSource.contains("const val MAX = 999"))
        assertTrue(guestSource.contains("next `held_tickets` INSERT"))
        assertTrue(heldSource.contains("restoreHeldGuestCountToPending"))
    }
}
''', encoding='utf-8')

          Path('customer-display/src/test/java/jp/co/tenposinfo/register/cd/V135SubtotalCompatibilityTest.kt').write_text('''package jp.co.tenposinfo.register.cd

import org.junit.Assert.assertEquals
import org.junit.Test

class V135SubtotalCompatibilityTest {
    @Test
    fun reducerAcceptsSubtotalSnapshot() {
        val subtotal = CustomerDisplaySnapshot(
            schemaVersion = CUSTOMER_DISPLAY_SCHEMA_VERSION,
            sequence = 2L,
            serverInstanceId = "register-v135",
            sentAtMillis = 2L,
            mode = CustomerDisplayMode.SUBTOTAL,
            transactionId = null,
            storeName = "つぐレジ",
            numberOfProducts = 2,
            subtotalAmount = 2_200L,
            totalAmount = 2_200L,
            paymentMethod = null,
            receivedAmount = 0L,
            shortageAmount = 0L,
            changeAmount = 0L,
            message = "小計をご確認ください",
            orderItems = emptyList(),
        )
        val current = CustomerDisplayUiState(
            connected = true,
            snapshot = CustomerDisplaySnapshot.initial(),
            statusMessage = "接続中",
        )

        val updated = CustomerDisplayStateReducer.received(current, subtotal)

        assertEquals(CustomerDisplayMode.SUBTOTAL, updated.snapshot.mode)
        assertEquals(2_200L, updated.snapshot.totalAmount)
    }
}
