          Path('docs/v1.35-uc-07-subtotal-audit.md').write_text('''# v1.35 UC-07 小計 仕様監査・実装記録

## 対象

詳細仕様書 v2.5 の UC-07 / CTL-1012 と SCR-300、Customer Display 第30章を、`develop/v1.35` の現行実装へ突合した。

## POS側でv1.35中に閉じる範囲

- `小計／会計` は空カート時に無効、商品があれば会計画面へ遷移する。
- 販売画面の表示合計と会計画面の合計は `TaxEngine.calculate(items)` を正本とする。
- SCR-300左側に商品金額、値引、商品計、税率別対象額・税額、非課税額、合計を表示する。
- 客数は既存 `SaleGuestCountRuntimeV135` の1〜999名明示入力を維持し、保留伝票へ保存、呼出時に作業中客数へ復元、確定売上へ引き継ぐ。
- 保留は既存の空カート禁止、客数保持、仮締め票導線を維持する。
- 小計押下時、REGISTER側WebSocket snapshotに `SUBTOTAL` を明示してから会計画面へ遷移する。
- 現行つぐレジ CDには `SUBTOTAL` enumの最小互換を追加し、未認識enumによる受信失敗を防ぐ。

## v1.37へ持ち越す範囲

UC-07のPOS小計契機とは分離し、Customer Display全体の確定状態機械はv1.37で完成させる。

- 既存legacy `SALES` / `ACCOUNTING` を v2.5正本の `CART` / `PAYMENT` へ移行する。
- `CASH_RECEIVED` / `CHANGE` の確定タイミングを実装する。
- `CHANGE -> COMPLETE -> STANDBY/CART` の表示時間と遷移を仕様どおり実装する。
- v2.5の完全snapshot項目（sessionId、lineId/quantityScaled等）の不足を整理し、schema互換を保って移行する。
- CDA-120専用の小計画面表示はv1.37で完成させる。v1.35では既存会計表示へ安全にフォールバックする。

## 実機確認

本記録はコード・自動テスト・CI・APK検証を対象とする。実端末での800x480視認性、バーコード入力との連続操作、別Android端末へのWebSocket表示順は未確認であり、最終統合受入で確認する。
''', encoding='utf-8')
