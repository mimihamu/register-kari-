name: Apply v0.22 backup portability

on:
  pull_request:
    branches:
      - develop/v0.21
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout v0.22
        uses: actions/checkout@v4
        with:
          ref: develop/v0.22
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply backup portability implementation
        run: python3 tools/apply_v022.py

      - name: Verify generated source
        run: |
          grep -q 'versionCode = 52' app/build.gradle.kts
          grep -q 'versionName = "0.22.0-dev.1"' app/build.gradle.kts
          grep -q 'ActivityResultContracts.CreateDocument' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'ActivityResultContracts.OpenDocument' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'Google Drive・USB・端末フォルダ' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'fun exportBackup' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'fun importBackup' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'copyWithLimit' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'DATA_BACKUP_EXPORTED' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'DATA_BACKUP_IMPORTED' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'TSUGUREGI_import_' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V022BackupPortabilityTest.kt
          test -s docs/V0.22_BACKUP_PORTABILITY.md
          ! grep -q 'MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          ! grep -q 'WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt \
            app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt \
            app/src/test/java/jp/co/tenposinfo/register/V022BackupPortabilityTest.kt \
            docs/V0.22_BACKUP_PORTABILITY.md
          git commit -m "feat: add portable backup export and verified import" || exit 0
          git push origin HEAD:develop/v0.22
