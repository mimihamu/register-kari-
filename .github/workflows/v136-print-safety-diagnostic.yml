name: Diagnose v1.36 Print Safety Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run cumulative unit tests with full log capture
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest --stacktrace 2>&1 | tee unit-test.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > unit-test-exit-code.txt
          exit 0

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v136-print-safety-diagnostic
          path: |
            unit-test.log
            unit-test-exit-code.txt
            app/build/test-results/**/*.xml
            customer-display/build/test-results/**/*.xml
            management-app/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Preserve test status
        if: always()
        run: test "$(cat unit-test-exit-code.txt)" -eq 0
