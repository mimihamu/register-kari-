name: v0.95 guarded build workflow update

on:
  push:
    branches:
      - develop/v0.95
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.95
          fetch-depth: 0

      - name: Update permanent build workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-apk.yml')
          text = path.read_text()
          if 'SALES_EDIT_RESPONSIVE=true' in text and 'POS_VERSION_CODE: 125' in text:
              print('v0.95 permanent workflow already updated')
              raise SystemExit(0)

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement guard failed ({count}): {old[:100]}')
              text = text.replace(old, new, 1)

          replace_once(
              '- name: Verify cumulative v0.14-v0.94 sources',
              '- name: Verify cumulative v0.14-v0.95 sources',
          )
          replace_once(
              "          grep -Fq 'versionCode = 124' app/build.gradle.kts\n          grep -Fq 'versionName = \"0.94.0-dev.1\"' app/build.gradle.kts\n",
              '',
          )

          marker = "          ! grep -Fqi 'DROP TABLE' docs/V0.94_STARTUP_DIAGNOSTIC_RESPONSIVE.md\n"
          if text.count(marker) != 1:
              raise SystemExit('v0.94 insertion marker guard failed')
          v095 = r'''

          # v0.95 sales edit responsive acceptance. Detailed layout is enforced by JUnit.
          grep -Fq 'versionCode = 125' app/build.gradle.kts
          grep -Fq 'versionName = "0.95.0-dev.1"' app/build.gradle.kts
          test -s app/src/test/java/jp/co/tenposinfo/register/V095SalesEditResponsiveTest.kt
          test -s docs/V0.95_SALES_EDIT_RESPONSIVE.md
          test -s docs/V0.95_RELEASE_NOTES.md
          grep -Fq 'val editScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'val editSummaryScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'val discountEditScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'val discountPreviewScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'Modifier.weight(0.72f)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'Modifier.weight(0.92f)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'Modifier.width(330.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'Modifier.width(390.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'DiscountEngine.applyToItem' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'DiscountEngine.applyToTransaction' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq '最終総合実機試験へ繰越' docs/V0.95_RELEASE_NOTES.md
          ! grep -Fqi 'DELETE FROM' docs/V0.95_SALES_EDIT_RESPONSIVE.md
          ! grep -Fqi 'UPDATE sales' docs/V0.95_SALES_EDIT_RESPONSIVE.md
          ! grep -Fqi 'DROP TABLE' docs/V0.95_SALES_EDIT_RESPONSIVE.md
          '''
          text = text.replace(marker, marker + v095, 1)

          replace_once('          POS_VERSION_CODE: 124', '          POS_VERSION_CODE: 125')
          replace_once('          POS_VERSION_NAME: 0.94.0-dev.1', '          POS_VERSION_NAME: 0.95.0-dev.1')
          replace_once(
              '          register_apk=artifacts/TSUGUREGI_v0.94.0_dev1_startup_diagnostic_responsive_debug.apk',
              '          register_apk=artifacts/TSUGUREGI_v0.95.0_dev1_sales_edit_responsive_debug.apk',
          )
          replace_once('          REGISTER_VERSION_NAME=0.94.0-dev.1', '          REGISTER_VERSION_NAME=0.95.0-dev.1')
          replace_once('          REGISTER_VERSION_CODE=124', '          REGISTER_VERSION_CODE=125')
          replace_once(
              '          STARTUP_DIAGNOSTIC_NORMAL_LAYOUT_PRESERVED=true\n',
              '          STARTUP_DIAGNOSTIC_NORMAL_LAYOUT_PRESERVED=true\n'
              '          SALES_EDIT_RESPONSIVE=true\n'
              '          LINE_EDIT_RESPONSIVE=true\n'
              '          DISCOUNT_RESPONSIVE=true\n'
              '          SALES_EDIT_SCROLL_FALLBACK=true\n'
              '          SALES_EDIT_NORMAL_LAYOUT_PRESERVED=true\n',
          )
          replace_once(
              '          REAL_DEVICE_STARTUP_DIAGNOSTIC_VERIFICATION=deferred-final-acceptance\n',
              '          REAL_DEVICE_STARTUP_DIAGNOSTIC_VERIFICATION=deferred-final-acceptance\n'
              '          REAL_DEVICE_SALES_EDIT_VERIFICATION=deferred-final-acceptance\n',
          )
          replace_once(
              '          name: TSUGUREGI-v0.94.0-dev1-startup-diagnostic-responsive-apks',
              '          name: TSUGUREGI-v0.95.0-dev1-sales-edit-responsive-apks',
          )

          path.write_text(text)
          PY

          git diff --check
          grep -Fq 'Verify cumulative v0.14-v0.95 sources' .github/workflows/build-apk.yml
          grep -Fq 'POS_VERSION_CODE: 125' .github/workflows/build-apk.yml
          grep -Fq 'SALES_EDIT_RESPONSIVE=true' .github/workflows/build-apk.yml
          grep -Fq 'TSUGUREGI-v0.95.0-dev1-sales-edit-responsive-apks' .github/workflows/build-apk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-apk.yml
          if git diff --cached --quiet; then
            echo 'No workflow commit required'
            exit 0
          fi
          git commit -m 'ci(v0.95): verify sales edit responsive release'
          git push origin HEAD:develop/v0.95
