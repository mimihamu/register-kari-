name: Fix v0.50 version expectations

on:
  push:
    branches:
      - develop/v0.50
    paths:
      - tools/v050_fix.py
      - .github/workflows/v050-fix-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v0.50
        uses: actions/checkout@v4
        with:
          ref: develop/v0.50
          fetch-depth: 0

      - name: Correct generated expectations
        run: python3 tools/v050_fix.py

      - name: Commit corrected tests and generated CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add management-app/src/test tools/build-apk-v050.generated.yml
          git commit -m "v0.50 correct version expectations"
          git push origin HEAD:develop/v0.50
