name: v1.36 cumulative unit test diagnostic

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Run exact cumulative unit tests
        id: tests
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest --stacktrace
      - name: Summarize failing tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('.').glob('**/build/test-results/**/*.xml'))
          print(f'XML_FILES={len(files)}')
          failed = 0
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  print(f'XML_PARSE_ERROR {path}: {exc}')
                  continue
              for tc in root.iter('testcase'):
                  problems = list(tc.findall('failure')) + list(tc.findall('error'))
                  if not problems:
                      continue
                  failed += 1
                  print(f'FAILED_TEST {tc.get("classname", "")}#{tc.get("name", "")}')
                  for problem in problems:
                      text = (problem.get('message') or '') + '\n' + (problem.text or '')
                      print(text[:12000])
          print(f'FAILED_COUNT={failed}')
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v136-cumulative-unit-test-results
          path: |
            app/build/test-results/
            customer-display/build/test-results/
            management-app/build/test-results/
            app/build/reports/tests/
            customer-display/build/reports/tests/
            management-app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve test conclusion
        if: steps.tests.outcome == 'failure'
        run: exit 1
