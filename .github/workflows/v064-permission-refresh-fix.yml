name: Apply v0.64 live reversal permission recheck

on:
  pull_request:
    branches:
      - develop/v0.63
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v064-permission:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.64'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.64 head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.64
          fetch-depth: 0

      - name: Apply live permission recheck
        run: python3 tools/v064_permission_refresh_fix.py

      - name: Commit permission safety fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(v0.64): leave reversal screen when permission expires"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:develop/v0.64
