          text = text.replace('TSUGUREGI-v0.45.0-dev1-drive-api-sync-apks', 'TSUGUREGI-v0.46.0-dev1-drive-setup-guide-apks')
          text = text.replace('          GOOGLE_DRIVE_DIRECT_UPLOAD=true', '          GOOGLE_DRIVE_SETUP_GUIDE=true\n          GOOGLE_DRIVE_DIRECT_UPLOAD=true')
          workflow.write_text(text)
