name: v0.52 repair CI temporary

on:
  push:
    branches:
      - develop/v0.52
    paths:
      - tools/v052_fix_ci.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.52
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate corrected CI
        run: python tools/v052_fix_ci.py
      - name: Commit corrected generated workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-apk-v052-fixed.yml
          git commit -m "v0.52 generate corrected CI workflow"
          git push origin HEAD:develop/v0.52
