name: Apply v0.57 held ticket operations UI

on:
  push:
    branches:
      - develop/v0.57
    paths:
      - tools/v057_apply.py
      - .github/workflows/v057-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.57
        uses: actions/checkout@v4
        with:
          ref: develop/v0.57
          fetch-depth: 0

      - name: Apply v0.57 source patch
        run: python tools/v057_apply.py

      - name: Remove temporary patch files
        run: |
          rm -f tools/v057_apply.py
          rm -f .github/workflows/v057-apply.yml

      - name: Commit cumulative v0.57
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "v0.57: wire held ticket merge split UI"
          git push origin HEAD:develop/v0.57
