name: Export v0.15 tested source patch

on:
  pull_request:
    branches:
      - develop/v0.14
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v0.15
        uses: actions/checkout@v4
        with:
          ref: develop/v0.15
          fetch-depth: 0

      - name: Restore implementation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re
          source = Path('.github/workflows/v015-apply.yml').read_text(encoding='utf-8')
          match = re.search(r"echo '([^']+)' \| base64 -d \| gzip -d", source)
          if not match:
              raise SystemExit('embedded implementation payload was not found')
          Path('tools').mkdir(exist_ok=True)
          Path('tools/apply_v015.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python -m py_compile tools/apply_v015.py

      - name: Apply the already-tested source changes
        shell: bash
        run: |
          python tools/apply_v015.py
          python - <<'PY'
          from pathlib import Path

          tax = Path('app/src/test/java/jp/co/tenposinfo/register/V015TaxInvoicePolicyTest.kt')
          text = tax.read_text(encoding='utf-8')
          text = text.replace('assertEquals(4_568L, summary.grossAmount)', 'assertEquals(4_750L, summary.grossAmount)')
          text = text.replace('assertEquals(338L, summary.taxAmount)', 'assertEquals(350L, summary.taxAmount)')
          text = text.replace('assertEquals(4_230L, summary.netAmount)', 'assertEquals(4_400L, summary.netAmount)')
          tax.write_text(text, encoding='utf-8')

          profile = Path('app/src/test/java/jp/co/tenposinfo/register/V015SalesProfileSnapshotTest.kt')
          text = profile.read_text(encoding='utf-8')
          text = text.replace('assertEquals(1_100L, dinnerProduct.unitPrice)', 'assertEquals(1_000L, dinnerProduct.unitPrice)')
          profile.write_text(text, encoding='utf-8')
          PY
          rm -rf tools

      - name: Package implementation files
        shell: bash
        run: |
          tar -czf v015-tested-source.tar.gz \
            .github/workflows/build-apk.yml \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/jp/co/tenposinfo/register/CatalogBootstrapProvider.kt \
            app/src/main/java/jp/co/tenposinfo/register/Domain.kt \
            app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/Receipt.kt \
            app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt \
            app/src/main/java/jp/co/tenposinfo/register/TaxInvoiceSettings.kt \
            app/src/main/java/jp/co/tenposinfo/register/TaxInvoiceSettingsActivity.kt \
            app/src/test/java/jp/co/tenposinfo/register/V015SalesProfileSnapshotTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V015TaxInvoicePolicyTest.kt \
            docs/V0.15_TAX_INVOICE_PROFILE.md
          sha256sum v015-tested-source.tar.gz > v015-tested-source.tar.gz.sha256

      - name: Upload tested source patch
        uses: actions/upload-artifact@v4
        with:
          name: v015-tested-source-patch
          path: |
            v015-tested-source.tar.gz
            v015-tested-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
