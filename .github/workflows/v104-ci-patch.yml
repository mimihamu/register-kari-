name: v1.04 CI patch

on:
  push:
    branches:
      - develop/v1.04

permissions:
  contents: write

jobs:
  patch-ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.04
          fetch-depth: 0
      - name: Extend cumulative CI to v1.04
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/build-apk.yml')
          text = path.read_text()
          text = text.replace('# V103CustomerDisplayConnectionLivenessTest.kt\n', '# V103CustomerDisplayConnectionLivenessTest.kt\n# V104DataProtectionCrashSafetyTest.kt\n', 1)

          source_step = '''      - name: Verify cumulative v0.14-v1.04 sources
              shell: bash
              env:
                V103_FINAL_HEAD: b7904e6059212011ca9bdd57c46e6b3aac8fa360
                V102_FINAL_HEAD: 6fbe2711a4575568fa919439733149ccb671b729
                V101_FINAL_HEAD: 754ba393923e1717244a6b940587bc754ecbf6dc
                V100_FINAL_HEAD: d4ebe92517a00e2cc6b41b97e02ac13010428580
                V099_FINAL_HEAD: 45e19c082f640623a91bc38609d471e873ec6ece
                V098_FINAL_HEAD: 8990d93c007bc0b57afed7f28695454a8535dd90
                V097_FINAL_HEAD: c216ab8a37c6db23ebcde673cd08fc9d6f4c328d
                V090_FINAL_HEAD: 2ca9a2faa263f469788eaad903309f9e3ddcd545
                V086_FINAL_HEAD: aef6c08d75d057b67662e9612238edba15fc6489
                V093_FINAL_HEAD: 5c8d0d95175bb7dd6cf8b70f52b31162c415a5e7
              run: |
                set -euo pipefail

                # v1.03 finalの累積ソースゲートを固定SHAから再実行する。
                # 現行版へ上がるPOS版番号チェックだけを除外し、v1.03までの安全性チェックを維持する。
                git show "$V103_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v103-build-apk.yml
                awk '
                  /^      - name: Verify cumulative v0.14-v1.03 sources/ { capture=1; next }
                  capture && /^      - name: Verify launcher and orientation configuration/ { exit }
                  capture && /^        run: \\|/ { inrun=1; next }
                  capture && inrun { sub(/^          /, ""); print }
                ' /tmp/v103-build-apk.yml \\
                  | grep -vF "grep -Fq 'versionCode = 133' app/build.gradle.kts" \\
                  | grep -vF "grep -Fq 'versionName = \\\"1.03.0-dev.1\\\"' app/build.gradle.kts" \\
                  > /tmp/v103-cumulative-checks.sh
                test -s /tmp/v103-cumulative-checks.sh
                bash -euxo pipefail /tmp/v103-cumulative-checks.sh

                # v1.04 data-protection crash safety acceptance.
                grep -Fq 'versionCode = 134' app/build.gradle.kts
                grep -Fq 'versionName = "1.04.0-dev.1"' app/build.gradle.kts
                grep -Fq 'versionCode = 15' management-app/build.gradle.kts
                grep -Fq 'versionName = "0.15.0-dev.1"' management-app/build.gradle.kts
                grep -Fq 'versionCode = 7' customer-display/build.gradle.kts
                grep -Fq 'versionName = "0.14.0-dev.1"' customer-display/build.gradle.kts
                test -s app/src/main/java/jp/co/tenposinfo/register/DataProtectionCrashSafetyV104.kt
                test -s app/src/test/java/jp/co/tenposinfo/register/V104DataProtectionCrashSafetyTest.kt
                test -s docs/V1.04_DATA_PROTECTION_CRASH_SAFETY.md
                test -s docs/V1.04_RELEASE_NOTES.md
                grep -Fq 'PRAGMA wal_checkpoint(TRUNCATE)' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
                grep -Fq 'BackupSnapshotFallbackPolicyV104.MAX_ATTEMPTS' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
                grep -Fq 'BackupSnapshotFallbackPolicyV104.walQuiescent(wal)' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
                grep -Fq 'CrashSafeFileReplaceV104.replace(source, target)' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
                grep -Fq 'Files.move(staged.toPath(), target.toPath(), ATOMIC_MOVE, REPLACE_EXISTING)' app/src/main/java/jp/co/tenposinfo/register/DataProtectionCrashSafetyV104.kt
                grep -Fq 'output.fd.sync()' app/src/main/java/jp/co/tenposinfo/register/DataProtectionCrashSafetyV104.kt
                grep -Fq 'WALを安全に固定できないためbackupを中止しました' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
                python3 - <<'CHECK'
                from pathlib import Path
                source = Path('app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt').read_text()
                start = source.index('internal fun atomicReplace')
                end = source.index('internal fun readSimpleProperties', start)
                body = source[start:end]
                assert 'target.delete()' not in body
                assert 'source.copyTo(target' not in body
                snapshot = source[source.index('private fun snapshotDatabase'):source.index('private fun inspectDatabaseFile')]
                checkpoint = snapshot.index('PRAGMA wal_checkpoint(TRUNCATE)')
                transaction = snapshot.index('database.beginTransaction()')
                wal_check = snapshot.index('BackupSnapshotFallbackPolicyV104.walQuiescent(wal)')
                copy = snapshot.index('source.copyTo(target, overwrite = true)')
                assert checkpoint < transaction < wal_check < copy
                CHECK
                grep -Fq '最終総合実機試験' docs/V1.04_RELEASE_NOTES.md
                ! grep -Fqi 'DELETE FROM sales' app/src/main/java/jp/co/tenposinfo/register/DataProtectionCrashSafetyV104.kt
                ! grep -Fqi 'DROP TABLE' app/src/main/java/jp/co/tenposinfo/register/DataProtectionCrashSafetyV104.kt
          '''

          pattern = re.compile(
              r'      - name: Verify cumulative v0\.14-v1\.03 sources\n.*?(?=      - name: Verify launcher and orientation configuration)',
              re.S,
          )
          text, count = pattern.subn(source_step, text, count=1)
          assert count == 1, f'source gate replacement count={count}'

          text = text.replace('POS_VERSION_CODE: 133\n          POS_VERSION_NAME: 1.03.0-dev.1', 'POS_VERSION_CODE: 134\n          POS_VERSION_NAME: 1.04.0-dev.1', 1)
          text = text.replace('TSUGUREGI_v1.03.0_dev1_customer_display_connection_liveness_debug.apk', 'TSUGUREGI_v1.04.0_dev1_data_protection_crash_safety_debug.apk', 1)
          text = text.replace('REGISTER_VERSION_NAME=1.03.0-dev.1\n          REGISTER_VERSION_CODE=133', 'REGISTER_VERSION_NAME=1.04.0-dev.1\n          REGISTER_VERSION_CODE=134', 1)
          marker = '          CUSTOMER_DISPLAY_STALE_CLOSE_WITHOUT_WRITER_LOCK=true\n'
          flags = '''          CUSTOMER_DISPLAY_STALE_CLOSE_WITHOUT_WRITER_LOCK=true
              DATA_PROTECTION_WAL_SAFE_FALLBACK=true
              DATA_PROTECTION_FALLBACK_CHECKPOINT_TRUNCATE=true
              DATA_PROTECTION_FALLBACK_EXCLUSIVE_LOCK_RECHECK=true
              DATA_PROTECTION_ATOMIC_REPLACE=true
              DATA_PROTECTION_TARGET_PREDELETE_REMOVED=true
              DATA_PROTECTION_ATOMIC_MOVE_API26=true
              REAL_DEVICE_DATA_PROTECTION_CRASH_SAFETY_VERIFICATION=deferred-final-acceptance
          '''
          assert marker in text
          text = text.replace(marker, flags, 1)
          text = text.replace(
              'name: TSUGUREGI-v1.03.0-dev1-customer-display-connection-liveness-apks',
              'name: TSUGUREGI-v1.04.0-dev1-data-protection-crash-safety-apks',
              1,
          )
          path.write_text(text)
          PY
      - name: Commit CI update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mimihamu'
          git config user.email '74812001+mimihamu@users.noreply.github.com'
          git add .github/workflows/build-apk.yml
          git commit -m 'v1.04 extend cumulative CI and APK integrity gate'
          git push origin HEAD:develop/v1.04
