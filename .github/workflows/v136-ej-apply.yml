name: V1.36 EJ Apply (temporary)

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-ej-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0

      - name: Apply structured print snapshot call sites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f"expected block not found: {path}")
              s2 = s.replace(old, new, 1)
              p.write_text(s2)

          reg = "app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt"
          replace_once(reg,
              '        SaleTaxSnapshotStoreV136.ensureSchema(db)\n    }',
              '        SaleTaxSnapshotStoreV136.ensureSchema(db)\n        PrintDocumentSnapshotSchemaV136.ensureSale(db)\n    }')
          replace_once(reg,
              '''            if (ReceiptAutoPrintPolicyV136.shouldCreateAutomaticReceiptJob(\n                    printerConfiguration.receiptAutoPrintEnabled,\n                )\n            ) {\n                insertPrintJob(this, saleId, paperWidthMm, createdAt)\n            }''',
              '''            val automaticPrintJobId = if (ReceiptAutoPrintPolicyV136.shouldCreateAutomaticReceiptJob(\n                    printerConfiguration.receiptAutoPrintEnabled,\n                )\n            ) {\n                insertPrintJob(this, saleId, paperWidthMm, createdAt)\n            } else {\n                null\n            }''')
          replace_once(reg,
              '''            SaleTaxSnapshotStoreV136.enrichSaleJournal(this, saleId)\n            if (normalizedCommitKey != null) {''',
              '''            SaleTaxSnapshotStoreV136.enrichSaleJournal(this, saleId)\n            PrintDocumentSnapshotV136.persistSaleSnapshot(\n                db = this,\n                printJobId = automaticPrintJobId,\n                saleId = saleId,\n                businessDate = businessLink.businessDate,\n                issuedAt = createdAt,\n                operatorName = operatorName,\n                items = items,\n                taxSummary = summary,\n                payments = paymentState.allocations,\n                changeAmount = paymentState.changeAmount,\n                settings = taxSettings,\n            )\n            if (normalizedCommitKey != null) {''')
          replace_once(reg,
              '''    private fun insertPrintJob(db: SQLiteDatabase, saleId: Long, paperWidthMm: Int, now: Long) {\n        db.insertOrThrow(''',
              '''    private fun insertPrintJob(db: SQLiteDatabase, saleId: Long, paperWidthMm: Int, now: Long): Long =\n        db.insertOrThrow(''')
          replace_once(reg,
              '''            },\n        )\n    }\n\n    private fun migrateCartToLineNumber''',
              '''            },\n        )\n\n    private fun migrateCartToLineNumber''')

          adv = "app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt"
          replace_once(adv,
              '        val result = gateway.send(TextEscPosEncoder.encode(job.payloadText))',
              '''        val renderedPayload = TextEscPosEncoder.encode(job.payloadText)\n        PrintDocumentSnapshotSchemaV136.recordRenderedHash(\n            db = db,\n            table = "document_print_jobs",\n            jobId = jobId,\n            payload = renderedPayload,\n        )\n        val result = gateway.send(renderedPayload)''')
          replace_once(adv,
              '''        TaxSnapshotSchema.ensureReversalColumns(db)\n    }''',
              '''        TaxSnapshotSchema.ensureReversalColumns(db)\n        PrintDocumentSnapshotSchemaV136.ensureDocument(db)\n    }''')

          rec = "app/src/main/java/jp/co/tenposinfo/register/Receipt.kt"
          replace_once(rec,
              '        val result = gateway.send(EscPosEncoder.encode(configuredReceipt, configuredSnapshot))',
              '''        val renderedPayload = EscPosEncoder.encode(configuredReceipt, configuredSnapshot)\n        PrintDocumentSnapshotSchemaV136.recordRenderedHash(\n            db = database.writableDatabase,\n            table = "print_jobs",\n            jobId = job.id,\n            payload = renderedPayload,\n        )\n        val result = gateway.send(renderedPayload)''')
          PY

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt \
                  app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt \
                  app/src/main/java/jp/co/tenposinfo/register/Receipt.kt
          git commit -m "feat(v1.36): persist structured print snapshots"
          git push origin HEAD:develop/v1.36
