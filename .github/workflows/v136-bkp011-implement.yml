name: v1.36 BKP-011 implement

on:
  push:
    branches: [ develop/v1.36 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply BKP-011 patch
        run: python3 .github/v136-bkp011-patch.py
      - name: Run V149 focused unit test
        run: gradle --no-daemon :app:testDebugUnitTest --tests jp.co.tenposinfo.register.V149Bkp011PortableKeyDecryptionTest
      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Commit BKP-011 product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/jp/co/tenposinfo/register/BackupEnvelopeV136.kt \
            app/src/test/java/jp/co/tenposinfo/register/V149Bkp011PortableKeyDecryptionTest.kt \
            docs/V1.36_BKP_011_PORTABLE_KEY_DECRYPTION_TEST.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v1.36): verify portable backup key at export'
          git push origin HEAD:develop/v1.36
