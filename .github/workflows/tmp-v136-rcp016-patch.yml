name: tmp-v136-rcp016-patch

on:
  push:
    branches: [develop/v1.36]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply RCP-016 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found: {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Printer settings UI: expose formal RCP-016 document-specific editor.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt',
              '''                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        Checkbox(checked = receiptAutoPrint, onCheckedChange = { receiptAutoPrint = it })
                        Column {
                            Text("会計確定時にレシートを自動発行")
                            Text("OFFでも売上一覧・会計完了から後レシート／再印字できます", color = Color.Gray, fontSize = 12.sp)
                        }
                    }
                    Spacer(Modifier.height(8.dp))
                    Text("用紙幅・カット", fontWeight = FontWeight.Bold, color = AsNavy)''',
              '''                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        Checkbox(checked = receiptAutoPrint, onCheckedChange = { receiptAutoPrint = it })
                        Column {
                            Text("会計確定時にレシートを自動発行")
                            Text("OFFでも売上一覧・会計完了から後レシート／再印字できます", color = Color.Gray, fontSize = 12.sp)
                        }
                    }
                    Spacer(Modifier.height(8.dp))
                    DocumentPrintSettingsPanelV136(receiptAutoPrintEnabled = receiptAutoPrint)
                    Spacer(Modifier.height(8.dp))
                    Text("用紙幅・カット", fontWeight = FontWeight.Bold, color = AsNavy)''',
          )

          # Settlement reports: X inspection and Z settlement have independent auto-print settings.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt',
              '''        val paperWidthMm = PrinterPaperSettingPolicy.currentWidthMm(appContext)
        val now = System.currentTimeMillis()
        var previewText = ""
        var printJobId = 0L
        val reportId = db.transaction {''',
              '''        val paperWidthMm = PrinterPaperSettingPolicy.currentWidthMm(appContext)
        val documentPrintKind = when (type) {
            SettlementReportType.X_INSPECTION -> DocumentPrintKindV136.INSPECTION
            SettlementReportType.Z_SETTLEMENT -> DocumentPrintKindV136.SETTLEMENT
        }
        val documentPrintSetting = DocumentPrintSettingsStoreV136(appContext).load(documentPrintKind)
        val now = System.currentTimeMillis()
        var previewText = ""
        var printJobId = 0L
        val reportId = db.transaction {''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt',
              '''            previewText = OperationDocumentRenderer.renderSettlement(document, ReceiptPaper.fromWidth(paperWidthMm))
            printJobId = insertDocumentJob(OperationDocumentType.SETTLEMENT_REPORT, id, paperWidthMm, previewText, now)
            if (type == SettlementReportType.Z_SETTLEMENT) {''',
              '''            previewText = OperationDocumentRenderer.renderSettlement(document, ReceiptPaper.fromWidth(paperWidthMm))
            if (documentPrintSetting.autoPrintEnabled) {
                printJobId = insertDocumentJob(
                    OperationDocumentType.SETTLEMENT_REPORT,
                    id,
                    paperWidthMm,
                    previewText,
                    now,
                    documentPrintKind,
                )
            }
            if (type == SettlementReportType.Z_SETTLEMENT) {''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt',
              '''    private fun SQLiteDatabase.insertDocumentJob(
        type: OperationDocumentType,
        referenceId: Long,
        paperWidthMm: Int,
        payloadText: String,
        now: Long,
    ): Long = insertOrThrow(
        "document_print_jobs",
        null,
        ContentValues().apply {
            put("document_type", type.name)
            put("reference_id", referenceId)
            put("paper_width_mm", if (paperWidthMm >= 80) 80 else 58)
            put("status", PrintJobStatus.PENDING.name)
            put("attempt_count", 0)
            putNull("last_error")
            put("payload_text", payloadText)
            put("created_at", now)
            put("updated_at", now)
        },
    )''',
              '''    private fun SQLiteDatabase.insertDocumentJob(
        type: OperationDocumentType,
        referenceId: Long,
        paperWidthMm: Int,
        payloadText: String,
        now: Long,
        settingsKind: DocumentPrintKindV136? = DocumentPrintSettingsPolicyV136.kindFor(type),
    ): Long {
        val setting = settingsKind?.let { DocumentPrintSettingsStoreV136(appContext).load(it) }
        val copies = setting?.copies?.let(DocumentPrintSettingsPolicyV136::normalizeCopies) ?: 1
        val decoratedPayload = setting?.let { DocumentPrintSettingsPolicyV136.decorateText(payloadText, it) } ?: payloadText
        var firstJobId = 0L
        repeat(copies) { copyIndex ->
            val jobId = insertOrThrow(
                "document_print_jobs",
                null,
                ContentValues().apply {
                    put("document_type", type.name)
                    put("reference_id", referenceId)
                    put("paper_width_mm", if (paperWidthMm >= 80) 80 else 58)
                    put("status", PrintJobStatus.PENDING.name)
                    put("attempt_count", 0)
                    putNull("last_error")
                    put("payload_text", decoratedPayload)
                    put("created_at", now + copyIndex)
                    put("updated_at", now + copyIndex)
                },
            )
            if (copyIndex == 0) firstJobId = jobId
        }
        return firstJobId
    }''',
          )

          # Sale receipt: one logical queue job can emit 1..3 physical copies without turning copy 2 into a reprint.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/Receipt.kt',
              '''    val reprint: Boolean = false,
    val invoiceAggregationBasis: InvoiceAggregationBasisV136 = InvoiceAggregationBasisV136.TAX_INCLUDED,
)''',
              '''    val reprint: Boolean = false,
    val invoiceAggregationBasis: InvoiceAggregationBasisV136 = InvoiceAggregationBasisV136.TAX_INCLUDED,
    val documentCopies: Int = 1,
    val documentHeader: String = "",
    val documentFooter: String = "",
)''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/Receipt.kt',
              '''        val width = paper.charsPerLine
        val lines = mutableListOf<String>()
        lines += center(data.storeName, width)''',
              '''        val width = paper.charsPerLine
        val lines = mutableListOf<String>()
        data.documentHeader.lineSequence().map(String::trim).filter(String::isNotBlank).forEach {
            lines += fit(it, width)
        }
        lines += center(data.storeName, width)''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/Receipt.kt',
              '''        lines += "内/外は内税・外税区分です"
        lines += center("ありがとうございました", width)
        return lines.joinToString("\\n")''',
              '''        lines += "内/外は内税・外税区分です"
        lines += center("ありがとうございました", width)
        data.documentFooter.lineSequence().map(String::trim).filter(String::isNotBlank).forEach {
            lines += fit(it, width)
        }
        return lines.joinToString("\\n")''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/Receipt.kt',
              '''        return PrinterCommandEncoder.encodeText(
            text = ReceiptRenderer.render(data, PrinterPaperSettingPolicy.paper(configuration)),
            configuration = configuration,
            openDrawer = openDrawer,
            appendCut = true,
        )''',
              '''        val copies = DocumentPrintSettingsPolicyV136.normalizeCopies(data.documentCopies)
        return (0 until copies).fold(ByteArray(0)) { payload, copyIndex ->
            payload + PrinterCommandEncoder.encodeText(
                text = ReceiptRenderer.render(data, PrinterPaperSettingPolicy.paper(configuration)),
                configuration = configuration,
                openDrawer = openDrawer && copyIndex == 0,
                appendCut = true,
            )
        }''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/Receipt.kt',
              '''class PrintQueueProcessor(
    private val database: RegisterDatabase,
    private val gateway: PrinterGateway,
) {''',
              '''class PrintQueueProcessor(
    private val database: RegisterDatabase,
    private val gateway: PrinterGateway,
    private val saleReceiptSetting: DocumentPrintSettingV136 = DocumentPrintSettingV136(),
) {''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/Receipt.kt',
              '''        val configuredSnapshot = (PrinterConfigurationRegistry.current() ?: PrinterConfiguration()).copy(
            paperWidthMm = job.paperWidthMm,
        )
        val result = gateway.send(EscPosEncoder.encode(receipt, configuredSnapshot))''',
              '''        val configuredSnapshot = (PrinterConfigurationRegistry.current() ?: PrinterConfiguration()).copy(
            paperWidthMm = job.paperWidthMm,
        )
        val configuredReceipt = DocumentPrintSettingsPolicyV136.applyToReceipt(receipt, saleReceiptSetting)
        val result = gateway.send(EscPosEncoder.encode(configuredReceipt, configuredSnapshot))''',
          )

          # Automatic worker uses the RCP-016 sale receipt copy/header/footer setting.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AutomaticPrintWorker.kt',
              '''        val database = RegisterDatabase(applicationContext)
        val operations = AdvancedOperationsStore(applicationContext)
        try {''',
              '''        val database = RegisterDatabase(applicationContext)
        val operations = AdvancedOperationsStore(applicationContext)
        val saleReceiptSetting = DocumentPrintSettingsStoreV136(applicationContext)
            .load(DocumentPrintKindV136.SALE_RECEIPT)
        try {''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AutomaticPrintWorker.kt',
              '''                            AutomaticPrintCandidateSource.SALE_RECEIPT ->
                                PrintQueueProcessor(database, gateway).processNext()''',
              '''                            AutomaticPrintCandidateSource.SALE_RECEIPT ->
                                PrintQueueProcessor(database, gateway, saleReceiptSetting).processNext()''',
          )

          # Unified preview/manual send uses the same sale receipt setting as automatic printing.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueue.kt',
              '''    private val monitoringStore = PrinterMonitoringStore(applicationContext)

    override fun close() {''',
              '''    private val monitoringStore = PrinterMonitoringStore(applicationContext)
    private val documentPrintSettingsStore = DocumentPrintSettingsStoreV136(applicationContext)

    override fun close() {''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueue.kt',
              '''                ReceiptRenderer.render(receipt, ReceiptPaper.fromWidth(job.paperWidthMm))''',
              '''                ReceiptRenderer.render(
                    DocumentPrintSettingsPolicyV136.applyToReceipt(
                        receipt,
                        documentPrintSettingsStore.load(DocumentPrintKindV136.SALE_RECEIPT),
                    ),
                    ReceiptPaper.fromWidth(job.paperWidthMm),
                )''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueue.kt',
              '''        val payload = EscPosEncoder.encode(
            data = receipt,
            configuration = configuration.copy(paperWidthMm = claimed.paperWidthMm),
        )''',
              '''        val payload = EscPosEncoder.encode(
            data = DocumentPrintSettingsPolicyV136.applyToReceipt(
                receipt,
                documentPrintSettingsStore.load(DocumentPrintKindV136.SALE_RECEIPT),
            ),
            configuration = configuration.copy(paperWidthMm = claimed.paperWidthMm),
        )''',
          )

          # Focused regression/source-contract test.
          Path('app/src/test/java/jp/co/tenposinfo/register/V136DocumentPrintSettingsTest.kt').write_text(r'''package jp.co.tenposinfo.register

import java.io.File
import kotlin.test.Test
import kotlin.test.assertEquals
import kotlin.test.assertFalse
import kotlin.test.assertTrue

class V136DocumentPrintSettingsTest {
    @Test
    fun copiesAreClampedToFormalInitialRange() {
        assertEquals(1, DocumentPrintSettingsPolicyV136.normalizeCopies(0))
        assertEquals(1, DocumentPrintSettingsPolicyV136.normalizeCopies(1))
        assertEquals(3, DocumentPrintSettingsPolicyV136.normalizeCopies(3))
        assertEquals(3, DocumentPrintSettingsPolicyV136.normalizeCopies(9))
    }

    @Test
    fun backwardsCompatibleDefaultsPreserveExistingAutomaticFlows() {
        assertTrue(DocumentPrintKindV136.SALE_RECEIPT.defaultAutoPrint)
        assertTrue(DocumentPrintKindV136.INSPECTION.defaultAutoPrint)
        assertTrue(DocumentPrintKindV136.SETTLEMENT.defaultAutoPrint)
        assertFalse(DocumentPrintKindV136.RECEIPT_VOUCHER.defaultAutoPrint)
        assertFalse(DocumentPrintKindV136.PROVISIONAL_RECEIPT.defaultAutoPrint)
    }

    @Test
    fun documentHeaderAndFooterDecoratePayloadWithoutChangingBlankDefaults() {
        val plain = DocumentPrintSettingV136()
        assertEquals("BODY", DocumentPrintSettingsPolicyV136.decorateText("BODY", plain))
        val decorated = plain.copy(header = "HEADER", footer = "FOOTER")
        assertEquals("HEADER\nBODY\nFOOTER", DocumentPrintSettingsPolicyV136.decorateText("BODY", decorated))
    }

    @Test
    fun saleReceiptSettingsDoNotCreateExtraLogicalQueueJobs() {
        val source = File("src/main/java/jp/co/tenposinfo/register/Receipt.kt").readText()
        assertTrue(source.contains("documentCopies: Int = 1"))
        assertTrue(source.contains("openDrawer = openDrawer && copyIndex == 0"))
        assertTrue(source.contains("applyToReceipt(receipt, saleReceiptSetting)"))
    }

    @Test
    fun settlementAutoPrintIsIndependentlyGated() {
        val source = File("src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt").readText()
        assertTrue(source.contains("DocumentPrintKindV136.INSPECTION"))
        assertTrue(source.contains("DocumentPrintKindV136.SETTLEMENT"))
        assertTrue(source.contains("if (documentPrintSetting.autoPrintEnabled)"))
        assertTrue(source.contains("repeat(copies)"))
    }

    @Test
    fun adminScreenExposesFormalDocumentSpecificSettings() {
        val source = File("src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt").readText()
        assertTrue(source.contains("DocumentPrintSettingsPanelV136(receiptAutoPrintEnabled = receiptAutoPrint)"))
    }
}
''')

          Path('docs/V1.36_PRN_002_RCP_016_DOCUMENT_PRINT_SETTINGS.md').write_text('''# v1.36 Issue #137 #20 / 正式仕様 RCP-016 文書別設定\n\nIssue #137 の旧 `PRN-002 通常/お客様控え/保存等の印刷モード` は、正式仕様 v2.5 の PRN-002（プリンター試験）とは番号・意味が一致しない。v1.36では正式仕様 RCP-016「文書別設定」を実装基準とする。\n\n## 対象\n\n- レシート\n- 領収書\n- 仮締め票\n- 点検票\n- 精算票\n\n各文書に `自動印刷 / 部数 / ヘッダ / フッタ` を持たせる。部数は初版制約 1〜3。レシートの自動印刷は #19/RCP-002 で導入済みの `receiptAutoPrintEnabled` を正とし、競合する二重設定を作らない。\n\n## 互換性\n\n既存で自動生成されていたレシート・X点検・Z精算は初期値ON、既存で手動発行されていた領収書・仮締め票は初期値OFFとする。領収書・仮締め票の手動印字そのものは自動印刷OFFでも禁止しない。返品・取消レシートはRCP-016対象外のため従来動作を維持する。\n\n業務帳票の複数部は同一参照の印刷ジョブを部数分登録する。売上レシートは再発行判定・print_count・ドロア連動を壊さないため、1論理ジョブ内で1〜3部を連続エンコードし、ドロアキックは1部目だけに付加する。\n\n## 未確認\n\n58mm/80mm実プリンターでの複数部カット位置、ヘッダ/フッタ印字位置、X/Z自動印刷ON/OFF、紙切れ復旧は実機未確認。最終統合受入で確認する。\n''')
          PY

          git diff --check
          git rm .github/workflows/tmp-v136-rcp016-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java docs .github/workflows/tmp-v136-rcp016-patch.yml
          git commit -m 'feat: add RCP-016 document print settings'
          git push origin HEAD:develop/v1.36
