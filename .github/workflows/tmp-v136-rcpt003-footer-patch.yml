name: tmp-v136-rcpt003-footer-patch

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/tmp-v136-rcpt003-footer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Patch receipt footer rendering
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/jp/co/tenposinfo/register/Receipt.kt")
          text = path.read_text(encoding="utf-8")

          old_default = '    val documentFooter: String = "",\n'
          new_default = '    val documentFooter: String = ReceiptFooterMessagePolicyV136.DEFAULT_MESSAGE,\n'
          if text.count(old_default) != 1:
              raise SystemExit(f"unexpected documentFooter default occurrences: {text.count(old_default)}")
          text = text.replace(old_default, new_default, 1)

          old_footer = '''        lines += center("ありがとうございました", width)\n        data.documentFooter.lineSequence().map { it.trim() }.filter { it.isNotBlank() }.forEach { lines += fit(it, width) }\n'''
          new_footer = '''        lines.addAll(ReceiptFooterMessagePolicyV136.renderLines(data.documentFooter, paper))\n'''
          if text.count(old_footer) != 1:
              raise SystemExit(f"unexpected footer renderer occurrences: {text.count(old_footer)}")
          text = text.replace(old_footer, new_footer, 1)

          old_processor = '    private val saleReceiptSetting: DocumentPrintSettingV136 = DocumentPrintSettingV136(),\n'
          new_processor = '    private val saleReceiptSetting: DocumentPrintSettingV136 = DocumentPrintSettingV136(footer = ReceiptFooterMessagePolicyV136.DEFAULT_MESSAGE),\n'
          if text.count(old_processor) != 1:
              raise SystemExit(f"unexpected saleReceiptSetting default occurrences: {text.count(old_processor)}")
          text = text.replace(old_processor, new_processor, 1)

          path.write_text(text, encoding="utf-8")
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/tmp-v136-rcpt003-footer-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/Receipt.kt .github/workflows/tmp-v136-rcpt003-footer-patch.yml
          git commit -m "feat(v1.36): render configurable receipt footer messages"
          git push origin HEAD:develop/v1.36
