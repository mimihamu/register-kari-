name: Fix v0.24 source typo

on:
  pull_request:
    branches:
      - develop/v0.23
    paths:
      - .github/workflows/inspect-v024.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'develop/v0.24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.24
          fetch-depth: 0

      - name: Correct reversal button label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsActivity.kt')
          text = path.read_text()
          old = '''                ) {
                    Text(
                        if (type == SettlementReportType.Z_SETTLEMENT) "Z精算して営業終了" else "X点検を確定",
                        fontWeight = FontWeight.Bold,
                    )
                }
                if (message != null) Text(message, color = messageColor(message), fontSize = 13.sp)
'''
          new = '''                ) {
                    Text("${type.displayName}を確定", fontWeight = FontWeight.Bold)
                }
                if (message != null) Text(message, color = messageColor(message), fontSize = 13.sp)
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one reversal label block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check

      - name: Commit and push correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsActivity.kt
          git commit -m 'fix: restore reversal confirmation label'
          git push origin HEAD:develop/v0.24
