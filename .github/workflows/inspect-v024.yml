name: Apply v0.24 implementation

on:
  pull_request:
    branches:
      - develop/v0.23
    paths:
      - .github/workflows/inspect-v024.yml

permissions:
  contents: write

concurrency:
  group: apply-v024-develop-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'develop/v0.24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.24
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v024.patch.gz.b64.00 tools/v024.patch.gz.b64.01 tools/v024.patch.gz.b64.02 \
            | tr -d '\r\n ' \
            | base64 --decode > /tmp/v024.patch.gz
          echo '74b5f0d2a1acc18ed5048c6c681966f5c47a8e63f1bdf95756dfaafe86f8e322  /tmp/v024.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/v024.patch.gz > /tmp/v024.patch
          echo '441d37e5268927b153cc1caaf90eee88dcadee0fe67c205b11f6bb3271c67f9e  /tmp/v024.patch' | sha256sum --check
          git apply --check /tmp/v024.patch

      - name: Apply implementation and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v024.patch
          rm -f \
            .github/workflows/inspect-v024.yml \
            .github/workflows/v024-apply.yml \
            tools/v024.patch \
            tools/v024.patch.b64.00 \
            tools/v024.patch.gz.b64.00 \
            tools/v024.patch.gz.b64.01 \
            tools/v024.patch.gz.b64.02
          rmdir tools 2>/dev/null || true
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: close business session with Z settlement'
          git push origin HEAD:develop/v0.24
