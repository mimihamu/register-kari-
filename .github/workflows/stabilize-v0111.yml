name: Stabilize つぐレジ v0.11.1

on:
  push:
    branches:
      - develop/v0.11.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stabilize-v0111-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stabilize-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Integrate stabilization sources
        run: python3 tools/stabilize_v0111.py

      - name: Verify legacy source generation is removed
        run: |
          test ! -e tools/generate_v010.py
          test ! -d tools/v08
          ! grep -R "generateV010Sources\|generated/source/v010\|commandLine(.*python3" -n app/build.gradle.kts

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK and SHA-256
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.11.1_debug.apk
          sha256sum artifacts/TSUGUREGI_v0.11.1_debug.apk | tee artifacts/TSUGUREGI_v0.11.1_debug.apk.sha256

      - name: Commit integrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No stabilization changes to commit"
          else
            git commit -m "v0.11.1: integrate stabilization fixes"
            git push origin HEAD:develop/v0.11.1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.11.1-debug-apk
          path: |
            artifacts/TSUGUREGI_v0.11.1_debug.apk
            artifacts/TSUGUREGI_v0.11.1_debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
