              ("grep -q 'versionCode = 38' app/build.gradle.kts", "grep -q 'versionCode = 39' app/build.gradle.kts"),
              ("grep -q 'versionName = \"0.13.0-dev.1\"' app/build.gradle.kts", "grep -q 'versionName = \"0.13.0-dev.2\"' app/build.gradle.kts"),
              ("grep -q 'versionCode = 2' customer-display/build.gradle.kts", "grep -q 'versionCode = 3' customer-display/build.gradle.kts"),
              ("grep -q 'versionName = \"0.13.0-dev.2\"' customer-display/build.gradle.kts", "grep -q 'versionName = \"0.13.0-dev.3\"' customer-display/build.gradle.kts"),
              ('TSUGUREGI_v0.13.0_dev1_debug.apk', 'TSUGUREGI_v0.13.0_dev2_debug.apk'),
              ('TSUGUREGI_CD_v0.13.0_dev2_smartphone_debug.apk', 'TSUGUREGI_CD_v0.13.0_dev3_latest_item_debug.apk'),
              ('REGISTER_VERSION_NAME=0.13.0-dev.1', 'REGISTER_VERSION_NAME=0.13.0-dev.2'),
              ('REGISTER_VERSION_CODE=38', 'REGISTER_VERSION_CODE=39'),
              ('CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.2', 'CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.3'),
              ('CUSTOMER_DISPLAY_VERSION_CODE=2', 'CUSTOMER_DISPLAY_VERSION_CODE=3'),
              ('TSUGUREGI-v0.13.0-cd-dev2-smartphone-debug-apks', 'TSUGUREGI-v0.13.0-dev3-ui-cd-debug-apks'),
          ]
          for old, new in pairs:
