              text = text.replace(old, new)
          verify_anchor = "          grep -q 'android:resizeableActivity=\"true\"' customer-display/src/main/AndroidManifest.xml\n"
          if verify_anchor in text and 'CustomerDisplayScrollPolicy' not in text:
              text = text.replace(verify_anchor, verify_anchor + '''          test "$(grep -R -l 'AdminOverlayProvider' app/src/main/AndroidManifest.xml app/src/main/java 2>/dev/null | wc -l)" -eq 0
          grep -q 'CustomerDisplayScrollPolicy' customer-display/src/main/java/jp/co/tenposinfo/register/cd/MainActivity.kt
          grep -q 'CustomerDisplaySnapshotFactory.accounting' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
''')
          wf.write_text(text, encoding='utf-8')

          diagnostics = Path('docs/V013_DEV3_APPLY_DIAGNOSTIC.txt')
          diagnostics.write_text(
              datetime.now(timezone.utc).isoformat() + '\n' + '\n'.join(log) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit source changes and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app customer-display .github/workflows/build-apk.yml docs/V013_DEV3_APPLY_DIAGNOSTIC.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(v0.13): fix register UI and keep latest CD item visible [v013-dev3-applied]"
          git push origin HEAD:develop/v0.13
