name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify v0.24 business session sources
        run: |
          grep -q 'versionCode = 54' app/build.gradle.kts
          grep -q 'versionName = "0.24.0-dev.1"' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime:2.11.2' app/build.gradle.kts
          grep -q 'versionCode = 6' customer-display/build.gradle.kts
          grep -q 'versionName = "0.13.0-dev.6"' customer-display/build.gradle.kts

          test -s app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V023AutoBackupRetentionTest.kt
          test -s docs/V0.23_AUTOMATIC_BACKUP_RETENTION.md
          grep -q 'ExistingWorkPolicy.KEEP' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'tsuguregi-auto-backup-z-' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DEFAULT_Z_BACKUP_BUSINESS_DAYS = 14' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DEFAULT_MONTHLY_BACKUP_MONTHS = 12' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DATA_BACKUP_AUTO_REQUESTED' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DATA_BACKUP_AUTO_CREATED' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DATA_BACKUP_AUTO_FAILED' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DATA_BACKUP_RETENTION_STARTED' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DATA_BACKUP_RETENTION_DELETED' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DATA_BACKUP_RETENTION_FAILED' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DATA_BACKUP_SKIPPED_LOW_STORAGE' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'DATA_BACKUP_SKIPPED_DUPLICATE' app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          grep -q 'AutoBackupScheduler.enqueueZSettlement' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          grep -q 'settlementCommitted = true' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          grep -q '自動バックアップを今すぐ実行' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q '外部保存:' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q '削除候補' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt

          test -s app/src/main/java/jp/co/tenposinfo/register/BusinessSessionV024.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V024BusinessSessionLifecycleTest.kt
          test -s docs/V0.24_Z_SETTLEMENT_SESSION_CLOSE.md
          grep -q 'BusinessSessionMultiplicityMigration.ensure' app/src/main/java/jp/co/tenposinfo/register/StabilizationFoundation.kt
          grep -q 'Z_SETTLEMENT:SESSION:' app/src/main/java/jp/co/tenposinfo/register/OperationExecutionSafety.kt
          grep -q 'BusinessSessionStatus.CLOSED' app/src/main/java/jp/co/tenposinfo/register/BusinessSessionV024.kt
          grep -q 'put("closed_at", now)' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'Z精算して営業終了' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q '同じ営業日でも' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          ! grep -q 'business_date TEXT NOT NULL UNIQUE' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          ! grep -q 'business_date TEXT NOT NULL UNIQUE' app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt
          ! grep -q 'secureStore.endBusinessDay' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt

          test -s app/src/test/java/jp/co/tenposinfo/register/V022BackupPortabilityTest.kt
          test -s docs/V0.22_BACKUP_PORTABILITY.md
          grep -q 'ActivityResultContracts.CreateDocument' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'ActivityResultContracts.OpenDocument' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'Google Drive・USB・端末フォルダ' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'fun exportBackup' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'fun importBackup' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'copyWithLimit' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'MAX_BACKUP_ARCHIVE_BYTES' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'DATA_BACKUP_EXPORTED' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'DATA_BACKUP_IMPORTED' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'TSUGUREGI_import_' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          ! grep -q 'MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          ! grep -q 'WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          ! grep -q 'READ_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml

          test -s app/src/test/java/jp/co/tenposinfo/register/V021DataProtectionPolicyTest.kt
          test -s docs/V0.21_DATA_PROTECTION.md
          grep -q 'android:name=".DataRestoreBootstrapProvider"' app/src/main/AndroidManifest.xml
          grep -q 'android:initOrder="10"' app/src/main/AndroidManifest.xml
          grep -q 'PRAGMA integrity_check' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'PRAGMA foreign_key_check' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'VACUUM INTO' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'DATA_RESTORE_APPLIED' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q '元DBへロールバック' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
          grep -q 'managerNameForPin' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt

          operations_count=$(grep -c 'android:name=".OperationsActivity"' app/src/main/AndroidManifest.xml)
          test "$operations_count" -eq 1
          ! grep -q '<activity-alias' app/src/main/AndroidManifest.xml
          ! grep -q 'AdvancedOperationsActivity' app/src/main/AndroidManifest.xml
          test ! -e app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsActivity.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V020OperationsRoutingTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V019PartialReturnPolicyTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V018BusinessSessionIntegrationTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V017OperationExecutionSafetyTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V016OperationsAuthorizationTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V015TaxInvoicePolicyTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V014HeldTicketSafetyTest.kt

          ! grep -q '初期責任者PIN：0000' app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt
          ! grep -q 'テストPIN' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          ! grep -q 'pin != "0000"' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          test ! -e .github/workflows/v023-apply.yml
          test ! -e tools/apply_v023.py
          test ! -e .github/workflows/inspect-v024.yml
          test ! -e .github/workflows/v024-apply.yml
          test ! -e tools/v024.patch
          test ! -e tools/v024.patch.b64.00
          test ! -e tools/v024.patch.gz.b64.00
          test ! -e tools/v024.patch.gz.b64.01
          test ! -e tools/v024.patch.gz.b64.02

      - name: Verify launcher configuration
        run: |
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$(grep -c 'android.intent.category.LAUNCHER' app/src/debug/AndroidManifest.xml || true)" -eq 0
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' customer-display/src/main/AndroidManifest.xml

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Prepare named APKs and SHA-256
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.24.0_dev1_session_z_close_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
          sha256sum artifacts/TSUGUREGI_v0.24.0_dev1_session_z_close_debug.apk | tee artifacts/TSUGUREGI_v0.24.0_dev1_session_z_close_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.24.0_dev1_session_z_close_debug.apk | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee -a artifacts/build-summary.txt
          echo "REGISTER_VERSION_NAME=0.24.0-dev.1" >> artifacts/build-summary.txt
          echo "REGISTER_VERSION_CODE=54" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.6" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_VERSION_CODE=6" >> artifacts/build-summary.txt
          echo "AUTO_BACKUP_TRIGGER=committed-z-settlement" >> artifacts/build-summary.txt
          echo "AUTO_BACKUP_WORK=unique-idempotent-workmanager" >> artifacts/build-summary.txt
          echo "AUTO_BACKUP_STORAGE=internal-only" >> artifacts/build-summary.txt
          echo "AUTO_BACKUP_METADATA=compatibility-preserving-sidecar" >> artifacts/build-summary.txt
          echo "AUTO_BACKUP_Z_RETENTION=14-business-days" >> artifacts/build-summary.txt
          echo "AUTO_BACKUP_MONTHLY_RETENTION=12-months" >> artifacts/build-summary.txt
          echo "AUTO_BACKUP_MANUAL_RETENTION=never-auto-delete" >> artifacts/build-summary.txt
          echo "AUTO_BACKUP_LOW_STORAGE=safe-margin-cleanup-recheck" >> artifacts/build-summary.txt
          echo "AUTO_BACKUP_ROLLBACK=never-roll-back-z-settlement" >> artifacts/build-summary.txt
          echo "BACKUP_EXPORT=storage-access-framework" >> artifacts/build-summary.txt
          echo "BACKUP_IMPORT=streamed-verified-atomic" >> artifacts/build-summary.txt
          echo "BACKUP_EXTERNAL_TARGETS=google-drive-usb-device-folder" >> artifacts/build-summary.txt
          echo "BACKUP_IMPORT_LIMIT=600MiB" >> artifacts/build-summary.txt
          echo "BACKUP_IMPORT_NAME=manifest-time-and-db-sha256" >> artifacts/build-summary.txt
          echo "BACKUP_EXTERNAL_PERMISSIONS=none" >> artifacts/build-summary.txt
          echo "BACKUP_TRANSFER_AUDIT=export-and-import" >> artifacts/build-summary.txt
          echo "DATA_INTEGRITY=sqlite-and-business-reference-checks" >> artifacts/build-summary.txt
          echo "BACKUP_FORMAT=tgbak-db-manifest-sha256" >> artifacts/build-summary.txt
          echo "BACKUP_COMMIT=temporary-then-atomic-finalization" >> artifacts/build-summary.txt
          echo "RESTORE_MODE=verified-next-start-application" >> artifacts/build-summary.txt
          echo "RESTORE_GATES=closed-empty-no-pending-work" >> artifacts/build-summary.txt
          echo "RESTORE_ROLLBACK=original-db-preserved" >> artifacts/build-summary.txt
          echo "RESTORE_AUTH=dynamic-manager-pin" >> artifacts/build-summary.txt
          echo "OPERATIONS_ACTIVITY=canonical-direct-manifest-registration" >> artifacts/build-summary.txt
          echo "PARTIAL_RETURN=item-quantity-and-sale-time-tax-snapshot" >> artifacts/build-summary.txt
          echo "BUSINESS_DAY_AGGREGATION=business-session-id" >> artifacts/build-summary.txt
          echo "Z_SETTLEMENT=atomic-business-session-close" >> artifacts/build-summary.txt
          echo "BUSINESS_DATE_SESSIONS=multiple-per-date" >> artifacts/build-summary.txt
          echo "Z_IDEMPOTENCY=business-session-id" >> artifacts/build-summary.txt
          echo "OPERATION_IDEMPOTENCY=persistent-deterministic-key" >> artifacts/build-summary.txt
          echo "OPERATIONS_PERMISSIONS=per-action-and-write-time" >> artifacts/build-summary.txt
          echo "TAX_ROUNDING=once-per-invoice-and-rate" >> artifacts/build-summary.txt
          echo "SALE_COMMIT_IDEMPOTENCY=persistent-uuid-key" >> artifacts/build-summary.txt
          echo "PAYMENT_DRAFT=sqlite-cart-fingerprint-bound" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_TRANSIENT_OUTAGE_SUPPRESSION=3000ms" >> artifacts/build-summary.txt
          echo "REGISTER_PACKAGE=jp.co.tenposinfo.register.dev" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_PACKAGE=jp.co.tenposinfo.register.cd.dev" >> artifacts/build-summary.txt
          echo "SIGNING=development-not-production" >> artifacts/build-summary.txt
          echo "REAL_DEVICE_Z_AUTO_BACKUP_VERIFICATION=required" >> artifacts/build-summary.txt
          echo "REAL_DEVICE_SAME_DATE_REOPEN_VERIFICATION=required" >> artifacts/build-summary.txt
          echo "REAL_DEVICE_Z_ATOMIC_CLOSE_VERIFICATION=required" >> artifacts/build-summary.txt
          echo "REAL_DEVICE_LOW_STORAGE_VERIFICATION=required" >> artifacts/build-summary.txt
          echo "REAL_DEVICE_RETENTION_DELETION_VERIFICATION=required" >> artifacts/build-summary.txt
          echo "REAL_DEVICE_SAF_EXPORT_IMPORT_VERIFICATION=required" >> artifacts/build-summary.txt
          echo "REAL_DEVICE_GOOGLE_DRIVE_PROVIDER_VERIFICATION=required" >> artifacts/build-summary.txt
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.24.0-dev1-session-z-close-apks
          path: |
            artifacts/TSUGUREGI_v0.24.0_dev1_session_z_close_debug.apk
            artifacts/TSUGUREGI_v0.24.0_dev1_session_z_close_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
