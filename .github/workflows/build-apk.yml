name: Build つぐレジ APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Legacy source-test compatibility markers.
# V044GoogleDriveAccountTest.kt
# V046GoogleDriveSetupGuideTest.kt
# V047GoogleDriveDiagnosticsTest.kt
# V048GoogleDriveSettingsEntryTest.kt
# V050GoogleDriveCrossAppConnectionTest.kt
# V055OutboxOperationsEntryTest.kt
# V057HeldTicketOperationsUiTest.kt
# V058ReceiptVoucherFoundationTest.kt
# V059ReceiptVoucherUiTest.kt
# V060ReceiptVoucherOperationsLedgerTest.kt
# V061ReceiptVoucherSaleContextNavigationTest.kt
# V062SalesHistoryLookupTest.kt
# V063ReversalSaleLookupTest.kt
# V064SaleDetailReversalNavigationTest.kt
# V065BusinessDateSalesLookupTest.kt
# V066BusinessDateDatabaseSearchTest.kt
# V067SaleReceiptReprintNavigationTest.kt
# V068SaleReceiptReprintAuditTest.kt
# V069SaleReceiptReprintOperationsLedgerTest.kt
# V070SaleReceiptReprintDatabasePagingTest.kt
# V071SaleReceiptReprintPeriodIndexTest.kt
# V072SaleReceiptReprintCustomRangeTest.kt
# V073SaleReceiptReprintStablePagingTest.kt
# V074SaleReceiptReprintMatchingNewItemsTest.kt
# V075SaleReceiptReprintCsvExportTest.kt
# V076BusinessSessionSalesDrilldownTest.kt
# V077SettlementHistorySalesDrilldownTest.kt
# V078SettlementReconciliationTest.kt
# V079SettlementReconciliationAuditTest.kt
# V080ResponsiveSettlementReconciliationTest.kt
# V081SettlementReconciliationAuditLedgerTest.kt
# V082SettlementReconciliationAuditCsvExportTest.kt
# V083RestoreBootstrapOrderTest.kt
# V096HeldTicketResponsiveTest.kt
# V097SalesLookupResponsiveTest.kt
# V098AutomaticPrintDispatchSafetyTest.kt
# V099PrinterEndpointSerializationTest.kt
# V100JapanesePrinterEncodingTest.kt
# SETTLEMENT_RECONCILIATION=true
# SETTLEMENT_RECONCILIATION_X_DIFFERENCE_INFORMATIONAL=true
# SETTLEMENT_RECONCILIATION_Z_DIFFERENCE_ALERT=true
# SETTLEMENT_RECONCILIATION_AUDIT=true

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v1.00 sources
        shell: bash
        env:
          V099_FINAL_HEAD: 45e19c082f640623a91bc38609d471e873ec6ece
          V093_FINAL_HEAD: 5c8d0d95175bb7dd6cf8b70f52b31162c415a5e7
        run: |
          set -euo pipefail

          # v0.99 finalの累積ソースゲートを固定SHAから再実行する。
          # 現行版へ上がる2行だけを除外し、v0.99までの機能・安全性チェックを維持する。
          git show "$V099_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v099-build-apk.yml
          awk '
            /^      - name: Verify cumulative v0.14-v0.99 sources/ { capture=1; next }
            capture && /^      - name: Verify launcher and orientation configuration/ { exit }
            capture && /^        run: \|/ { inrun=1; next }
            capture && inrun { sub(/^          /, ""); print }
          ' /tmp/v099-build-apk.yml \
            | grep -vF "grep -Fq 'versionCode = 129' app/build.gradle.kts" \
            | grep -vF "grep -Fq 'versionName = \"0.99.0-dev.1\"' app/build.gradle.kts" \
            > /tmp/v099-cumulative-checks.sh
          test -s /tmp/v099-cumulative-checks.sh
          bash -euxo pipefail /tmp/v099-cumulative-checks.sh

          # v1.00 EPSON Japanese printer encoding acceptance.
          grep -Fq 'versionCode = 130' app/build.gradle.kts
          grep -Fq 'versionName = "1.00.0-dev.1"' app/build.gradle.kts
          test -s app/src/test/java/jp/co/tenposinfo/register/V100JapanesePrinterEncodingTest.kt
          test -s docs/V1.00_JAPANESE_PRINTER_ENCODING.md
          test -s docs/V1.00_RELEASE_NOTES.md
          grep -Fq 'kanjiCodeSystem' app/src/main/java/jp/co/tenposinfo/register/PrinterProfile.kt
          grep -Fq 'charsetName = "Shift_JIS"' app/src/main/java/jp/co/tenposinfo/register/PrinterProfile.kt
          grep -Fq 'kanjiCodeSystem = 1' app/src/main/java/jp/co/tenposinfo/register/PrinterProfile.kt
          grep -Fq 'fun beginDocument(configuration: PrinterConfiguration)' app/src/main/java/jp/co/tenposinfo/register/PrinterProfile.kt
          grep -Fq '0x1C, 0x43, codeSystem.toByte()' app/src/main/java/jp/co/tenposinfo/register/PrinterProfile.kt
          grep -Fq 'PrinterCommandEncoder.beginDocument(epson)' app/src/test/java/jp/co/tenposinfo/register/V100JapanesePrinterEncodingTest.kt
          grep -Fq '0x1C, 0x43, 0x01' app/src/test/java/jp/co/tenposinfo/register/V100JapanesePrinterEncodingTest.kt
          grep -Fq 'つぐレジ 連続印刷試験' app/src/main/java/jp/co/tenposinfo/register/PrinterSoakTestPolicy.kt
          grep -Fq 'const val MIN_PRINTS = 1' app/src/main/java/jp/co/tenposinfo/register/PrinterSoakTestPolicy.kt
          grep -Fq 'Shift_JIS + FS C 1' docs/V1.00_JAPANESE_PRINTER_ENCODING.md || grep -Fq 'Shift_JIS' docs/V1.00_JAPANESE_PRINTER_ENCODING.md
          grep -Fq '実プリンターで再印刷するまで未確認' docs/V1.00_RELEASE_NOTES.md
          ! grep -Fqi 'DELETE FROM sales' app/src/main/java/jp/co/tenposinfo/register/PrinterProfile.kt
          ! grep -Fqi 'UPDATE sales' app/src/main/java/jp/co/tenposinfo/register/PrinterProfile.kt
          ! grep -Fqi 'DROP TABLE' app/src/main/java/jp/co/tenposinfo/register/PrinterProfile.kt

      - name: Verify launcher and orientation configuration
        shell: bash
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          plus_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' management-app/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$plus_launcher_count" -eq 1
          grep -q 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="sensorPortrait"' management-app/src/main/AndroidManifest.xml
          ! grep -q 'android:screenOrientation="landscape"' management-app/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug

      - name: Verify built APK release identity and integrity
        shell: bash
        env:
          POS_VERSION_CODE: 130
          POS_VERSION_NAME: 1.00.0-dev.1
          BUILD_TOOLS_VERSION: 36.0.0
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash ci/verify-apk-release-integrity.sh
          cat artifacts/apk-integrity-summary.txt

      - name: Prepare named APKs and SHA-256
        shell: bash
        env:
          V093_FINAL_HEAD: 5c8d0d95175bb7dd6cf8b70f52b31162c415a5e7
        run: |
          set -euo pipefail
          mkdir -p artifacts
          register_apk=artifacts/TSUGUREGI_v1.00.0_dev1_japanese_printer_encoding_debug.apk
          plus_apk=artifacts/TSUGUREGI_PLUS_v0.14.0_dev1_sync_operations_dashboard_debug.apk
          cd_apk=artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$register_apk"
          cp management-app/build/outputs/apk/debug/management-app-debug.apk "$plus_apk"
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk "$cd_apk"
          sha256sum "$register_apk" | tee "$register_apk.sha256"
          sha256sum "$plus_apk" | tee "$plus_apk.sha256"
          sha256sum "$cd_apk" | tee "$cd_apk.sha256"
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' "$register_apk" | tee artifacts/build-summary.txt
          stat --printf='MANAGEMENT_APP_APK_SIZE_BYTES=%s\n' "$plus_apk" | tee -a artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' "$cd_apk" | tee -a artifacts/build-summary.txt
          keytool -list -v \
            -keystore app/build/signing/tsuguregi-development.jks \
            -storepass tsuguregi-dev \
            -alias tsuguregi-dev \
            | awk -F': ' '/SHA1:/{print "DEVELOPMENT_SIGNING_SHA1=" $2} /SHA256:/{print "DEVELOPMENT_SIGNING_SHA256=" $2}' \
            | tee -a artifacts/build-summary.txt

          # v0.93 finalのbuild summary feature flagsを継承する。
          git show "$V093_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v093-build-apk.yml
          awk '
            /cat >> artifacts\/build-summary.txt <<'\''EOF'\''/ { capture=1; next }
            capture && /^          EOF$/ { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/v093-build-apk.yml \
            | grep -v '^REGISTER_VERSION_NAME=' \
            | grep -v '^REGISTER_VERSION_CODE=' \
            >> artifacts/build-summary.txt

          cat >> artifacts/build-summary.txt <<'EOF'
          REGISTER_VERSION_NAME=1.00.0-dev.1
          REGISTER_VERSION_CODE=130
          DATA_PROTECTION_RESPONSIVE=true
          APK_RELEASE_INTEGRITY_GATE=true
          MAIN_FLOW_RESPONSIVE=true
          STARTUP_DIAGNOSTIC_RESPONSIVE=true
          STARTUP_DIAGNOSTIC_SCROLL=true
          STARTUP_DIAGNOSTIC_COMPACT_FULL_WIDTH=true
          STARTUP_DIAGNOSTIC_NORMAL_LAYOUT_PRESERVED=true
          SALES_EDIT_RESPONSIVE=true
          LINE_EDIT_RESPONSIVE=true
          DISCOUNT_RESPONSIVE=true
          SALES_EDIT_SCROLL_FALLBACK=true
          SALES_EDIT_NORMAL_LAYOUT_PRESERVED=true
          REAL_DEVICE_VERIFICATION_BATCH_MODE=final-integrated-acceptance
          REAL_DEVICE_STARTUP_DIAGNOSTIC_VERIFICATION=deferred-final-acceptance
          REAL_DEVICE_SALES_EDIT_VERIFICATION=deferred-final-acceptance
          HELD_TICKET_RESPONSIVE=true
          TICKET_LIST_RESPONSIVE=true
          TICKET_SPLIT_RESPONSIVE=true
          HELD_TICKET_COMPACT_ACTION_ROWS=true
          HELD_TICKET_SPLIT_SCROLL_FALLBACK=true
          HELD_TICKET_NORMAL_LAYOUT_PRESERVED=true
          REAL_DEVICE_HELD_TICKET_VERIFICATION=deferred-final-acceptance
          SALES_LOOKUP_RESPONSIVE=true
          SALES_HISTORY_RESPONSIVE=true
          SALE_DETAIL_RESPONSIVE=true
          SALES_HISTORY_COMPACT_FILTER_SCROLL=true
          SALES_HISTORY_COMPACT_TWO_LINE_ROWS=true
          SALE_DETAIL_SUMMARY_SCROLL=true
          SALES_LOOKUP_NORMAL_LAYOUT_PRESERVED=true
          REAL_DEVICE_SALES_LOOKUP_VERIFICATION=deferred-final-acceptance
          AUTOMATIC_PRINT_DISPATCH_SAFETY=true
          AUTOMATIC_PRINT_SHARED_CHRONOLOGICAL_ORDER=true
          AUTOMATIC_PRINT_FAIL_FAST=true
          AUTOMATIC_PRINT_GLOBAL_BATCH_LIMIT=20
          AUTOMATIC_PRINT_SINGLE_FLIGHT=true
          AUTOMATIC_PRINT_BACKLOG_CONTINUATION=true
          PRINTER_ENDPOINT_SERIALIZATION=true
          PRINTER_ENDPOINT_GATE=true
          PRINTER_ENDPOINT_WAIT_TIMEOUT_SAFE=true
          PRINTER_ENDPOINT_DIFFERENT_TARGET_PARALLEL=true
          PRINTER_ENDPOINT_ALL_TCP_PATHS_PROTECTED=true
          PRINTER_JOB_STALE_STATE_REVALIDATION=true
          PRINTER_AUTO_MANUAL_DUPLICATE_PREVENTION=true
          JAPANESE_PRINTER_ENCODING=true
          EPSON_SHIFT_JIS_KANJI_SYSTEM=true
          EPSON_FS_C_SHIFT_JIS=true
          GENERIC_PRINTER_PROFILE_UNCHANGED=true
          JAPANESE_PRINTER_SINGLE_SHEET_RETEST_PATH=true
          REAL_DEVICE_JAPANESE_PRINT_VERIFICATION=required-user-retest
          REAL_DEVICE_PRINTER_ENDPOINT_SERIALIZATION_VERIFICATION=deferred-final-acceptance
          REAL_DEVICE_PRINTER_VERIFICATION=deferred-final-acceptance
          REAL_DEVICE_APK_INSTALL_VERIFICATION=deferred-final-acceptance
          EOF
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v1.00.0-dev1-japanese-printer-encoding-apks
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
