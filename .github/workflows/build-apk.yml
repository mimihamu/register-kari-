name: Build つぐレジ APK

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: v066-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-v066:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.66 head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.66
          fetch-depth: 0
      - name: Apply cumulative version references and restore full CI
        run: python tools/v066_finalize.py
      - name: Commit generated references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test management-app/src/test .github/workflows/build-apk.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "v0.66 finalize cumulative version references"
          git push origin HEAD:develop/v0.66
