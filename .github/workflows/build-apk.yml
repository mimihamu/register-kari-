name: Finalize v0.73 CI guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Fix obsolete v0.70 UI guard
        shell: bash
        run: python3 scripts/fix_v073_ci_guard.py
