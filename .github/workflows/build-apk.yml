name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify v0.13 customer display dev.2 metadata
        run: |
          grep -q 'versionCode = 38' app/build.gradle.kts
          grep -q 'versionName = "0.13.0-dev.1"' app/build.gradle.kts
          grep -q 'versionCode = 2' customer-display/build.gradle.kts
          grep -q 'versionName = "0.13.0-dev.2"' customer-display/build.gradle.kts
          grep -q 'applicationId = "jp.co.tenposinfo.register.cd"' customer-display/build.gradle.kts
          ! grep -q 'android:screenOrientation="landscape"' customer-display/src/main/AndroidManifest.xml
          grep -q 'android:resizeableActivity="true"' customer-display/src/main/AndroidManifest.xml

      - name: Verify launcher configuration
        run: |
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$(grep -c 'android.intent.category.LAUNCHER' app/src/debug/AndroidManifest.xml || true)" -eq 0
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' customer-display/src/main/AndroidManifest.xml

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Prepare named APKs and SHA-256
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.13.0_dev1_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.13.0_dev2_smartphone_debug.apk
          sha256sum artifacts/TSUGUREGI_v0.13.0_dev1_debug.apk | tee artifacts/TSUGUREGI_v0.13.0_dev1_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_CD_v0.13.0_dev2_smartphone_debug.apk | tee artifacts/TSUGUREGI_CD_v0.13.0_dev2_smartphone_debug.apk.sha256
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.13.0_dev1_debug.apk | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_CD_v0.13.0_dev2_smartphone_debug.apk | tee -a artifacts/build-summary.txt
          echo "REGISTER_VERSION_NAME=0.13.0-dev.1" >> artifacts/build-summary.txt
          echo "REGISTER_VERSION_CODE=38" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.2" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_VERSION_CODE=2" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_PHONE_PORTRAIT=responsive-stacked" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_PHONE_LANDSCAPE=responsive-side-by-side" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_ORIENTATION_LOCK=removed" >> artifacts/build-summary.txt
          echo "REGISTER_PACKAGE=jp.co.tenposinfo.register.dev" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_PACKAGE=jp.co.tenposinfo.register.cd.dev" >> artifacts/build-summary.txt
          echo "REGISTER_LAUNCHER_COUNT=1" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_LAUNCHER_COUNT=1" >> artifacts/build-summary.txt
          echo "SIGNING=development-not-production" >> artifacts/build-summary.txt
          echo "REAL_CUSTOMER_DISPLAY_DEVICE_VERIFICATION=not-performed-by-ci" >> artifacts/build-summary.txt
          echo "REAL_PRINTER_VERIFICATION=not-performed-by-ci" >> artifacts/build-summary.txt
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.13.0-cd-dev2-smartphone-debug-apks
          path: |
            artifacts/TSUGUREGI_v0.13.0_dev1_debug.apk
            artifacts/TSUGUREGI_v0.13.0_dev1_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.13.0_dev2_smartphone_debug.apk
            artifacts/TSUGUREGI_CD_v0.13.0_dev2_smartphone_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
