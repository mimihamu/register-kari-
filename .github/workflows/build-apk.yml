          CUSTOMER_DISPLAY_STALE_AFTER_MS=45000
          CUSTOMER_DISPLAY_ACTIVITY_INBOUND_OR_SUCCESSFUL_OUTBOUND=true
          CUSTOMER_DISPLAY_STALE_CLOSE_WITHOUT_WRITER_LOCK=true
          DATA_PROTECTION_WAL_SAFE_FALLBACK=true
          DATA_PROTECTION_FALLBACK_CHECKPOINT_TRUNCATE=true
