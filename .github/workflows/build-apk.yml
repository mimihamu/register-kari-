        val requirements = File(root, "docs/V0.97_SALES_LOOKUP_RESPONSIVE.md").readText()
        assertFalse(requirements.contains("DELETE FROM", ignoreCase = true))
        assertFalse(requirements.contains("UPDATE sales", ignoreCase = true))
