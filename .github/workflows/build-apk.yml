name: Apply v0.27 settlement history

on:
  pull_request:
    branches:
      - develop/v0.26
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v027:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.27'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v0.27
        uses: actions/checkout@v4
        with:
          ref: develop/v0.27
          fetch-depth: 0

      - name: Narrow applicator target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_v027.py")
          lines = path.read_text().splitlines()
          replacement = "text = replace_once(text, 'data class SettlementRecord(\\n    val id: Long,\\n    val businessSessionId: Long,\\n    val businessDate: String,\\n    val type: SettlementReportType,\\n    val salesGross: Long,\\n    val reversalGross: Long,\\n    val netSales: Long,\\n    val expectedCash: Long,\\n    val actualCash: Long,\\n    val variance: Long,\\n    val transactionCount: Int,\\n    val reversalCount: Int,\\n    val pendingPrints: Int,\\n    val heldTickets: Int,\\n    val operatorName: String,\\n    val createdAt: Long,\\n)', 'data class SettlementRecord(\\n    val id: Long,\\n    val businessSessionId: Long,\\n    val businessDate: String,\\n    val type: SettlementReportType,\\n    val salesGross: Long,\\n    val reversalGross: Long,\\n    val netSales: Long,\\n    val expectedCash: Long,\\n    val actualCash: Long,\\n    val variance: Long,\\n    val transactionCount: Int,\\n    val reversalCount: Int,\\n    val pendingPrints: Int,\\n    val heldTickets: Int,\\n    val operatorName: String,\\n    val createdAt: Long,\\n    val openingCash: Long = 0L,\\n    val cashIn: Long = 0L,\\n    val cashOut: Long = 0L,\\n    val snapshotVersion: Int = 0,\\n)', 'settlement record snapshot fields')"
          found = False
          for index, line in enumerate(lines):
              if "settlement record snapshot fields" in line:
                  lines[index] = replacement
                  found = True
                  break
          if not found:
              raise RuntimeError("settlement record replacement line not found")
          path.write_text("\n".join(lines) + "\n")
          PY
          python3 -m py_compile tools/apply_v027.py

      - name: Apply v0.27 sources
        run: |
          set -euo pipefail
          if grep -q 'versionName = "0.27.0-dev.1"' app/build.gradle.kts; then
            echo "v0.27 already applied"
            exit 0
          fi
          python3 tools/apply_v027.py
          git diff --check
          grep -q 'versionCode = 57' app/build.gradle.kts
          grep -q 'versionName = "0.27.0-dev.1"' app/build.gradle.kts
          test -s app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryPolicyV027.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V027SettlementHistoryReprintTest.kt
          grep -q 'OperationsScreen.SETTLEMENT_HISTORY' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'SettlementSnapshotSchemaV027.savePaymentTotals' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'SETTLEMENT_REPRINT' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'fun reprintSettlement' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt

      - name: Commit v0.27 implementation
        run: |
          set -euo pipefail
          if git diff --quiet -- app docs; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs
          git commit -m "feat: add settlement history and reprint"
          git push origin HEAD:develop/v0.27
