name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v0.35 sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 65' app/build.gradle.kts
          grep -q 'versionName = "0.35.0-dev.1"' app/build.gradle.kts
          grep -q 'versionCode = 6' customer-display/build.gradle.kts
          grep -q 'versionName = "0.13.0-dev.6"' customer-display/build.gradle.kts

          for file in \
            app/src/main/java/jp/co/tenposinfo/register/OutboxExternalDelivery.kt \
            app/src/main/java/jp/co/tenposinfo/register/OutboxDeliverySettingsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/BusinessSyncFoundation.kt \
            app/src/main/java/jp/co/tenposinfo/register/SyncSettingsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/ExternalBackupSync.kt \
            app/src/main/java/jp/co/tenposinfo/register/ExternalBackupSettingsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt \
            app/src/main/java/jp/co/tenposinfo/register/AutoBackupSettings.kt \
            app/src/main/java/jp/co/tenposinfo/register/AutoBackupNotification.kt \
            app/src/main/java/jp/co/tenposinfo/register/AutoBackupSettingsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt \
            app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/RegisterApplication.kt \
            app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueue.kt \
            app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueueActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt \
            app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt \
            app/src/test/java/jp/co/tenposinfo/register/V035OutboxExternalDeliveryTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V034ExternalBackupMirrorTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V033PeriodicBackupSettingsTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V032PrintQueueOperationsTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V031PrinterPaperSettingTest.kt \
            docs/V0.35_OUTBOX_EXTERNAL_DELIVERY.md \
            docs/V0.35_RELEASE_NOTES.md \
            docs/V0.34_EXTERNAL_BACKUP_MIRROR.md \
            docs/V0.34_RELEASE_NOTES.md; do
            test -s "$file"
          done

          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/jp/co/tenposinfo/register')
          delivery = (root / 'OutboxExternalDelivery.kt').read_text()
          delivery_ui = (root / 'OutboxDeliverySettingsActivity.kt').read_text()
          foundation = (root / 'BusinessSyncFoundation.kt').read_text()
          sync_ui = (root / 'SyncSettingsActivity.kt').read_text()
          mirror = (root / 'ExternalBackupSync.kt').read_text()
          external_ui = (root / 'ExternalBackupSettingsActivity.kt').read_text()
          settings = (root / 'AutoBackupSettings.kt').read_text()
          worker = (root / 'AutoBackup.kt').read_text()
          notification = (root / 'AutoBackupNotification.kt').read_text()
          settings_ui = (root / 'AutoBackupSettingsActivity.kt').read_text()
          data_protection = (root / 'DataProtection.kt').read_text()
          protection_ui = (root / 'DataProtectionActivity.kt').read_text()
          application = (root / 'RegisterApplication.kt').read_text()
          queue = (root / 'UnifiedPrintQueue.kt').read_text()
          queue_ui = (root / 'UnifiedPrintQueueActivity.kt').read_text()
          database = (root / 'RegisterDatabase.kt').read_text()
          advanced = (root / 'AdvancedOperationsStore.kt').read_text()
          printer = (root / 'AdminSettingsStore.kt').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()

          # v0.35 verified external Outbox delivery.
          for token in (
              'data class OutboxDeliverySettings',
              "status='STAGED'",
              'SyncOutboxStatus.SENT.name',
              'OutboxDeliveryPathPolicy',
              '.partial',
              'SHA-256',
              'MAX_ATTEMPTS = 10',
              'SYNC_OUTBOX_EXTERNAL_SENT',
              'SYNC_OUTBOX_EXTERNAL_FAILED',
              'outbox_delivery_failures',
          ):
              assert token in delivery, token
          assert 'ActivityResultContracts.OpenDocumentTree' in delivery_ui
          assert 'takePersistableUriPermission' in delivery_ui
          assert 'releasePersistableUriPermission' in delivery_ui
          assert '失敗を再試行' in delivery_ui
          assert 'OutboxExternalDeliveryCoordinator' in foundation
          assert 'ExistingWorkPolicy.APPEND_OR_REPLACE' in foundation
          assert 'OutboxDeliverySettingsActivity::class.java' in sync_ui
          assert 'is OutboxDeliverySettingsActivity' in application
          assert 'android:name=".OutboxDeliverySettingsActivity"' in manifest

          # v0.34 external automatic backup mirror remains cumulative.
          for token in (
              'data class ExternalBackupSettings',
              'persistedUriPermissions',
              'PeriodicWorkRequestBuilder<ExternalBackupMirrorWorker>',
              '15,',
              'ExistingPeriodicWorkPolicy.KEEP',
              'ExistingPeriodicWorkPolicy.UPDATE',
              'ExistingWorkPolicy.APPEND_OR_REPLACE',
              'ExternalBackupFileNamePolicy',
              '.partial',
              'archiveSha256',
              'DATA_BACKUP_EXTERNAL_AUTO_EXPORTED',
              'DATA_BACKUP_EXTERNAL_AUTO_FAILED',
              'external_backup_failures',
          ):
              assert token in mirror, token
          assert 'ActivityResultContracts.OpenDocumentTree' in external_ui
          assert 'takePersistableUriPermission' in external_ui
          assert 'releasePersistableUriPermission' in external_ui
          assert 'ExternalBackupScheduler.apply(this)' in application
          assert 'is ExternalBackupSettingsActivity' in application
          assert 'ExternalBackupScheduler.enqueueNow' in worker
          assert 'ExternalBackupSettingsActivity::class.java' in settings_ui
          assert 'ExternalBackupSettingsActivity::class.java' in protection_ui
          assert 'fun copyVerifiedBackup' in data_protection
          assert 'android:name=".ExternalBackupSettingsActivity"' in manifest

          # v0.33 periodic internal backup remains cumulative.
          for token in (
              'enum class PeriodicBackupCadence',
              'DAILY',
              'WEEKLY',
              'periodicEnabled',
              'preferredHour',
              'zRetentionBusinessDays',
              'monthlyRetentionMonths',
              'PeriodicWorkRequestBuilder<AutoBackupWorker>',
              'ExistingPeriodicWorkPolicy.KEEP',
              'ExistingPeriodicWorkPolicy.UPDATE',
              'setRequiresBatteryNotLow(true)',
              'setRequiresStorageNotLow(true)',
          ):
              assert token in settings, token
          assert 'BackupCreationReason.PERIODIC' in worker
          assert 'AutoBackupFailureNotificationPolicy' in notification
          assert 'DATA_BACKUP_SETTINGS_UPDATED' in settings_ui
          assert 'AutoBackupPeriodicScheduler.apply(this)' in application

          # v0.32 print queue safety remains cumulative.
          assert 'DISCARDED' in queue
          assert 'managerPin' in queue
          assert 'discardReason' in queue_ui
          assert 'PRINT_JOB_DISCARDED' in database
          assert 'PRINT_JOB_DISCARDED' in advanced

          # v0.31 paper width remains printer-settings-only.
          assert 'object PrinterPaperSettingPolicy' in printer
          assert 'currentWidthMm' in printer

          # Temporary transfer files/workflows must not survive the final branch.
          assert not list(Path('tools').glob('v035*'))
          assert not Path('.github/workflows/v035-apply.yml').exists()
          assert not list(Path('tools').glob('v034*'))
          assert not Path('.github/workflows/v034-apply.yml').exists()
          PY

          test "$(grep -c 'android:name=".OutboxDeliverySettingsActivity"' app/src/main/AndroidManifest.xml)" -eq 1
          test "$(grep -c 'android:name=".ExternalBackupSettingsActivity"' app/src/main/AndroidManifest.xml)" -eq 1
          ! grep -q '<activity-alias' app/src/main/AndroidManifest.xml

      - name: Verify launcher configuration
        shell: bash
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' customer-display/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Prepare named APKs and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.35.0_dev1_outbox_external_delivery_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
          sha256sum artifacts/TSUGUREGI_v0.35.0_dev1_outbox_external_delivery_debug.apk | tee artifacts/TSUGUREGI_v0.35.0_dev1_outbox_external_delivery_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.35.0_dev1_outbox_external_delivery_debug.apk | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee -a artifacts/build-summary.txt
          cat >> artifacts/build-summary.txt <<'EOF'
          REGISTER_VERSION_NAME=0.35.0-dev.1
          REGISTER_VERSION_CODE=65
          CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.6
          CUSTOMER_DISPLAY_VERSION_CODE=6
          OUTBOX_EXTERNAL_DELIVERY=android-document-tree
          OUTBOX_STAGED_MEANING=local-json-ready
          OUTBOX_SENT_MEANING=external-size-and-sha256-verified
          OUTBOX_EXTERNAL_PARTIAL_COMMIT=true
          OUTBOX_EXTERNAL_SHA256_VERIFY=true
          OUTBOX_EXTERNAL_MAX_ATTEMPTS=10
          OUTBOX_EXTERNAL_TARGETS=google-drive-usb-device-folder
          EXTERNAL_BACKUP_DESTINATION=android-document-tree
          EXTERNAL_BACKUP_TARGETS=google-drive-usb-device-folder
          EXTERNAL_BACKUP_TRIGGER=backup-created-and-periodic-scan
          EXTERNAL_BACKUP_PERIODIC_SCAN_MINUTES=15
          EXTERNAL_BACKUP_INTERNAL_SOURCE_OF_TRUTH=true
          EXTERNAL_BACKUP_PARTIAL_COMMIT=true
          EXTERNAL_BACKUP_ARCHIVE_SHA256_VERIFY=true
          GOOGLE_DRIVE_REST_API=not-implemented
          GOOGLE_OAUTH=not-implemented
          AUTO_BACKUP_Z_SETTLEMENT_ALWAYS_ENABLED=true
          PRINT_PAPER_WIDTH_SOURCE=printer-settings-only
          PRINT_TIME_PAPER_WIDTH_SELECTION=disabled
          PRINT_QUEUE_DISCARD=manager-pin-reason-audit
          SIGNING=development-not-production
          REAL_DEVICE_EXTERNAL_BACKUP_VERIFICATION=required
          REAL_DEVICE_OUTBOX_DELIVERY_VERIFICATION=required
          EOF
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.35.0-dev1-outbox-external-delivery-apks
          path: |
            artifacts/TSUGUREGI_v0.35.0_dev1_outbox_external_delivery_debug.apk
            artifacts/TSUGUREGI_v0.35.0_dev1_outbox_external_delivery_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
