name: Apply v0.29 responsive layout

on:
  push:
    branches:
      - develop/v0.29

permissions:
  contents: write

jobs:
  apply-responsive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout v0.29
        uses: actions/checkout@v4
        with:
          ref: develop/v0.29
          fetch-depth: 0

      - name: Validate applicator
        run: python3 -m py_compile tools/apply_v029.py

      - name: Apply responsive implementation
        run: python3 tools/apply_v029.py

      - name: Commit implementation and restore formal CI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: implement v0.29 full-screen responsive layout"
          git push origin HEAD:develop/v0.29
