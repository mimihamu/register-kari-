name: Correct v0.24 compilation issues

on:
  pull_request:
    branches:
      - develop/v0.23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.24
          fetch-depth: 0

      - name: Correct source substitutions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          base = Path('app/src/main/java/jp/co/tenposinfo/register')

          activity = base / 'OperationsActivity.kt'
          text = activity.read_text()
          old = '''                    message = result.fold(
                        onSuccess = {
                            if (type == SettlementReportType.Z_SETTLEMENT) {
                                "Z精算を保存し、営業を終了しました（No.$it）"
                            } else {
                                "X点検を保存しました（No.$it）"
                            }
                        },
                        onFailure = { it.message ?: "保存に失敗しました" },
                    )
                    if (result.isSuccess) revision++
                    activeOperator = OperatorSessionRegistry.current(appContext)
                },
                onBack = { screen = OperationsScreen.MENU },
            )

            OperationsScreen.REVERSAL -> ReversalScreen('''
          new = '''                    message = result.fold(
                        onSuccess = { "${type.displayName}を保存しました（No.$it）" },
                        onFailure = { it.message ?: "保存に失敗しました" },
                    )
                    if (result.isSuccess) revision++
                    activeOperator = OperatorSessionRegistry.current(appContext)
                },
                onBack = { screen = OperationsScreen.MENU },
            )

            OperationsScreen.REVERSAL -> ReversalScreen('''
          if old in text:
              text = text.replace(old, new, 1)
          activity.write_text(text)

          operations = base / 'OperationsStore.kt'
          text = operations.read_text()
          text = text.replace('No.$sessionIdが見つかりません', 'No.${sessionId}が見つかりません')
          text = text.replace('No.$idにより営業終了', 'No.${id}により営業終了')
          operations.write_text(text)

          advanced = base / 'AdvancedOperationsStore.kt'
          text = advanced.read_text().replace('No.$idにより営業終了', 'No.${id}により営業終了')
          advanced.write_text(text)
          PY
          git diff --check

      - name: Commit corrections when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source correction required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt \
                  app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt \
                  app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt
          git commit -m 'fix: correct v0.24 settlement source substitutions'
          git push origin HEAD:develop/v0.24
