name: Apply v0.25 inspection and settlement split

on:
  pull_request:
    branches:
      - develop/v0.24
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v025:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.25'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v0.25
        uses: actions/checkout@v4
        with:
          ref: develop/v0.25
          fetch-depth: 0

      - name: Apply v0.25 sources
        run: |
          set -euo pipefail
          python3 tools/apply_v025.py
          git diff --check
          grep -q 'versionCode = 55' app/build.gradle.kts
          grep -q 'versionName = "0.25.0-dev.1"' app/build.gradle.kts
          grep -q 'OperationsScreen.X_INSPECTION' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'OperationsScreen.Z_SETTLEMENT' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          ! grep -q 'OperationsScreen.SETTLEMENT' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'Z精算して営業を終了しますか？' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V025InspectionSettlementNavigationTest.kt
          test -s docs/V0.25_INSPECTION_SETTLEMENT_SPLIT.md
          test -s docs/V0.25_RELEASE_NOTES.md

      - name: Commit v0.25 implementation
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No implementation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt \
                  app/src/test/java/jp/co/tenposinfo/register/V025InspectionSettlementNavigationTest.kt \
                  docs/V0.25_INSPECTION_SETTLEMENT_SPLIT.md \
                  docs/V0.25_RELEASE_NOTES.md
          git commit -m 'feat: split inspection and settlement actions'
          git push origin HEAD:develop/v0.25
