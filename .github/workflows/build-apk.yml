name: Build つぐレジ APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v057:
    if: github.head_ref == 'develop/v0.57' || github.ref == 'refs/heads/develop/v0.57'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.57
        uses: actions/checkout@v4
        with:
          ref: develop/v0.57
          fetch-depth: 0

      - name: Prepare patch script to restore final cumulative workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/v057_apply.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nimport subprocess\n', 1)
          text = text.replace(
              'workflow = read(workflow_path)',
              'workflow = subprocess.check_output(["git", "show", "origin/develop/v0.56:.github/workflows/build-apk.yml"], text=True)',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply v0.57 source changes
        run: python tools/v057_apply.py

      - name: Remove temporary patch machinery
        run: |
          rm -f tools/v057_apply.py
          rm -f .github/workflows/v057-apply.yml

      - name: Commit v0.57 cumulative sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.57: wire held ticket merge split UI"
          git push origin HEAD:develop/v0.57
