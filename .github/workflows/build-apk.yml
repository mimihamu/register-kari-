name: v0.93 one-time CompleteScreen repair

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'develop/v0.93'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact guarded scope repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt"); t=p.read_text(encoding="utf-8"); s=t.index("private fun CompleteScreen("); e=t.index("private fun SalesHistoryScreen(", s); b=t[s:e]; a="    val bodyModifier = Modifier\n        .weight(1f)\n        .fillMaxWidth()"; c="    val bodyModifier = Modifier\n        .fillMaxWidth()"; d="        Column(\n            bodyModifier,\n"; f="        Column(\n            Modifier.weight(1f).then(bodyModifier),\n"; assert b.count(a) == 1 and b.count(d) == 1, "unexpected CompleteScreen source"; b=b.replace(a,c,1).replace(d,f,1); p.write_text(t[:s]+b+t[e:], encoding="utf-8")'
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt"
          grep -q 'Modifier.weight(1f).then(bodyModifier)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt

      - name: Commit scope repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          git commit -m "fix(v0.93): keep completion weight inside ColumnScope"
          git push origin HEAD:develop/v0.93
