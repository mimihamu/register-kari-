name: Apply v0.26 settlement safeguards

on:
  pull_request:
    branches:
      - develop/v0.25
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v026:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.26'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v0.26
        uses: actions/checkout@v4
        with:
          ref: develop/v0.26
          fetch-depth: 0

      - name: Apply v0.26 sources
        run: |
          set -euo pipefail
          python3 tools/apply_v026.py
          git diff --check
          grep -q 'versionCode = 56' app/build.gradle.kts
          grep -q 'versionName = "0.26.0-dev.1"' app/build.gradle.kts
          grep -q 'X_INSPECTION("X点検")' app/src/main/java/jp/co/tenposinfo/register/AdminSettingsStore.kt
          grep -q 'Z_SETTLEMENT("Z精算")' app/src/main/java/jp/co/tenposinfo/register/AdminSettingsStore.kt
          grep -q 'ZSettlementPreflightPolicy.evaluate' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'pendingPrintsAcknowledged' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'OperationsAction.X_INSPECTION' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          grep -q 'OperationsAction.Z_SETTLEMENT' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt

      - name: Commit v0.26 implementation
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No implementation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  app/src/main/java/jp/co/tenposinfo/register/AdminSettingsStore.kt \
                  app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt \
                  app/src/main/java/jp/co/tenposinfo/register/OperatorSession.kt \
                  app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt \
                  app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt \
                  app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          git commit -m 'feat: enforce z settlement preflight and split permissions'
          git push origin HEAD:develop/v0.26
