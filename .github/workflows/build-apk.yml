name: Build つぐレジ APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK/platforms/android-36"
          test -d "$SDK/build-tools/36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify cumulative v0.14-v1.34 sources
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/jp/co/tenposinfo/register/ReceiptStampV136.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/ReceiptStampPlacementV136.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V136ReceiptStampPlacementTest.kt
          grep -Fq 'versionCode = 164' app/build.gradle.kts
          grep -Fq 'versionName = "1.34.0-dev.1"' app/build.gradle.kts
          grep -Fq 'versionCode = 33' management-app/build.gradle.kts
          grep -Fq 'versionName = "0.33.0-dev.1"' management-app/build.gradle.kts
          git merge-base --is-ancestor 0da5d36a3899bedacdd0f28bea16468d191f784e HEAD
      - name: Verify launcher and orientation configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)" -eq 1
          test "$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)" -eq 1
          test "$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' management-app/src/main | wc -l)" -eq 1
          grep -q 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="sensorPortrait"' management-app/src/main/AndroidManifest.xml
      - name: Run cumulative unit tests
        run: gradle --no-daemon clean :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest
      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin
      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug
      - name: Verify built APK release identity and integrity
        shell: bash
        env:
          POS_VERSION_CODE: 164
          POS_VERSION_NAME: 1.34.0-dev.1
          PLUS_VERSION_CODE: 33
          PLUS_VERSION_NAME: 0.33.0-dev.1
          BUILD_TOOLS_VERSION: 36.0.0
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash ci/verify-apk-release-integrity.sh
          cat artifacts/apk-integrity-summary.txt
      - name: Prepare named APKs and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v1.34.0_dev1_debug.apk
          cp management-app/build/outputs/apk/debug/management-app-debug.apk artifacts/TSUGUREGI_PLUS_v0.33.0_dev1_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.14.0_dev1_debug.apk
          sha256sum artifacts/*.apk | tee artifacts/apk-sha256.txt
          git rev-parse HEAD | sed 's/^/HEAD=/' > artifacts/build-summary.txt
          echo 'FORMAL_CUMULATIVE_SOURCE_GATE=true' >> artifacts/build-summary.txt
          echo 'FORMAL_APK_RELEASE_INTEGRITY_GATE=true' >> artifacts/build-summary.txt
      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v1.36-formal-apks
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
