name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify v0.18 business session integration and cumulative safety
        run: |
          grep -q 'versionCode = 48' app/build.gradle.kts
          grep -q 'versionName = "0.18.0-dev.1"' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime:2.11.2' app/build.gradle.kts
          grep -q 'versionCode = 6' customer-display/build.gradle.kts
          grep -q 'versionName = "0.13.0-dev.6"' customer-display/build.gradle.kts
          grep -q 'applicationId = "jp.co.tenposinfo.register.cd"' customer-display/build.gradle.kts

          test -f app/src/test/java/jp/co/tenposinfo/register/V018BusinessSessionIntegrationTest.kt
          test -f docs/V0.18_BUSINESS_SESSION_INTEGRATION.md
          grep -q 'object BusinessSessionTransitionPolicy' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'fun startBusinessDay' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'fun endBusinessDay' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'sales WHERE business_session_id = ?' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'reversal_transactions WHERE business_session_id = ?' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'openingCash = session.openingCash' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'business_session_id", session.id' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'BusinessSessionStatus.Z_SETTLED.name' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'BusinessSessionSchema.currentOpen(this)' app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt
          grep -q '営業開始後に会計してください' app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt
          grep -q 'fun currentOpen' app/src/main/java/jp/co/tenposinfo/register/StabilizationFoundation.kt
          grep -q 'OperationsScreen.BUSINESS' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q '営業開始・終了' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'is OperationsActivity, is AdvancedOperationsActivity' app/src/main/java/jp/co/tenposinfo/register/RegisterApplication.kt
          test ! -e .github/workflows/v018-apply.yml
          test ! -e .github/workflows/v018-inventory.yml
          test ! -e tools/apply_v018.py
          test ! -e tools/v018-business-session.patch

          test -f app/src/main/java/jp/co/tenposinfo/register/OperationExecutionSafety.kt
          grep -q 'OperationExecutionGuard' app/src/main/java/jp/co/tenposinfo/register/OperationExecutionSafety.kt
          grep -q 'operation_commit_keys' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'claimOperationKey' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'bindOperationKey' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          test -f app/src/test/java/jp/co/tenposinfo/register/V017OperationExecutionSafetyTest.kt
          test -f docs/V0.17_OPERATION_ATOMICITY.md

          test -f app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          grep -q 'OperatorSessionRegistry.current' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          grep -q 'managerNameForPin' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          grep -q 'OperationsActorFormatter.approved' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          ! grep -q 'テストPIN' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          ! grep -q 'pin != "0000"' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          ! grep -q 'onValueChange = { operator =' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          test -f app/src/test/java/jp/co/tenposinfo/register/V016OperationsAuthorizationTest.kt

          test -f app/src/main/java/jp/co/tenposinfo/register/TaxInvoiceSettings.kt
          grep -q 'mixedTaxAmount' app/src/main/java/jp/co/tenposinfo/register/Domain.kt
          grep -q '対象額（税込）' app/src/main/java/jp/co/tenposinfo/register/Receipt.kt
          test -f app/src/test/java/jp/co/tenposinfo/register/V015TaxInvoicePolicyTest.kt
          test -f app/src/test/java/jp/co/tenposinfo/register/V015SalesProfileSnapshotTest.kt

          test -f app/src/main/java/jp/co/tenposinfo/register/HeldTicketSafety.kt
          grep -q 'class HeldTicketSafetyCoordinator' app/src/main/java/jp/co/tenposinfo/register/HeldTicketSafety.kt
          grep -q 'class SaleCommitGuard' app/src/main/java/jp/co/tenposinfo/register/HeldTicketSafety.kt
          test -f app/src/main/java/jp/co/tenposinfo/register/PaymentDraftStore.kt
          grep -q 'payment_draft_meta' app/src/main/java/jp/co/tenposinfo/register/PaymentDraftStore.kt
          test -f app/src/test/java/jp/co/tenposinfo/register/V014HeldTicketSafetyTest.kt
          test -f app/src/test/java/jp/co/tenposinfo/register/V014PaymentDraftTest.kt

          grep -q 'TRANSIENT_OUTAGE_GRACE_MS = 3_000L' customer-display/src/main/java/jp/co/tenposinfo/register/cd/CustomerDisplayConnectionPresentation.kt
          grep -q 'serverInstanceId' customer-display/src/main/java/jp/co/tenposinfo/register/cd/CustomerDisplayModel.kt
          grep -q 'CustomerDisplayScrollPolicy.targetIndex' customer-display/src/main/java/jp/co/tenposinfo/register/cd/MainActivity.kt
          grep -q 'CustomerDisplaySnapshotFactory.accounting' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt

      - name: Verify launcher configuration
        run: |
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$(grep -c 'android.intent.category.LAUNCHER' app/src/debug/AndroidManifest.xml || true)" -eq 0
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' customer-display/src/main/AndroidManifest.xml

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Prepare named APKs and SHA-256
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.18.0_dev1_business_session_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
          sha256sum artifacts/TSUGUREGI_v0.18.0_dev1_business_session_debug.apk | tee artifacts/TSUGUREGI_v0.18.0_dev1_business_session_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.18.0_dev1_business_session_debug.apk | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee -a artifacts/build-summary.txt
          echo "REGISTER_VERSION_NAME=0.18.0-dev.1" >> artifacts/build-summary.txt
          echo "REGISTER_VERSION_CODE=48" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.6" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_VERSION_CODE=6" >> artifacts/build-summary.txt
          echo "BUSINESS_DAY_BOUNDARY=explicit-open-to-close-session" >> artifacts/build-summary.txt
          echo "BUSINESS_DAY_AGGREGATION=business-session-id" >> artifacts/build-summary.txt
          echo "OPENING_CASH_INCLUDED=true" >> artifacts/build-summary.txt
          echo "SALE_REQUIRES_OPEN_SESSION=true" >> artifacts/build-summary.txt
          echo "Z_SETTLEMENT_TRANSITION=open-to-z-settled" >> artifacts/build-summary.txt
          echo "BUSINESS_CLOSE_REQUIRES=z-settled-and-manager-pin" >> artifacts/build-summary.txt
          echo "REVERSAL_ATOMICITY=single-sqlite-transaction" >> artifacts/build-summary.txt
          echo "Z_SETTLEMENT_ATOMICITY=single-sqlite-transaction" >> artifacts/build-summary.txt
          echo "OPERATION_IDEMPOTENCY=persistent-deterministic-key" >> artifacts/build-summary.txt
          echo "OPERATIONS_PERMISSIONS=per-action-and-write-time" >> artifacts/build-summary.txt
          echo "TAX_ROUNDING=once-per-invoice-and-rate" >> artifacts/build-summary.txt
          echo "SALE_COMMIT_IDEMPOTENCY=persistent-uuid-key" >> artifacts/build-summary.txt
          echo "PAYMENT_DRAFT=sqlite-cart-fingerprint-bound" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_TRANSIENT_OUTAGE_SUPPRESSION=3000ms" >> artifacts/build-summary.txt
          echo "REGISTER_PACKAGE=jp.co.tenposinfo.register.dev" >> artifacts/build-summary.txt
          echo "CUSTOMER_DISPLAY_PACKAGE=jp.co.tenposinfo.register.cd.dev" >> artifacts/build-summary.txt
          echo "SIGNING=development-not-production" >> artifacts/build-summary.txt
          echo "REAL_DEVICE_OVERNIGHT_BUSINESS_DAY_VERIFICATION=required" >> artifacts/build-summary.txt
          echo "REAL_DEVICE_BUSINESS_CLOSE_VERIFICATION=required" >> artifacts/build-summary.txt
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.18.0-dev1-business-session-apks
          path: |
            artifacts/TSUGUREGI_v0.18.0_dev1_business_session_debug.apk
            artifacts/TSUGUREGI_v0.18.0_dev1_business_session_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
