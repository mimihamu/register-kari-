name: Build つぐレジ APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v073-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Wire stable keyset paging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/wire_v073_stable_paging.py')
          text = p.read_text(encoding='utf-8')
          needle = "subprocess.run(['git', 'config', 'user.name', 'tsuguregi-ci'], check=True)\n"
          insert = "workflow = subprocess.check_output(['git', 'show', '599991e7317daf444e81678271f3b9c8bfe00369:.github/workflows/build-apk.yml'], text=True)\nPath('.github/workflows/build-apk.yml').write_text(workflow, encoding='utf-8')\n\n"
          if text.count(needle) != 1:
              raise SystemExit('commit anchor not found exactly once')
          p.write_text(text.replace(needle, insert + needle, 1), encoding='utf-8')
          PY
          python3 scripts/wire_v073_stable_paging.py
