name: Apply v0.25 inspection and settlement split

on:
  push:
    branches:
      - develop/v0.25
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v025:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v0.25
        uses: actions/checkout@v4
        with:
          ref: develop/v0.25
          fetch-depth: 0

      - name: Apply v0.25 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          activity = Path('app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt')
          text = activity.read_text()

          if 'import androidx.compose.material3.AlertDialog\n' not in text:
              text = text.replace(
                  'import androidx.compose.material3.Button\n',
                  'import androidx.compose.material3.AlertDialog\nimport androidx.compose.material3.Button\n',
                  1,
              )

          text = text.replace(
              '    SETTLEMENT,\n',
              '    X_INSPECTION,\n    Z_SETTLEMENT,\n',
              1,
          )

          old_menu_call = '''                onDailySales = { openScreen(RegisterPermission.VIEW_SALES, OperationsScreen.DAILY_SALES) },
                onSettlement = { openScreen(RegisterPermission.SETTLEMENT, OperationsScreen.SETTLEMENT) },
                onCashMovement = { openScreen(RegisterPermission.CASH_MOVEMENT, OperationsScreen.CASH_MOVEMENT) },'''
          new_menu_call = '''                onDailySales = { openScreen(RegisterPermission.VIEW_SALES, OperationsScreen.DAILY_SALES) },
                onXInspection = { openScreen(RegisterPermission.SETTLEMENT, OperationsScreen.X_INSPECTION) },
                onZSettlement = { openScreen(RegisterPermission.SETTLEMENT, OperationsScreen.Z_SETTLEMENT) },
                onCashMovement = { openScreen(RegisterPermission.CASH_MOVEMENT, OperationsScreen.CASH_MOVEMENT) },'''
          if old_menu_call not in text:
              raise SystemExit('operations menu call marker not found')
          text = text.replace(old_menu_call, new_menu_call, 1)

          helper_marker = '    val operator = activeOperator\n'
          helper = '''    fun executeSettlement(type: SettlementReportType, actualCash: Long?, pin: String) {
        val result = runCatching { secureStore.recordSettlement(type, actualCash, pin) }
        message = result.fold(
            onSuccess = {
                if (type == SettlementReportType.Z_SETTLEMENT) {
                    "Z精算を保存し、営業を終了しました（No.$it）"
                } else {
                    "X点検を保存しました（No.$it）"
                }
            },
            onFailure = { it.message ?: "保存に失敗しました" },
        )
        if (result.isSuccess) revision++
        activeOperator = OperatorSessionRegistry.current(appContext)
    }

'''
          if helper not in text:
              if helper_marker not in text:
                  raise SystemExit('settlement helper marker not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          screen_start = text.index('            OperationsScreen.SETTLEMENT -> SettlementScreen(')
          screen_end = text.index('            OperationsScreen.CASH_MOVEMENT -> CashMovementScreen(', screen_start)
          split_screens = '''            OperationsScreen.X_INSPECTION -> SettlementScreen(
                reportType = SettlementReportType.X_INSPECTION,
                screenCode = "SCR-500-X",
                title = "X点検",
                session = store.activeBusinessSession(),
                summary = store.dailySummary(),
                history = store.recentSettlements(),
                operatorName = operator.name,
                revision = revision,
                onExecute = { actualCash, pin ->
                    executeSettlement(SettlementReportType.X_INSPECTION, actualCash, pin)
                },
                message = message,
                onBack = { screen = OperationsScreen.MENU },
            )

            OperationsScreen.Z_SETTLEMENT -> SettlementScreen(
                reportType = SettlementReportType.Z_SETTLEMENT,
                screenCode = "SCR-500-Z",
                title = "Z精算・営業終了",
                session = store.activeBusinessSession(),
                summary = store.dailySummary(),
                history = store.recentSettlements(),
                operatorName = operator.name,
                revision = revision,
                onExecute = { actualCash, pin ->
                    executeSettlement(SettlementReportType.Z_SETTLEMENT, actualCash, pin)
                },
                message = message,
                onBack = { screen = OperationsScreen.MENU },
            )

'''
          text = text[:screen_start] + split_screens + text[screen_end:]

          signature_old = '''    onDailySales: () -> Unit,
    onSettlement: () -> Unit,
    onCashMovement: () -> Unit,'''
          signature_new = '''    onDailySales: () -> Unit,
    onXInspection: () -> Unit,
    onZSettlement: () -> Unit,
    onCashMovement: () -> Unit,'''
          if signature_old not in text:
              raise SystemExit('operations menu signature marker not found')
          text = text.replace(signature_old, signature_new, 1)

          menu_start = text.index('            Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(12.dp)) {')
          menu_end = text.index('        }\n        OpBottomBar("販売へ戻る", onClose)', menu_start)
          menu_column = '''            Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                MenuTile(
                    "営業開始・状態",
                    "営業セッションを開始／Z精算で営業終了",
                    Color(0xFFE8EAF6),
                    Modifier.weight(0.82f),
                    RegisterPermission.SETTLEMENT in permissions,
                    onBusiness,
                )
                Row(Modifier.weight(1f), horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                    MenuTile(
                        "当日売上",
                        "SCR-510\\n売上・支払・現金を確認",
                        OpPaleBlue,
                        Modifier.weight(1f),
                        RegisterPermission.VIEW_SALES in permissions,
                        onDailySales,
                    )
                    MenuTile(
                        "X点検",
                        "SCR-500-X\\n営業を継続したまま確認",
                        OpPaleGreen,
                        Modifier.weight(1f),
                        RegisterPermission.SETTLEMENT in permissions,
                        onXInspection,
                    )
                    MenuTile(
                        "Z精算",
                        "SCR-500-Z\\n精算して営業終了",
                        Color(0xFFFFE8E8),
                        Modifier.weight(1f),
                        RegisterPermission.SETTLEMENT in permissions,
                        onZSettlement,
                    )
                }
                Row(Modifier.weight(1f), horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                    MenuTile(
                        "入出金",
                        "入金・出金を理由付きで記録",
                        OpPaleYellow,
                        Modifier.weight(1f),
                        RegisterPermission.CASH_MOVEMENT in permissions,
                        onCashMovement,
                    )
                    MenuTile(
                        "返品・取消",
                        "元売上を残して反対取引を作成",
                        Color(0xFFFCE8E6),
                        Modifier.weight(1f),
                        RegisterPermission.REVERSAL in permissions,
                        onReversal,
                    )
                }
            }
'''
          text = text[:menu_start] + menu_column + text[menu_end:]

          settlement_start = text.index('@Composable\nprivate fun SettlementScreen(')
          settlement_end = text.index('@Composable\nprivate fun CashMovementScreen(', settlement_start)
          settlement_screen = '''@Composable
private fun SettlementScreen(
    reportType: SettlementReportType,
    screenCode: String,
    title: String,
    session: BusinessSessionRecord?,
    summary: DailyOperationsSummary,
    history: List<SettlementRecord>,
    operatorName: String,
    revision: Int,
    onExecute: (Long?, String) -> Unit,
    message: String?,
    onBack: () -> Unit,
) {
    var actualCash by remember { mutableStateOf("") }
    var pin by remember { mutableStateOf("") }
    var showZConfirmation by remember { mutableStateOf(false) }
    @Suppress("UNUSED_VARIABLE") val refresh = revision
    val isZSettlement = reportType == SettlementReportType.Z_SETTLEMENT
    val actual = actualCash.toLongOrNull()
    val previewActual = actual ?: summary.expectedCash
    val variance = OperationsMath.variance(previewActual, summary.expectedCash)

    if (showZConfirmation) {
        AlertDialog(
            onDismissRequest = { showZConfirmation = false },
            title = { Text("Z精算して営業を終了しますか？", fontWeight = FontWeight.Bold) },
            text = {
                Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                    Text("営業日 ${summary.businessDate} / セッションNo.${summary.businessSessionId}")
                    Text("純売上 ${opYen(summary.netSales)}")
                    Text("現金実査 ${opYen(previewActual)} / 過不足 ${signedYen(variance)}")
                    Text("完了後、この営業セッションでは販売できません。", color = OpDanger, fontWeight = FontWeight.Bold)
                }
            },
            confirmButton = {
                Button(
                    onClick = {
                        showZConfirmation = false
                        onExecute(actual, pin)
                    },
                    enabled = pin.isNotBlank(),
                    colors = ButtonDefaults.buttonColors(containerColor = OpDanger),
                ) { Text("Z精算して営業終了") }
            },
            dismissButton = {
                OutlinedButton(onClick = { showZConfirmation = false }) { Text("戻る") }
            },
        )
    }

    Column(Modifier.fillMaxSize()) {
        OpHeader(screenCode, title)
        Row(Modifier.weight(1f).padding(18.dp), horizontalArrangement = Arrangement.spacedBy(16.dp)) {
            OpPanel(Modifier.width(390.dp).fillMaxHeight()) {
                Text(if (isZSettlement) "Z精算" else "X点検", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = if (isZSettlement) OpDanger else OpNavy)
                Spacer(Modifier.height(6.dp))
                Text(
                    session?.let { "対象: ${it.businessDate} / セッションNo.${it.id}" } ?: "営業中のセッションがありません",
                    color = if (session == null) OpDanger else OpGreen,
                    fontWeight = FontWeight.Bold,
                )
                Spacer(Modifier.height(12.dp))
                OpNumericField("現金実査額（空欄は理論額）", actualCash, { actualCash = it })
                Spacer(Modifier.height(8.dp))
                OpAuthenticatedOperator(operatorName)
                if (isZSettlement) {
                    Spacer(Modifier.height(8.dp))
                    OutlinedTextField(
                        value = pin,
                        onValueChange = { pin = it.filter(Char::isDigit).take(8) },
                        label = { Text("責任者PIN") },
                        keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.NumberPassword),
                        singleLine = true,
                        modifier = Modifier.fillMaxWidth(),
                    )
                }
                Spacer(Modifier.height(12.dp))
                Text(
                    if (isZSettlement) {
                        "Z精算は現在の営業セッションに対して1回だけ実行し、完了と同時に営業終了します。同じ営業日で再開する場合は新しい営業セッションになります。"
                    } else {
                        "X点検は現在の営業セッションの値を保存します。営業は終了せず、そのまま販売を継続できます。"
                    },
                    color = Color.DarkGray,
                )
                Spacer(Modifier.weight(1f))
                Button(
                    onClick = {
                        if (isZSettlement) showZConfirmation = true else onExecute(actual, "")
                    },
                    enabled = session != null && (!isZSettlement || !summary.settled),
                    modifier = Modifier.fillMaxWidth().height(56.dp),
                    colors = ButtonDefaults.buttonColors(containerColor = if (isZSettlement) OpDanger else OpBlue),
                ) {
                    Text(if (isZSettlement) "Z精算の確認へ" else "X点検を実行", fontWeight = FontWeight.Bold)
                }
                if (message != null) {
                    Spacer(Modifier.height(8.dp))
                    Text(message, color = if (message.contains("違い") || message.contains("既に") || message.contains("失敗")) OpDanger else OpGreen)
                }
            }

            OpPanel(Modifier.width(360.dp).fillMaxHeight()) {
                Text("プレビュー", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = OpNavy)
                Spacer(Modifier.height(10.dp))
                OpAmountRow("営業セッション", if (summary.businessSessionId > 0) "No.${summary.businessSessionId}" else "未開始")
                OpAmountRow("営業日", summary.businessDate)
                OpAmountRow("売上総額", opYen(summary.salesGross))
                OpAmountRow("返品・取消", "-${opYen(summary.reversalGross)}")
                OpAmountRow("純売上", opYen(summary.netSales), emphasized = true)
                OpAmountRow("現金理論", opYen(summary.expectedCash))
                OpAmountRow("現金実査", opYen(previewActual))
                OpAmountRow("過不足", signedYen(variance), emphasized = true)
                OpAmountRow("未印刷", "${summary.pendingPrints}件")
                OpAmountRow("未会計伝票", "${summary.heldTickets}件")
                if (summary.pendingPrints > 0 || summary.heldTickets > 0) {
                    Spacer(Modifier.height(8.dp))
                    Text(
                        if (isZSettlement) "未処理項目があります。Z精算前に確認してください。" else "未処理項目があります。",
                        color = OpDanger,
                        fontWeight = FontWeight.Bold,
                    )
                }
            }

            OpPanel(Modifier.weight(1f).fillMaxHeight()) {
                Text("保存履歴", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = OpNavy)
                Spacer(Modifier.height(8.dp))
                if (history.isEmpty()) {
                    Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("履歴はありません", color = Color.Gray) }
                } else {
                    LazyColumn {
                        itemsIndexed(history) { _, record ->
                            Column(Modifier.fillMaxWidth().padding(vertical = 8.dp)) {
                                Row(Modifier.fillMaxWidth()) {
                                    Text(record.type.displayName, fontWeight = FontWeight.Bold, color = OpNavy)
                                    Spacer(Modifier.weight(1f))
                                    Text(opDateTime(record.createdAt), color = Color.Gray)
                                }
                                Text("${record.businessDate}  セッションNo.${record.businessSessionId}")
                                Text("純売上 ${opYen(record.netSales)}  差異 ${signedYen(record.variance)}")
                                Text("担当 ${record.operatorName}", color = Color.Gray)
                            }
                        }
                    }
                }
            }
        }
        OpBottomBar("レジ管理へ戻る", onBack)
    }
}

'''
          text = text[:settlement_start] + settlement_screen + text[settlement_end:]

          cash_start = text.index('            OperationsScreen.CASH_MOVEMENT -> CashMovementScreen(')
          cash_end = text.index('            OperationsScreen.REVERSAL -> ReversalScreen(', cash_start)
          cash_segment = text[cash_start:cash_end]
          fold_start = cash_segment.index('                    message = result.fold(')
          fold_end = cash_segment.index('                    if (result.isSuccess)', fold_start)
          cash_fold = '''                    message = result.fold(
                        onSuccess = { "${type.displayName}を保存しました（No.$it）" },
                        onFailure = { it.message ?: "保存に失敗しました" },
                    )
'''
          cash_segment = cash_segment[:fold_start] + cash_fold + cash_segment[fold_end:]
          text = text[:cash_start] + cash_segment + text[cash_end:]

          if 'OperationsScreen.SETTLEMENT' in text:
              raise SystemExit('legacy settlement screen route remains')
          if 'var reportType by remember' in text:
              raise SystemExit('legacy report type selector remains')
          activity.write_text(text)

          gradle = Path('app/build.gradle.kts')
          gradle_text = gradle.read_text()
          gradle_text = gradle_text.replace('versionCode = 54', 'versionCode = 55', 1)
          gradle_text = gradle_text.replace('versionName = "0.24.0-dev.1"', 'versionName = "0.25.0-dev.1"', 1)
          gradle.write_text(gradle_text)

          test = Path('app/src/test/java/jp/co/tenposinfo/register/V025InspectionSettlementNavigationTest.kt')
          test.write_text('''package jp.co.tenposinfo.register

import java.io.File
import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test

class V025InspectionSettlementNavigationTest {
    private val source = File("src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt").readText()

    @Test
    fun inspectionAndSettlementHaveSeparateRoutes() {
        assertTrue(source.contains("OperationsScreen.X_INSPECTION"))
        assertTrue(source.contains("OperationsScreen.Z_SETTLEMENT"))
        assertFalse(source.contains("OperationsScreen.SETTLEMENT"))
        assertTrue(source.contains("onXInspection"))
        assertTrue(source.contains("onZSettlement"))
    }

    @Test
    fun reportTypeCannotBeChangedInsideEachScreen() {
        assertFalse(source.contains("var reportType by remember"))
        assertFalse(source.contains("OpChoiceButton(\\\"X点検\\\""))
        assertTrue(source.contains("reportType = SettlementReportType.X_INSPECTION"))
        assertTrue(source.contains("reportType = SettlementReportType.Z_SETTLEMENT"))
    }

    @Test
    fun zSettlementRequiresExplicitConfirmation() {
        assertTrue(source.contains("Z精算して営業を終了しますか？"))
        assertTrue(source.contains("完了後、この営業セッションでは販売できません。"))
        assertTrue(source.contains("enabled = pin.isNotBlank()"))
    }

    @Test
    fun cashMovementDoesNotUseSettlementReportType() {
        val start = source.indexOf("OperationsScreen.CASH_MOVEMENT")
        val end = source.indexOf("OperationsScreen.REVERSAL", start)
        val segment = source.substring(start, end)
        assertFalse(segment.contains("SettlementReportType"))
        assertTrue(segment.contains("type.displayName"))
    }
}
''')

          Path('docs/V0.25_INSPECTION_SETTLEMENT_SPLIT.md').write_text('''# v0.25 X点検・Z精算の導線分離

## 目的

点検と精算を同じ画面内の切替操作にせず、業務上の意味と影響が異なる処理として独立させる。

## 画面構成

- `SCR-500-X X点検`
  - 営業中の数値を保存する。
  - 営業セッションは`OPEN`のまま継続する。
  - 責任者PINは要求しない。
- `SCR-500-Z Z精算・営業終了`
  - 責任者PINを要求する。
  - 確認ダイアログに営業日、セッション番号、純売上、現金実査、過不足を表示する。
  - 確定後はZ精算と営業終了を同一トランザクションで完了する。

## 誤操作防止

- レジ管理メニューにX点検とZ精算を別ボタンで表示する。
- 各画面内で処理種別を切り替えられない。
- Z精算は赤系表示とし、最終確認を経なければ実行しない。
- Z精算の確定ボタンは責任者PIN入力後のみ有効にする。

## 併行修正

v0.24で崩れていた入出金保存結果ブロックのインデントを修正し、入出金処理から精算種別への誤参照がないことをテストする。
''')

          Path('docs/V0.25_RELEASE_NOTES.md').write_text('''# つぐレジ v0.25.0-dev.1 リリースノート

## 変更点

- レジ管理メニューの「点検・精算」を「X点検」と「Z精算」の別ボタンへ分離。
- X点検とZ精算を別画面・別ルートに変更。
- 各画面から処理種別の切替操作を撤廃。
- Z精算に営業終了確認ダイアログを追加。
- Z精算の最終確定を責任者PIN入力後のみ有効化。
- v0.24の入出金保存処理に残っていた整形不良を修正。

## 継承する仕様

- Z精算が正常確定した時点で営業セッションを終了する。
- 同じ営業日でも、終了後は新しい営業セッションを開始できる。
- Z精算と営業終了は同一SQLiteトランザクションで確定する。

## 実機確認

- X点検後も販売を継続できること。
- Z精算画面へ誤って入った場合に「戻る」で終了できること。
- PIN未入力ではZ精算を最終確定できないこと。
- Z精算確認画面の売上、実査額、過不足が正しいこと。
''')
          PY

          git diff --check
          grep -q 'versionCode = 55' app/build.gradle.kts
          grep -q 'versionName = "0.25.0-dev.1"' app/build.gradle.kts
          grep -q 'OperationsScreen.X_INSPECTION' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'OperationsScreen.Z_SETTLEMENT' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          ! grep -q 'OperationsScreen.SETTLEMENT' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'Z精算して営業を終了しますか？' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V025InspectionSettlementNavigationTest.kt
          test -s docs/V0.25_INSPECTION_SETTLEMENT_SPLIT.md
          test -s docs/V0.25_RELEASE_NOTES.md

      - name: Commit v0.25 implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No implementation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt \
                  app/src/test/java/jp/co/tenposinfo/register/V025InspectionSettlementNavigationTest.kt \
                  docs/V0.25_INSPECTION_SETTLEMENT_SPLIT.md \
                  docs/V0.25_RELEASE_NOTES.md
          git commit -m 'feat: split inspection and settlement actions'
          git push origin HEAD:develop/v0.25
