name: Build つぐレジ APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Legacy source-test compatibility markers.
# v0.86以前の一部JUnitは、当時のCI登録確認としてworkflow本文に
# 自身のファイル名が存在することを検査している。v0.87以降は実検査を
# v0.86 final HEADから再実行するが、旧JUnitの意味を壊さないため以下を保持する。
# 新規テストはこの形式へ依存せず、Gradleの累積test task実行を確認する。
# V044GoogleDriveAccountTest.kt
# V046GoogleDriveSetupGuideTest.kt
# V047GoogleDriveDiagnosticsTest.kt
# V048GoogleDriveSettingsEntryTest.kt
# V050GoogleDriveCrossAppConnectionTest.kt
# V055OutboxOperationsEntryTest.kt
# V057HeldTicketOperationsUiTest.kt
# V058ReceiptVoucherFoundationTest.kt
# V059ReceiptVoucherUiTest.kt
# V060ReceiptVoucherOperationsLedgerTest.kt
# V061ReceiptVoucherSaleContextNavigationTest.kt
# V062SalesHistoryLookupTest.kt
# V063ReversalSaleLookupTest.kt
# V064SaleDetailReversalNavigationTest.kt
# V065BusinessDateSalesLookupTest.kt
# V066BusinessDateDatabaseSearchTest.kt
# V067SaleReceiptReprintNavigationTest.kt
# V068SaleReceiptReprintAuditTest.kt
# V069SaleReceiptReprintOperationsLedgerTest.kt
# V070SaleReceiptReprintDatabasePagingTest.kt
# V071SaleReceiptReprintPeriodIndexTest.kt
# V072SaleReceiptReprintCustomRangeTest.kt
# V073SaleReceiptReprintStablePagingTest.kt
# V074SaleReceiptReprintMatchingNewItemsTest.kt
# V075SaleReceiptReprintCsvExportTest.kt
# V076BusinessSessionSalesDrilldownTest.kt
# V077SettlementHistorySalesDrilldownTest.kt
# V078SettlementReconciliationTest.kt
# V079SettlementReconciliationAuditTest.kt
# V080ResponsiveSettlementReconciliationTest.kt
# V081SettlementReconciliationAuditLedgerTest.kt
# V082SettlementReconciliationAuditCsvExportTest.kt
# V083RestoreBootstrapOrderTest.kt
# Legacy build-summary compatibility markers referenced by old source tests.
# SETTLEMENT_RECONCILIATION=true
# SETTLEMENT_RECONCILIATION_X_DIFFERENCE_INFORMATIONAL=true
# SETTLEMENT_RECONCILIATION_Z_DIFFERENCE_ALERT=true
# SETTLEMENT_RECONCILIATION_AUDIT=true

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v0.90 sources
        shell: bash
        env:
          V086_FINAL_HEAD: aef6c08d75d057b67662e9612238edba15fc6489
        run: |
          set -euo pipefail

          # v0.86の最終CI検査ブロックを履歴から再実行する。
          # 現行版番号だけは現在版で置き換えるため除外する。
          git show "$V086_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v086-build-apk.yml
          awk '
            /- name: Verify cumulative v0.14-v0.86 sources/ { capture=1; next }
            capture && /- name: Verify launcher and orientation configuration/ { exit }
            capture && /^        run: \|/ { inrun=1; next }
            capture && inrun { sub(/^          /, ""); print }
          ' /tmp/v086-build-apk.yml \
            | grep -v "grep -q 'versionCode = 116' app/build.gradle.kts" \
            | grep -v "grep -q 'versionName = \"0.86.0-dev.1\"' app/build.gradle.kts" \
            > /tmp/v086-cumulative-checks.sh
          test -s /tmp/v086-cumulative-checks.sh
          bash -euxo pipefail /tmp/v086-cumulative-checks.sh

          # v0.87 rollback visibility acceptance（旧版番号への固定はしない）。
          test -s app/src/test/java/jp/co/tenposinfo/register/V087RestoreRollbackVisibilityTest.kt
          test -s docs/V0.87_RESTORE_ROLLBACK_VISIBILITY.md
          test -s docs/V0.87_RELEASE_NOTES.md
          grep -q 'var rollbackInventory by remember' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'RestoreRollbackSafetyV086.inventory(appContext)' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'Dispatchers.IO' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q '復元前ロールバック' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q '最新ロールバック検証OK' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q '最新ロールバック検証NG' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'latestRollback.sha256.take(16)' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'ロールバック再検証' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'ロールバックDBは自動削除しません。' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          ! grep -q 'ロールバック削除' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          ! grep -q 'ロールバックから復元' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt

          # v0.88 app update transition ledger semantic acceptance.
          test -s app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV088.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V088AppUpdateTransitionTest.kt
          test -s docs/V0.88_APP_UPDATE_TRANSITION_LEDGER.md
          test -s docs/V0.88_RELEASE_NOTES.md
          grep -q 'app_update_transition_v088' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV088.kt
          grep -q 'APP_UPDATE_STARTUP_SUCCEEDED' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV088.kt
          grep -q 'APP_UPDATE_STARTUP_RECOVERED' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV088.kt
          grep -q 'APP_UPDATE_PREVIOUS_STARTUP_INCOMPLETE' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV088.kt
          ! grep -qi 'DELETE FROM sales' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV088.kt
          ! grep -qi 'UPDATE sales' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV088.kt
          ! grep -qi 'DROP TABLE' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV088.kt

          # v0.89 DB health gate semantic acceptance（旧版番号への固定はしない）。
          test -s app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V089AppUpdateDatabaseHealthGateTest.kt
          test -s docs/V0.89_APP_UPDATE_DATABASE_HEALTH_GATE.md
          test -s docs/V0.89_RELEASE_NOTES.md
          grep -q 'android:name=".AppUpdateTransitionBootstrapProviderV089"' app/src/main/AndroidManifest.xml
          ! grep -q 'android:name=".AppUpdateTransitionBootstrapProviderV088"' app/src/main/AndroidManifest.xml
          grep -q 'android:initOrder="900"' app/src/main/AndroidManifest.xml
          grep -q 'app_update_transition_v088' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q 'SQLiteDatabase.OPEN_READONLY' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q 'PRAGMA integrity_check' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q 'PRAGMA foreign_key_check' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q 'SELECT name FROM sqlite_master' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q 'PRAGMA table_info' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q 'if (!health.healthy)' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q 'AppUpdateDatabaseHealthEvidenceV089.recordFailure' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q '不健全DBにはoperation_auditも書かない' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q 'APP_UPDATE_STARTUP_DB_HEALTH_RECOVERED' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          grep -q 'APP_UPDATE_STARTUP_SUCCEEDED' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          ! grep -q 'writableDatabase' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          ! grep -q 'execSQL(' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          ! grep -qi 'DELETE FROM' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          ! grep -qi 'UPDATE sales' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          ! grep -qi 'DROP TABLE' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt
          ! grep -qi 'ALTER TABLE' app/src/main/java/jp/co/tenposinfo/register/AppUpdateTransitionV089.kt

          # v0.90 release identity + read-only update diagnostics visibility.
          grep -q 'versionCode = 120' app/build.gradle.kts
          grep -q 'versionName = "0.90.0-dev.1"' app/build.gradle.kts
          test -s app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsV090.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V090AppUpdateDiagnosticsVisibilityTest.kt
          test -s docs/V0.90_APP_UPDATE_DIAGNOSTICS_VISIBILITY.md
          test -s docs/V0.90_RELEASE_NOTES.md
          grep -q 'AppUpdateDiagnosticsPanelV090(appContext)' app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt
          grep -q 'AppUpdateDatabaseHealthEvidenceV089.read(appContext)' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsV090.kt
          grep -q 'app_update_transition_v088' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsV090.kt
          grep -q 'AppUpdateOperationalStateV090.DB_HEALTH_BLOCKED' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsV090.kt
          grep -q 'Lifecycle.Event.ON_RESUME' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt
          grep -q 'アプリ更新状態' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt
          grep -q '起動成功確定済み' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt
          grep -q 'DB健全性NG・更新成功未確定' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt
          grep -q '起動成功確認中' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt
          grep -q '最終成功版' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt
          grep -q '起動試行' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt
          ! grep -q '\.edit()' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsV090.kt
          ! grep -q 'writableDatabase' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsV090.kt
          ! grep -q 'execSQL(' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsV090.kt
          ! grep -qi 'DELETE FROM' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsV090.kt
          ! grep -q '更新状態を削除' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt
          ! grep -q '更新成功を強制' app/src/main/java/jp/co/tenposinfo/register/AppUpdateDiagnosticsPanelV090.kt

      - name: Verify launcher and orientation configuration
        shell: bash
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          plus_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' management-app/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$plus_launcher_count" -eq 1
          grep -q 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="sensorPortrait"' management-app/src/main/AndroidManifest.xml
          ! grep -q 'android:screenOrientation="landscape"' management-app/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug

      - name: Prepare named APKs and SHA-256
        shell: bash
        env:
          V086_FINAL_HEAD: aef6c08d75d057b67662e9612238edba15fc6489
        run: |
          set -euo pipefail
          mkdir -p artifacts
          register_apk=artifacts/TSUGUREGI_v0.90.0_dev1_app_update_diagnostics_visibility_debug.apk
          plus_apk=artifacts/TSUGUREGI_PLUS_v0.14.0_dev1_sync_operations_dashboard_debug.apk
          cd_apk=artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$register_apk"
          cp management-app/build/outputs/apk/debug/management-app-debug.apk "$plus_apk"
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk "$cd_apk"
          sha256sum "$register_apk" | tee "$register_apk.sha256"
          sha256sum "$plus_apk" | tee "$plus_apk.sha256"
          sha256sum "$cd_apk" | tee "$cd_apk.sha256"
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' "$register_apk" | tee artifacts/build-summary.txt
          stat --printf='MANAGEMENT_APP_APK_SIZE_BYTES=%s\n' "$plus_apk" | tee -a artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' "$cd_apk" | tee -a artifacts/build-summary.txt
          keytool -list -v \
            -keystore app/build/signing/tsuguregi-development.jks \
            -storepass tsuguregi-dev \
            -alias tsuguregi-dev \
            | awk -F': ' '/SHA1:/{print "DEVELOPMENT_SIGNING_SHA1=" $2} /SHA256:/{print "DEVELOPMENT_SIGNING_SHA256=" $2}' \
            | tee -a artifacts/build-summary.txt

          # v0.86までのfeature/verification flagsを履歴から継承する。
          git show "$V086_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v086-build-apk.yml
          awk '
            /cat >> artifacts\/build-summary.txt <<'\''EOF'\''/ { capture=1; next }
            capture && /^          EOF$/ { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/v086-build-apk.yml \
            | grep -v '^REGISTER_VERSION_NAME=' \
            | grep -v '^REGISTER_VERSION_CODE=' \
            >> artifacts/build-summary.txt

          cat >> artifacts/build-summary.txt <<'EOF'
          RESTORE_ROLLBACK_VISIBILITY=true
          RESTORE_ROLLBACK_VISIBILITY_READ_ONLY=true
          RESTORE_ROLLBACK_VISIBILITY_IO_VERIFICATION=true
          RESTORE_ROLLBACK_LATEST_INTEGRITY_STATUS=true
          RESTORE_ROLLBACK_AUTO_DELETE=false
          REAL_DEVICE_RESTORE_ROLLBACK_VISIBILITY_VERIFICATION=required
          APP_UPDATE_TRANSITION_LEDGER=true
          APP_UPDATE_PENDING_BEFORE_NORMAL_PROVIDERS=true
          APP_UPDATE_SUCCESS_ON_MAIN_RESUMED=true
          APP_UPDATE_INCOMPLETE_RECOVERY=true
          APP_UPDATE_BUSINESS_DATA_MUTATION=false
          REAL_DEVICE_APP_UPDATE_TRANSITION_VERIFICATION=required
          APP_UPDATE_DATABASE_HEALTH_GATE=true
          APP_UPDATE_DATABASE_HEALTH_READ_ONLY=true
          APP_UPDATE_DATABASE_HEALTH_INTEGRITY_CHECK=true
          APP_UPDATE_DATABASE_HEALTH_FOREIGN_KEY_CHECK=true
          APP_UPDATE_DATABASE_HEALTH_REQUIRED_SCHEMA=true
          APP_UPDATE_DATABASE_HEALTH_FAILURE_DB_WRITE=false
          APP_UPDATE_DATABASE_HEALTH_FAILURE_EVIDENCE=true
          APP_UPDATE_DATABASE_HEALTH_RECOVERY_AUDIT=true
          REAL_DEVICE_APP_UPDATE_DATABASE_HEALTH_VERIFICATION=required
          REGISTER_VERSION_NAME=0.90.0-dev.1
          REGISTER_VERSION_CODE=120
          APP_UPDATE_DIAGNOSTICS_VISIBILITY=true
          APP_UPDATE_DIAGNOSTICS_READ_ONLY=true
          APP_UPDATE_DIAGNOSTICS_SCR767=true
          APP_UPDATE_DIAGNOSTICS_ON_RESUME_REFRESH=true
          APP_UPDATE_DIAGNOSTICS_MUTATION_CONTROLS=false
          REAL_DEVICE_APP_UPDATE_DIAGNOSTICS_VISIBILITY_VERIFICATION=required
          EOF
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.90.0-dev1-app-update-diagnostics-visibility-apks
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
