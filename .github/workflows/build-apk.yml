name: Build つぐレジ APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v0.57 sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 87' app/build.gradle.kts
          grep -q 'versionName = "0.57.0-dev.1"' app/build.gradle.kts
          grep -q 'versionCode = 14' management-app/build.gradle.kts
          grep -q 'versionName = "0.14.0-dev.1"' management-app/build.gradle.kts
          grep -q 'versionCode = 7' customer-display/build.gradle.kts
          grep -q 'versionName = "0.14.0-dev.1"' customer-display/build.gradle.kts
          test -s app/src/main/java/jp/co/tenposinfo/register/GoogleDriveEasyConnectActivity.kt
          test -s management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveEasyConnectActivity.kt
          test -s management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveSyncVerificationActivity.kt
          test -s management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveDirectSync.kt
          test -s management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveRecoveryActivity.kt
          test -s management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveOperationsRuntime.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V044GoogleDriveAccountTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V046GoogleDriveSetupGuideTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V047GoogleDriveDiagnosticsTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V048GoogleDriveSettingsEntryTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V050GoogleDriveCrossAppConnectionTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V051GoogleDriveRecoveryFallbackTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V054GoogleEasyConnectTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V055OutboxOperationsEntryTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V056HeldTicketMergeSplitTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V057HeldTicketOperationsUiTest.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V044GoogleDriveAccountTest.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V049GoogleDrivePlusSetupDiagnosticsTest.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V050GoogleDriveCrossAppConnectionTest.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V051GoogleDriveRecoveryFallbackTest.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V052GoogleDriveOperationsSetupTest.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V053GoogleDriveSyncVerificationTest.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V053GoogleDriveSyncVerificationSourceTest.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V054GoogleEasyConnectTest.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V055GoogleDriveOperationsDashboardTest.kt
          test -s docs/V0.54_GOOGLE_EASY_CONNECT.md
          test -s docs/V0.54_RELEASE_NOTES.md
          test -s docs/V0.55_SYNC_OPERATIONS_DASHBOARD.md
          test -s docs/V0.55_RELEASE_NOTES.md
          test -s docs/V0.56_HELD_TICKET_MERGE_SPLIT.md
          test -s docs/V0.56_RELEASE_NOTES.md
          test -s docs/V0.57_HELD_TICKET_OPERATIONS_UI.md
          test -s docs/V0.57_RELEASE_NOTES.md
          grep -q '^# つぐレジ$' README.md
          grep -q 'GoogleDriveEasyConnectActivity' app/src/main/AndroidManifest.xml
          grep -q 'GoogleDriveEasyConnectActivity' management-app/src/main/AndroidManifest.xml
          grep -q 'GoogleDriveEasyConnectActivity::class.java' app/src/main/java/jp/co/tenposinfo/register/SyncSettingsActivity.kt
          grep -q 'GoogleDriveEasyConnectActivity::class.java' management-app/src/main/java/jp/co/tenposinfo/register/plus/ManagementFolderSyncScreen.kt
          grep -q 'setAutoImportOnLaunch(false)' management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveEasyConnectActivity.kt
          grep -q 'createOrUpdate(accessToken)' app/src/main/java/jp/co/tenposinfo/register/GoogleDriveEasyConnectActivity.kt
          grep -q 'STALE_RUNNING_MILLIS' management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveSyncVerificationActivity.kt
          grep -q 'lastFailureCategory' management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveDirectSync.kt
          grep -q 'Intent.ACTION_SEND' management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveSyncVerificationActivity.kt
          grep -q '同期運用ダッシュボード' management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveSyncVerificationActivity.kt
          grep -q 'GoogleDriveRejectedRetryService' management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveSyncVerificationActivity.kt
          grep -q 'getWorkInfosForUniqueWork' management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveOperationsRuntime.kt
          grep -q '送信運用・個別再試行' app/src/main/java/jp/co/tenposinfo/register/SyncSettingsActivity.kt
          grep -q 'fun merge(' app/src/main/java/jp/co/tenposinfo/register/HeldTicketSafety.kt
          grep -q 'fun split(' app/src/main/java/jp/co/tenposinfo/register/HeldTicketSafety.kt
          grep -q 'HeldTicketMergeSplitPolicy' app/src/main/java/jp/co/tenposinfo/register/HeldTicketSafety.kt
          grep -q 'TICKET_SPLIT' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q '結合確定' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q '分割実行' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/HeldTicketOperationsUi.kt
          ! grep -R -q --include='*.kt' 'putString("access_token"' app/src/main management-app/src/main
          ! grep -R -q --include='*.kt' 'putString("refresh_token"' app/src/main management-app/src/main

      - name: Verify launcher and orientation configuration
        shell: bash
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          plus_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' management-app/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$plus_launcher_count" -eq 1
          grep -q 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="sensorPortrait"' management-app/src/main/AndroidManifest.xml
          ! grep -q 'android:screenOrientation="landscape"' management-app/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug

      - name: Prepare named APKs and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          register_apk=artifacts/TSUGUREGI_v0.57.0_dev1_held_ticket_operations_ui_debug.apk
          plus_apk=artifacts/TSUGUREGI_PLUS_v0.14.0_dev1_sync_operations_dashboard_debug.apk
          cd_apk=artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$register_apk"
          cp management-app/build/outputs/apk/debug/management-app-debug.apk "$plus_apk"
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk "$cd_apk"
          sha256sum "$register_apk" | tee "$register_apk.sha256"
          sha256sum "$plus_apk" | tee "$plus_apk.sha256"
          sha256sum "$cd_apk" | tee "$cd_apk.sha256"
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' "$register_apk" | tee artifacts/build-summary.txt
          stat --printf='MANAGEMENT_APP_APK_SIZE_BYTES=%s\n' "$plus_apk" | tee -a artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' "$cd_apk" | tee -a artifacts/build-summary.txt
          keytool -list -v \
            -keystore app/build/signing/tsuguregi-development.jks \
            -storepass tsuguregi-dev \
            -alias tsuguregi-dev \
            | awk -F': ' '/SHA1:/{print "DEVELOPMENT_SIGNING_SHA1=" $2} /SHA256:/{print "DEVELOPMENT_SIGNING_SHA256=" $2}' \
            | tee -a artifacts/build-summary.txt
          cat >> artifacts/build-summary.txt <<'EOF'
          REGISTER_VERSION_NAME=0.57.0-dev.1
          REGISTER_VERSION_CODE=87
          REGISTER_APPLICATION_ID_DEBUG=jp.co.tenposinfo.register.dev
          MANAGEMENT_APP_VERSION_NAME=0.14.0-dev.1
          MANAGEMENT_APP_VERSION_CODE=14
          MANAGEMENT_APP_APPLICATION_ID_DEBUG=jp.co.tenposinfo.register.plus.dev
          CUSTOMER_DISPLAY_VERSION_NAME=0.14.0-dev.1
          CUSTOMER_DISPLAY_VERSION_CODE=7
          GOOGLE_EASY_CONNECT=true
          GOOGLE_EASY_CONNECT_ACCOUNT_SELECTION_ONLY=true
          GOOGLE_EASY_CONNECT_DIRECT_API_DEFAULT=true
          GOOGLE_EASY_CONNECT_COMPATIBILITY_FOLDER_RECOVERY_ONLY=true
          GOOGLE_EASY_CONNECT_AUTOMATIC_CONNECTION_TEST=true
          GOOGLE_EASY_CONNECT_AUTOMATIC_INITIAL_SYNC=true
          SYNC_OPERATIONS_DASHBOARD=true
          SYNC_OPERATIONS_INDIVIDUAL_RETRY=true
          SYNC_OPERATIONS_FORCE_REIMPORT_FROM_DAILY_UI=false
          SYNC_OPERATIONS_REJECTION_HISTORY_DELETED_ON_RETRY=false
          SYNC_OPERATIONS_SCHEDULER_VISIBILITY=true
          HELD_TICKET_MERGE_SPLIT_ENGINE=true
          HELD_TICKET_MERGE_SPLIT_SQLITE_ATOMIC=true
          HELD_TICKET_SPLIT_DISCOUNT_PRESERVED=true
          HELD_TICKET_SPLIT_TAX_SNAPSHOT_PRESERVED=true
          HELD_TICKET_MERGE_SPLIT_UI=true
          HELD_TICKET_MERGE_CONFIRMATION=true
          HELD_TICKET_SPLIT_QUANTITY_UI=true
          GOOGLE_DRIVE_DIAGNOSTIC_TOKENS_INCLUDED=false
          GOOGLE_DRIVE_DIAGNOSTIC_SALES_JSON_INCLUDED=false
          GOOGLE_DRIVE_DIAGNOSTIC_CONTENT_URI_INCLUDED=false
          REAL_DEVICE_HELD_TICKET_MERGE_SPLIT_VERIFICATION=required
          REAL_DEVICE_SYNC_OPERATIONS_VERIFICATION=required
          SIGNING=development-not-production
          EOF
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.57.0-dev1-held-ticket-operations-ui-apks
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
