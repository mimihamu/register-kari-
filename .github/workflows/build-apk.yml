name: Build つぐレジ APK

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: v067-summary-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-v067-summary:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.67 head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.67
          fetch-depth: 0
      - name: Restore full CI and fix build summary metadata
        run: python tools/v067_fix_build_summary.py
      - name: Commit generated metadata fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/build-apk.yml tools/v067_fix_build_summary.py
          git commit -m "v0.67 fix artifact build summary metadata"
          git push origin HEAD:develop/v0.67
