name: Apply one-time v0.28 source deduplication

on:
  push:
    branches:
      - develop/v0.28

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v0.28
        uses: actions/checkout@v4
        with:
          ref: develop/v0.28
          fetch-depth: 0

      - name: Remove duplicate UI blocks and restore formal CI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt')
          main = main_path.read_text()
          line = '    val columnGap = if (compact) 6.dp else 8.dp\n'
          first = main.find(line)
          if first < 0:
              raise RuntimeError('columnGap declaration missing')
          main = main[:first + len(line)] + main[first + len(line):].replace(line, '')
          main_path.write_text(main)

          catalog_path = Path('app/src/main/java/jp/co/tenposinfo/register/CatalogSettingsActivity.kt')
          catalog = catalog_path.read_text()
          catalog_block = '''            Spacer(Modifier.height(12.dp))
            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                OutlinedButton(
                    onClick = onDynamic,
                    modifier = Modifier.width(240.dp).height(46.dp),
                ) { Text("任意税率・メニュー改定", fontWeight = FontWeight.Bold) }
            }
'''
          first = catalog.find(catalog_block)
          if first < 0:
              raise RuntimeError('catalog navigation block missing')
          catalog = catalog[:first + len(catalog_block)] + catalog[first + len(catalog_block):].replace(catalog_block, '')
          catalog_path.write_text(catalog)

          dynamic_path = Path('app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt')
          dynamic = dynamic_path.read_text()
          dynamic_block = '''            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                OutlinedButton(onClick = onTaxInvoice, modifier = Modifier.weight(1f).height(46.dp)) {
                    Text("税・インボイス", fontWeight = FontWeight.Bold)
                }
                OutlinedButton(onClick = onRevisionEditor, modifier = Modifier.weight(1f).height(46.dp)) {
                    Text("改定内容編集", fontWeight = FontWeight.Bold)
                }
                OutlinedButton(onClick = onSync, modifier = Modifier.weight(1f).height(46.dp)) {
                    Text("同期基盤", fontWeight = FontWeight.Bold)
                }
            }
            Spacer(Modifier.height(14.dp))
'''
          first = dynamic.find(dynamic_block)
          if first < 0:
              raise RuntimeError('dynamic navigation block missing')
          dynamic = dynamic[:first + len(dynamic_block)] + dynamic[first + len(dynamic_block):].replace(dynamic_block, '')
          dynamic_path.write_text(dynamic)
          PY

          git show HEAD^:.github/workflows/build-apk.yml > .github/workflows/build-apk.yml

          test "$(grep -c 'val columnGap = if (compact) 6.dp else 8.dp' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt)" -eq 1
          test "$(grep -c 'Text("任意税率・メニュー改定"' app/src/main/java/jp/co/tenposinfo/register/CatalogSettingsActivity.kt)" -eq 1
          test "$(grep -c 'Text("税・インボイス"' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt)" -eq 1
          test "$(grep -c 'Text("改定内容編集"' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt)" -eq 1
          test "$(grep -c 'Text("同期基盤"' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt)" -eq 1
          grep -q 'name: Build つぐレジ APK' .github/workflows/build-apk.yml
          git diff --check

      - name: Commit fixed sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app .github/workflows/build-apk.yml
          git commit -m 'fix: remove duplicated v0.28 UI blocks'
          git push origin HEAD:develop/v0.28
