name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v0.32 sources
        run: |
          set -euo pipefail
          grep -q 'versionCode = 62' app/build.gradle.kts
          grep -q 'versionName = "0.32.0-dev.1"' app/build.gradle.kts
          grep -q 'versionCode = 6' customer-display/build.gradle.kts
          grep -q 'versionName = "0.13.0-dev.6"' customer-display/build.gradle.kts

          test -s app/src/main/java/jp/co/tenposinfo/register/ResponsiveLayoutV029.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/OperationsNavigationPoliciesV030.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/BusinessStartActivityV030.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/OperationsHubActivityV030.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/SettlementActivityV030.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryActivityV030.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/CatalogHubActivityV030.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogHubActivityV030.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V030BusinessStartNavigationTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V030ResponsiveManagementTest.kt
          test -s docs/V0.30_BUSINESS_START_NAVIGATION_FIX.md
          test -s docs/V0.30_RESPONSIVE_MANAGEMENT_REQUIREMENTS.md
          test -s docs/V0.30_RELEASE_NOTES.md
          test -s docs/V0.30_VALIDATION_MATRIX.md
          test -s app/src/test/java/jp/co/tenposinfo/register/V032PrintQueueOperationsTest.kt
          test -s docs/V0.32_PRINT_QUEUE_OPERATIONS.md
          test -s docs/V0.32_RELEASE_NOTES.md
          test -s app/src/test/java/jp/co/tenposinfo/register/V031PrinterPaperSettingTest.kt
          test -s docs/V0.31_PRINTER_PAPER_WIDTH.md
          test -s docs/V0.31_RELEASE_NOTES.md
          test -s app/src/test/java/jp/co/tenposinfo/register/V029ResponsiveLayoutTest.kt
          test -s docs/V0.29_RESPONSIVE_LAYOUT_REQUIREMENTS.md
          test -s docs/V0.29_RELEASE_NOTES.md
          test -s app/src/main/java/jp/co/tenposinfo/register/RegisterUiChromeV028.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V028UiStabilityTest.kt

          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/jp/co/tenposinfo/register')
          main = (root / 'MainActivity.kt').read_text()
          responsive = (root / 'ResponsiveLayoutV029.kt').read_text()
          catalog = (root / 'CatalogSettingsActivity.kt').read_text()
          dynamic = (root / 'DynamicCatalogSettingsActivity.kt').read_text()
          provider = (root / 'CatalogBootstrapProvider.kt').read_text()
          chrome = (root / 'RegisterUiChromeV028.kt').read_text()
          application = (root / 'RegisterApplication.kt').read_text()
          policies = (root / 'OperationsNavigationPoliciesV030.kt').read_text()
          business = (root / 'BusinessStartActivityV030.kt').read_text()
          hub = (root / 'OperationsHubActivityV030.kt').read_text()
          settlement = (root / 'SettlementActivityV030.kt').read_text()
          history = (root / 'SettlementHistoryActivityV030.kt').read_text()
          catalog_hub = (root / 'CatalogHubActivityV030.kt').read_text()
          dynamic_hub = (root / 'DynamicCatalogHubActivityV030.kt').read_text()
          admin = (root / 'AdminSettingsActivity.kt').read_text()
          coordinator = (root / 'SecureOperationsCoordinator.kt').read_text()
          printer_settings = (root / 'AdminSettingsStore.kt').read_text()
          operations = (root / 'OperationsActivity.kt').read_text()
          operations_store = (root / 'OperationsStore.kt').read_text()
          receipt = (root / 'Receipt.kt').read_text()
          queue = (root / 'UnifiedPrintQueue.kt').read_text()
          queue_ui = (root / 'UnifiedPrintQueueActivity.kt').read_text()
          database = (root / 'RegisterDatabase.kt').read_text()
          advanced = (root / 'AdvancedOperationsStore.kt').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()

          assert 'TOP_BAR_ARGB: Long = 0xFF173F6B' in chrome
          assert 'MIN_TOUCH_DP = 48' in responsive
          assert 'MAX_KEY_HEIGHT_DP = 80' in responsive
          assert 'MAX_FUNCTION_HEIGHT_DP = 64' in responsive
          assert 'RegisterWindowClass.COMPACT' in responsive
          assert 'configuration.fontScale' in responsive
          assert 'scrollRequired' in responsive

          assert main.count('RegisterResponsiveLayoutPolicy.keypadMetrics(') == 2
          assert main.count('BoxWithConstraints(Modifier.fillMaxSize())') >= 2
          assert 'buttonHeightDp: Int? = null' in main
          assert 'rowGapDp: Int? = null' in main
          assert 'heightDp: Int? = null' in main
          assert 'responsive.salesListWeight' in main
          assert 'responsive.salesKeypadWeight' in main
          assert 'responsive.salesProductsWeight' in main
          assert 'responsive.paymentDetailWeight' in main
          assert 'responsive.paymentKeypadWeight' in main
          assert 'keypad.scrollRequired' in main
          assert 'Modifier.width(430.dp).fillMaxHeight()' not in main
          assert 'Modifier.weight(0.24f).fillMaxHeight()' not in main
          assert 'Modifier.fillMaxWidth().height(76.dp)' not in main

          for forbidden in (
              'FrameLayout.LayoutParams',
              'installDynamicCatalogButton',
              'installRevisionEditorButton',
              'installTaxInvoiceButton',
              'installSyncButton',
          ):
              assert forbidden not in provider, forbidden

          assert catalog.count('Text("任意税率・メニュー改定"') == 1
          assert dynamic.count('Text("税・インボイス"') == 1
          assert dynamic.count('Text("改定内容編集"') == 1
          assert dynamic.count('Text("同期基盤"') == 1

          assert 'RegisterPermission.SETTLEMENT' not in application
          assert 'BusinessStartNavigationPolicyV030.canOpenBusinessStart' in application
          assert 'ManagementNavigationPolicyV030.canOpenManagement' in application
          assert 'OperationsAccessPolicyV030.canEnter' in application
          assert 'BusinessStartActivityV030::class.java' in application
          assert 'OperationsHubActivityV030::class.java' in application
          assert 'ManagementNavigationPolicyV030::canOpenManagement' in main
          assert 'OperationsHubActivityV030::class.java' in main
          assert 'OperationsAction.SETTLEMENT' not in coordinator
          assert 'RegisterPermission.Z_SETTLEMENT in permissions' in policies

          legacy_references = sorted(
              path.name for path in root.glob('*.kt')
              if 'RegisterPermission.SETTLEMENT' in path.read_text()
          )
          assert legacy_references == ['SettlementPreflightV026.kt'], legacy_references

          for source in (business, hub, settlement, history, catalog_hub, dynamic_hub):
              assert 'rememberRegisterResponsiveMetrics()' in source
              assert 'BoxWithConstraints' in source
              assert 'verticalScroll' in source
              assert '0xFF173F6B' in source

          assert 'SecureOperationsCoordinator' in business
          assert 'secureStore.startBusinessDay' in business
          assert 'secureStore.recordSettlement' in settlement
          assert 'secureStore.reprintSettlement' in history
          assert 'OperationsActivity::class.java' in hub

          assert 'object PrinterPaperSettingPolicy' in printer_settings
          assert 'AsChoiceButton("58mm"' in admin
          assert 'ChoiceButton("58mm"' not in main
          assert 'OpChoiceButton("58mm"' not in operations
          assert 'HistoryChoiceButtonV030("58mm"' not in history
          assert 'fun enqueueReprint(saleId: Long): Long' in (root / 'RegisterDatabase.kt').read_text()
          assert 'fun previewSettlement(reportId: Long): String' in operations_store
          assert 'PrinterPaperSettingPolicy.currentPaper(appContext)' in operations_store
          assert 'PrinterPaperSettingPolicy.paper(configuration)' in receipt

          assert 'DISCARDED' in receipt
          assert 'object UnifiedPrintFailureClassifier' in queue
          assert 'object UnifiedPrintQueueFilterPolicy' in queue
          assert 'object UnifiedPrintJobActionPolicy' in queue
          assert 'PRINT_JOB_RETRY_REQUESTED' in queue
          assert 'PRINT_JOB_FORCE_SEND_SUCCEEDED' in queue
          assert 'PRINT_JOB_FORCE_SEND_FAILED' in queue
          assert 'PRINT_JOB_DISCARDED' in database
          assert 'PRINT_JOB_DISCARDED' in advanced
          assert 'writableDatabase.runInTransaction' in database
          assert 'db.beginTransaction()' in advanced
          assert 'settingsStore.managerNameForPin(managerPin)' in queue
          assert 'fun discardPrintJob(' in database
          assert 'fun discardDocumentPrint(' in advanced
          assert 'PrintJobStatus.DISCARDED.name' in operations_store
          assert 'PrintJobStatus.DISCARDED.name' in advanced
          assert 'rememberRegisterResponsiveMetrics()' in queue_ui
          assert 'BoxWithConstraints' in queue_ui
          assert 'verticalScroll' in queue_ui
          assert '印刷時指定なし' in queue_ui
          assert '責任者承認付き強制印刷' in queue_ui
          assert '破棄理由（4文字以上・監査ログへ保存）' in queue_ui
          assert 'ChoiceButton("58mm"' not in queue_ui
          assert 'ChoiceButton("80mm"' not in queue_ui

          assert 'CatalogHubActivityV030::class.java' in admin
          assert 'CatalogNavigationContractV030.EXTRA_INITIAL_SCREEN' in catalog
          assert 'CatalogNavigationContractV030.PRODUCTS -> CatalogScreen.PRODUCTS' in catalog
          assert 'DynamicCatalogHubActivityV030::class.java' in catalog
          assert 'DynamicCatalogNavigationContractV030.EXTRA_INITIAL_SCREEN' in dynamic
          assert 'DynamicCatalogNavigationContractV030.TAX_RULES -> DynamicCatalogScreen.TAX_RULES' in dynamic
          assert 'Intent(this, OperationsHubActivityV030::class.java)' in business

          for activity in (
              '.BusinessStartActivityV030',
              '.OperationsHubActivityV030',
              '.SettlementActivityV030',
              '.SettlementHistoryActivityV030',
              '.CatalogHubActivityV030',
              '.DynamicCatalogHubActivityV030',
          ):
              assert f'android:name="{activity}"' in manifest
          PY

          for test_file in \
            V032PrintQueueOperationsTest.kt \
            V031PrinterPaperSettingTest.kt \
            V030ResponsiveManagementTest.kt \
            V030BusinessStartNavigationTest.kt \
            V029ResponsiveLayoutTest.kt \
            V028UiStabilityTest.kt \
            V027SettlementHistoryReprintTest.kt \
            V026SettlementPreflightPermissionTest.kt \
            V025InspectionSettlementNavigationTest.kt \
            V024BusinessSessionLifecycleTest.kt \
            V023AutoBackupRetentionTest.kt \
            V022BackupPortabilityTest.kt \
            V021DataProtectionPolicyTest.kt \
            V020OperationsRoutingTest.kt \
            V019PartialReturnPolicyTest.kt \
            V018BusinessSessionIntegrationTest.kt \
            V017OperationExecutionSafetyTest.kt \
            V016OperationsAuthorizationTest.kt \
            V015TaxInvoicePolicyTest.kt \
            V014HeldTicketSafetyTest.kt; do
            test -s "app/src/test/java/jp/co/tenposinfo/register/$test_file"
          done

          operations_count=$(grep -c 'android:name=".OperationsActivity"' app/src/main/AndroidManifest.xml)
          business_start_count=$(grep -c 'android:name=".BusinessStartActivityV030"' app/src/main/AndroidManifest.xml)
          hub_count=$(grep -c 'android:name=".OperationsHubActivityV030"' app/src/main/AndroidManifest.xml)
          settlement_count=$(grep -c 'android:name=".SettlementActivityV030"' app/src/main/AndroidManifest.xml)
          history_count=$(grep -c 'android:name=".SettlementHistoryActivityV030"' app/src/main/AndroidManifest.xml)
          catalog_hub_count=$(grep -c 'android:name=".CatalogHubActivityV030"' app/src/main/AndroidManifest.xml)
          dynamic_hub_count=$(grep -c 'android:name=".DynamicCatalogHubActivityV030"' app/src/main/AndroidManifest.xml)
          test "$operations_count" -eq 1
          test "$business_start_count" -eq 1
          test "$hub_count" -eq 1
          test "$settlement_count" -eq 1
          test "$history_count" -eq 1
          test "$catalog_hub_count" -eq 1
          test "$dynamic_hub_count" -eq 1
          ! grep -q '<activity-alias' app/src/main/AndroidManifest.xml
          test ! -e app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsActivity.kt
          test ! -e tools/apply_v029.py
          test ! -e tools/fix_apply_v029.py
          test ! -d tools/__pycache__

      - name: Verify launcher configuration
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$(grep -c 'android.intent.category.LAUNCHER' app/src/debug/AndroidManifest.xml || true)" -eq 0
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' customer-display/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Prepare named APKs and SHA-256
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.32.0_dev1_print_queue_operations_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
          sha256sum artifacts/TSUGUREGI_v0.32.0_dev1_print_queue_operations_debug.apk | tee artifacts/TSUGUREGI_v0.32.0_dev1_print_queue_operations_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.32.0_dev1_print_queue_operations_debug.apk | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee -a artifacts/build-summary.txt
          echo 'REGISTER_VERSION_NAME=0.32.0-dev.1' >> artifacts/build-summary.txt
          echo 'REGISTER_VERSION_CODE=62' >> artifacts/build-summary.txt
          echo 'CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.6' >> artifacts/build-summary.txt
          echo 'CUSTOMER_DISPLAY_VERSION_CODE=6' >> artifacts/build-summary.txt
          echo 'UI_TOP_BAR=fixed-navy' >> artifacts/build-summary.txt
          echo 'UI_RESPONSIVE_POLICY=main-scr200-scr270-business-start-management-x-z-history' >> artifacts/build-summary.txt
          echo 'UI_KEYPAD_HEIGHT_DP=48-80-adaptive' >> artifacts/build-summary.txt
          echo 'UI_BUSINESS_START_DIRECT_ROUTE=enabled' >> artifacts/build-summary.txt
          echo 'UI_MANAGEMENT_RESPONSIVE_HUB=enabled' >> artifacts/build-summary.txt
          echo 'UI_X_Z_RESPONSIVE=enabled' >> artifacts/build-summary.txt
          echo 'UI_SETTLEMENT_HISTORY_RESPONSIVE=enabled' >> artifacts/build-summary.txt
          echo 'PRINT_PAPER_WIDTH_SOURCE=printer-settings-only' >> artifacts/build-summary.txt
          echo 'PRINT_TIME_PAPER_WIDTH_SELECTION=disabled' >> artifacts/build-summary.txt
          echo 'PRINT_QUEUE_STATUS=active-action-required-completed-discarded' >> artifacts/build-summary.txt
          echo 'PRINT_QUEUE_FILTERS=status-type-time-attempts-query' >> artifacts/build-summary.txt
          echo 'PRINT_QUEUE_FAILURE_CLASSIFICATION=enabled' >> artifacts/build-summary.txt
          echo 'PRINT_QUEUE_FORCE_SEND=manager-pin-and-paper-confirmation' >> artifacts/build-summary.txt
          echo 'PRINT_QUEUE_DISCARD=manager-pin-reason-audit' >> artifacts/build-summary.txt
          echo 'PRINT_QUEUE_DISCARDED_EXCLUDED_FROM_PENDING=enabled' >> artifacts/build-summary.txt
          echo 'PRINT_QUEUE_RESPONSIVE=three-column-or-stacked-scroll' >> artifacts/build-summary.txt
          echo 'UI_SCR200_RESPONSIVE_HUB=enabled' >> artifacts/build-summary.txt
          echo 'UI_SCR270_RESPONSIVE_HUB=enabled' >> artifacts/build-summary.txt
          echo 'UI_COMPACT_FALLBACK=vertical-scroll' >> artifacts/build-summary.txt
          echo 'UI_SUPPORTED_PROFILES=800x480-to-1920x1080' >> artifacts/build-summary.txt
          echo 'LEGACY_SETTLEMENT_UI_REFERENCE=removed' >> artifacts/build-summary.txt
          echo 'SETTLEMENT_HISTORY=business-session' >> artifacts/build-summary.txt
          echo 'Z_PREFLIGHT_HELD_TICKETS=blocked' >> artifacts/build-summary.txt
          echo 'Z_SETTLEMENT=atomic-business-session-close' >> artifacts/build-summary.txt
          echo 'AUTO_BACKUP_TRIGGER=committed-z-settlement' >> artifacts/build-summary.txt
          echo 'SIGNING=development-not-production' >> artifacts/build-summary.txt
          echo 'REAL_DEVICE_BUSINESS_START_NAVIGATION_VERIFICATION=required' >> artifacts/build-summary.txt
          echo 'REAL_DEVICE_MANAGEMENT_RESPONSIVE_VERIFICATION=required' >> artifacts/build-summary.txt
          echo 'REAL_DEVICE_SCR200_SCR270_NAVIGATION_VERIFICATION=required' >> artifacts/build-summary.txt
          echo 'REAL_DEVICE_ALL_SCREEN_DISPLAY_SIZE_VERIFICATION=required' >> artifacts/build-summary.txt
          echo 'REAL_DEVICE_PRINT_QUEUE_OPERATIONS_VERIFICATION=required' >> artifacts/build-summary.txt
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.32.0-dev1-print-queue-operations-apks
          path: |
            artifacts/TSUGUREGI_v0.32.0_dev1_print_queue_operations_debug.apk
            artifacts/TSUGUREGI_v0.32.0_dev1_print_queue_operations_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
