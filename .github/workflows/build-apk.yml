name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v0.41 sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 71' app/build.gradle.kts
          grep -q 'versionName = "0.41.0-dev.1"' app/build.gradle.kts
          grep -q 'versionCode = 7' customer-display/build.gradle.kts
          grep -q 'versionName = "0.14.0-dev.1"' customer-display/build.gradle.kts
          grep -q 'versionCode = 3' management-app/build.gradle.kts
          grep -q 'versionName = "0.3.0-dev.1"' management-app/build.gradle.kts
          grep -q 'include(":management-app")' settings.gradle.kts

          for file in \
            management-app/build.gradle.kts \
            management-app/src/main/AndroidManifest.xml \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/MainActivity.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/ManagementMobileScreen.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/ManagementDatabase.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/SalesJournalImportContract.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/SalesJournalImportRepository.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/SalesReporting.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/SalesJournalImportContractTest.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/SalesReportCalculatorTest.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V039ManagementImportIntegrationTest.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V040ManagementSalesReportingIntegrationTest.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V041ManagementPortraitMobileTest.kt \
            docs/V0.41_TSUGUREGI_PLUS_MOBILE_PORTRAIT.md \
            docs/V0.41_RELEASE_NOTES.md \
            docs/V0.40_TSUGUREGI_PLUS_SALES_REPORTING.md \
            docs/V0.40_RELEASE_NOTES.md \
            docs/V0.39_TSUGUREGI_PLUS_IMPORT.md \
            docs/V0.39_RELEASE_NOTES.md \
            app/src/main/java/jp/co/tenposinfo/register/OutboxDeliveryOperations.kt \
            app/src/main/java/jp/co/tenposinfo/register/OutboxDeliveryOperationsPanel.kt \
            app/src/test/java/jp/co/tenposinfo/register/V038OutboxDeliveryOperationsTest.kt \
            docs/V0.38_OUTBOX_DELIVERY_OPERATIONS.md \
            docs/V0.38_RELEASE_NOTES.md \
            app/src/main/java/jp/co/tenposinfo/register/CustomerDisplayPresentation.kt \
            app/src/main/java/jp/co/tenposinfo/register/CustomerDisplayProtocol.kt \
            customer-display/src/main/java/jp/co/tenposinfo/register/cd/CustomerDisplayPresentation.kt \
            customer-display/src/main/java/jp/co/tenposinfo/register/cd/CustomerDisplaySnapshotStore.kt \
            customer-display/src/main/java/jp/co/tenposinfo/register/cd/MainActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/SalesJournalJsonContract.kt \
            app/src/main/java/jp/co/tenposinfo/register/BusinessSyncFoundation.kt \
            app/src/main/java/jp/co/tenposinfo/register/OutboxExternalDelivery.kt \
            app/src/main/java/jp/co/tenposinfo/register/ExternalBackupSync.kt \
            app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt \
            app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueue.kt \
            app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt \
            app/src/test/java/jp/co/tenposinfo/register/V036SalesJournalJsonContractTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V035OutboxExternalDeliveryTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V034ExternalBackupMirrorTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V033PeriodicBackupSettingsTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V032PrintQueueOperationsTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V031PrinterPaperSettingTest.kt \
            docs/schemas/tsuguregi-sales-journal-v1.schema.json; do
            test -s "$file"
          done

          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/jp/co/tenposinfo/register')
          plus = Path('management-app/src/main/java/jp/co/tenposinfo/register/plus')
          activity = (plus / 'MainActivity.kt').read_text()
          mobile = (plus / 'ManagementMobileScreen.kt').read_text()
          contract = (plus / 'SalesJournalImportContract.kt').read_text()
          database = (plus / 'ManagementDatabase.kt').read_text()
          repository = (plus / 'SalesJournalImportRepository.kt').read_text()
          reporting = (plus / 'SalesReporting.kt').read_text()
          plus_manifest = Path('management-app/src/main/AndroidManifest.xml').read_text()
          register_manifest = Path('app/src/main/AndroidManifest.xml').read_text()

          assert 'TsuguRegiPlusMobileScreen' in activity
          assert 'android:screenOrientation="sensorPortrait"' in plus_manifest
          assert 'android:screenOrientation="landscape"' not in plus_manifest
          assert 'android:screenOrientation="landscape"' in register_manifest

          for token in (
              'NavigationBar',
              'ManagementSection.SALES',
              'ManagementSection.TRANSACTIONS',
              'ManagementSection.IMPORTS',
              'SalesOverviewScreen',
              'TransactionsScreen',
              'ImportOperationsScreen',
              'LazyColumn',
              'MobileFilterMenu',
              'JSON取込',
              '純売上',
              '支払方法別',
              '税額内訳',
              '隔離データ',
          ):
              assert token in mobile, token
          assert 'verticalScroll(rememberScrollState())' not in mobile

          for token in (
              'jp.co.tenposinfo.tsuguregi.sales-journal',
              'SUPPORTED_SCHEMA_VERSION = 1',
              'duplicateImportKey',
              'supportedEventTypes',
              'supportedPayloadSchemas',
              'PAYLOAD_SCHEMA_MISMATCH',
          ):
              assert token in contract, token
          for token in (
              'CREATE TABLE import_runs',
              'CREATE TABLE imported_journal',
              'CREATE TABLE import_rejections',
              'DATABASE_VERSION = 2',
              'idx_imported_journal_report',
          ):
              assert token in database, token
          for token in (
              'fun importDocuments',
              'SQLiteDatabase.CONFLICT_IGNORE',
              'fun reportFilterOptions',
              'fun salesReport',
              'fun recentRejections',
          ):
              assert token in repository, token
          for token in (
              'data class SalesReportFilter',
              'data class SalesReport',
              'object SalesReportCalculator',
              'EVENT_SALE',
              'EVENT_REVERSAL',
              'unmatchedReversalCount',
          ):
              assert token in reporting, token

          operations = (root / 'OutboxDeliveryOperations.kt').read_text()
          delivery = (root / 'OutboxExternalDelivery.kt').read_text()
          cd_contract = (root / 'CustomerDisplayPresentation.kt').read_text()
          cd_protocol = (root / 'CustomerDisplayProtocol.kt').read_text()
          cd_screen = Path('customer-display/src/main/java/jp/co/tenposinfo/register/cd/MainActivity.kt').read_text()
          journal_contract = (root / 'SalesJournalJsonContract.kt').read_text()
          foundation = (root / 'BusinessSyncFoundation.kt').read_text()
          schema = Path('docs/schemas/tsuguregi-sales-journal-v1.schema.json').read_text()

          assert 'OutboxDeliveryDashboardCounts' in operations
          assert 'fun retryItem' in operations
          assert "status='STAGED'" in delivery
          assert 'MAX_ATTEMPTS = 10' in delivery
          assert 'textScalePercent' in cd_contract
          assert 'put("presentation"' in cd_protocol
          assert 'snapshotStore.save(snapshot)' in cd_screen
          assert 'DUPLICATE_KEY_VERSION = 1' in journal_contract
          assert 'SalesJournalJsonContract.wrap' in foundation
          assert 'jp.co.tenposinfo.tsuguregi.sales-journal' in schema

          for version in ('v041', 'v040', 'v039', 'v038', 'v037', 'v036', 'v035', 'v034'):
              assert not list(Path('tools').glob(f'{version}*'))
              assert not Path(f'.github/workflows/{version}-apply.yml').exists()
          PY

      - name: Verify portrait management configuration
        shell: bash
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          plus_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' management-app/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$plus_launcher_count" -eq 1
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' customer-display/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' management-app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="sensorPortrait"' management-app/src/main/AndroidManifest.xml
          ! grep -q 'android:screenOrientation="landscape"' management-app/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug

      - name: Prepare named APKs and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.41.0_dev1_management_mobile_portrait_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk
          cp management-app/build/outputs/apk/debug/management-app-debug.apk artifacts/TSUGUREGI_PLUS_v0.3.0_dev1_mobile_portrait_debug.apk

          sha256sum artifacts/TSUGUREGI_v0.41.0_dev1_management_mobile_portrait_debug.apk | tee artifacts/TSUGUREGI_v0.41.0_dev1_management_mobile_portrait_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk | tee artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_PLUS_v0.3.0_dev1_mobile_portrait_debug.apk | tee artifacts/TSUGUREGI_PLUS_v0.3.0_dev1_mobile_portrait_debug.apk.sha256

          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.41.0_dev1_management_mobile_portrait_debug.apk | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk | tee -a artifacts/build-summary.txt
          stat --printf='MANAGEMENT_APP_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_PLUS_v0.3.0_dev1_mobile_portrait_debug.apk | tee -a artifacts/build-summary.txt
          cat >> artifacts/build-summary.txt <<'EOF'
          REGISTER_VERSION_NAME=0.41.0-dev.1
          REGISTER_VERSION_CODE=71
          REGISTER_ORIENTATION=landscape
          CUSTOMER_DISPLAY_VERSION_NAME=0.14.0-dev.1
          CUSTOMER_DISPLAY_VERSION_CODE=7
          MANAGEMENT_APP_VERSION_NAME=0.3.0-dev.1
          MANAGEMENT_APP_VERSION_CODE=3
          MANAGEMENT_APP_APPLICATION_ID=jp.co.tenposinfo.register.plus
          MANAGEMENT_APP_ORIENTATION=sensorPortrait
          MANAGEMENT_APP_NAVIGATION=sales-transactions-imports
          MANAGEMENT_APP_DEFAULT_SECTION=sales
          MANAGEMENT_APP_LIST_RENDERING=lazy-column
          MANAGEMENT_IMPORT_SOURCE=android-saf-multiple-documents
          MANAGEMENT_IMPORT_SCHEMA=jp.co.tenposinfo.tsuguregi.sales-journal
          MANAGEMENT_IMPORT_DUPLICATE_POLICY=duplicate-import-key-primary-key-conflict-ignore
          MANAGEMENT_IMPORT_REJECTION_STORAGE=sqlite-quarantine
          MANAGEMENT_DATABASE=sqlite-open-helper-version-2
          MANAGEMENT_SALES_REPORTING=true
          MANAGEMENT_REPORT_FILTERS=business-date-store-terminal
          MANAGEMENT_REPORT_NETTING=sale-positive-reversal-negative
          MANAGEMENT_REPORT_NON_SALES_EXCLUDED=true
          MANAGEMENT_REPORT_DETAIL_LIMIT=50
          MANAGEMENT_PAYLOAD_PREVIEW_CHARACTERS=1200
          CUSTOMER_DISPLAY_STATE_CACHE_MAX_MINUTES=30
          OUTBOX_OPERATIONS_DASHBOARD=true
          OUTBOX_OPERATIONS_INDIVIDUAL_RETRY=true
          SIGNING=development-not-production
          REAL_DEVICE_MANAGEMENT_PORTRAIT_VERIFICATION=required
          REAL_DEVICE_MANAGEMENT_IMPORT_VERIFICATION=required
          REAL_DEVICE_CUSTOMER_DISPLAY_VERIFICATION=required
          EOF
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.41.0-dev1-management-mobile-portrait-apks
          path: |
            artifacts/TSUGUREGI_v0.41.0_dev1_management_mobile_portrait_debug.apk
            artifacts/TSUGUREGI_v0.41.0_dev1_management_mobile_portrait_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk
            artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk.sha256
            artifacts/TSUGUREGI_PLUS_v0.3.0_dev1_mobile_portrait_debug.apk
            artifacts/TSUGUREGI_PLUS_v0.3.0_dev1_mobile_portrait_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
