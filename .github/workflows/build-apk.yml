name: Generate and verify v0.53

on:
  push:
    branches:
      - develop/v0.53
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.53
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply v0.53 source changes
        run: python3 tools/v053_apply.py

      - name: Update cumulative current-version assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('app/src/test'), Path('management-app/src/test')]
          replacements = {
              'versionName = \\"0.52.0-dev.1\\"': 'versionName = \\"0.53.0-dev.1\\"',
              'versionName = \\"0.11.0-dev.1\\"': 'versionName = \\"0.12.0-dev.1\\"',
          }
          changed = 0
          for root in roots:
              for path in root.rglob('*.kt'):
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed += 1
          print(f'updated current-version assertions in {changed} test files')
          assert changed >= 10
          PY

      - name: Verify generated source markers
        run: |
          set -euo pipefail
          grep -q 'versionCode = 83' app/build.gradle.kts
          grep -q 'versionName = "0.53.0-dev.1"' app/build.gradle.kts
          grep -q 'versionCode = 12' management-app/build.gradle.kts
          grep -q 'versionName = "0.12.0-dev.1"' management-app/build.gradle.kts
          test -s management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveSyncVerificationActivity.kt
          test -s management-app/src/test/java/jp/co/tenposinfo/register/plus/V053GoogleDriveSyncVerificationTest.kt
          test -s docs/V0.53_RELEASE_NOTES.md
          test ! -e tools/v053_apply.py
          test ! -e .github/workflows/v053-apply-temp.yml
          ! grep -R -q --include='*.kt' 'versionName = \\"0.52.0-dev.1\\"' app/src/test management-app/src/test
          ! grep -R -q --include='*.kt' 'versionName = \\"0.11.0-dev.1\\"' app/src/test management-app/src/test

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug

      - name: Commit generated v0.53 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m "v0.53 Google Drive sales sync verification and recovery"
          git push origin HEAD:develop/v0.53

      - name: Package generated source
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/v053-generated
          mkdir -p /tmp/v053-generated
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='*/build' ./ /tmp/v053-generated/repository/
          cd /tmp/v053-generated
          zip -qr "$GITHUB_WORKSPACE/v053-generated-source.zip" repository

      - name: Upload generated source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v053-generated-source
          path: v053-generated-source.zip
          if-no-files-found: error
          retention-days: 7
