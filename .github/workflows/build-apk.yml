name: v0.94 one-time DiagnosticScreen repair

on:
  push:
    branches:
      - develop/v0.94

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.94 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact guarded diagnostic responsive repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt"); t=p.read_text(encoding="utf-8"); s=t.index("private fun DiagnosticScreen("); e=t.index("private fun StatusRow(", s); b=t[s:e]; marker="    val diagnosticScroll = rememberScrollState()"; import sys; sys.exit(0) if marker in b else None; a="private fun DiagnosticScreen(restoredCount: Int, pendingPrints: Int, onComplete: () -> Unit) {\n    Column(modifier = Modifier.fillMaxSize()) {"; c="private fun DiagnosticScreen(restoredCount: Int, pendingPrints: Int, onComplete: () -> Unit) {\n    val responsive = rememberRegisterResponsiveMetrics()\n    val diagnosticScroll = rememberScrollState()\n    Column(modifier = Modifier.fillMaxSize()) {"; d="            modifier = Modifier.weight(1f).fillMaxWidth().padding(horizontal = 24.dp, vertical = 18.dp),\n            horizontalAlignment = Alignment.CenterHorizontally,\n            verticalArrangement = Arrangement.Center,"; f="            modifier = Modifier\n                .weight(1f)\n                .fillMaxWidth()\n                .verticalScroll(diagnosticScroll)\n                .padding(responsive.screenPaddingDp.dp),\n            horizontalAlignment = Alignment.CenterHorizontally,\n            verticalArrangement = if (responsive.isCompact) Arrangement.Top else Arrangement.Center,"; g="            Text(\"起動チェックを実行しました\", fontSize = 30.sp, fontWeight = FontWeight.Bold, color = Navy)\n            Spacer(Modifier.height(14.dp))\n            CardPanel(Modifier.width(700.dp).height(RegisterLayoutPolicy.DIAGNOSTIC_CARD_HEIGHT_DP.dp)) {"; h="            Text(\n                \"起動チェックを実行しました\",\n                fontSize = if (responsive.isCompact) 22.sp else 30.sp,\n                fontWeight = FontWeight.Bold,\n                color = Navy,\n                maxLines = 1,\n            )\n            Spacer(Modifier.height(if (responsive.isCompact) 8.dp else 14.dp))\n            CardPanel(\n                if (responsive.isCompact) {\n                    Modifier.fillMaxWidth().heightIn(min = 250.dp)\n                } else {\n                    Modifier.width(700.dp).height(RegisterLayoutPolicy.DIAGNOSTIC_CARD_HEIGHT_DP.dp)\n                },\n            ) {"; i="            Spacer(Modifier.height(14.dp))\n            BlueButton(\"診断完了・担当者選択へ\", onComplete, Modifier.width(340.dp).height(54.dp))"; j="            Spacer(Modifier.height(if (responsive.isCompact) 8.dp else 14.dp))\n            BlueButton(\n                \"診断完了・担当者選択へ\",\n                onComplete,\n                if (responsive.isCompact) {\n                    Modifier.fillMaxWidth().height(54.dp)\n                } else {\n                    Modifier.width(340.dp).height(54.dp)\n                },\n            )"; assert b.count(a)==1 and b.count(d)==1 and b.count(g)==1 and b.count(i)==1, "unexpected DiagnosticScreen source"; b=b.replace(a,c,1).replace(d,f,1).replace(g,h,1).replace(i,j,1); p.write_text(t[:s]+b+t[e:], encoding="utf-8")'
          git diff --check
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo "DiagnosticScreen already repaired"
            exit 0
          fi
          test "$changed" = "app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt"
          grep -q 'val diagnosticScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'Modifier.fillMaxWidth().heightIn(min = 250.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt

      - name: Commit diagnostic responsive repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          git commit -m "feat(v0.94): make startup diagnostic responsive"
          git push origin HEAD:develop/v0.94
