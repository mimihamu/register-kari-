name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v0.28 sources
        run: |
          set -euo pipefail
          grep -q 'versionCode = 58' app/build.gradle.kts
          grep -q 'versionName = "0.28.0-dev.1"' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime:2.11.2' app/build.gradle.kts
          grep -q 'versionCode = 6' customer-display/build.gradle.kts
          grep -q 'versionName = "0.13.0-dev.6"' customer-display/build.gradle.kts

          test -s app/src/main/java/jp/co/tenposinfo/register/RegisterUiChromeV028.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V028UiStabilityTest.kt
          test -s docs/V0.28_UI_STABILITY.md
          test -s docs/V0.28_RELEASE_NOTES.md
          grep -q 'TOP_BAR_ARGB: Long = 0xFF173F6B' app/src/main/java/jp/co/tenposinfo/register/RegisterUiChromeV028.kt
          grep -q 'COMPACT_VALUE_HEIGHT_DP = 46' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'COMPACT_KEY_HEIGHT_DP = 42' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'COMPACT_KEY_GAP_DP = 5' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'COMPACT_FUNCTION_HEIGHT_DP = 40' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          test "$(grep -c 'val columnGap = if (compact) 6.dp else 8.dp' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt)" -eq 1
          grep -q 'BlueButton(bottomActionLabel, onBottomAction, Modifier.weight(1f).height(buttonHeight))' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          ! grep -q 'Modifier.weight(1.4f).height(buttonHeight)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt

          ! grep -q 'FrameLayout.LayoutParams' app/src/main/java/jp/co/tenposinfo/register/CatalogBootstrapProvider.kt
          ! grep -q 'installDynamicCatalogButton' app/src/main/java/jp/co/tenposinfo/register/CatalogBootstrapProvider.kt
          ! grep -q 'installRevisionEditorButton' app/src/main/java/jp/co/tenposinfo/register/CatalogBootstrapProvider.kt
          ! grep -q 'installTaxInvoiceButton' app/src/main/java/jp/co/tenposinfo/register/CatalogBootstrapProvider.kt
          ! grep -q 'installSyncButton' app/src/main/java/jp/co/tenposinfo/register/CatalogBootstrapProvider.kt
          grep -q 'onDynamic' app/src/main/java/jp/co/tenposinfo/register/CatalogSettingsActivity.kt
          test "$(grep -c 'Text("任意税率・メニュー改定"' app/src/main/java/jp/co/tenposinfo/register/CatalogSettingsActivity.kt)" -eq 1
          grep -q 'onTaxInvoice' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt
          grep -q 'onRevisionEditor' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt
          grep -q 'onSync' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt
          test "$(grep -c 'Text("税・インボイス"' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt)" -eq 1
          test "$(grep -c 'Text("改定内容編集"' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt)" -eq 1
          test "$(grep -c 'Text("同期基盤"' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt)" -eq 1
          ! grep -R -q --include='*.kt' 'Text("REGISTER"' app/src/main/java/jp/co/tenposinfo/register

          grep -q 'configureRegisterSystemBars(window)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -q 'configureRegisterSystemBars(window)' app/src/main/java/jp/co/tenposinfo/register/CatalogSettingsActivity.kt
          grep -q 'configureRegisterSystemBars(window)' app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogSettingsActivity.kt
          grep -q 'configureRegisterSystemBars(window)' app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueueActivity.kt

          test -s app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryPolicyV027.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V027SettlementHistoryReprintTest.kt
          grep -q 'OperationsScreen.SETTLEMENT_HISTORY' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'SettlementSnapshotSchemaV027.savePaymentTotals' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'SETTLEMENT_REPRINT' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'fun reprintSettlement' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          grep -q '【再印字】' app/src/main/java/jp/co/tenposinfo/register/OperationDocuments.kt

          test -s app/src/main/java/jp/co/tenposinfo/register/SettlementPreflightV026.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V026SettlementPreflightPermissionTest.kt
          grep -q 'ZSettlementPreflightPolicy.evaluate' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'Z_SETTLEMENT_PENDING_PRINTS_ACKNOWLEDGED' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt

          test -s app/src/test/java/jp/co/tenposinfo/register/V025InspectionSettlementNavigationTest.kt
          grep -q 'OperationsScreen.X_INSPECTION' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'OperationsScreen.Z_SETTLEMENT' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'Z精算して営業を終了しますか？' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt

          test -s app/src/main/java/jp/co/tenposinfo/register/BusinessSessionV024.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V024BusinessSessionLifecycleTest.kt
          grep -q 'Z_SETTLEMENT:SESSION:' app/src/main/java/jp/co/tenposinfo/register/OperationExecutionSafety.kt
          ! grep -q 'business_date TEXT NOT NULL UNIQUE' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt

          test -s app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V023AutoBackupRetentionTest.kt
          grep -q 'AutoBackupScheduler.enqueueZSettlement' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt

          test -s app/src/test/java/jp/co/tenposinfo/register/V022BackupPortabilityTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V021DataProtectionPolicyTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V020OperationsRoutingTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V019PartialReturnPolicyTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V018BusinessSessionIntegrationTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V017OperationExecutionSafetyTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V016OperationsAuthorizationTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V015TaxInvoicePolicyTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V014HeldTicketSafetyTest.kt

          operations_count=$(grep -c 'android:name=".OperationsActivity"' app/src/main/AndroidManifest.xml)
          test "$operations_count" -eq 1
          ! grep -q '<activity-alias' app/src/main/AndroidManifest.xml
          ! grep -q 'AdvancedOperationsActivity' app/src/main/AndroidManifest.xml
          test ! -e app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsActivity.kt
          test ! -e tools/apply_v028.py
          test ! -e .github/workflows/v028-ui-diagnostic.yml
          test ! -e .github/workflows/v028-apply-ui-stability.yml
          test ! -e .github/workflows/v028-apply-ui-stability-push.yml
          test ! -e .github/workflows/v028-dedupe-ui.yml
          test ! -e .github/workflows/v028-promote-formal-ci.yml
          test ! -e .github/workflows/v028-finalize.yml

          git diff --check origin/develop/v0.27...HEAD

      - name: Verify launcher configuration
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$(grep -c 'android.intent.category.LAUNCHER' app/src/debug/AndroidManifest.xml || true)" -eq 0
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' customer-display/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Prepare named APKs and SHA-256
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.28.0_dev1_ui_stability_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
          sha256sum artifacts/TSUGUREGI_v0.28.0_dev1_ui_stability_debug.apk | tee artifacts/TSUGUREGI_v0.28.0_dev1_ui_stability_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.28.0_dev1_ui_stability_debug.apk | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee -a artifacts/build-summary.txt
          echo 'REGISTER_VERSION_NAME=0.28.0-dev.1' >> artifacts/build-summary.txt
          echo 'REGISTER_VERSION_CODE=58' >> artifacts/build-summary.txt
          echo 'CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.6' >> artifacts/build-summary.txt
          echo 'CUSTOMER_DISPLAY_VERSION_CODE=6' >> artifacts/build-summary.txt
          echo 'UI_TOP_BAR=fixed-navy' >> artifacts/build-summary.txt
          echo 'UI_BRAND=tsuguregi' >> artifacts/build-summary.txt
          echo 'UI_COMPACT_VALUE_HEIGHT_DP=46' >> artifacts/build-summary.txt
          echo 'UI_COMPACT_KEY_HEIGHT_DP=42' >> artifacts/build-summary.txt
          echo 'UI_COMPACT_KEY_GAP_DP=5' >> artifacts/build-summary.txt
          echo 'UI_OVERLAY_BUTTONS=removed' >> artifacts/build-summary.txt
          echo 'UI_ADMIN_NAVIGATION=compose-flow' >> artifacts/build-summary.txt
          echo 'SETTLEMENT_HISTORY=business-session' >> artifacts/build-summary.txt
          echo 'Z_PREFLIGHT_HELD_TICKETS=blocked' >> artifacts/build-summary.txt
          echo 'Z_SETTLEMENT=atomic-business-session-close' >> artifacts/build-summary.txt
          echo 'AUTO_BACKUP_TRIGGER=committed-z-settlement' >> artifacts/build-summary.txt
          echo 'SIGNING=development-not-production' >> artifacts/build-summary.txt
          echo 'REAL_DEVICE_TOP_BAR_COLOR_VERIFICATION=required' >> artifacts/build-summary.txt
          echo 'REAL_DEVICE_KEYPAD_SIZE_VERIFICATION=required' >> artifacts/build-summary.txt
          echo 'REAL_DEVICE_ADMIN_OVERLAP_VERIFICATION=required' >> artifacts/build-summary.txt
          echo 'REAL_DEVICE_PRINT_QUEUE_LAYOUT_VERIFICATION=required' >> artifacts/build-summary.txt
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.28.0-dev1-ui-stability-apks
          path: |
            artifacts/TSUGUREGI_v0.28.0_dev1_ui_stability_debug.apk
            artifacts/TSUGUREGI_v0.28.0_dev1_ui_stability_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
