name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v0.33 sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 63' app/build.gradle.kts
          grep -q 'versionName = "0.33.0-dev.1"' app/build.gradle.kts
          grep -q 'versionCode = 6' customer-display/build.gradle.kts
          grep -q 'versionName = "0.13.0-dev.6"' customer-display/build.gradle.kts

          for file in \
            app/src/main/java/jp/co/tenposinfo/register/AutoBackup.kt \
            app/src/main/java/jp/co/tenposinfo/register/AutoBackupSettings.kt \
            app/src/main/java/jp/co/tenposinfo/register/AutoBackupNotification.kt \
            app/src/main/java/jp/co/tenposinfo/register/AutoBackupSettingsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/DataProtectionActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueue.kt \
            app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueueActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt \
            app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt \
            app/src/test/java/jp/co/tenposinfo/register/V033PeriodicBackupSettingsTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V032PrintQueueOperationsTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V031PrinterPaperSettingTest.kt \
            docs/V0.33_PERIODIC_BACKUP_NOTIFICATIONS.md \
            docs/V0.33_RELEASE_NOTES.md; do
            test -s "$file"
          done

          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/jp/co/tenposinfo/register')
          settings = (root / 'AutoBackupSettings.kt').read_text()
          worker = (root / 'AutoBackup.kt').read_text()
          notification = (root / 'AutoBackupNotification.kt').read_text()
          settings_ui = (root / 'AutoBackupSettingsActivity.kt').read_text()
          protection = (root / 'DataProtectionActivity.kt').read_text()
          application = (root / 'RegisterApplication.kt').read_text()
          queue = (root / 'UnifiedPrintQueue.kt').read_text()
          queue_ui = (root / 'UnifiedPrintQueueActivity.kt').read_text()
          database = (root / 'RegisterDatabase.kt').read_text()
          advanced = (root / 'AdvancedOperationsStore.kt').read_text()
          printer = (root / 'AdminSettingsStore.kt').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()

          # v0.33 periodic backup operation.
          for token in (
              'enum class PeriodicBackupCadence',
              'DAILY',
              'WEEKLY',
              'periodicEnabled',
              'preferredHour',
              'zRetentionBusinessDays',
              'monthlyRetentionMonths',
              'failureNotificationsEnabled',
              'PeriodicWorkRequestBuilder<AutoBackupWorker>',
              'ExistingPeriodicWorkPolicy.KEEP',
              'ExistingPeriodicWorkPolicy.UPDATE',
              'setRequiresBatteryNotLow(true)',
              'setRequiresStorageNotLow(true)',
          ):
              assert token in settings, token
          assert 'BackupCreationReason.PERIODIC' in worker
          assert 'AutoBackupSettingsStore' in worker
          assert 'nextScheduledAt' in worker
          assert 'AutoBackupFailureNotificationPolicy' in notification
          assert 'SKIPPED_LOW_STORAGE' in notification
          assert 'FAILED' in notification
          assert 'POST_NOTIFICATIONS' in settings_ui
          assert 'DATA_BACKUP_SETTINGS_UPDATED' in settings_ui
          assert '定期・保存世代・失敗通知を設定' in protection
          assert '次回定期予定' in protection
          assert 'AutoBackupPeriodicScheduler.apply(this)' in application
          assert 'android:name=".AutoBackupSettingsActivity"' in manifest

          # v0.32 print queue safety remains cumulative.
          assert 'DISCARDED' in queue
          assert 'managerPin' in queue
          assert 'discardReason' in queue_ui
          assert 'PRINT_JOB_DISCARDED' in database
          assert 'PRINT_JOB_DISCARDED' in advanced

          # v0.31 paper width source remains printer settings only.
          assert 'object PrinterPaperSettingPolicy' in printer
          assert 'currentWidthMm' in printer

          # Temporary transfer files must not survive the final branch.
          assert not list(Path('tools').glob('v033-payload.*'))
          PY

          test "$(grep -c 'android:name=".AutoBackupSettingsActivity"' app/src/main/AndroidManifest.xml)" -eq 1
          ! grep -q '<activity-alias' app/src/main/AndroidManifest.xml

      - name: Verify launcher configuration
        shell: bash
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' customer-display/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Prepare named APKs and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.33.0_dev1_periodic_backup_notifications_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
          sha256sum artifacts/TSUGUREGI_v0.33.0_dev1_periodic_backup_notifications_debug.apk | tee artifacts/TSUGUREGI_v0.33.0_dev1_periodic_backup_notifications_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.33.0_dev1_periodic_backup_notifications_debug.apk | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk | tee -a artifacts/build-summary.txt
          cat >> artifacts/build-summary.txt <<'EOF'
          REGISTER_VERSION_NAME=0.33.0-dev.1
          REGISTER_VERSION_CODE=63
          CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.6
          CUSTOMER_DISPLAY_VERSION_CODE=6
          AUTO_BACKUP_TRIGGER=committed-z-settlement-and-periodic
          AUTO_BACKUP_PERIODIC_CADENCE=daily-or-seven-days
          AUTO_BACKUP_PREFERRED_HOUR=configurable-0-to-23
          AUTO_BACKUP_RETENTION=configurable-z-business-days-and-monthly-months
          AUTO_BACKUP_FAILURE_NOTIFICATION=failed-or-low-storage
          AUTO_BACKUP_Z_SETTLEMENT_ALWAYS_ENABLED=true
          PRINT_PAPER_WIDTH_SOURCE=printer-settings-only
          PRINT_TIME_PAPER_WIDTH_SELECTION=disabled
          PRINT_QUEUE_DISCARD=manager-pin-reason-audit
          SIGNING=development-not-production
          REAL_DEVICE_PERIODIC_BACKUP_AND_NOTIFICATION_VERIFICATION=required
          EOF
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.33.0-dev1-periodic-backup-notifications-apks
          path: |
            artifacts/TSUGUREGI_v0.33.0_dev1_periodic_backup_notifications_debug.apk
            artifacts/TSUGUREGI_v0.33.0_dev1_periodic_backup_notifications_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
