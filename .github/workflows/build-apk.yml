name: Format v0.24 cash movement correction

on:
  pull_request:
    branches:
      - develop/v0.23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.24
          fetch-depth: 0

      - name: Replace cash movement result block by boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt')
          text = path.read_text()
          screen_start = text.index('            OperationsScreen.CASH_MOVEMENT -> CashMovementScreen(')
          screen_end = text.index('            OperationsScreen.REVERSAL -> ReversalScreen(', screen_start)
          segment = text[screen_start:screen_end]
          block_start = segment.index('                    message = result.fold(')
          block_end = segment.index('                    if (result.isSuccess)', block_start)
          replacement = '''                    message = result.fold(
                        onSuccess = { "${type.displayName}を保存しました（No.$it）" },
                        onFailure = { it.message ?: "保存に失敗しました" },
                    )
'''
          segment = segment[:block_start] + replacement + segment[block_end:]
          updated = text[:screen_start] + segment + text[screen_end:]
          if updated == text:
              raise SystemExit('cash movement block was not changed')
          path.write_text(updated)
          PY
          git diff --check
          sed -n '202,214p' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt

      - name: Commit formatting correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          git commit -m 'style: format cash movement result block'
          git push origin HEAD:develop/v0.24
