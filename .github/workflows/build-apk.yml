name: Build つぐレジ APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-v096-final-ci:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Restore cumulative v0.96 CI
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          base_head = 'e212150060c81f2bba98d4699f0945ed21b751ec'
          workflow = subprocess.check_output(
              ['git', 'show', f'{base_head}:.github/workflows/build-apk.yml'],
              text=True,
          )
          workflow = workflow.replace(
              'Verify cumulative v0.14-v0.95 sources',
              'Verify cumulative v0.14-v0.96 sources',
          )
          workflow = workflow.replace(
              "          grep -Fq 'versionCode = 125' app/build.gradle.kts\n"
              "          grep -Fq 'versionName = \"0.95.0-dev.1\"' app/build.gradle.kts\n",
              '',
          )
          marker = '      - name: Verify launcher and orientation configuration\n'
          addition = '''          # v0.96 held-ticket responsive acceptance. Detailed layout is enforced by JUnit.\n          grep -Fq 'versionCode = 126' app/build.gradle.kts\n          grep -Fq 'versionName = "0.96.0-dev.1"' app/build.gradle.kts\n          test -s app/src/test/java/jp/co/tenposinfo/register/V096HeldTicketResponsiveTest.kt\n          test -s docs/V0.96_HELD_TICKET_RESPONSIVE.md\n          test -s docs/V0.96_RELEASE_NOTES.md\n          grep -Fq 'val ticketResponsive = rememberRegisterResponsiveMetrics()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt\n          grep -Fq 'val splitSummaryScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt\n          grep -Fq 'Modifier.weight(1.25f).height(42.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt\n          grep -Fq 'Modifier.weight(0.8f)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt\n          grep -Fq 'Modifier.width(350.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt\n          grep -Fq 'Modifier.width(if (responsive.isCompact) 108.dp else 130.dp)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt\n          grep -Fq 'onMerge(source, ticket)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt\n          grep -Fq 'HeldTicketOperationsUiPolicy.validateSplit(items, rawQuantities, newName)' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt\n          grep -Fq '最終総合実機試験へ繰越' docs/V0.96_RELEASE_NOTES.md\n          ! grep -Fqi 'DELETE FROM' docs/V0.96_HELD_TICKET_RESPONSIVE.md\n          ! grep -Fqi 'UPDATE sales' docs/V0.96_HELD_TICKET_RESPONSIVE.md\n          ! grep -Fqi 'DROP TABLE' docs/V0.96_HELD_TICKET_RESPONSIVE.md\n\n'''
          if marker not in workflow:
              raise SystemExit('launcher step marker not found')
          workflow = workflow.replace(marker, addition + marker, 1)
          workflow = workflow.replace('POS_VERSION_CODE: 125', 'POS_VERSION_CODE: 126')
          workflow = workflow.replace('POS_VERSION_NAME: 0.95.0-dev.1', 'POS_VERSION_NAME: 0.96.0-dev.1')
          workflow = workflow.replace(
              'TSUGUREGI_v0.95.0_dev1_sales_edit_responsive_debug.apk',
              'TSUGUREGI_v0.96.0_dev1_held_ticket_responsive_debug.apk',
          )
          workflow = workflow.replace('REGISTER_VERSION_NAME=0.95.0-dev.1', 'REGISTER_VERSION_NAME=0.96.0-dev.1')
          workflow = workflow.replace('REGISTER_VERSION_CODE=125', 'REGISTER_VERSION_CODE=126')
          flags_marker = '          REAL_DEVICE_SALES_EDIT_VERIFICATION=deferred-final-acceptance\n'
          flags = '''          HELD_TICKET_RESPONSIVE=true\n          TICKET_LIST_RESPONSIVE=true\n          TICKET_SPLIT_RESPONSIVE=true\n          HELD_TICKET_COMPACT_ACTION_ROWS=true\n          HELD_TICKET_SPLIT_SCROLL_FALLBACK=true\n          HELD_TICKET_NORMAL_LAYOUT_PRESERVED=true\n          REAL_DEVICE_HELD_TICKET_VERIFICATION=deferred-final-acceptance\n'''
          if flags_marker not in workflow:
              raise SystemExit('build summary flag marker not found')
          workflow = workflow.replace(flags_marker, flags_marker + flags, 1)
          workflow = workflow.replace(
              'name: TSUGUREGI-v0.95.0-dev1-sales-edit-responsive-apks',
              'name: TSUGUREGI-v0.96.0-dev1-held-ticket-responsive-apks',
          )
          Path('.github/workflows/build-apk.yml').write_text(workflow)
          PY

          git rm -f --ignore-unmatch .github/workflows/v096-apply-held-ticket-responsive.yml
          git rm -f --ignore-unmatch docs/.v096-held-ticket-patch-trigger
          git diff --check
          grep -Fq 'Verify cumulative v0.14-v0.96 sources' .github/workflows/build-apk.yml
          grep -Fq 'POS_VERSION_CODE: 126' .github/workflows/build-apk.yml
          grep -Fq 'HELD_TICKET_RESPONSIVE=true' .github/workflows/build-apk.yml
          grep -Fq 'TSUGUREGI-v0.96.0-dev1-held-ticket-responsive-apks' .github/workflows/build-apk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-apk.yml
          if git diff --cached --quiet; then
            echo 'No CI restore commit required'
            exit 0
          fi
          git commit -m 'ci(v0.96): restore cumulative held-ticket release gate'
          git push origin HEAD:develop/v0.96
