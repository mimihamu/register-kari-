name: Build つぐレジ APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v135-uc0506-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Apply fail-closed UC-05/06 implementation
        run: |
          python3 scripts/v135_uc0506_patch.py
          python3 scripts/v135_uc0506_safety_fix.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test docs
          if git diff --cached --quiet; then
            echo "No implementation diff"
            exit 1
          fi
          git commit -m "feat(v1.35): implement product entry and search"
          git push origin HEAD:develop/v1.35
