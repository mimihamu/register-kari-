name: Apply v0.27 history layout fix

on:
  pull_request:
    branches:
      - develop/v0.26
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-layout-fix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.27'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v0.27
        uses: actions/checkout@v4
        with:
          ref: develop/v0.27
          fetch-depth: 0

      - name: Apply bounded history layout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt")
          text = path.read_text()
          replacements = [
              ("HistoryPanel(Modifier.width(270.dp).fillMaxHeight())", "HistoryPanel(Modifier.width(220.dp).fillMaxHeight())"),
              ("HistoryPanel(Modifier.width(370.dp).fillMaxHeight())", "HistoryPanel(Modifier.width(310.dp).fillMaxHeight())"),
              ("HistoryPanel(Modifier.width(390.dp).fillMaxHeight())", "HistoryPanel(Modifier.width(300.dp).fillMaxHeight())"),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise RuntimeError(f"layout target not found: {old}")

          old = "LazyColumn(verticalArrangement = Arrangement.spacedBy(6.dp)) {"
          new = "LazyColumn(\n                    modifier = Modifier.weight(1f),\n                    verticalArrangement = Arrangement.spacedBy(6.dp),\n                ) {"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError("session list target not found")

          old = "LazyColumn(verticalArrangement = Arrangement.spacedBy(7.dp)) {"
          new = "LazyColumn(\n                        modifier = Modifier.weight(1f),\n                        verticalArrangement = Arrangement.spacedBy(7.dp),\n                    ) {"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError("report list target not found")

          path.write_text(text)
          PY
          git diff --check
          grep -q 'HistoryPanel(Modifier.width(220.dp)' app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt
          grep -q 'HistoryPanel(Modifier.width(310.dp)' app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt
          grep -q 'HistoryPanel(Modifier.width(300.dp)' app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt
          test "$(grep -c 'modifier = Modifier.weight(1f)' app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt)" -ge 3

      - name: Commit layout fix
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt; then
            echo "Layout fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt
          git commit -m "fix: constrain settlement history layout"
          git push origin HEAD:develop/v0.27
