          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v1.14.0-dev1-outbox-delivery-lease-loss-fencing-apks
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
