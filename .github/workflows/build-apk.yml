name: Apply つぐレジ dev.22 integration

on:
  push:
    branches:
      - develop/v0.12
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-dev22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop/v0.12
        uses: actions/checkout@v4
        with:
          ref: develop/v0.12
          fetch-depth: 0

      - name: Verify blobs and apply integration
        run: python .github/scripts/apply_dev22.py

      - name: Commit integrated dev.22 implementation
        run: |
          rm .github/scripts/apply_dev22.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: finalize v0.12 printer software implementation dev.22"
          git push origin HEAD:develop/v0.12
