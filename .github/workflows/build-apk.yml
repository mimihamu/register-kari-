name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v0.31 sources
        run: |
          set -euo pipefail
          grep -q 'versionCode = 61' app/build.gradle.kts
          grep -q 'versionName = "0.31.0-dev.1"' app/build.gradle.kts
          grep -q 'versionCode = 6' customer-display/build.gradle.kts
          grep -q 'versionName = "0.13.0-dev.6"' customer-display/build.gradle.kts

          for file in \
            app/src/test/java/jp/co/tenposinfo/register/V031PrinterPaperSettingTest.kt \
            docs/V0.31_PRINTER_PAPER_WIDTH.md \
            docs/V0.31_RELEASE_NOTES.md \
            app/src/test/java/jp/co/tenposinfo/register/V030BusinessStartNavigationTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V030ResponsiveManagementTest.kt \
            docs/V0.30_BUSINESS_START_NAVIGATION_FIX.md \
            docs/V0.30_RESPONSIVE_MANAGEMENT_REQUIREMENTS.md \
            app/src/main/java/jp/co/tenposinfo/register/ResponsiveLayoutV029.kt \
            app/src/test/java/jp/co/tenposinfo/register/V029ResponsiveLayoutTest.kt \
            app/src/main/java/jp/co/tenposinfo/register/RegisterUiChromeV028.kt \
            app/src/test/java/jp/co/tenposinfo/register/V028UiStabilityTest.kt; do
            test -s "$file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main/java/jp/co/tenposinfo/register')
          read = lambda name: (root / name).read_text()
          main = read('MainActivity.kt')
          admin = read('AdminSettingsActivity.kt')
          printer = read('AdminSettingsStore.kt')
          database = read('RegisterDatabase.kt')
          operations = read('OperationsActivity.kt')
          operations_store = read('OperationsStore.kt')
          advanced = read('AdvancedOperationsStore.kt')
          coordinator = read('SecureOperationsCoordinator.kt')
          receipt = read('Receipt.kt')
          history27 = read('SettlementHistoryScreenV027.kt')
          history30 = read('SettlementHistoryActivityV030.kt')
          queue = read('UnifiedPrintQueue.kt')
          application = read('RegisterApplication.kt')
          policies = read('OperationsNavigationPoliciesV030.kt')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()

          assert 'object PrinterPaperSettingPolicy' in printer
          assert 'fun currentWidthMm(context: Context)' in printer
          assert 'fun currentPaper(context: Context)' in printer
          assert 'AsChoiceButton("58mm"' in admin
          assert 'AsChoiceButton("80mm"' in admin

          for name, source in {
              'MainActivity.kt': main,
              'OperationsActivity.kt': operations,
              'SettlementHistoryScreenV027.kt': history27,
              'SettlementHistoryActivityV030.kt': history30,
          }.items():
              assert 'ChoiceButton("58mm"' not in source, name
              assert 'ChoiceButton("80mm"' not in source, name

          assert 'fun enqueueReprint(saleId: Long): Long' in database
          assert 'PrinterPaperSettingPolicy.currentWidthMm(applicationContext)' in database
          assert 'fun previewSettlement(reportId: Long): String' in operations_store
          assert re.search(r'fun\s+reprintSettlement\s*\(\s*reportId: Long,\s*operatorName: String,?\s*\): Long', operations_store, re.S)
          assert 'PrinterPaperSettingPolicy.currentPaper(appContext)' in operations_store
          assert 'PrinterPaperSettingPolicy.currentWidthMm(appContext)' in advanced
          assert 'paperWidthMm: Int' not in coordinator

          esc_signature = receipt.split('fun encode(', 1)[1].split('): ByteArray', 1)[0]
          assert 'ReceiptPaper' not in esc_signature
          assert 'PrinterPaperSettingPolicy.paper(configuration)' in receipt
          assert 'configuration.copy(paperWidthMm = sourceJob.paperWidthMm)' in queue
          assert 'paper_width_mm' in database

          public_names = ('saveSale', 'enqueueReprint', 'createReversal', 'previewSettlement', 'reprintSettlement')
          for path in root.glob('*.kt'):
              text = path.read_text()
              for name in public_names:
                  for match in re.finditer(rf'fun\s+{name}\s*\((.*?)\)', text, re.S):
                      assert 'paperWidthMm' not in match.group(1), f'{path.name}:{name}'

          assert 'RegisterPermission.SETTLEMENT' not in application
          assert 'RegisterPermission.Z_SETTLEMENT in permissions' in policies
          legacy = sorted(path.name for path in root.glob('*.kt') if 'RegisterPermission.SETTLEMENT' in path.read_text())
          assert legacy == ['SettlementPreflightV026.kt'], legacy

          for activity in (
              '.BusinessStartActivityV030', '.OperationsHubActivityV030',
              '.SettlementActivityV030', '.SettlementHistoryActivityV030',
              '.CatalogHubActivityV030', '.DynamicCatalogHubActivityV030',
          ):
              assert f'android:name="{activity}"' in manifest
          PY

          for test_file in \
            V031PrinterPaperSettingTest.kt \
            V030ResponsiveManagementTest.kt \
            V030BusinessStartNavigationTest.kt \
            V029ResponsiveLayoutTest.kt \
            V028UiStabilityTest.kt \
            V027SettlementHistoryReprintTest.kt \
            V026SettlementPreflightPermissionTest.kt \
            V025InspectionSettlementNavigationTest.kt \
            V024BusinessSessionLifecycleTest.kt \
            V023AutoBackupRetentionTest.kt \
            V022BackupPortabilityTest.kt \
            V021DataProtectionPolicyTest.kt \
            V020OperationsRoutingTest.kt \
            V019PartialReturnPolicyTest.kt \
            V018BusinessSessionIntegrationTest.kt \
            V017OperationExecutionSafetyTest.kt \
            V016OperationsAuthorizationTest.kt \
            V015TaxInvoicePolicyTest.kt \
            V014HeldTicketSafetyTest.kt; do
            test -s "app/src/test/java/jp/co/tenposinfo/register/$test_file"
          done

          test ! -e .github/workflows/apply-v031.yml
          test ! -e .github/workflows/run-v031-apply.yml
          test ! -e .github/workflows/export-v031-source.yml
          test ! -e tools/apply_v029.py
          test ! -e tools/fix_apply_v029.py
          test ! -d tools/__pycache__

      - name: Verify launcher configuration
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$(grep -c 'android.intent.category.LAUNCHER' app/src/debug/AndroidManifest.xml || true)" -eq 0

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Prepare named APKs and SHA-256
        run: |
          set -euo pipefail
          mkdir -p artifacts
          register_apk=artifacts/TSUGUREGI_v0.31.0_dev1_printer_width_setting_debug.apk
          cd_apk=artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$register_apk"
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk "$cd_apk"
          sha256sum "$register_apk" | tee "$register_apk.sha256"
          sha256sum "$cd_apk" | tee "$cd_apk.sha256"
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' "$register_apk" | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' "$cd_apk" | tee -a artifacts/build-summary.txt
          cat >> artifacts/build-summary.txt <<'SUMMARY'
          REGISTER_VERSION_NAME=0.31.0-dev.1
          REGISTER_VERSION_CODE=61
          CUSTOMER_DISPLAY_VERSION_NAME=0.13.0-dev.6
          CUSTOMER_DISPLAY_VERSION_CODE=6
          PRINT_PAPER_WIDTH_SOURCE=printer-settings-only
          PRINT_TIME_PAPER_WIDTH_SELECTION=disabled
          PRINT_JOB_PAPER_WIDTH_SNAPSHOT=retained-for-retry-compatibility
          REAL_DEVICE_58MM_PRINT_VERIFICATION=required
          REAL_DEVICE_80MM_PRINT_VERIFICATION=required
          REAL_DEVICE_PRINTER_COMMUNICATION_AND_CUT_VERIFICATION=required
          REAL_DEVICE_EXISTING_PENDING_JOB_RETRY_VERIFICATION=required
          SIGNING=development-not-production
          SUMMARY
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.31.0-dev1-printer-width-setting-apks
          path: |
            artifacts/TSUGUREGI_v0.31.0_dev1_printer_width_setting_debug.apk
            artifacts/TSUGUREGI_v0.31.0_dev1_printer_width_setting_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk
            artifacts/TSUGUREGI_CD_v0.13.0_dev6_transition_fix_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
