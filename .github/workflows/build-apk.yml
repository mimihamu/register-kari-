name: Fix and build つぐレジ dev.22

on:
  pull_request:
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-build-dev22:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop/v0.12
        uses: actions/checkout@v4
        with:
          ref: develop/v0.12
          fetch-depth: 0

      - name: Verify latest blob and fix nullable CSV references
        run: |
          test "$(git hash-object app/src/main/java/jp/co/tenposinfo/register/PrinterStatusValidationFinalization.kt)" = "a06e022bb736be5209b8d7471b5193c3a1c55a49"
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/jp/co/tenposinfo/register/PrinterStatusValidationFinalization.kt")
          text = p.read_text(encoding="utf-8")
          replacements = {
              "item.candidate.normalSampleCount.toString(),": "item.candidate?.normalSampleCount?.toString().orEmpty(),",
              "item.candidate.conditionSampleCount.toString(),": "item.candidate?.conditionSampleCount?.toString().orEmpty(),",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one occurrence: {old}")
              text = text.replace(old, new, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Commit compile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/PrinterStatusValidationFinalization.kt
          git diff --cached --check
          git commit -m "fix: safely render nullable printer bit candidates"
          git push origin HEAD:develop/v0.12

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify dev.22 metadata
        run: |
          grep -q 'versionCode = 36' app/build.gradle.kts
          grep -q 'versionName = "0.12.0-dev.22"' app/build.gradle.kts

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare named APK and SHA-256
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.12.0_dev22_debug.apk
          sha256sum artifacts/TSUGUREGI_v0.12.0_dev22_debug.apk | tee artifacts/TSUGUREGI_v0.12.0_dev22_debug.apk.sha256
          stat --printf='APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.12.0_dev22_debug.apk | tee artifacts/build-summary.txt
          echo "VERSION_NAME=0.12.0-dev.22" >> artifacts/build-summary.txt
          echo "VERSION_CODE=36" >> artifacts/build-summary.txt
          echo "SIGNING=development-not-production" >> artifacts/build-summary.txt
          echo "REAL_PRINTER_VERIFICATION=not-performed-by-ci" >> artifacts/build-summary.txt
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.12.0-dev22-debug-apk
          path: |
            artifacts/TSUGUREGI_v0.12.0_dev22_debug.apk
            artifacts/TSUGUREGI_v0.12.0_dev22_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
