name: Correct v0.24 cash movement compilation issue

on:
  pull_request:
    branches:
      - develop/v0.23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.24
          fetch-depth: 0

      - name: Correct cash movement result message
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt')
          text = path.read_text()
          start = text.index('            OperationsScreen.CASH_MOVEMENT -> CashMovementScreen(')
          end = text.index('            OperationsScreen.REVERSAL -> ReversalScreen(', start)
          segment = text[start:end]
          pattern = re.compile(
              r'''                    message = result\.fold\(\n'''
              r'''                        onSuccess = \{\n'''
              r'''                            if \(type == SettlementReportType\.Z_SETTLEMENT\) \{\n'''
              r'''                                "Z精算を保存し、営業を終了しました（No\.\$it）"\n'''
              r'''                            \} else \{\n'''
              r'''                                "X点検を保存しました（No\.\$it）"\n'''
              r'''                            \}\n'''
              r'''                        \},\n'''
              r'''                        onFailure = \{ it\.message \?: "保存に失敗しました" \},\n'''
              r'''                    \)'''
          )
          replacement = '''                    message = result.fold(
                        onSuccess = { "${type.displayName}を保存しました（No.$it）" },
                        onFailure = { it.message ?: "保存に失敗しました" },
                    )'''
          segment, count = pattern.subn(replacement, segment)
          if count != 1:
              raise SystemExit(f'cash movement correction count={count}')
          path.write_text(text[:start] + segment + text[end:])
          PY
          git diff --check
          grep -q 'onSuccess = { "${type.displayName}を保存しました（No.$it）" }' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          git commit -m 'fix: restore cash movement result message'
          git push origin HEAD:develop/v0.24
