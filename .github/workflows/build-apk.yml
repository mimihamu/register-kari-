name: Apply v0.29 responsive layout

on:
  push:
    branches:
      - develop/v0.29
  pull_request:
    branches:
      - develop/v0.28
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-responsive-layout:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'develop/v0.29'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout v0.29
        uses: actions/checkout@v4
        with:
          ref: develop/v0.29
          fetch-depth: 0

      - name: Scope payment row replacement
        run: python3 tools/fix_apply_v029.py

      - name: Validate applicator
        run: python3 -m py_compile tools/apply_v029.py

      - name: Apply responsive implementation
        run: python3 tools/apply_v029.py

      - name: Commit implementation source only
        run: |
          set -euo pipefail
          # The GitHub App token cannot update workflow files. Keep the
          # temporary workflow unchanged here; formal CI is restored through
          # the GitHub connector immediately after this source commit.
          git restore --source=HEAD -- .github/workflows/build-apk.yml
          rm -rf tools/__pycache__ tools/fix_apply_v029.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: implement v0.29 full-screen responsive layout"
          git push origin HEAD:develop/v0.29
