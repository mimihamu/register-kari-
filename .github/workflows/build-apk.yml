name: Build つぐレジ APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v058:
    if: github.head_ref == 'develop/v0.58' || github.ref == 'refs/heads/develop/v0.58'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.58
        uses: actions/checkout@v4
        with:
          ref: develop/v0.58
          fetch-depth: 0

      - name: Apply v0.58 receipt voucher foundation
        run: python tools/v058_apply.py

      - name: Remove temporary patch machinery
        run: rm -f tools/v058_apply.py

      - name: Commit v0.58 cumulative sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.58: add receipt voucher foundation"
          git push origin HEAD:develop/v0.58
