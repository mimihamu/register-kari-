name: Build つぐレジ APK

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: v066-version-ref-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-escaped-version-refs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.66 head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.66
          fetch-depth: 0
      - name: Fix escaped version refs and restore full CI
        run: python tools/v066_fix_escaped_version_refs.py
      - name: Commit generated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/test management-app/src/test .github/workflows/build-apk.yml tools/v066_fix_escaped_version_refs.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "v0.66 fix cumulative escaped version references"
          git push origin HEAD:develop/v0.66
