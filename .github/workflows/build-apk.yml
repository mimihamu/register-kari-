name: Finalize v0.30 permissions and CI

on:
  push:
    branches:
      - develop/v0.30
  pull_request:
    branches:
      - develop/v0.29
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current v0.30
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply final permission and regression fixes
        run: |
          set -euo pipefail
          python3 tools/finalize_v030.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize v0.30 split settlement permissions"
          git push origin HEAD:develop/v0.30
