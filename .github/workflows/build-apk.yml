name: Build つぐレジ APK

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: v067-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-v067:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v0.67 head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.67
          fetch-depth: 0
      - name: Apply v0.67 cumulative finalization
        run: python tools/v067_finalize.py
      - name: Commit generated v0.67
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app management-app .github/workflows docs tools/v067_finalize.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "v0.67 finalize sale receipt reprint navigation"
          git push origin HEAD:develop/v0.67
