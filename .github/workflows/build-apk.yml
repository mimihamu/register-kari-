          DRIVE_JSON_COLLISION_SAFETY=true
          DRIVE_EXISTING_JSON_NEVER_OVERWRITTEN=true
          DRIVE_IDENTICAL_JSON_DUPLICATE_SUCCESS=true
          DRIVE_MISMATCH_COLLISION_PERMANENT=true
          DRIVE_COLLISION_MANUAL_RETRY_AVAILABLE=true
          DRIVE_PARTIAL_TEMP_CLEANUP_PRESERVED=true
          DRIVE_SAF_EXACT_OBJECT_KEY_NAME=true
          DRIVE_SAF_PROVIDER_RENAMING_REJECTED=true
          DRIVE_SAF_RENAMED_APP_FILE_NOT_SENT=true
          DRIVE_SAF_EXISTING_FINAL_NONDESTRUCTIVE=true
          DRIVE_SAF_DUPLICATE_DISPLAY_NAME_BLOCKED=true
          DRIVE_SAF_DUPLICATE_EXISTING_NONDESTRUCTIVE=true
          DRIVE_SAF_UNIQUE_CHILD_REQUIRED=true
          DRIVE_SAF_QUERY_NULL_BLOCKS_WRITE=true
          DRIVE_SAF_QUERY_UNAVAILABLE_RETRYABLE=true
          DRIVE_SAF_QUERY_NULL_NOT_MISSING=true
          DRIVE_SAF_METADATA_QUERY_NULL_BLOCKS_COMMIT=true
          DRIVE_SAF_METADATA_UNAVAILABLE_RETRYABLE=true
          DRIVE_SAF_UNVERIFIED_APP_OBJECT_CLEANUP=true
          DRIVE_SAF_RENAME_NULL_ONLY_FALLBACK=true
          DRIVE_SAF_RENAME_ERRORS_PROPAGATE=true
          DRIVE_SAF_RENAME_METADATA_FAILURE_NOT_COPIED=true
          DRIVE_SAF_FINAL_PRECOMMIT_RECHECK=true
