          test -s app/src/test/java/jp/co/tenposinfo/register/V048GoogleDriveSettingsEntryTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V050GoogleDriveCrossAppConnectionTest.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V051GoogleDriveRecoveryFallbackTest.kt
