name: Format v0.24 cash movement correction

on:
  pull_request:
    branches:
      - develop/v0.23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.24
          fetch-depth: 0

      - name: Format cash movement result block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt')
          text = path.read_text()
          old = '''                    message = result.fold(
              onSuccess = { "${type.displayName}を保存しました（No.$it）" },
              onFailure = { it.message ?: "保存に失敗しました" },
          )'''
          new = '''                    message = result.fold(
                        onSuccess = { "${type.displayName}を保存しました（No.$it）" },
                        onFailure = { it.message ?: "保存に失敗しました" },
                    )'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'format correction count={count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit formatting correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          git commit -m 'style: format cash movement result block'
          git push origin HEAD:develop/v0.24
