name: Validate v0.27 settlement history

on:
  pull_request:
    branches:
      - develop/v0.26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v027:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'develop/v0.27'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify v0.27 sources
        run: |
          set -euo pipefail
          grep -q 'versionCode = 57' app/build.gradle.kts
          grep -q 'versionName = "0.27.0-dev.1"' app/build.gradle.kts
          test -s app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryPolicyV027.kt
          test -s app/src/main/java/jp/co/tenposinfo/register/SettlementHistoryScreenV027.kt
          test -s app/src/test/java/jp/co/tenposinfo/register/V027SettlementHistoryReprintTest.kt
          test -s docs/V0.27_SETTLEMENT_HISTORY_REPRINT.md
          test -s docs/V0.27_RELEASE_NOTES.md
          grep -q 'OperationsScreen.SETTLEMENT_HISTORY' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'SettlementSnapshotSchemaV027.savePaymentTotals' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'SETTLEMENT_REPRINT' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'fun reprintSettlement' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          grep -q 'AutomaticPrintScheduler.enqueueNow' app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt
          git diff --check develop/v0.26...HEAD

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug
