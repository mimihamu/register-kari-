name: TEMP apply UC-07 through trusted workflow path

on:
  pull_request:
    branches:
      - develop/v1.34

permissions:
  contents: write

concurrency:
  group: temp-v135-uc07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-uc07:
    if: github.event.pull_request.number == 138 && github.event.pull_request.head.ref == 'develop/v1.35'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply prepared UC-07 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RUNNER'
          from pathlib import Path
          workflow = Path('.github/workflows/v135-uc07-apply.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow:
              raise SystemExit('prepared patch start marker not found')
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          )
          exec(compile(script, 'v135-uc07-apply.py', 'exec'))
          RUNNER

          # Restore the formal CI exactly from the parent commit and remove all temporary applicator files.
          git show HEAD^:.github/workflows/build-apk.yml > .github/workflows/build-apk.yml
          git rm .github/workflows/v135-uc07-apply.yml docs/.v135-uc07-trigger

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v1.35): complete UC-07 subtotal POS flow"
          git push origin HEAD:develop/v1.35
