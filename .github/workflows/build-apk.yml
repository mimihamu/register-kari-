name: Build つぐレジ APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v096-held-ticket-responsive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply guarded v0.96 patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/v096-apply-held-ticket-responsive.yml > /tmp/v096_patch.py
          test -s /tmp/v096_patch.py
          python3 /tmp/v096_patch.py
          git diff --check
          grep -Fq 'val ticketResponsive = rememberRegisterResponsiveMetrics()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          grep -Fq 'val splitSummaryScroll = rememberScrollState()' app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No patch commit required'
            exit 0
          fi
          git commit -m 'feat(v0.96): make held-ticket flow responsive'
          git push origin HEAD:develop/v0.96
