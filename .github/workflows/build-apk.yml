# V114OutboxExternalDeliveryLeaseLossFencingTest.kt
# SETTLEMENT_RECONCILIATION=true
# SETTLEMENT_RECONCILIATION_X_DIFFERENCE_INFORMATIONAL=true
# SETTLEMENT_RECONCILIATION_Z_DIFFERENCE_ALERT=true
# SETTLEMENT_RECONCILIATION_AUDIT=true

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v1.14 sources
        shell: bash
        env:
          V113_FINAL_HEAD: 2a58140d03ef2155a8f1d4c1307459d52db4022d
          V112_FINAL_HEAD: eabc1560dd76fa3b1b46506869862410b252fea3
          V111_FINAL_HEAD: e2e131674d10df42cec06876eb803e7e235323de
          V110_FINAL_HEAD: 3211d9884f077e351736906d788b0d7de4cccdff
          V109_FINAL_HEAD: b61ec6615bb98e5fd5d02859158396ec357e7d71
          V108_FINAL_HEAD: da6b47275bdebad78525aec7d18ac4285efda373
          V107_FINAL_HEAD: 12071a643f7bb875b7111445c6f5d5504f75f7a4
          V106_FINAL_HEAD: abae12a8f7547660b80611a5023f315cc3bd8b6e
          V105_FINAL_HEAD: 4bab293dfb6604366c399a5cc2f677b3ce0e0604
          V104_FINAL_HEAD: 00b1f8ec6d9280b9c84203e5bf847dbf1f1652d2
          V103_FINAL_HEAD: b7904e6059212011ca9bdd57c46e6b3aac8fa360
          V102_FINAL_HEAD: 6fbe2711a4575568fa919439733149ccb671b729
          V101_FINAL_HEAD: 754ba393923e1717244a6b940587bc754ecbf6dc
          V100_FINAL_HEAD: d4ebe92517a00e2cc6b41b97e02ac13010428580
          V099_FINAL_HEAD: 45e19c082f640623a91bc38609d471e873ec6ece
          V098_FINAL_HEAD: 8990d93c007bc0b57afed7f28695454a8535dd90
          V097_FINAL_HEAD: c216ab8a37c6db23ebcde673cd08fc9d6f4c328d
          V090_FINAL_HEAD: 2ca9a2faa263f469788eaad903309f9e3ddcd545
          V086_FINAL_HEAD: aef6c08d75d057b67662e9612238edba15fc6489
          V093_FINAL_HEAD: 5c8d0d95175bb7dd6cf8b70f52b31162c415a5e7
        run: |
          set -euo pipefail

          git show "$V113_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v113-build-apk.yml
          awk '
            /^      - name: Verify cumulative v0.14-v1.13 sources/ { capture=1; next }
            capture && /^      - name: Verify launcher and orientation configuration/ { exit }
            capture && /^        run: \|/ { inrun=1; next }
            capture && inrun { sub(/^          /, ""); print }
          ' /tmp/v113-build-apk.yml \
            | grep -vF "grep -Fq 'versionCode = 143' app/build.gradle.kts" \
            | grep -vF "grep -Fq 'versionName = \"1.13.0-dev.1\"' app/build.gradle.kts" \
            > /tmp/v113-cumulative-checks.sh
          test -s /tmp/v113-cumulative-checks.sh
          bash -euxo pipefail /tmp/v113-cumulative-checks.sh

          grep -Fq 'versionCode = 144' app/build.gradle.kts
          grep -Fq 'versionName = "1.14.0-dev.1"' app/build.gradle.kts
          grep -Fq 'versionCode = 15' management-app/build.gradle.kts
          grep -Fq 'versionName = "0.15.0-dev.1"' management-app/build.gradle.kts
          grep -Fq 'versionCode = 7' customer-display/build.gradle.kts
          grep -Fq 'versionName = "0.14.0-dev.1"' customer-display/build.gradle.kts
          test -s app/src/test/java/jp/co/tenposinfo/register/V114OutboxExternalDeliveryLeaseLossFencingTest.kt
          test -s docs/V1.14_OUTBOX_EXTERNAL_DELIVERY_LEASE_LOSS_FENCING.md
          test -s docs/V1.14_RELEASE_NOTES.md
          grep -Fq 'OUTBOX_EXTERNAL_DELIVERY_LEASE_LOST_FENCING=true' .github/workflows/build-apk.yml
          grep -Fq 'OUTBOX_EXTERNAL_DELIVERY_LEASE_LOST_NO_SECOND_TRANSITION=true' .github/workflows/build-apk.yml
          grep -Fq 'OUTBOX_EXTERNAL_DELIVERY_LEASE_LOST_AUDIT=true' .github/workflows/build-apk.yml
          grep -Fq 'OUTBOX_EXTERNAL_DELIVERY_LOCALFILE_INSIDE_OWNERSHIP_GUARD=true' .github/workflows/build-apk.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/jp/co/tenposinfo/register/OutboxExternalDelivery.kt').read_text()
          loop_start = source.index('        for (record in records) {')
          loop_end = source.index('        val countsAfter = counts()', loop_start)
          loop = source[loop_start:loop_end]
          lease_catch = loop.index('catch (error: OutboxExternalDeliveryLeaseLostExceptionV113)')
          generic_catch = loop.index('catch (error: Throwable)')
          assert lease_catch < generic_catch
          assert 'catch (leaseLost: OutboxExternalDeliveryLeaseLostExceptionV113)' in loop
          assert 'handleLeaseOwnershipLost(record, error)' in loop
          assert 'handleLeaseOwnershipLost(record, leaseLost)' in loop
          handler_start = source.index('    private fun handleLeaseOwnershipLost(')
          handler_end = source.index('    private fun claimStaged(', handler_start)
          handler = source[handler_start:handler_end]
          assert 'SYNC_OUTBOX_EXTERNAL_LEASE_LOST' in handler
          for forbidden in ('markSent(', 'markDeliveryFailure(', 'markDeliveryPaused(', 'moveBackToPending(', 'delete('):
              assert forbidden not in handler
          PY
          grep -Fq '最終総合実機試験' docs/V1.14_RELEASE_NOTES.md

      - name: Verify launcher and orientation configuration
        shell: bash
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          plus_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' management-app/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$plus_launcher_count" -eq 1
          grep -q 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="sensorPortrait"' management-app/src/main/AndroidManifest.xml
          ! grep -q 'android:screenOrientation="landscape"' management-app/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug

      - name: Verify built APK release identity and integrity
        shell: bash
        env:
          POS_VERSION_CODE: 144
          POS_VERSION_NAME: 1.14.0-dev.1
          PLUS_VERSION_CODE: 15
          PLUS_VERSION_NAME: 0.15.0-dev.1
          BUILD_TOOLS_VERSION: 36.0.0
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash ci/verify-apk-release-integrity.sh
          cat artifacts/apk-integrity-summary.txt

      - name: Prepare named APKs and SHA-256
        shell: bash
        env:
          V093_FINAL_HEAD: 5c8d0d95175bb7dd6cf8b70f52b31162c415a5e7
        run: |
          set -euo pipefail
          mkdir -p artifacts
          register_apk=artifacts/TSUGUREGI_v1.14.0_dev1_outbox_delivery_lease_loss_fencing_debug.apk
          plus_apk=artifacts/TSUGUREGI_PLUS_v0.15.0_dev1_drive_transient_import_safety_debug.apk
          cd_apk=artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$register_apk"
          cp management-app/build/outputs/apk/debug/management-app-debug.apk "$plus_apk"
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk "$cd_apk"
          sha256sum "$register_apk" | tee "$register_apk.sha256"
          sha256sum "$plus_apk" | tee "$plus_apk.sha256"
          sha256sum "$cd_apk" | tee "$cd_apk.sha256"
          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' "$register_apk" | tee artifacts/build-summary.txt
          stat --printf='MANAGEMENT_APP_APK_SIZE_BYTES=%s\n' "$plus_apk" | tee -a artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' "$cd_apk" | tee -a artifacts/build-summary.txt
          keytool -list -v \
            -keystore app/build/signing/tsuguregi-development.jks \
            -storepass tsuguregi-dev \
            -alias tsuguregi-dev \
            | awk -F': ' '/SHA1:/{print "DEVELOPMENT_SIGNING_SHA1=" $2} /SHA256:/{print "DEVELOPMENT_SIGNING_SHA256=" $2}' \
            | tee -a artifacts/build-summary.txt

          # v0.93 finalのbuild summary feature flagsを継承する。
          git show "$V093_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v093-build-apk.yml
          awk '
            /cat >> artifacts\/build-summary.txt <<'\''EOF'\''/ { capture=1; next }
            capture && /^          EOF$/ { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/v093-build-apk.yml \
            | grep -v '^REGISTER_VERSION_NAME=' \
            | grep -v '^REGISTER_VERSION_CODE=' \
            >> artifacts/build-summary.txt

          cat >> artifacts/build-summary.txt <<'EOF'
          REGISTER_VERSION_NAME=1.14.0-dev.1
          REGISTER_VERSION_CODE=144
          MANAGEMENT_APP_VERSION_NAME=0.15.0-dev.1
          MANAGEMENT_APP_VERSION_CODE=15
          DATA_PROTECTION_RESPONSIVE=true
          APK_RELEASE_INTEGRITY_GATE=true
          MAIN_FLOW_RESPONSIVE=true
          STARTUP_DIAGNOSTIC_RESPONSIVE=true
          STARTUP_DIAGNOSTIC_SCROLL=true
          STARTUP_DIAGNOSTIC_COMPACT_FULL_WIDTH=true
          STARTUP_DIAGNOSTIC_NORMAL_LAYOUT_PRESERVED=true
          SALES_EDIT_RESPONSIVE=true
          LINE_EDIT_RESPONSIVE=true
          DISCOUNT_RESPONSIVE=true
          SALES_EDIT_SCROLL_FALLBACK=true
          SALES_EDIT_NORMAL_LAYOUT_PRESERVED=true
          REAL_DEVICE_VERIFICATION_BATCH_MODE=final-integrated-acceptance
          REAL_DEVICE_STARTUP_DIAGNOSTIC_VERIFICATION=deferred-final-acceptance
          REAL_DEVICE_SALES_EDIT_VERIFICATION=deferred-final-acceptance
          HELD_TICKET_RESPONSIVE=true
          TICKET_LIST_RESPONSIVE=true
          TICKET_SPLIT_RESPONSIVE=true
          HELD_TICKET_COMPACT_ACTION_ROWS=true
          HELD_TICKET_SPLIT_SCROLL_FALLBACK=true
          HELD_TICKET_NORMAL_LAYOUT_PRESERVED=true
          REAL_DEVICE_HELD_TICKET_VERIFICATION=deferred-final-acceptance
          SALES_LOOKUP_RESPONSIVE=true
          SALES_HISTORY_RESPONSIVE=true
          SALE_DETAIL_RESPONSIVE=true
          SALES_HISTORY_COMPACT_FILTER_SCROLL=true
          SALES_HISTORY_COMPACT_TWO_LINE_ROWS=true
          SALE_DETAIL_SUMMARY_SCROLL=true
          SALES_LOOKUP_NORMAL_LAYOUT_PRESERVED=true
          REAL_DEVICE_SALES_LOOKUP_VERIFICATION=deferred-final-acceptance
          AUTOMATIC_PRINT_DISPATCH_SAFETY=true
          AUTOMATIC_PRINT_SHARED_CHRONOLOGICAL_ORDER=true
          AUTOMATIC_PRINT_FAIL_FAST=true
          AUTOMATIC_PRINT_GLOBAL_BATCH_LIMIT=20
          AUTOMATIC_PRINT_SINGLE_FLIGHT=true
          AUTOMATIC_PRINT_BACKLOG_CONTINUATION=true
          PRINTER_ENDPOINT_SERIALIZATION=true
          PRINTER_ENDPOINT_GATE=true
          PRINTER_ENDPOINT_WAIT_TIMEOUT_SAFE=true
          PRINTER_ENDPOINT_DIFFERENT_TARGET_PARALLEL=true
          PRINTER_ENDPOINT_ALL_TCP_PATHS_PROTECTED=true
          PRINTER_JOB_STALE_STATE_REVALIDATION=true
          PRINTER_AUTO_MANUAL_DUPLICATE_PREVENTION=true
          JAPANESE_PRINTER_ENCODING=true
          EPSON_SHIFT_JIS_KANJI_SYSTEM=true
          EPSON_FS_C_SHIFT_JIS=true
          GENERIC_PRINTER_PROFILE_UNCHANGED=true
          JAPANESE_PRINTER_SINGLE_SHEET_RETEST_PATH=true
          REAL_DEVICE_JAPANESE_PRINT_VERIFICATION=required-user-retest
          GOOGLE_DRIVE_REAUTHORIZATION_SAFETY=true
          GOOGLE_DRIVE_BLOCKER_PRESERVES_SALE_JSON=true
          GOOGLE_DRIVE_TRANSIENT_UPLOAD_FAIL_FAST=true
          GOOGLE_DRIVE_PLUS_TRANSIENT_DOWNLOAD_NOT_QUARANTINED=true
          GOOGLE_DRIVE_RECONNECT_STATUS_VISIBLE=true
          OUTBOX_EXTERNAL_DELIVERY_LEASE=true
          OUTBOX_EXTERNAL_DELIVERY_OWNER_TOKEN=true
          OUTBOX_EXTERNAL_DELIVERY_STALE_RECLAIM=true
          OUTBOX_EXTERNAL_DELIVERY_ACTIVE_REQUEUE_GUARD=true
          OUTBOX_EXTERNAL_DELIVERY_LEASE_LOST_FENCING=true
          OUTBOX_EXTERNAL_DELIVERY_LEASE_LOST_NO_SECOND_TRANSITION=true
          OUTBOX_EXTERNAL_DELIVERY_LEASE_LOST_AUDIT=true
          OUTBOX_EXTERNAL_DELIVERY_LOCALFILE_INSIDE_OWNERSHIP_GUARD=true
          REAL_ACCOUNT_GOOGLE_DRIVE_VERIFICATION=deferred-final-acceptance
          CUSTOMER_DISPLAY_SEND_ISOLATION=true
          CUSTOMER_DISPLAY_LATEST_PENDING_COALESCE=true
          CUSTOMER_DISPLAY_MULTI_CLIENT_FAILURE_ISOLATION=true
          CUSTOMER_DISPLAY_UNBOUNDED_BACKLOG_PREVENTION=true
