name: tmp-uc07-diagnose

on:
  push:
    branches:
      - develop/v1.35

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.35
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run targeted UC-07 tests and capture diagnostics
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:testDebugUnitTest --tests 'jp.co.tenposinfo.register.V135SubtotalUc07Test' --console=plain --stacktrace > /tmp/uc07-app.log 2>&1
          APP_RC=$?
          ./gradlew :customer-display:testDebugUnitTest --tests 'jp.co.tenposinfo.register.cd.V135SubtotalCompatibilityTest' --console=plain --stacktrace > /tmp/uc07-cd.log 2>&1
          CD_RC=$?
          set -e
          {
            echo "APP_RC=$APP_RC"
            echo "CD_RC=$CD_RC"
            echo '=== APP tail ==='
            tail -n 160 /tmp/uc07-app.log
            echo '=== CD tail ==='
            tail -n 160 /tmp/uc07-cd.log
          } > .github/tmp-uc07-diagnostic.txt
          rm -f .github/workflows/tmp-uc07-diagnose.yml .github/tmp-uc07-diagnose.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/tmp-uc07-diagnostic.txt
          git add -A .github/workflows/tmp-uc07-diagnose.yml .github/tmp-uc07-diagnose.trigger
          git commit -m 'chore: capture UC-07 test diagnostic'
          git push origin HEAD:develop/v1.35
