name: Apply v0.19 partial return integration

on:
  pull_request:
    branches:
      - develop/v0.18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout v0.19
        uses: actions/checkout@v4
        with:
          ref: develop/v0.19
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply partial return changes
        run: python3 tools/apply_v019.py

      - name: Verify partial return integration
        run: |
          grep -q 'versionCode = 49' app/build.gradle.kts
          grep -q 'versionName = "0.19.0-dev.1"' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime:2.11.2' app/build.gradle.kts

          test -f app/src/main/java/jp/co/tenposinfo/register/PartialReturn.kt
          grep -q 'data class ReturnableSaleLine' app/src/main/java/jp/co/tenposinfo/register/PartialReturn.kt
          grep -q 'object PartialReturnPolicy' app/src/main/java/jp/co/tenposinfo/register/PartialReturn.kt
          grep -q 'remainingDiscount' app/src/main/java/jp/co/tenposinfo/register/PartialReturn.kt
          grep -q 'allocateRefundPayments' app/src/main/java/jp/co/tenposinfo/register/PartialReturn.kt
          grep -q 'RETURN:' app/src/main/java/jp/co/tenposinfo/register/PartialReturn.kt
          grep -q 'CANCEL:' app/src/main/java/jp/co/tenposinfo/register/PartialReturn.kt

          grep -q 'fun loadReturnableLines' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'fun createReversal' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'line_tax_snapshots' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'reversal_items' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'document_print_jobs' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'claimOperationKey' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'bindOperationKey' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'TaxInvoiceSettingsStore(appContext).load().issuer' app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt
          grep -q 'AutomaticPrintScheduler.schedule' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q 'DriveOutboxScheduler.schedule' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q '返品数量' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q '58mm' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt
          grep -q '80mm' app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt

          ! grep -q 'サンプル居酒屋' app/src/main/java/jp/co/tenposinfo/register/OperationDocuments.kt
          ! grep -q 'T1234567890123' app/src/main/java/jp/co/tenposinfo/register/OperationDocuments.kt
          grep -q 'issuer.storeName' app/src/main/java/jp/co/tenposinfo/register/OperationDocuments.kt
          grep -q 'issuer.registrationNumber' app/src/main/java/jp/co/tenposinfo/register/OperationDocuments.kt

          test -f app/src/test/java/jp/co/tenposinfo/register/V019PartialReturnPolicyTest.kt
          test -f docs/V0.19_PARTIAL_RETURN.md

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt \
            app/src/main/java/jp/co/tenposinfo/register/SecureOperationsCoordinator.kt \
            app/src/main/java/jp/co/tenposinfo/register/OperationExecutionSafety.kt \
            app/src/main/java/jp/co/tenposinfo/register/OperationsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/OperationDocuments.kt \
            app/src/main/java/jp/co/tenposinfo/register/PartialReturn.kt \
            app/src/test/java/jp/co/tenposinfo/register/V019PartialReturnPolicyTest.kt \
            docs/V0.19_PARTIAL_RETURN.md
          git commit -m "feat: integrate partial returns and compliant reversal receipts" || exit 0
          git push origin HEAD:develop/v0.19
