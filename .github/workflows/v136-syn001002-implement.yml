name: v1.36 SYN-001/002 implement

on:
  push:
    branches: [ develop/v1.36 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Fix current BKP-006 anchor in temporary patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/v136-syn001002-patch.py')
          s = p.read_text()
          old = '''        val remainingMissing = missingCount(db)
                  require(remainingMissing == 0) { "BKP-006同期キュー再構築後も不足行があります: $remainingMissing" }'''
          new = '''        val remaining = missingCount(db)
                  require(remaining == 0) { "BKP-006同期再構築後もoutbox不足が残っています: $remaining" }'''
          if old not in s:
              raise SystemExit('temporary patch anchor text not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Apply SYN-001/002 patch
        run: python3 .github/v136-syn001002-patch.py
      - name: Run REGISTER focused tests
        run: ./gradlew :app:testDebugUnitTest --tests jp.co.tenposinfo.register.V150Syn001002ImmutableOutboxDocumentTest --stacktrace
      - name: Run Plus focused tests
        run: ./gradlew :management-app:testDebugUnitTest --tests jp.co.tenposinfo.register.plus.V150Syn001002AckOutboxTest --stacktrace
      - name: Compile REGISTER and Plus Kotlin
        run: ./gradlew :app:compileDebugKotlin :management-app:compileDebugKotlin --stacktrace
      - name: Commit SYN-001/002 product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/jp/co/tenposinfo/register/OutboxDocumentV150.kt \
            app/src/main/java/jp/co/tenposinfo/register/BusinessSyncFoundation.kt \
            app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt \
            app/src/main/java/jp/co/tenposinfo/register/OperationsStore.kt \
            app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt \
            app/src/main/java/jp/co/tenposinfo/register/DynamicCatalogRuntime.kt \
            app/src/main/java/jp/co/tenposinfo/register/RestoreSyncRebuildV136.kt \
            app/src/test/java/jp/co/tenposinfo/register/V150Syn001002ImmutableOutboxDocumentTest.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/PlusAckOutboxV150.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/SalesJournalImportRepository.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/ManagementDatabase.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/SalesJournalImportContract.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveDirectSync.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V150Syn001002AckOutboxTest.kt \
            docs/V1.36_SYN_001_002_IMMUTABLE_OUTBOX_DOCUMENT.md
          git commit -m 'feat(v1.36): freeze sync documents at business commit'
          git push origin HEAD:develop/v1.36
