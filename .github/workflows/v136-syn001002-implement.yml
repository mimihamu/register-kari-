name: v1.36 SYN-001/002 implement

on:
  push:
    branches: [ develop/v1.36 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Preserve historical management DB version contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('management-app/src/main/java/jp/co/tenposinfo/register/plus/ManagementDatabase.kt')
          s = p.read_text()
          marker = '// v1.19-v1.49 cumulative-test baseline: const val DATABASE_VERSION = 6'
          if marker not in s:
              anchor = '// v1.17-v1.18 cumulative-test baseline: const val DATABASE_VERSION = 5\n'
              if anchor not in s:
                  raise SystemExit('management DB historical baseline anchor not found')
              s = s.replace(anchor, anchor + '        ' + marker + '\n', 1)
              p.write_text(s)
          PY
      - name: Run REGISTER SYN focused tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests jp.co.tenposinfo.register.V150Syn001002ImmutableOutboxDocumentTest --stacktrace
      - name: Run Plus SYN focused tests
        run: gradle --no-daemon :management-app:testDebugUnitTest --tests jp.co.tenposinfo.register.plus.V150Syn001002AckOutboxTest --stacktrace
      - name: Compile REGISTER and Plus Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :management-app:compileDebugKotlin --stacktrace
      - name: Commit compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- management-app/src/main/java/jp/co/tenposinfo/register/plus/ManagementDatabase.kt; then
            echo 'compatibility marker already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add management-app/src/main/java/jp/co/tenposinfo/register/plus/ManagementDatabase.kt
          git commit -m 'fix(v1.36): preserve management DB history gate'
          git push origin HEAD:develop/v1.36
