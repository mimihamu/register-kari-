name: v1.36 barcode diagnostics

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-barcode-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Inspect barcode and product lookup paths
        shell: bash
        run: |
          set -u
          echo '=== barcode/scanner/router symbols ==='
          grep -RniE --exclude-dir=.git 'BarcodeScanner|ScannerGateway|InputRouter|barcodeScanned|dispatchKeyEvent|KEYCODE_ENTER|KeyEvent|HID|scanner|barcode' app/src/main app/src/test | head -5000 || true
          echo '=== product code lookup/add paths ==='
          grep -RniE --exclude-dir=.git 'find.*Product|product.*code|lookup.*Product|search.*Product|未登録商品|仮商品|ProductRegister|temporary.*product|一時登録|onAddProduct|addProduct' app/src/main app/src/test | head -5000 || true
          echo '=== permissions and product-management routes ==='
          grep -RniE --exclude-dir=.git 'enum class RegisterPermission|RegisterPermission\.|isManager|canOpenManagement|商品設定|商品管理|Catalog.*Activity|Product.*Activity|Master.*Activity' app/src/main/java/jp/co/tenposinfo/register | head -5000 || true
          echo '=== temporary/unregistered product persistence ==='
          grep -RniE --exclude-dir=.git '未登録|仮商品|temporary|temp.*product|Product\(' app/src/main/java/jp/co/tenposinfo/register | head -5000 || true
          echo '=== matching source filenames ==='
          find app/src/main app/src/test -type f | sort | grep -Ei 'barcode|scanner|input|product|sales|catalog|operator|permission|master' | head -2000 || true
