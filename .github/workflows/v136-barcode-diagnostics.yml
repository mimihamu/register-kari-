name: v1.36 barcode diagnostics

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/v136-barcode-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Inspect barcode and product lookup paths
        shell: bash
        run: |
          set -u
          echo '=== barcode/scanner/router symbols ==='
          grep -RniE --exclude-dir=.git 'BarcodeScanner|ScannerGateway|InputRouter|barcodeScanned|dispatchKeyEvent|KEYCODE_ENTER|KeyEvent|HID|scanner|barcode' app/src/main app/src/test | head -5000 || true
          echo '=== product code lookup/add paths ==='
          grep -RniE --exclude-dir=.git 'find.*Product|product.*code|lookup.*Product|search.*Product|未登録商品|仮商品|ProductRegister|temporary.*product|onAddProduct|addProduct' app/src/main app/src/test | head -5000 || true
          echo '=== matching v1.35 source filenames ==='
          find app/src/main app/src/test -type f | sort | grep -Ei 'barcode|scanner|input|product|sales|catalog' | head -1500 || true
