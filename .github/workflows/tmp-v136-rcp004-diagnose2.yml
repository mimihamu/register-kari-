name: tmp-v136-rcp004-diagnose2

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/tmp-v136-rcp004-diagnose2.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run cumulative unit tests and capture log
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew :app:testDevDebugUnitTest --continue --stacktrace > unit-test.log 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            echo "===== focused failure lines ====="
            grep -nE "(^| )FAILED$|FAILED|AssertionError|expected:<|but was:<|Caused by:|There were failing tests|FAILURE: Build failed|V136ReceiptReissueMarkTest|> Task :app:testDevDebugUnitTest" unit-test.log || true
            echo "===== final 160 log lines ====="
            tail -n 160 unit-test.log
          } > .github/tmp-v136-rcp004-unit-failure.txt

      - name: Persist concise diagnosis and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-v136-rcp004-diagnose2.yml
          git add .github/tmp-v136-rcp004-unit-failure.txt
          git commit -m "chore(v1.36): capture RCP-004 unit test failure"
          git push origin HEAD:develop/v1.36
