name: Apply v0.13 register layout fix

on:
  pull_request:
    branches:
      - develop/v0.12

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.13
          fetch-depth: 0

      - name: Apply register compact layout fix
        run: python3 tools/apply_v013_register_layout_fix.py

      - name: Commit fixed register source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(v0.13): keep startup and keypad controls visible"
          git push origin HEAD:develop/v0.13
