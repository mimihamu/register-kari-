name: Apply v0.47 diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop/v0.46
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.47 head
        uses: actions/checkout@v4
        with:
          ref: develop/v0.47
          fetch-depth: 0

      - name: Apply source changes
        run: python3 tools/v047_apply.py

      - name: Keep workflow updates for connector
        run: |
          git checkout -- .github/workflows/build-apk.yml
          rm tools/v047_apply.py

      - name: Commit and push source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs tools
          git commit -m "v0.47 connect Google Drive diagnostics"
          git push origin HEAD:develop/v0.47
