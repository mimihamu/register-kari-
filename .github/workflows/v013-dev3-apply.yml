              '            Text(title, fontSize = 21.sp, fontWeight = FontWeight.Bold, color = AsNavy)\n            Spacer(Modifier.height(6.dp))\n            Text(description, textAlign = TextAlign.Center, color = Color.DarkGray, lineHeight = 18.sp, fontSize = 13.sp)\n',
          )

          # Main register screen: fixed system bars, in-layout management buttons and payment/CD synchronization.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt',
              'import androidx.activity.compose.setContent\n',
