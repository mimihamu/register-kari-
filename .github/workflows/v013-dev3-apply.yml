                PaymentAmountRow("支払済", yen(state.paidAmount))
                PaymentAmountRow("残額", yen(remaining), emphasized = true)
                PaymentAmountRow("お釣り", yen(state.changeAmount))
                Spacer(Modifier.height(4.dp))
                LazyColumn(Modifier.height(40.dp)) {''',
