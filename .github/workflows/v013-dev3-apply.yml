name: Apply v0.13 dev3 updates

on:
  push:
    branches:
      - develop/v0.13

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v013-dev3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.13
          fetch-depth: 0

      - name: Apply source updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # RegisterApplication: management buttons are rendered only inside the sales screen.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/RegisterApplication.kt',
              '        updateActionButtons(activity, content, operator)\n',
              '',
          )

          # Catalog bootstrap keeps synchronization but no longer overlays a button on every MainActivity screen.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/CatalogBootstrapProvider.kt',
              '                synchronizeAndRefresh(activity)\n                installCatalogButton(activity)\n',
              '                synchronizeAndRefresh(activity)\n',
          )

          # Admin settings: status bar and authenticated, in-layout navigation tiles.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt',
              'import android.os.Bundle\n',
              'import android.content.Intent\nimport android.os.Bundle\nimport androidx.core.view.WindowCompat\n',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt',
              '        super.onCreate(savedInstanceState)\n        setContent {',
              '''        super.onCreate(savedInstanceState)
        window.statusBarColor = android.graphics.Color.rgb(23, 63, 107)
        window.navigationBarColor = android.graphics.Color.WHITE
        WindowCompat.getInsetsController(window, window.decorView).apply {
            isAppearanceLightStatusBars = false
            isAppearanceLightNavigationBars = true
        }
        setContent {''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt',
              '''                    onOperators = { screen = AdminScreen.OPERATORS },
                    onPrinter = { screen = AdminScreen.PRINTER },
                    onSecurity = { screen = AdminScreen.SECURITY },
                    onAudit = { screen = AdminScreen.AUDIT },
                    onLock = { unlocked = false },''',
              '''                    onOperators = { screen = AdminScreen.OPERATORS },
                    onPrinter = { screen = AdminScreen.PRINTER },
                    onCatalog = { context.startActivity(Intent(context, CatalogSettingsActivity::class.java)) },
                    onCustomerDisplay = { context.startActivity(Intent(context, CustomerDisplaySettingsActivity::class.java)) },
                    onPrinterTools = { context.startActivity(Intent(context, PrinterToolsHubActivity::class.java)) },
                    onSecurity = { screen = AdminScreen.SECURITY },
                    onAudit = { screen = AdminScreen.AUDIT },
                    onLock = { unlocked = false },''',
          )
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt',
              '''    onOperators: () -> Unit,
    onPrinter: () -> Unit,
    onSecurity: () -> Unit,
    onAudit: () -> Unit,''',
              '''    onOperators: () -> Unit,
    onPrinter: () -> Unit,
    onCatalog: () -> Unit,
    onCustomerDisplay: () -> Unit,
    onPrinterTools: () -> Unit,
    onSecurity: () -> Unit,
    onAudit: () -> Unit,''',
          )
