name: v1.36 SYN-004 apply

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop/v1.36'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply guarded SYN-004 patch
        run: python3 .github/v136-syn004-apply.py
      - name: Commit generated implementation
        run: |
          if git diff --quiet -- management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveDirectSync.kt management-app/src/test/java/jp/co/tenposinfo/register/plus/V152Syn004DriveChangesRateLimitTest.kt docs/V1.36_SYN_004_DRIVE_CHANGES_RATE_LIMIT.md; then
            echo 'SYN-004 already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveDirectSync.kt \
                  management-app/src/test/java/jp/co/tenposinfo/register/plus/V152Syn004DriveChangesRateLimitTest.kt \
                  docs/V1.36_SYN_004_DRIVE_CHANGES_RATE_LIMIT.md
          git commit -m 'feat(v1.36): implement Drive Changes API retry semantics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
