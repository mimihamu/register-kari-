name: v0.45 temporary source export

on:
  push:
    branches:
      - develop/v0.45
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          zip -r TSUGUREGI-v0.45-source.zip . \
            -x '.git/*' \
            -x '**/build/*' \
            -x '.gradle/*'

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.45-source-temp
          path: TSUGUREGI-v0.45-source.zip
          if-no-files-found: error
          retention-days: 1
