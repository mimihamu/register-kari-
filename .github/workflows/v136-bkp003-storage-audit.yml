name: v1.36 BKP-003 storage audit

on:
  push:
    branches:
      - develop/v1.36
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Audit BKP-003 storage locations
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HEAD ==='
          git rev-parse HEAD
          echo '=== SharedPreferences / filesystem persistence ==='
          rg -n --glob '*.kt' 'getSharedPreferences|SharedPreferences|PreferenceManager|filesDir|noBackupFilesDir|openFile(Output|Input)|getExternalFilesDir' app/src/main/java || true
          echo '=== backup-content domain terms ==='
          rg -n -i --glob '*.kt' 'image|logo|template|receipt.*layout|print.*template|sync.?index|outbox|unsent|store.?id|store.?host|store.?url|terminal.?id|connection|reservation|scheduled|pending.*master|drive.*index' app/src/main/java | head -n 1200 || true
          echo '=== DB table definitions / migrations relevant to BKP-003 ==='
          rg -n -i --glob '*.kt' 'CREATE TABLE|ALTER TABLE' app/src/main/java | rg -i 'setting|printer|template|image|logo|sync|outbox|store|terminal|reservation|schedule|pending|master|product|menu|operation_audit' | head -n 800 || true
          echo '=== application-private non-backup/runtime file roots ==='
          find app/src/main -maxdepth 4 -type f | sort | head -n 600
          echo '=== DataProtection archive/extract calls ==='
          rg -n 'writeArchive|extractDatabase|ZipEntry|MANIFEST_ENTRY|DATABASE_ENTRY|stageRestore|pending-register' app/src/main/java/jp/co/tenposinfo/register/DataProtection.kt
