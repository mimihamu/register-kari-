name: v1.36 formal sync queue audit

on:
  push:
    branches: [ develop/v1.36 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
      - name: Pinpoint finalization paths
        shell: bash
        run: |
          set -uo pipefail
          echo '=== files containing DynamicCatalog/menu revisions ==='
          grep -RIlE 'class DynamicCatalogStore|object DynamicCatalogStore|fun .*Revision|menu_revisions' app/src/main/java/jp/co/tenposinfo/register | sort
          echo '=== exact menu revision mutations ==='
          grep -RInC 30 -E 'insertOrThrow\("menu_revisions"|insert\("menu_revisions"|applyRevision|activateRevision|rollbackRevision|MenuRevisionApply' app/src/main/java/jp/co/tenposinfo/register | head -n 1600 || true
          echo '=== all business session status writes ==='
          grep -RInC 16 -E 'update\(.*business_sessions|"business_sessions"|put\("status"' app/src/main/java/jp/co/tenposinfo/register | grep -E 'OperationsStore|BusinessSession|status|business_sessions|closed_at' | head -n 1000 || true
          echo '=== exact recordSale/enrich order ==='
          grep -nC 30 -E 'JournalOutboxSchema.recordSale|enrichSaleJournal|setTransactionSuccessful' app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt | head -n 900 || true
          echo '=== transaction helper implementation ==='
          grep -RInC 12 -E 'fun <.*transaction|inline fun .*transaction|SQLiteDatabase.transaction' app/src/main/java/jp/co/tenposinfo/register | head -n 500 || true
