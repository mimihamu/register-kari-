    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Locate outer V1.18 conflict assertion
        shell: bash
        run: |
          set -uo pipefail
          git show "$V133_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v133-build-apk.yml
          awk '
            /^      - name: Verify cumulative v0.14-v1.33 sources/ { capture=1; next }
            capture && /^      - name: Verify launcher and orientation configuration/ { exit }
            capture && /^        run: \|/ { inrun=1; next }
            capture && inrun { sub(/^          /, ""); print }
          ' /tmp/v133-build-apk.yml > /tmp/v133-cumulative-checks.sh
          bash -uxo pipefail /tmp/v133-cumulative-checks.sh || true
          for f in /tmp/v122-cumulative-checks.sh /tmp/v123-cumulative-checks.sh /tmp/v124-cumulative-checks.sh; do
            echo "=== $f AROUND CONFLICT ==="
            if test -f "$f"; then
              nl -ba "$f" | grep -B50 -A120 'SYNC_IMPORT_CONFLICT_FINGERPRINT_AFTER_AUDIT' || true
            else
              echo missing
            fi
          done
