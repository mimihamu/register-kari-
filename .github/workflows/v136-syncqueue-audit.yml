name: v1.36 formal sync queue audit

on:
  push:
    branches: [ develop/v1.36 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      V133_FINAL_HEAD: 0da5d36a3899bedacdd0f28bea16468d191f784e
