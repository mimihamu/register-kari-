name: v1.36 formal sync queue audit

on:
  push:
    branches: [ develop/v1.36 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
      - name: Audit Plus ACK outbound path
        shell: bash
        run: |
          set -uo pipefail
          echo '=== ACK model / import result consumers ==='
          grep -RInC 20 -E 'SalesJournalImportAck|ImportAck|acknowledgements|acknowledg|IMPORT_ACK|ACK_' management-app/src/main | head -n 1800 || true
          echo '=== Drive upload / create paths in Plus ==='
          grep -RInC 20 -E 'files\.create|createFile|multipart|upload|appProperties|Drive.*client|GoogleDrive.*Upload|GoogleDrive.*Sync' management-app/src/main | head -n 2200 || true
          echo '=== importBatch call sites ==='
          grep -RInC 30 -E 'importBatch\(' management-app/src/main | head -n 1400 || true
          echo '=== outbox / pending / worker in Plus ==='
          grep -RInC 20 -E 'outbox|WorkManager|Worker|pending|retry|next_attempt|PENDING|RETRY' management-app/src/main | head -n 1800 || true
          echo '=== package tree candidate files ==='
          find management-app/src/main/java -type f | sort | grep -Ei 'drive|sync|import|ack|worker|outbox|upload' || true
