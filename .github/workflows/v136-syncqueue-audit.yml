name: v1.36 formal sync queue audit

on:
  push:
    branches: [ develop/v1.36 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Trace generated V1.18 compatibility gate
        shell: bash
        run: |
          set -uo pipefail
          V133_FINAL_HEAD=0da5d36a3899bedacdd0f28bea16468d191f784e
          git show "$V133_FINAL_HEAD:.github/workflows/build-apk.yml" > /tmp/v133-build-apk.yml
          awk '
            /^      - name: Verify cumulative v0.14-v1.33 sources/ { capture=1; next }
            capture && /^      - name: Verify launcher and orientation configuration/ { exit }
            capture && /^        run: \|/ { inrun=1; next }
            capture && inrun { sub(/^          /, ""); print }
          ' /tmp/v133-build-apk.yml > /tmp/v133-cumulative-checks.sh
          bash -uxo pipefail /tmp/v133-cumulative-checks.sh || true
          echo '=== FINAL V118 GENERATED SCRIPT AROUND CONFLICT MARKERS ==='
          if test -f /tmp/v118-cumulative-checks.sh; then
            nl -ba /tmp/v118-cumulative-checks.sh | grep -B45 -A70 'SYNC_IMPORT_CONFLICT_FINGERPRINT_AFTER_AUDIT' || true
          else
            echo 'v118 script was not generated'
          fi
