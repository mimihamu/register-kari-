name: V1.36 Source Export (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Export source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v136-source-snapshot
          path: |
            app/src/main/java/jp/co/tenposinfo/register/
            app/src/test/java/jp/co/tenposinfo/register/
            docs/
          retention-days: 1
