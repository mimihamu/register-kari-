name: tmp-v136-rcp004-diagnose3

on:
  push:
    branches:
      - develop/v1.36
    paths:
      - .github/workflows/tmp-v136-rcp004-diagnose3.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run app unit tests and capture failure
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest --stacktrace > unit-test.log 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            echo "===== focused failure lines ====="
            grep -nE "FAILED|AssertionError|expected:<|but was:<|Caused by:|There were failing tests|FAILURE: Build failed|V136ReceiptReissueMarkTest|> Task :app:testDebugUnitTest" unit-test.log || true
            echo "===== final 220 log lines ====="
            tail -n 220 unit-test.log
          } > .github/tmp-v136-rcp004-unit-failure.txt

      - name: Persist diagnosis and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-v136-rcp004-diagnose3.yml
          git add .github/tmp-v136-rcp004-unit-failure.txt
          git commit -m "chore(v1.36): refresh RCP-004 unit test diagnosis"
          git push origin HEAD:develop/v1.36
