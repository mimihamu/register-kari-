name: Apply v0.13 dev3 on PR

on:
  pull_request:
    branches:
      - develop/v0.12

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.13
          fetch-depth: 0

      - name: Execute embedded source applicator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/v013-dev3-apply-robust.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          source = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in source.splitlines()
          )
          exec(compile(source, 'v013-dev3-embedded.py', 'exec'))
          PY

      - name: Commit applied source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app customer-display .github/workflows/build-apk.yml docs/V013_DEV3_APPLY_DIAGNOSTIC.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(v0.13): fix register UI and keep latest CD item visible [v013-dev3-applied]"
          git push origin HEAD:develop/v0.13
