name: Clean v0.13 dev3 source

on:
  pull_request:
    branches:
      - develop/v0.12

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v0.13
          fetch-depth: 0

      - name: Remove duplicate generated source
        run: python3 tools/v013_dev3_cleanup.py

      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt \
                  app/src/main/java/jp/co/tenposinfo/register/MainActivity.kt \
                  customer-display/src/main/java/jp/co/tenposinfo/register/cd/MainActivity.kt \
                  docs/V013_DEV3_CLEANUP_DIAGNOSTIC.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(v0.13): remove duplicate generated UI source [v013-dev3-clean]"
          git push origin HEAD:develop/v0.13
