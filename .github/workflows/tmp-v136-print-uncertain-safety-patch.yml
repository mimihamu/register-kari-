name: Apply v1.36 print uncertain safety patch

on:
  push:
    branches:
      - develop/v1.36

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.36
          fetch-depth: 0
      - name: Apply formal v2.5 section 16.9 safety patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_all_required(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected >= {minimum} matches, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          # Persist the formal SENDING state while retaining PRINTING as a legacy-DB compatibility value.
          replace_once(
              'app/src/main/java/jp/co/tenposinfo/register/Receipt.kt',
              '    PRINTING,\n    COMPLETED,',
              '    PRINTING, // legacy: v1.35 and earlier in-flight row\n    SENDING,  // formal v2.5 §16.9: persisted before transport send\n    COMPLETED,',
          )

          # Sale receipt queue: new claims are SENDING; unknown delivery stays SENDING and is never auto-retried.
          p = Path('app/src/main/java/jp/co/tenposinfo/register/RegisterDatabase.kt')
          text = p.read_text()
          text = text.replace(
              'check(current.status == PrintJobStatus.PRINTING) {\n                "印刷中ではないジョブを完了へ変更できません"\n            }',
              'check(current.status == PrintJobStatus.SENDING || current.status == PrintJobStatus.PRINTING) {\n                "送信中ではないジョブを完了へ変更できません"\n            }',
          )
          text = text.replace(
              'arrayOf(jobId.toString(), PrintJobStatus.PRINTING.name, current.attemptCount.toString()),',
              'arrayOf(jobId.toString(), current.status.name, current.attemptCount.toString()),',
          )
          text = text.replace(
              'if (current.status != PrintJobStatus.PRINTING) return@runInTransactionWithResult Unit',
              'if (current.status != PrintJobStatus.SENDING && current.status != PrintJobStatus.PRINTING) return@runInTransactionWithResult Unit',
          )
          text = text.replace(
              'val status = if (permanent || manualConfirmation || current.attemptCount >= 4) {\n                PrintJobStatus.FAILED\n            } else {\n                PrintJobStatus.RETRY\n            }',
              'val status = when {\n                manualConfirmation -> PrintJobStatus.SENDING\n                permanent || current.attemptCount >= 4 -> PrintJobStatus.FAILED\n                else -> PrintJobStatus.RETRY\n            }',
          )
          text = text.replace(
              'require(current.status != PrintJobStatus.PRINTING) { "印刷中のジョブは操作できません" }',
              'require(current.status != PrintJobStatus.SENDING && current.status != PrintJobStatus.PRINTING) { "送信中または印刷結果不明のジョブは再送できません" }',
              1,
          )
          text = text.replace(
              'require(current.status != PrintJobStatus.PRINTING) { "印刷中のジョブは破棄できません" }',
              'require(current.status != PrintJobStatus.SENDING && current.status != PrintJobStatus.PRINTING) { "送信中または印刷結果不明のジョブは破棄できません" }',
              1,
          )
          text = text.replace(
              '"id = ? AND status NOT IN (?, ?, ?)",\n                arrayOf(\n                    jobId.toString(),\n                    PrintJobStatus.COMPLETED.name,\n                    PrintJobStatus.DISCARDED.name,\n                    PrintJobStatus.PRINTING.name,\n                ),',
              '"id = ? AND status NOT IN (?, ?, ?, ?)",\n                arrayOf(\n                    jobId.toString(),\n                    PrintJobStatus.COMPLETED.name,\n                    PrintJobStatus.DISCARDED.name,\n                    PrintJobStatus.SENDING.name,\n                    PrintJobStatus.PRINTING.name,\n                ),',
              1,
          )
          text = text.replace('put("status", PrintJobStatus.PRINTING.name)', 'put("status", PrintJobStatus.SENDING.name)', 1)
          text = text.replace('status = PrintJobStatus.PRINTING,', 'status = PrintJobStatus.SENDING,', 1)
          p.write_text(text)

          # Operation-document queue gets the same persisted SENDING and unknown-delivery semantics.
          p = Path('app/src/main/java/jp/co/tenposinfo/register/AdvancedOperationsStore.kt')
          text = p.read_text()
          text = text.replace(
              'require(current.status != PrintJobStatus.PRINTING) { "印刷中のジョブは操作できません" }',
              'require(current.status != PrintJobStatus.SENDING && current.status != PrintJobStatus.PRINTING) { "送信中または印刷結果不明のジョブは再送できません" }',
              1,
          )
          text = text.replace(
              'require(current.status != PrintJobStatus.PRINTING) { "印刷中のジョブは破棄できません" }',
              'require(current.status != PrintJobStatus.SENDING && current.status != PrintJobStatus.PRINTING) { "送信中または印刷結果不明のジョブは破棄できません" }',
              1,
          )
          text = text.replace(
              '"id = ? AND status NOT IN (?, ?, ?)",\n                arrayOf(\n                    jobId.toString(),\n                    PrintJobStatus.COMPLETED.name,\n                    PrintJobStatus.DISCARDED.name,\n                    PrintJobStatus.PRINTING.name,\n                ),',
              '"id = ? AND status NOT IN (?, ?, ?, ?)",\n                arrayOf(\n                    jobId.toString(),\n                    PrintJobStatus.COMPLETED.name,\n                    PrintJobStatus.DISCARDED.name,\n                    PrintJobStatus.SENDING.name,\n                    PrintJobStatus.PRINTING.name,\n                ),',
              1,
          )
          text = text.replace('put("status", PrintJobStatus.PRINTING.name)', 'put("status", PrintJobStatus.SENDING.name)', 1)
          text = text.replace(
              'arrayOf(jobId.toString(), PrintJobStatus.PRINTING.name, attempt.toString()),',
              'arrayOf(jobId.toString(), PrintJobStatus.SENDING.name, attempt.toString()),',
          )
          text = text.replace(
              'if (manualConfirmation || attempt >= 5) PrintJobStatus.FAILED.name else PrintJobStatus.RETRY.name,',
              'if (manualConfirmation) PrintJobStatus.SENDING.name else if (attempt >= 5) PrintJobStatus.FAILED.name else PrintJobStatus.RETRY.name,',
              1,
          )
          p.write_text(text)

          # Unified queue semantics, controller actions and legacy PRINTING compatibility.
          p = Path('app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueue.kt')
          text = p.read_text()
          text = text.replace('val actionRequired: Int get() = failed + retry', 'val actionRequired: Int get() = failed + retry + printing')
          text = text.replace(
              'printing = jobs.count { it.status == PrintJobStatus.PRINTING },',
              'printing = jobs.count { PrintJobUncertainPolicyV136.isUncertain(it.status) },',
          )
          text = text.replace(
              'PrintJobStatus.FAILED,\n                PrintJobStatus.PRINTING,',
              'PrintJobStatus.FAILED,\n                PrintJobStatus.SENDING,\n                PrintJobStatus.PRINTING,',
              1,
          )
          text = text.replace(
              'PrintJobStatus.RETRY,\n                PrintJobStatus.FAILED,\n            )',
              'PrintJobStatus.RETRY,\n                PrintJobStatus.FAILED,\n                PrintJobStatus.SENDING,\n                PrintJobStatus.PRINTING,\n            )',
              1,
          )
          text = text.replace(
              'private val documentStore = AdvancedOperationsStore(applicationContext)\n    private val settingsStore',
              'private val documentStore = AdvancedOperationsStore(applicationContext)\n    private val uncertainSafetyStore = PrintJobUncertainSafetyStoreV136(applicationContext)\n    private val settingsStore',
          )
          text = text.replace(
              'monitoringStore.close()\n        settingsStore.close()',
              'monitoringStore.close()\n        uncertainSafetyStore.close()\n        settingsStore.close()',
          )
          text = text.replace(
              'PrintJobStatus.PRINTING -> "印刷中のジョブは操作できません"',
              'PrintJobStatus.SENDING,\n                PrintJobStatus.PRINTING -> "印刷済みの可能性があるため直接再送できません"',
          )
          marker = '''    fun discard(\n        job: UnifiedPrintJob,'''
          addition = '''    fun resolveUncertainAsCompleted(\n        job: UnifiedPrintJob,\n        reason: String,\n        actor: String,\n    ): Result<String> = runCatching {\n        require(PrintJobUncertainPolicyV136.isUncertain(job.status)) { "印刷結果不明のジョブではありません" }\n        uncertainSafetyStore.resolveAsPrinted(job, reason, actor)\n        "完了扱いにしました（Job.${job.sourceId} / 印刷済みの可能性を担当者確認）"\n    }\n\n    fun reprintUncertain(\n        job: UnifiedPrintJob,\n        reason: String,\n        actor: String,\n    ): Result<String> = runCatching {\n        require(PrintJobUncertainPolicyV136.isUncertain(job.status)) { "印刷結果不明のジョブではありません" }\n        val newJobId = uncertainSafetyStore.createReprint(job, reason, actor)\n        AutomaticPrintScheduler.enqueueNow(applicationContext)\n        "再印刷を新規登録しました（元Job.${job.sourceId} → 新Job.$newJobId）"\n    }\n\n'''
          if marker not in text:
              raise SystemExit('UnifiedPrintQueue.kt: discard marker not found')
          text = text.replace(marker, addition + marker, 1)
          text = text.replace(
              'PrintJobStatus.PRINTING -> "印刷中のジョブは操作できません"\n        else -> "このジョブは送信できません"',
              'PrintJobStatus.SENDING,\n        PrintJobStatus.PRINTING -> "印刷済みの可能性があるため送信できません。完了扱いまたは再印刷を選択してください"\n        else -> "このジョブは送信できません"',
              1,
          )
          text = text.replace(
              'PrintJobStatus.RETRY -> 5\n        PrintJobStatus.PRINTING -> 4',
              'PrintJobStatus.SENDING -> 7\n        PrintJobStatus.RETRY -> 5\n        PrintJobStatus.PRINTING -> 7',
          )
          p.write_text(text)

          # Queue UI: explicitly surface uncertain delivery and the two formal operator decisions.
          p = Path('app/src/main/java/jp/co/tenposinfo/register/UnifiedPrintQueueActivity.kt')
          text = p.read_text()
          insert_after = '''    fun executeDiscard(job: UnifiedPrintJob) {\n        if (working) return\n        working = true\n        message = "責任者承認を確認して印刷ジョブを破棄しています…"\n        scope.launch {\n            val result = withContext(Dispatchers.IO) {\n                controller.discard(\n                    job = job,\n                    managerPin = managerPin,\n                    reason = discardReason,\n                    actor = actor,\n                )\n            }\n            message = result.fold(onSuccess = { it }, onFailure = { it.message ?: "破棄に失敗しました" })\n            if (result.isSuccess) resetApprovalInputs()\n            working = false\n            refresh(clearSelection = result.isSuccess && criteria.status != UnifiedPrintStatusFilter.ALL)\n        }\n    }\n'''
          extra = '''\n    fun executeResolveUncertain(job: UnifiedPrintJob) {\n        if (working) return\n        working = true\n        message = "印刷結果不明ジョブを完了扱いにしています…"\n        scope.launch {\n            val result = withContext(Dispatchers.IO) { controller.resolveUncertainAsCompleted(job, discardReason, actor) }\n            message = result.fold(onSuccess = { it }, onFailure = { it.message ?: "完了扱いに失敗しました" })\n            if (result.isSuccess) resetApprovalInputs()\n            working = false\n            refresh(clearSelection = result.isSuccess && criteria.status != UnifiedPrintStatusFilter.ALL)\n        }\n    }\n\n    fun executeReprintUncertain(job: UnifiedPrintJob) {\n        if (working) return\n        working = true\n        message = "元ジョブを保持したまま再印刷ジョブを新規登録しています…"\n        scope.launch {\n            val result = withContext(Dispatchers.IO) { controller.reprintUncertain(job, discardReason, actor) }\n            message = result.fold(onSuccess = { it }, onFailure = { it.message ?: "再印刷登録に失敗しました" })\n            if (result.isSuccess) resetApprovalInputs()\n            working = false\n            refresh()\n        }\n    }\n'''
          if insert_after not in text:
              raise SystemExit('UnifiedPrintQueueActivity.kt: executeDiscard block not found')
          text = text.replace(insert_after, insert_after + extra, 1)
          text = text.replace(
              'onDiscard = ::executeDiscard,',
              'onDiscard = ::executeDiscard,\n                            onResolveUncertain = ::executeResolveUncertain,\n                            onReprintUncertain = ::executeReprintUncertain,',
          )
          text = text.replace(
              'onDiscard: (UnifiedPrintJob) -> Unit,\n) {',
              'onDiscard: (UnifiedPrintJob) -> Unit,\n    onResolveUncertain: (UnifiedPrintJob) -> Unit,\n    onReprintUncertain: (UnifiedPrintJob) -> Unit,\n) {',
              1,
          )
          action_marker = '''        if (UnifiedPrintJobActionPolicy.mayRetry(selected.status)) {'''
          uncertain_ui = '''        if (PrintJobUncertainPolicyV136.isUncertain(selected.status)) {\n            Card(\n                colors = CardDefaults.cardColors(containerColor = UqRed.copy(alpha = 0.08f)),\n                border = BorderStroke(2.dp, UqRed),\n                modifier = Modifier.fillMaxWidth(),\n            ) {\n                Column(Modifier.fillMaxWidth().padding(10.dp)) {\n                    Text("印刷済みの可能性", color = UqRed, fontWeight = FontWeight.Bold, fontSize = 18.sp)\n                    Text("自動再送しません。実際の紙を確認し、完了扱いまたは再印刷を選択してください。")\n                    if (!selected.lastError.isNullOrBlank()) Text("送信情報：${selected.lastError}", fontSize = 12.sp)\n                }\n            }\n            Spacer(Modifier.height(7.dp))\n            OutlinedTextField(\n                value = discardReason,\n                onValueChange = onDiscardReasonChanged,\n                label = { Text("判断理由（4文字以上・監査ログへ保存）") },\n                minLines = 2,\n                maxLines = 3,\n                modifier = Modifier.fillMaxWidth(),\n            )\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(7.dp)) {\n                OutlinedButton(\n                    onClick = { onResolveUncertain(selected) },\n                    enabled = !working && discardReason.trim().length >= 4,\n                    modifier = Modifier.weight(1f).height(50.dp),\n                ) { Text("完了扱い", fontWeight = FontWeight.Bold) }\n                Button(\n                    onClick = { onReprintUncertain(selected) },\n                    enabled = !working && discardReason.trim().length >= 4,\n                    modifier = Modifier.weight(1f).height(50.dp),\n                    colors = ButtonDefaults.buttonColors(containerColor = UqBlue),\n                ) { Text("再印刷", fontWeight = FontWeight.Bold) }\n            }\n            Spacer(Modifier.height(7.dp))\n        }\n\n'''
          if action_marker not in text:
              raise SystemExit('UnifiedPrintQueueActivity.kt: action marker not found')
          text = text.replace(action_marker, uncertain_ui + action_marker, 1)
          text = text.replace(
              '} else {\n            Card(\n                modifier = Modifier.fillMaxWidth(),\n                colors = CardDefaults.cardColors(containerColor = Color(0xFFF1F3F5)),',
              '} else if (!PrintJobUncertainPolicyV136.isUncertain(selected.status)) {\n            Card(\n                modifier = Modifier.fillMaxWidth(),\n                colors = CardDefaults.cardColors(containerColor = Color(0xFFF1F3F5)),',
              1,
          )
          text = text.replace('QueueValue("印刷中", "${summary.printing}件")', 'QueueValue("送信中/結果不明", "${summary.printing}件")')
          text = text.replace(
              'PrintJobStatus.RETRY,\n    PrintJobStatus.PRINTING,',
              'PrintJobStatus.RETRY,\n    PrintJobStatus.SENDING,\n    PrintJobStatus.PRINTING,',
              1,
          )
          text = text.replace(
              'PrintJobStatus.PRINTING -> "印刷中"',
              'PrintJobStatus.SENDING -> "印刷済みの可能性"\n    PrintJobStatus.PRINTING -> "印刷済みの可能性（旧状態）"',
              1,
          )
          text = text.replace(
              'PrintJobStatus.PRINTING -> "印刷処理中です。完了または失敗状態へ変わるまで操作できません。"',
              'PrintJobStatus.SENDING,\n                        PrintJobStatus.PRINTING -> "印刷済みの可能性があります。完了扱いまたは再印刷を選択してください。"',
              1,
          )
          text = text.replace(
              '"FAILEDは自動再送しません。強制印刷と破棄は責任者PIN・監査ログを必須とします。"',
              '"SENDING（印刷済みの可能性）は自動再送しません。完了扱いまたは理由付き再印刷を選択します。"',
          )
          p.write_text(text)

          helper = r'''package jp.co.tenposinfo.register

import android.content.ContentValues
import android.content.Context
import android.database.sqlite.SQLiteDatabase

/** Formal v2.5 §16.9: uncertain delivery must never overwrite/retry the original PrintJob. */
object PrintJobUncertainPolicyV136 {
    const val MIN_REASON_LENGTH = 4

    fun isUncertain(status: PrintJobStatus): Boolean =
        status == PrintJobStatus.SENDING || status == PrintJobStatus.PRINTING

    fun requireDecisionInput(reason: String, operatorId: String) {
        require(reason.trim().length >= MIN_REASON_LENGTH) { "判断理由を4文字以上で入力してください" }
        require(operatorId.isNotBlank()) { "担当者が必要です" }
    }
}

class PrintJobUncertainSafetyStoreV136(context: Context) : AutoCloseable {
    private val database = RegisterDatabase(context.applicationContext)
    private val db = database.writableDatabase

    init {
        ensureSchema()
    }

    override fun close() = database.close()

    fun resolveAsPrinted(job: UnifiedPrintJob, reason: String, operatorId: String) {
        PrintJobUncertainPolicyV136.requireDecisionInput(reason, operatorId)
        db.inPrintSafetyTransaction {
            val source = requireUncertain(job)
            val now = System.currentTimeMillis()
            val table = source.first
            val updated = update(
                table,
                ContentValues().apply {
                    put("status", PrintJobStatus.COMPLETED.name)
                    put("last_error", "印刷済みの可能性を担当者確認で完了扱い：${reason.trim()}".take(500))
                    put("uncertain_resolution", "COMPLETED_AS_PRINTED")
                    put("uncertain_resolved_at", now)
                    put("uncertain_resolved_by", operatorId.trim().take(100))
                    put("updated_at", now)
                },
                "id = ? AND status IN (?, ?)",
                arrayOf(job.sourceId.toString(), PrintJobStatus.SENDING.name, PrintJobStatus.PRINTING.name),
            )
            check(updated == 1) { "印刷ジョブの状態が変更されたため完了扱いにできませんでした" }
            if (job.type == UnifiedPrintJobType.SALE_RECEIPT) {
                execSQL("UPDATE sales SET print_count = print_count + 1 WHERE id = ?", arrayOf(source.second))
            }
            insertAudit(
                eventType = "PRINT_JOB_UNCERTAIN_COMPLETED",
                referenceId = job.sourceId,
                detail = "${job.type.name}; source_job_id=${job.sourceId}; reason=${reason.trim()}",
                operatorId = operatorId,
                createdAt = now,
            )
        }
    }

    fun createReprint(job: UnifiedPrintJob, reason: String, operatorId: String): Long {
        PrintJobUncertainPolicyV136.requireDecisionInput(reason, operatorId)
        return db.inPrintSafetyTransaction {
            val source = requireUncertain(job)
            val now = System.currentTimeMillis()
            val newJobId = if (job.type == UnifiedPrintJobType.SALE_RECEIPT) {
                val row = query(
                    "print_jobs",
                    arrayOf("sale_id", "paper_width_mm"),
                    "id = ?",
                    arrayOf(job.sourceId.toString()),
                    null, null, null, "1",
                ).use { cursor ->
                    check(cursor.moveToFirst()) { "元の売上印刷ジョブが見つかりません" }
                    cursor.getLong(0) to cursor.getInt(1)
                }
                insertOrThrow(
                    "print_jobs",
                    null,
                    ContentValues().apply {
                        put("sale_id", row.first)
                        put("paper_width_mm", row.second)
                        put("status", PrintJobStatus.PENDING.name)
                        put("attempt_count", 0)
                        putNull("last_error")
                        put("created_at", now)
                        put("updated_at", now)
                        put("source_job_id", job.sourceId)
                        put("reprint_reason", reason.trim().take(500))
                        put("reprint_operator_id", operatorId.trim().take(100))
                    },
                )
            } else {
                val row = query(
                    "document_print_jobs",
                    arrayOf("document_type", "reference_id", "paper_width_mm", "payload_text"),
                    "id = ?",
                    arrayOf(job.sourceId.toString()),
                    null, null, null, "1",
                ).use { cursor ->
                    check(cursor.moveToFirst()) { "元の業務帳票印刷ジョブが見つかりません" }
                    arrayOf(cursor.getString(0), cursor.getLong(1), cursor.getInt(2), cursor.getString(3))
                }
                insertOrThrow(
                    "document_print_jobs",
                    null,
                    ContentValues().apply {
                        put("document_type", row[0] as String)
                        put("reference_id", row[1] as Long)
                        put("paper_width_mm", row[2] as Int)
                        put("status", PrintJobStatus.PENDING.name)
                        put("attempt_count", 0)
                        putNull("last_error")
                        put("payload_text", row[3] as String)
                        put("created_at", now)
                        put("updated_at", now)
                        put("source_job_id", job.sourceId)
                        put("reprint_reason", reason.trim().take(500))
                        put("reprint_operator_id", operatorId.trim().take(100))
                    },
                )
            }

            val updated = update(
                source.first,
                ContentValues().apply {
                    put("status", PrintJobStatus.DISCARDED.name)
                    put("last_error", "印刷結果不明。再印刷Job.$newJobIdへ引継ぎ：${reason.trim()}".take(500))
                    put("uncertain_resolution", "REPRINT_CREATED")
                    put("uncertain_resolved_at", now)
                    put("uncertain_resolved_by", operatorId.trim().take(100))
                    put("updated_at", now)
                },
                "id = ? AND status IN (?, ?)",
                arrayOf(job.sourceId.toString(), PrintJobStatus.SENDING.name, PrintJobStatus.PRINTING.name),
            )
            check(updated == 1) { "印刷ジョブの状態が変更されたため再印刷を登録できませんでした" }
            insertAudit(
                eventType = "PRINT_JOB_UNCERTAIN_REPRINT_CREATED",
                referenceId = job.sourceId,
                detail = "${job.type.name}; source_job_id=${job.sourceId}; new_job_id=$newJobId; reason=${reason.trim()}",
                operatorId = operatorId,
                createdAt = now,
            )
            newJobId
        }
    }

    private fun SQLiteDatabase.requireUncertain(job: UnifiedPrintJob): Pair<String, Long> {
        val table = if (job.type == UnifiedPrintJobType.SALE_RECEIPT) "print_jobs" else "document_print_jobs"
        val referenceColumn = if (job.type == UnifiedPrintJobType.SALE_RECEIPT) "sale_id" else "reference_id"
        val current = query(
            table,
            arrayOf(referenceColumn, "status"),
            "id = ?",
            arrayOf(job.sourceId.toString()),
            null, null, null, "1",
        ).use { cursor ->
            check(cursor.moveToFirst()) { "印刷ジョブが見つかりません" }
            cursor.getLong(0) to PrintJobStatus.valueOf(cursor.getString(1))
        }
        check(PrintJobUncertainPolicyV136.isUncertain(current.second)) {
            "印刷ジョブは既に別の状態へ変更されています"
        }
        return table to current.first
    }

    private fun ensureSchema() {
        OperationAuditSchemaV136.ensure(db)
        listOf("print_jobs", "document_print_jobs").forEach { table ->
            ensureColumn(table, "source_job_id", "INTEGER")
            ensureColumn(table, "reprint_reason", "TEXT")
            ensureColumn(table, "reprint_operator_id", "TEXT")
            ensureColumn(table, "uncertain_resolution", "TEXT")
            ensureColumn(table, "uncertain_resolved_at", "INTEGER")
            ensureColumn(table, "uncertain_resolved_by", "TEXT")
            db.execSQL("CREATE INDEX IF NOT EXISTS idx_${table}_source_job_v136 ON $table(source_job_id)")
        }
    }

    private fun ensureColumn(table: String, column: String, definition: String) {
        val exists = db.rawQuery("PRAGMA table_info($table)", null).use { cursor ->
            val nameIndex = cursor.getColumnIndex("name")
            var found = false
            while (cursor.moveToNext()) {
                if (cursor.getString(nameIndex) == column) {
                    found = true
                    break
                }
            }
            found
        }
        if (!exists) db.execSQL("ALTER TABLE $table ADD COLUMN $column $definition")
    }

    private fun SQLiteDatabase.insertAudit(
        eventType: String,
        referenceId: Long,
        detail: String,
        operatorId: String,
        createdAt: Long,
    ) {
        insertOrThrow(
            "operation_audit",
            null,
            ContentValues().apply {
