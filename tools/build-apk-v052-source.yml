name: Build つぐレジ APK

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify cumulative v0.14-v0.52 sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 82' app/build.gradle.kts
          grep -q 'versionName = "0.52.0-dev.1"' app/build.gradle.kts
          grep -q 'versionCode = 7' customer-display/build.gradle.kts
          grep -q 'versionName = "0.14.0-dev.1"' customer-display/build.gradle.kts
          grep -q 'versionCode = 11' management-app/build.gradle.kts
          grep -q 'versionName = "0.11.0-dev.1"' management-app/build.gradle.kts
          grep -q 'com.google.android.gms:play-services-auth:21.6.0' app/build.gradle.kts
          grep -q 'com.google.android.gms:play-services-auth:21.6.0' management-app/build.gradle.kts
          grep -q 'androidx.work:work-runtime:2.11.2' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime:2.11.2' management-app/build.gradle.kts
          grep -q 'include(":management-app")' settings.gradle.kts

          for file in \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/jp/co/tenposinfo/register/AdminSettingsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/GoogleDriveAccountActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/GoogleDriveSetupGuideActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/GoogleDriveDiagnosticsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/GoogleDriveConnectionTest.kt \
            app/src/main/java/jp/co/tenposinfo/register/GoogleDriveDirectUpload.kt \
            app/src/main/java/jp/co/tenposinfo/register/SyncSettingsActivity.kt \
            app/src/main/java/jp/co/tenposinfo/register/SalesJournalJsonContract.kt \
            app/src/main/java/jp/co/tenposinfo/register/BusinessSyncFoundation.kt \
            app/src/main/java/jp/co/tenposinfo/register/OutboxExternalDelivery.kt \
            app/src/main/java/jp/co/tenposinfo/register/OutboxDeliveryOperations.kt \
            app/src/test/java/jp/co/tenposinfo/register/V044GoogleDriveAccountTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V045GoogleDriveDirectUploadTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V046GoogleDriveSetupGuideTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V047GoogleDriveDiagnosticsTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V048GoogleDriveSettingsEntryTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V050GoogleDriveCrossAppConnectionTest.kt \
            app/src/test/java/jp/co/tenposinfo/register/V051GoogleDriveRecoveryFallbackTest.kt \
            management-app/src/main/AndroidManifest.xml \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveAccountActivity.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveSetupGuideActivity.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveDiagnosticsActivity.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveConnectionTest.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveRecoveryActivity.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveOperations.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/GoogleDriveDirectSync.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/MainActivity.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/ManagementFolderSyncScreen.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/ImportFolderSource.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/FolderImportRepository.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/ManagementDatabase.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/SalesJournalImportContract.kt \
            management-app/src/main/java/jp/co/tenposinfo/register/plus/SalesJournalImportRepository.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V044GoogleDriveAccountTest.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V045GoogleDriveDirectSyncTest.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V049GoogleDrivePlusSetupDiagnosticsTest.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V050GoogleDriveCrossAppConnectionTest.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V051GoogleDriveRecoveryFallbackTest.kt \
            management-app/src/test/java/jp/co/tenposinfo/register/plus/V052GoogleDriveOperationsSetupTest.kt \
            customer-display/src/main/java/jp/co/tenposinfo/register/cd/MainActivity.kt \
            customer-display/src/main/java/jp/co/tenposinfo/register/cd/CustomerDisplaySnapshotStore.kt \
            docs/V0.52_GOOGLE_DRIVE_OPERATIONS_SETUP.md \
            docs/V0.52_RELEASE_NOTES.md \
            docs/V0.51_GOOGLE_DRIVE_RECOVERY_FALLBACK.md \
            docs/V0.51_RELEASE_NOTES.md \
            docs/V0.50_GOOGLE_DRIVE_CROSS_APP_CONNECTION_TEST.md \
            docs/V0.50_RELEASE_NOTES.md \
            docs/V0.49_TSUGUREGI_PLUS_DRIVE_SETUP_DIAGNOSTICS.md \
            docs/V0.49_RELEASE_NOTES.md \
            docs/V0.48_GOOGLE_DRIVE_SETTINGS_ENTRY.md \
            docs/V0.48_RELEASE_NOTES.md \
            docs/V0.47_GOOGLE_DRIVE_DIAGNOSTICS.md \
            docs/V0.47_RELEASE_NOTES.md \
            docs/V0.46_GOOGLE_DRIVE_SETUP_GUIDE.md \
            docs/V0.46_RELEASE_NOTES.md \
            docs/V0.45_GOOGLE_DRIVE_DIRECT_SYNC.md \
            docs/V0.45_RELEASE_NOTES.md \
            docs/V0.44_GOOGLE_ACCOUNT_AUTHORIZATION.md \
            docs/V0.44_RELEASE_NOTES.md \
            docs/V0.43_GOOGLE_DRIVE_CONNECTION.md \
            docs/V0.42_TSUGUREGI_PLUS_FOLDER_IMPORT.md \
            docs/V0.41_TSUGUREGI_PLUS_MOBILE_PORTRAIT.md \
            docs/V0.40_TSUGUREGI_PLUS_SALES_REPORTING.md \
            docs/V0.39_TSUGUREGI_PLUS_IMPORT.md \
            docs/schemas/tsuguregi-sales-journal-v1.schema.json; do
            test -s "$file"
          done

          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/jp/co/tenposinfo/register')
          plus = Path('management-app/src/main/java/jp/co/tenposinfo/register/plus')
          pos_account = (root / 'GoogleDriveAccountActivity.kt').read_text()
          pos_drive = (root / 'GoogleDriveDirectUpload.kt').read_text()
          setup_guide = (root / 'GoogleDriveSetupGuideActivity.kt').read_text()
          diagnostics = (root / 'GoogleDriveDiagnosticsActivity.kt').read_text()
          admin_settings = (root / 'AdminSettingsActivity.kt').read_text()
          sync_settings = (root / 'SyncSettingsActivity.kt').read_text()
          plus_account = (plus / 'GoogleDriveAccountActivity.kt').read_text()
          plus_drive = (plus / 'GoogleDriveDirectSync.kt').read_text()
          plus_setup = (plus / 'GoogleDriveSetupGuideActivity.kt').read_text()
          plus_diagnostics = (plus / 'GoogleDriveDiagnosticsActivity.kt').read_text()
          register_connection_test = (root / 'GoogleDriveConnectionTest.kt').read_text()
          plus_connection_test = (plus / 'GoogleDriveConnectionTest.kt').read_text()
          plus_recovery = (plus / 'GoogleDriveRecoveryActivity.kt').read_text()
          plus_operations = (plus / 'GoogleDriveOperations.kt').read_text()
          plus_db = (plus / 'ManagementDatabase.kt').read_text()
          plus_import = (plus / 'SalesJournalImportRepository.kt').read_text()
          folder_ui = (plus / 'ManagementFolderSyncScreen.kt').read_text()
          pos_manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          plus_manifest = Path('management-app/src/main/AndroidManifest.xml').read_text()
          contract = (root / 'SalesJournalJsonContract.kt').read_text()
          foundation = (root / 'BusinessSyncFoundation.kt').read_text()
          saf_delivery = (root / 'OutboxExternalDelivery.kt').read_text()
          schema = Path('docs/schemas/tsuguregi-sales-journal-v1.schema.json').read_text()

          for account_source in (pos_account, plus_account):
              for token in (
                  'Identity.getAuthorizationClient',
                  'AuthorizationRequest.builder',
                  'AuthorizationRequest.Prompt.SELECT_ACCOUNT',
                  'Scopes.DRIVE_FILE',
                  'RevokeAccessRequest.builder',
                  'https://www.googleapis.com/drive/v3/about',
                  'GoogleDriveAccountStatus.CLOUD_CONFIGURATION_REQUIRED',
                  'GoogleDriveAccountStatus.DRIVE_API_DISABLED',
              ):
                  assert token in account_source, token
              assert 'putString("access_token"' not in account_source
              assert 'putString("refresh_token"' not in account_source

          for token in (
              'GoogleDriveAccessTokenProvider',
              'GoogleDriveAccountPolicy.requestedScopes',
              'https://www.googleapis.com/drive/v3/files',
              'https://www.googleapis.com/upload/drive/v3/files',
              'supportsAllDrives=false',
              'spaces=drive',
              'appProperties has',
              'sales-journal-root',
              'storeId',
              'terminalId',
              'businessDate',
              'duplicateKey',
              'contentSha256',
              'drive_api_uploads',
              "o.status IN ('STAGED','SENT')",
              'GoogleDriveDirectUploadWorker',
              'GoogleDriveDirectUploadScheduler',
              'OutboxDeliverySettingsStore',
          ):
              assert token in pos_drive, token
          assert 'putString("access_token"' not in pos_drive
          assert 'putString("refresh_token"' not in pos_drive
          assert 'https://www.googleapis.com/auth/drive"' not in pos_drive

          for token in (
              'GoogleDriveSyncAccessTokenProvider',
              'GoogleDriveAccountPolicy.requestedScopes',
              'files(id,name,modifiedTime,size,appProperties)',
              'supportsAllDrives=false',
              'spaces=drive',
              'appProperties has',
              'sales-journal',
              'drive_sync_files',
              'file_id',
              'modified_time',
              'content_sha256',
              'SalesJournalImportRepository(database).importDocuments',
              'forceReimport',
              'GoogleDriveDirectSyncWorker',
              'GoogleDriveDirectSyncScheduler',
              'enqueueStartup',
          ):
              assert token in plus_drive, token
          assert 'putString("access_token"' not in plus_drive
          assert 'putString("refresh_token"' not in plus_drive
          assert 'DATABASE_VERSION = 4' in plus_db
          assert 'drive_sync_files' in plus_db
          assert 'fun importDocuments' in plus_import

          for token in ('GET_SIGNING_CERTIFICATES', 'applicationId（パッケージ名）', '署名SHA-1', '別々のAndroid OAuthクライアント'):
              assert token in plus_setup, token
          for token in ('GoogleApiAvailability', 'ConnectivityManager', 'ManagementDatabase', 'drive_sync_files', 'import_rejections', 'Intent.ACTION_SEND', 'REDACTED_TOKEN'):
              assert token in plus_diagnostics, token
          assert 'putString("access_token"' not in plus_diagnostics
          assert 'putString("refresh_token"' not in plus_diagnostics

          for token in ('GoogleDriveConnectionTestCoordinator', 'connection-test', 'containsSalesData', 'client.updateJson', 'oauth-cross-app-visibility'):
              assert token in register_connection_test, token
          for token in ('GoogleDriveConnectionTestVerifier', 'findLatest', 'download', 'ALLOWED_KEYS', 'NOT_FOUND', 'modifiedTime desc'):
              assert token in plus_connection_test, token
          assert 'SalesJournalJsonContract' not in register_connection_test
          assert 'SalesJournalImportRepository' not in plus_connection_test
          assert 'putString("access_token"' not in register_connection_test
          assert 'putString("refresh_token"' not in register_connection_test
          assert 'putString("access_token"' not in plus_connection_test
          assert 'putString("refresh_token"' not in plus_connection_test
          assert '接続テストJSONを作成' in pos_account
          assert 'つぐレジ接続テストを検索' in plus_account
          assert 'GoogleDriveRecoveryActivity::class.java' in plus_account
          assert '運用セットアップ・復旧' in plus_account
          for token in ('GoogleDriveRecoveryPolicy', 'ActivityResultContracts.OpenDocumentTree', 'persistFolderPermission', 'ImportFolderPreferences', 'DriveConnectionInspector', 'setAutomaticSyncEnabled'):
              assert token in plus_recovery, token
          assert 'putString("access_token"' not in plus_recovery
          assert 'putString("refresh_token"' not in plus_recovery
          for token in ('GoogleDriveOperatingMode', 'GoogleDriveResolvedMode', 'GoogleDriveOperationsPolicy', 'GoogleDriveOperatingModeStore', 'GoogleDriveValidationChecklistStore'):
              assert token in plus_operations, token
          assert '推奨設定を一括適用' in plus_recovery
          assert 'DriveSyncPreferences(applicationContext).setAutoImportOnLaunch(false)' in plus_recovery
          assert 'putString("access_token"' not in plus_operations
          assert 'putString("refresh_token"' not in plus_operations
          assert 'cancelUniqueWork(PERIODIC_NAME)' in plus_drive
          assert 'cancelUniqueWork(STARTUP_NAME)' in plus_drive

          for token in ('GET_SIGNING_CERTIFICATES', 'MessageDigest.getInstance', 'applicationId（パッケージ名）', 'Google Cloud Consoleを開く', 'Googleアカウント登録へ進む'):
              assert token in setup_guide, token

          for token in ('GoogleDriveDiagnosticLogStore', 'GoogleDriveDiagnosticRepository', 'GoogleDriveDiagnosticReport', 'Intent.ACTION_SEND', 'REDACTED_TOKEN', 'content://[REDACTED]'):
              assert token in diagnostics, token
          assert 'putString("access_token"' not in diagnostics
          assert 'putString("refresh_token"' not in diagnostics

          for token in ('Google Drive・同期', '初期設定、アカウント、送信状況、診断', 'SyncSettingsActivity::class.java', 'onSync: () -> Unit'):
              assert token in admin_settings, token
          for token in ('Google Drive・同期設定', 'Google Drive初期設定・アカウント', 'GoogleDriveSetupGuideActivity::class.java'):
              assert token in sync_settings, token

          assert 'GoogleDriveSetupGuideActivity' in pos_manifest
          assert 'GoogleDriveDiagnosticsActivity' in pos_manifest
          assert 'GoogleDriveDiagnosticsActivity::class.java' in pos_account
          assert 'GoogleDriveDiagnosticLogStore' in pos_drive
          assert 'GoogleDriveDirectUploadBootstrapProvider' in pos_manifest
          assert 'GoogleDriveDirectSyncBootstrapProvider' in plus_manifest
          assert 'GoogleDriveRecoveryActivity' in plus_manifest
          assert 'android:screenOrientation="landscape"' in pos_manifest
          assert 'android:screenOrientation="sensorPortrait"' in plus_manifest
          assert 'android:screenOrientation="landscape"' not in plus_manifest
          assert 'フォルダ方式は互換用' in folder_ui
          assert '今すぐアップロード' in pos_account
          assert '今すぐ差分同期' in plus_account
          assert '全件再取込' in plus_account
          assert '起動時に差分同期' in plus_account

          assert 'DUPLICATE_KEY_VERSION = 1' in contract
          assert 'SalesJournalJsonContract.wrap' in foundation
          assert "status='STAGED'" in saf_delivery
          assert 'jp.co.tenposinfo.tsuguregi.sales-journal' in schema

          for version in ('v052', 'v051', 'v050', 'v049', 'v048', 'v047', 'v046', 'v045', 'v044', 'v043', 'v042', 'v041', 'v040', 'v039', 'v038', 'v037', 'v036', 'v035'):
              assert not list(Path('tools').glob(f'{version}*'))
              assert not Path(f'.github/workflows/{version}-apply.yml').exists()
          assert not Path('.github/workflows/v045-source-export-temp.yml').exists()
          assert not Path('.github/workflows/v046-apply-temp.yml').exists()
          assert not Path('.github/workflows/v046-trigger-temp.yml').exists()
          assert not Path('tools/v046_apply.py').exists()
          assert not Path('.github/workflows/v047-apply-temp.yml').exists()
          assert not Path('tools/v047_apply.py').exists()
          assert not Path('tools/build-apk-v047.generated.yml').exists()
          assert not Path('.github/workflows/v048-apply-temp.yml').exists()
          assert not Path('tools/v048_apply.py').exists()
          assert not Path('tools/build-apk-v048.generated.yml').exists()
          assert not Path('.github/workflows/v049-apply-temp.yml').exists()
          assert not Path('tools/v049_apply.py').exists()
          assert not Path('tools/build-apk-v049.generated.yml').exists()
          assert not Path('.github/workflows/v050-apply-temp.yml').exists()
          assert not Path('tools/v050_apply.py').exists()
          assert not Path('tools/build-apk-v050.generated.yml').exists()
          assert not Path('.github/workflows/v051-apply-temp.yml').exists()
          assert not Path('tools/v051_apply.py').exists()
          assert not Path('tools/build-apk-v051.generated.yml').exists()
          assert not Path('.github/workflows/v052-apply-temp.yml').exists()
          assert not Path('tools/v052_apply.py').exists()
          assert not Path('tools/build-apk-v052.generated.yml').exists()
          PY

      - name: Verify launcher and orientation configuration
        shell: bash
        run: |
          set -euo pipefail
          register_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' app/src/main app/src/debug | wc -l)
          cd_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' customer-display/src/main | wc -l)
          plus_launcher_count=$(grep -R -h --include='AndroidManifest.xml' 'android.intent.category.LAUNCHER' management-app/src/main | wc -l)
          test "$register_launcher_count" -eq 1
          test "$cd_launcher_count" -eq 1
          test "$plus_launcher_count" -eq 1
          grep -q 'android:screenOrientation="sensorPortrait"' management-app/src/main/AndroidManifest.xml
          ! grep -q 'android:screenOrientation="landscape"' management-app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml

      - name: Run cumulative unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :customer-display:testDebugUnitTest :management-app:testDebugUnitTest

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin :customer-display:compileDebugKotlin :management-app:compileDebugKotlin

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :customer-display:assembleDebug :management-app:assembleDebug

      - name: Prepare named APKs and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TSUGUREGI_v0.52.0_dev1_drive_operations_setup_debug.apk
          cp customer-display/build/outputs/apk/debug/customer-display-debug.apk artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk
          cp management-app/build/outputs/apk/debug/management-app-debug.apk artifacts/TSUGUREGI_PLUS_v0.11.0_dev1_drive_operations_setup_debug.apk

          sha256sum artifacts/TSUGUREGI_v0.52.0_dev1_drive_operations_setup_debug.apk | tee artifacts/TSUGUREGI_v0.52.0_dev1_drive_operations_setup_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk | tee artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk.sha256
          sha256sum artifacts/TSUGUREGI_PLUS_v0.11.0_dev1_drive_operations_setup_debug.apk | tee artifacts/TSUGUREGI_PLUS_v0.11.0_dev1_drive_operations_setup_debug.apk.sha256

          stat --printf='REGISTER_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_v0.52.0_dev1_drive_operations_setup_debug.apk | tee artifacts/build-summary.txt
          stat --printf='CUSTOMER_DISPLAY_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk | tee -a artifacts/build-summary.txt
          stat --printf='MANAGEMENT_APP_APK_SIZE_BYTES=%s\n' artifacts/TSUGUREGI_PLUS_v0.11.0_dev1_drive_operations_setup_debug.apk | tee -a artifacts/build-summary.txt

          keytool -list -v \
            -keystore app/build/signing/tsuguregi-development.jks \
            -storepass tsuguregi-dev \
            -alias tsuguregi-dev \
            | awk -F': ' '/SHA1:/{print "DEVELOPMENT_SIGNING_SHA1="$2} /SHA256:/{print "DEVELOPMENT_SIGNING_SHA256="$2}' \
            | tee -a artifacts/build-summary.txt

          cat >> artifacts/build-summary.txt <<'EOF'
          REGISTER_VERSION_NAME=0.52.0-dev.1
          REGISTER_VERSION_CODE=82
          REGISTER_APPLICATION_ID_DEBUG=jp.co.tenposinfo.register.dev
          CUSTOMER_DISPLAY_VERSION_NAME=0.14.0-dev.1
          CUSTOMER_DISPLAY_VERSION_CODE=7
          MANAGEMENT_APP_VERSION_NAME=0.11.0-dev.1
          MANAGEMENT_APP_VERSION_CODE=11
          MANAGEMENT_APP_APPLICATION_ID_DEBUG=jp.co.tenposinfo.register.plus.dev
          MANAGEMENT_SCREEN_ORIENTATION=sensorPortrait
          GOOGLE_AUTHORIZATION_LIBRARY=play-services-auth-21.6.0
          GOOGLE_DRIVE_SCOPE=https://www.googleapis.com/auth/drive.file
          GOOGLE_DRIVE_SETUP_GUIDE=true
          GOOGLE_DRIVE_DIAGNOSTICS=true
          GOOGLE_DRIVE_SETTINGS_ENTRY=true
          PLUS_GOOGLE_DRIVE_SETUP_GUIDE=true
          PLUS_GOOGLE_DRIVE_DIAGNOSTICS=true
          PLUS_GOOGLE_DRIVE_DIAGNOSTIC_TOKENS_INCLUDED=false
          PLUS_GOOGLE_DRIVE_DIAGNOSTIC_SALES_JSON_INCLUDED=false
          GOOGLE_DRIVE_CROSS_APP_CONNECTION_TEST=true
          GOOGLE_DRIVE_RECOVERY_FALLBACK=true
          GOOGLE_DRIVE_OPERATIONS_SETUP=true
          GOOGLE_DRIVE_OPERATING_MODE_AUTO=true
          GOOGLE_DRIVE_DUPLICATE_AUTOMATIC_TRANSPORTS=false
          GOOGLE_DRIVE_VALIDATION_CHECKLIST=true
          DIRECT_AUTOMATIC_SYNC_CANCELLED_ON_FALLBACK=true
          FOLDER_AUTO_IMPORT_ENABLED_ON_FALLBACK=true
          RECOVERY_SCREEN_DISPLAYS_FOLDER_URI=false
          CONNECTION_TEST_CONTAINS_SALES_DATA=false
          CONNECTION_TEST_IMPORTED_TO_SALES_DATABASE=false
          GOOGLE_DRIVE_DIAGNOSTIC_EVENT_LIMIT=100
          GOOGLE_DRIVE_DIAGNOSTIC_TOKENS_INCLUDED=false
          GOOGLE_DRIVE_DIAGNOSTIC_SALES_JSON_INCLUDED=false
          GOOGLE_DRIVE_DIRECT_UPLOAD=true
          GOOGLE_DRIVE_DIRECT_DOWNLOAD=true
          GOOGLE_DRIVE_DIFFERENTIAL_SYNC=true
          GOOGLE_ACCESS_TOKEN_PERSISTED=false
          GOOGLE_REFRESH_TOKEN_PERSISTED=false
          SAF_FOLDER_COMPATIBILITY=true
          MANAGEMENT_DATABASE=sqlite-open-helper-version-4
          SHARED_DRIVES_SUPPORTED=false
          SIGNING=development-not-production
          REAL_DEVICE_GOOGLE_DRIVE_DIRECT_SYNC=required
          REAL_DEVICE_CROSS_APP_DRIVE_FILE_SCOPE=required
          REAL_DEVICE_FOLDER_RECOVERY=required
          EOF
          git rev-parse HEAD | sed 's/^/HEAD=/' >> artifacts/build-summary.txt

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TSUGUREGI-v0.52.0-dev1-drive-operations-setup-apks
          path: |
            artifacts/TSUGUREGI_v0.52.0_dev1_drive_operations_setup_debug.apk
            artifacts/TSUGUREGI_v0.52.0_dev1_drive_operations_setup_debug.apk.sha256
            artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk
            artifacts/TSUGUREGI_CD_v0.14.0_dev1_presentation_restore_debug.apk.sha256
            artifacts/TSUGUREGI_PLUS_v0.11.0_dev1_drive_operations_setup_debug.apk
            artifacts/TSUGUREGI_PLUS_v0.11.0_dev1_drive_operations_setup_debug.apk.sha256
            artifacts/build-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report artifact ID
        run: echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
